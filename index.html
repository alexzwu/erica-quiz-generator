topic":"Employability Skills"},{"answer":1,"explain":"The ESA sets the floor for Ontario workplaces: minimum wage, maximum hours, overtime pay, vacation pay, and termination notice all come from it.","options":["The school curriculum","Minimum standards for pay, hours, overtime, vacation, and termination","University admission rules","Traffic laws"],"q":"Ontario's Employment Standards Act (ESA) sets out…","topic":"Employee Rights"},{"answer":3,"explain":"Ontario workers have three basic safety rights: to know the hazards, to participate in safety, and to refuse unsafe work without being punished.","options":["Do it anyway to prove they are tough","Quit on the spot with no explanation","Post about it online first","Refuse the unsafe work, which is their legal right, and report it to a supervisor"],"q":"Under Ontario's Occupational Health and Safety Act, a young worker asked to do something dangerously unsafe should…","topic":"Workplace Safety"},{"answer":0,"explain":"WHMIS covers labels, safety data sheets, and safe handling of hazardous products. It is required wherever such products are used, from restaurant kitchens to retail stockrooms.","options":["It teaches you to recognize hazardous products and handle them safely","It replaces all other job training","It is only relevant for scientists","It guarantees a pay raise"],"q":"Why does WHMIS training matter even for a part-time job?","topic":"Workplace Safety"},{"answer":2,"explain":"A generic resume buries what matters. Moving the most relevant experience and skills to the top shows the employer, in seconds, why you are a fit for this job.","options":["Employers enjoy reading long resumes","Fancy fonts impress hiring managers","To highlight the skills and experience most relevant to that specific job","So the same file can be reused forever"],"q":"Why should you tailor your resume for each job application?","topic":"Resumes"},{"answer":1,"explain":"Available upon request keeps private contact details off your resume. You provide references later, ideally teachers, coaches, or supervisors who have seen your work.","options":["List three friends with their cell numbers","Write References available upon request","Attach copies of your report card","Skip it, since employers never check"],"q":"On a resume, what is the best way to handle references?","topic":"Resumes"},{"answer":3,"explain":"A short thank-you note restates your interest and keeps you memorable. It is professional without being pushy.","options":["Call every hour to check on the decision","Assume you got the job","Send the interviewer funny memes","Send a brief thank-you email within 24 hours"],"q":"After a job interview, what is the best next step?","topic":"Interviews"}],"shortBank":[{"answer":"Any three specific fixes, for example: cut it to one page, since a teen resume should fit on a single page; use one clean, readable font throughout; remove the reference's private phone number and write References available upon request instead; tailor the content to the job being applied for; add clear section headings such as contact, education, experience, and skills.","marks":3,"q":"Your friend's resume is two pages long, uses three different fonts, and lists a reference's personal phone number. Give three specific fixes.","topic":"Resumes"},{"answer":"Any two valid preparations, for example: research the company; plan your route and lay out what to wear; prepare answers to common questions like tell me about yourself using the STAR method; print extra copies of your resume; prepare one or two questions to ask them; get a good night's sleep.","marks":2,"q":"Name two things you should do to prepare the night before a job interview.","topic":"Interviews"},{"answer":"1) The right to know: to be informed about hazards in the workplace and trained to work safely. 2) The right to participate: to take part in keeping the workplace safe, for example through a health and safety representative or committee. 3) The right to refuse: to refuse work you believe is dangerously unsafe, without being punished or fired.","marks":4,"q":"Name the three basic health-and-safety rights Ontario workers have, and explain what each one means.","topic":"Workplace Safety"},{"answer":"They mean technical tasks are trainable, but work habits are not, so employers hire for reliability and character. Examples of the attitude they want: showing up on time for every shift; staying off your phone; helping teammates without being asked; accepting feedback gracefully; taking initiative.","marks":2,"q":"An employer says: I can teach anyone to run the cash register, but I can't teach attitude. Explain what they mean, and give two examples of the attitude they want.","topic":"Employability Skills"}],"notes":"<h3>The Resume</h3>\n<p>A resume is a one-page summary that sells your skills to an employer. Employers skim fast, so it must be clear and error-free.</p>\n<ul>\n<li><strong>Contact info</strong> — name, phone, professional email, city. No photos, no social media handles.</li>\n<li><strong>Objective or summary</strong> — 1–2 lines about the kind of work you want and what you offer.</li>\n<li><strong>Education</strong> — school, expected graduation year, relevant courses or awards.</li>\n<li><strong>Experience</strong> — paid jobs, volunteering, co-op, school clubs, sports. List the most recent first.</li>\n<li><strong>Skills</strong> — languages, computer skills, certifications (e.g. first aid, WHMIS).</li>\n</ul>\n<p>Start each bullet with a strong <strong>action verb</strong>: <em>organized, trained, assisted, created, managed, communicated</em>. <strong>Tailor</strong> every resume to the posting — mirror the employer's keywords and put the most relevant experience first. Proofread twice: a single typo can get a resume thrown out.</p>\n<h3>The Cover Letter</h3>\n<p>A cover letter (three short paragraphs) explains <em>why you</em> for <em>this</em> job:</p>\n<ul>\n<li><strong>Hook</strong> — which job you are applying for and one line that grabs attention.</li>\n<li><strong>Fit</strong> — connect 2–3 of your skills or experiences to what the posting asks for. Give a brief example.</li>\n<li><strong>Close</strong> — thank them, say you welcome an interview, and give your contact info.</li>\n</ul>\n<p>Keep it to one page, address a named person when possible, and never reuse the same letter for different jobs.</p>\n<h3>The Interview</h3>\n<p><strong>Prepare</strong> by researching the company, re-reading the posting, planning your route, and dressing one step above the job's dress code. Bring extra resumes and arrive 10 minutes early.</p>\n<h4>The STAR method</h4>\n<p>For behavioural questions (\"Tell me about a time you…\"), answer with <strong>STAR</strong>:</p>\n<ul>\n<li><strong>S</strong>ituation — set the scene briefly.</li>\n<li><strong>T</strong>ask — what needed to be done.</li>\n<li><strong>A</strong>ction — what <em>you</em> did.</li>\n<li><strong>R</strong>esult — the positive outcome.</li>\n</ul>\n<p>Ask <strong>questions</strong> at the end (about training, the team, next steps) — it shows genuine interest. Afterward, send a short <strong>thank-you email</strong> within 24 hours.</p>\n<h3>Networking</h3>\n<p><strong>Networking</strong> means building relationships that can lead to opportunities — most jobs are found through people, not postings. Tell family, teachers, and coaches you are looking; volunteer; do informational interviews (a 20-minute chat asking someone about their career). Always follow up and say thank you.</p>\n<h3>Employability Skills</h3>\n<p>Employers hire for attitude as much as ability. The core <strong>employability skills</strong> are:</p>\n<ul>\n<li><strong>Communication</strong> — clear speaking, writing, and listening.</li>\n<li><strong>Teamwork</strong> — cooperating, sharing credit, handling conflict calmly.</li>\n<li><strong>Reliability</strong> — showing up on time, every time; doing what you promised.</li>\n<li><strong>Problem-solving</strong> — thinking through solutions instead of freezing.</li>\n<li><strong>Adaptability</strong> — learning new tasks and accepting feedback.</li>\n</ul>\n<h3>Your Rights at Work in Ontario</h3>\n<p>The <strong>Employment Standards Act (ESA)</strong> sets minimum rules every employer must follow:</p>\n<ul>\n<li><strong>Minimum wage</strong> — about <strong>$17.95/hour</strong> general rate as of October 2026 (it rises most Octobers, so check the current rate). Students under 18 working 28 hours or less per week during school — or during school breaks — have a lower <strong>student rate of about $16.90/hour</strong>.</li>\n<li><strong>Hours</strong> — generally a maximum of 8 hours a day or 48 a week; <strong>overtime pay (1.5×)</strong> after 44 hours in a week.</li>\n<li><strong>Pay</strong> — vacation pay of at least 4% of wages, paid public holidays, and regular paydays. The <strong>3-hour rule</strong>: if you regularly work more than 3 hours a day and report for a shift, you are generally entitled to at least 3 hours of pay.</li>\n<li><strong>Protection from reprisal</strong> — it is illegal for an employer to punish or fire you for asking about or claiming your ESA rights.</li>\n</ul>\n<p>Most workplaces cannot hire anyone under <strong>age 14</strong>, and some hazardous jobs have higher age limits.</p>\n<h3>Workplace Safety</h3>\n<ul>\n<li><strong>WHMIS</strong> (Workplace Hazardous Materials Information System) — the Canada-wide system for hazardous products. Learn to read supplier <strong>labels</strong> (pictograms, hazard statements) and <strong>Safety Data Sheets (SDS)</strong>, which detail hazards, safe handling, and first aid. Your employer must train you.</li>\n<li><strong>Right to know</strong> — you have the right to be told about hazards in your workplace.</li>\n<li><strong>Right to refuse unsafe work</strong> — under Ontario's Occupational Health and Safety Act, you may refuse work you believe endangers your health or safety. Report it to your supervisor; the employer must investigate, and you cannot be punished for refusing in good faith.</li>\n</ul>\n<p>Questions about a right or a safety concern? Ontario's Employment Standards Information Centre answers them for free.</p>\n"}]},
{"id":"icd2o","name":"Digital Technology and Innovations (ICD2O1)","semester":1,"units":[{"id":"icd-computational","name":"Computational Thinking, Planning, and Purpose","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":1,"explain":"Decomposition means breaking a large problem into smaller sub-problems — here, the calendar, the sign-up form, and the reminders — that can be tackled one at a time.","options":["Writing all the code in one long sitting without a plan","Breaking the app into the calendar, the sign-up form, and the reminders, then solving each part","Copying a finished app from the internet","Starting with the colour scheme and fonts"],"q":"Erica is planning a school event app with a calendar, a sign-up form, and reminders. Which approach best shows decomposition?","topic":"Decomposition"},{"answer":2,"explain":"Pattern recognition is spotting similarities across problems; once you see the shared input-process-output pattern, you can reuse one solution design for all three apps.","options":["abstraction","decomposition","pattern recognition","debugging"],"q":"A student notices that a quiz app, a survey app, and a store checkout program all ask for input, process it, then show a result. Spotting this repeated input-process-output structure is an example of:","topic":"Pattern recognition"},{"answer":0,"explain":"Abstraction keeps only the details that matter for the task (the route) and hides the rest (trees, houses) to make the problem simpler.","options":["Abstraction","Decomposition","Pattern matching","Iteration"],"q":"A navigation app shows your route as a simple line instead of drawing every tree and house along the street. Which computational thinking skill is this?","topic":"Abstraction"},{"answer":3,"explain":"An algorithm is an ordered set of steps that solves a problem or completes a task — a sorting recipe qualifies; hardware and files do not.","options":["A fast computer","A printed photo","A computer virus","A step-by-step recipe for sorting names alphabetically"],"q":"Which of the following is an algorithm?","topic":"Algorithms"},{"answer":1,"explain":"Pseudocode lets you work out the logic in readable plain-language steps first, so syntax details do not get in the way of problem-solving.","options":["To make the program run faster","To plan the logic in plain language before worrying about exact programming syntax","To hide the code from other people","To automatically find and fix bugs"],"q":"What is the main purpose of writing pseudocode before coding?","topic":"Pseudocode"},{"answer":2,"explain":"A computational artifact is built for a purpose and an audience — knowing the users shapes what the app does and how it looks and talks to them.","options":["Teenagers never use apps","Professional developers are the only ones who plan","The features, wording, and design should fit the people who will actually use it","Adults and teens always want exactly the same app"],"q":"Erica is designing a budgeting app for teenagers. Why should she think about her audience while planning?","topic":"Planning for purpose and audience"},{"answer":0,"explain":"Computers follow steps exactly in order; putting on shoes before socks fails in real life the same way wrong sequence fails in a program.","options":["Doing steps out of order can produce a wrong result, so the sequence must be correct","Order never matters in an algorithm","Only the first step of an algorithm matters","Computers automatically shuffle steps into the right order"],"q":"In an algorithm, why does the order of steps (sequence) matter?","topic":"Algorithms"},{"answer":3,"explain":"AI learns from its data — if the data is unbalanced, the system copies that imbalance, which is why checking data for bias matters.","options":["The tool runs too fast","The tool costs too much electricity","The tool needs a bigger screen","Bias in the training data can make technology treat people unfairly"],"q":"A hiring tool trained mostly on resumes from one group keeps recommending candidates from that group. What issue does this show?","topic":"Digital technology and society"},{"answer":1,"explain":"Accessibility means people with different abilities can use the technology — image descriptions let blind users access visual content through screen readers.","options":["Tiny light-grey text on a white background","Adding text descriptions to images so screen readers can read them aloud","Auto-playing loud background music","Hiding all navigation buttons in a secret menu"],"q":"Which design choice best improves the accessibility of a website?","topic":"Digital technology and society"},{"answer":0,"explain":"Digital technology and programming appear across industries — from CNC machines in skilled trades to data tools in medicine — and keep evolving.","options":["Programming skills are used in many fields, including skilled trades, medicine, and business","Programming is only useful for making video games","Only university professors ever write code","Technology careers never change, so learning it once is enough"],"q":"Which statement about programming in careers is TRUE?","topic":"Careers and applications"},{"answer":3,"explain":"Safe data practices mean asking why an app wants your personal information and refusing access that has nothing to do with what the app does.","options":["Grant everything — free apps are always safe","Post your contacts online so the app works","Turn off your phone and never use apps again","Question it: a flashlight has no reason to need your contacts, so deny the permissions or delete the app"],"q":"A free flashlight app demands access to your contacts and location before it will turn on. What is the safest response?","topic":"Digital technology and society"},{"answer":2,"explain":"Iteration is repeating the design-test-improve cycle; each round uses real feedback to make the artifact better fit its purpose and audience.","options":["decomposition","abstraction","iteration","compilation"],"q":"Erica tests her program with classmates, finds the buttons confusing, and redesigns them. This cycle of testing, getting feedback, and improving is called:","topic":"Planning and iteration"}],"shortBank":[{"answer":"Any three sensible sub-problems, for example: (1) collect the student's classes, deadlines, and free time as input; (2) decide how to split study time across subjects; (3) display the schedule and let the student edit it. Each part is small enough to design and test on its own.","marks":3,"q":"Erica wants to build a program that helps students plan a weekly study schedule. Break this project into at least three smaller sub-problems she could solve one at a time.","topic":"Decomposition"},{"answer":"One correct version, for example: INPUT score \n IF score >= 60 THEN \n   OUTPUT \"Pass\" \n ELSE \n   OUTPUT \"Fail\" \n ENDIF. Full marks for correct input, condition, and both outputs.","marks":2,"q":"Write pseudocode for an algorithm that takes a student's test score (0–100) as input and outputs \"Pass\" if the score is 60 or more, otherwise outputs \"Fail\".","topic":"Algorithms and pseudocode"},{"answer":"Any clear example showing both sides, for example: in a school-bus tracker app you keep the bus location and route (they matter for the purpose) but leave out the colour of the bus seats (irrelevant). Full marks for naming the purpose, one kept detail with a reason, and one removed detail with a reason.","marks":3,"q":"Explain, using your own example, the difference between a detail you would KEEP and a detail you would LEAVE OUT when abstracting a real-world situation into a program.","topic":"Abstraction"},{"answer":"Any one sensible benefit (e.g., translation tools, medical image analysis, voice assistants) and any one sensible limitation or concern (e.g., it can reflect biased data, make confident mistakes, or raise privacy concerns). One mark each.","marks":2,"q":"Give one benefit and one limitation of artificial intelligence in everyday life.","topic":"Digital technology and society"}]},{"id":"icd-hardware","name":"Hardware, Software, and Innovations","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":2,"explain":"The CPU (central processing unit) executes instructions — doing the actual calculations and control — which is why it is called the brain of the computer.","options":["Hard drive","Monitor","CPU","Keyboard"],"q":"Which component is often called the \"brain\" of the computer because it carries out program instructions?","topic":"Hardware components"},{"answer":0,"explain":"RAM holds data programs are actively using and is wiped at shutdown; storage (hard drive/SSD) keeps files permanently. Confusing the two is a classic mix-up.","options":["RAM is temporary working memory that is cleared when the computer turns off; the hard drive keeps files long-term","RAM and the hard drive do exactly the same job","RAM stores your files forever, even with no power","A bigger hard drive makes programs run faster"],"q":"Erica is choosing between more RAM and a bigger hard drive. Which statement is TRUE?","topic":"Memory vs storage"},{"answer":3,"explain":"System software (operating system, drivers, firmware) runs the computer itself; application software like a web browser is a tool the user runs on top of it.","options":["The operating system","Device drivers","The BIOS/UEFI firmware","A web browser"],"q":"Which of the following is application software rather than system software?","topic":"Types of software"},{"answer":1,"explain":"Input devices send data into the computer (microphone, keyboard, mouse); printers, speakers, and monitors send data out, so they are output devices.","options":["Printer","Microphone","Speaker","Monitor"],"q":"Which of these is an input device?","topic":"Hardware components"},{"answer":3,"explain":"Good file management — clear names and folders — means you can locate work quickly and back it up reliably instead of hunting through clutter.","options":["The desktop cannot hold any files","Folders use less electricity","Folders make programs run faster","Named folders make files easier to find, back up, and share"],"q":"Why is it good practice to organize files into named folders instead of saving everything on the desktop?","topic":"File management"},{"answer":0,"explain":"Cloud storage keeps a copy on remote servers, so your work is safe from a lost, stolen, or broken device and reachable anywhere you can log in.","options":["Files are reachable from any device and survive even if the laptop is lost or broken","Cloud files can never be deleted by anyone","Files open instantly with no internet connection needed","Cloud storage is always free and unlimited"],"q":"What is a main advantage of saving schoolwork to cloud storage instead of keeping it only on one laptop?","topic":"Cloud storage"},{"answer":1,"explain":"Long, unique passphrases resist guessing, and using a different one per account means one leaked password cannot open everything else.","options":["Using your birthday for every account","Using a long, unique passphrase for each important account","Sharing passwords with trusted friends","Writing passwords on a sticky note on the monitor"],"q":"Which password practice is safest?","topic":"Cybersecurity"},{"answer":2,"explain":"This is phishing: the misspelled domain and urgent threat are red flags. Never log in through an emailed link — go to the real site yourself.","options":["Click the link quickly before time runs out","Reply with her password to prove it is her","Delete the email and log in through the bank's official site or app","Forward it to all her contacts so they can check it"],"q":"Erica gets an email from \"support@yourbankk.com\" urging her to log in through the link before her account is closed. What should she do?","topic":"Cybersecurity"},{"answer":3,"explain":"AI finds patterns in its training data rather than truly understanding; bad or narrow data means confident mistakes and biased results.","options":["AI understands the world exactly like a human","AI works with no data at all","AI can never make a mistake","AI systems learn patterns from data, so they can be wrong or biased"],"q":"Which statement about artificial intelligence is TRUE?","topic":"Artificial intelligence"},{"answer":1,"explain":"A fair assessment weighs benefits (speed, consistency) against limitations (job loss, maintenance needs, loss of human judgment) — innovations always have both.","options":["Robots never break down or need repairs","Automation can eliminate jobs, and the robots still need humans to maintain, program, and oversee them","Robots work for free with no costs at all","Automation has no downsides worth considering"],"q":"A factory replaces assembly-line workers with robots. Which is a limitation of this automation?","topic":"Automation and innovations"},{"answer":2,"explain":"A router forwards data packets between your devices and the wider internet, deciding where each packet needs to go next.","options":["Cools down the computer","Prints documents","Directs data between the home devices and the internet","Charges the laptop battery"],"q":"What does a router do on a home network?","topic":"Networks"},{"answer":0,"explain":"Safe data practices start with informed choices: if an app wants more personal data than its job requires, that is a reason to say no.","options":["Collected data can be shared, sold, or misused, so you should only hand over what the app truly needs","Apps never collect any personal data","Checking wastes time and changes nothing","Every app is required by law to be completely safe"],"q":"Why should you check what personal data an app collects before installing it?","topic":"Data practices"}],"shortBank":[{"answer":"Any two correct components with roles, for example: the CPU carries out the game's instructions and calculations; RAM holds the data the game is actively using; the GPU (graphics card) draws the images; an SSD loads game data faster than a hard drive. Award marks for two components named with a correct role each.","marks":3,"q":"A friend says, \"I need a new computer because mine is too slow at running games.\" Name two hardware components that affect how fast games run, and explain what each one does.","topic":"Hardware components"},{"answer":"Cloud storage (or a backup drive) keeps a separate copy of the files away from the laptop, so losing the device does not mean losing the work — she could log in elsewhere and keep going.","marks":2,"q":"Erica's laptop was stolen, and her school project was saved only on that laptop. Explain how cloud storage or a regular backup would have prevented losing her work.","topic":"File management and backups"},{"answer":"Any two with reasons, for example: use long unique passwords (one leak cannot open all accounts); do not click suspicious links and check sender addresses (avoids phishing); keep software updated (patches security holes); limit app permissions (less data exposed). One mark per practice, one for a correct reason.","marks":3,"q":"Describe two safe practices Erica should follow to protect her personal data online, and explain why each one helps.","topic":"Cybersecurity"},{"answer":"Any one sensible benefit (e.g., fewer crashes caused by human error, mobility for people who cannot drive) and any one sensible limitation or concern (e.g., mistakes in bad weather, job losses for drivers, privacy from constant sensors, who is liable in a crash). One mark each.","marks":2,"q":"Self-driving cars are an emerging innovation. Give one potential benefit and one potential limitation or concern.","topic":"Emerging innovations"}]},{"id":"icd-programming","name":"Programming","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"topic":"Variables","q":"What is stored in x after this runs?\nx = 5\nx = x + 3\nprint(x)","options":["5","8","3","x"],"answer":1,"explain":"The second line reads the current value of x (5), adds 3, and stores 8 back into x."},{"topic":"Data types","q":"Which of these is a string (text) data type in Python?","options":["42","3.14","True","\"hello\""],"answer":3,"explain":"Quotes mark text data: \"hello\" is a string (str), while 42 is an int, 3.14 is a float, and True is a bool."},{"topic":"Operators","q":"What does 7 % 3 evaluate to in Python? (% gives the remainder after division.)","options":["1","4","2","10"],"answer":0,"explain":"7 ÷ 3 = 2 remainder 1, so 7 % 3 is 1. The % operator returns the remainder, not the quotient."},{"topic":"Input and output","q":"A user types Erica when the program asks for a name. What is displayed?\nname = input(\"Enter your name: \")\nprint(\"Hi, \" + name)","options":["Enter your name:","Hi, name","Hi, Erica","Hi, + name"],"answer":2,"explain":"input() stores what the user typed (\"Erica\") in name, then + joins \"Hi, \" and the value, giving \"Hi, Erica\"."},{"topic":"Conditionals","q":"For age = 15, what does this program output?\nage = 15\nif age >= 16:\n    print(\"can drive\")\nelse:\n    print(\"too young\")","options":["can drive","16","too young","age"],"answer":2,"explain":"The condition 15 >= 16 is False, so Python skips to the else branch and prints \"too young\"."},{"topic":"Loops","q":"How many times does the loop body run?\nfor i in range(1, 4):\n    print(i)","options":["3","1","4","0"],"answer":0,"explain":"range(1, 4) produces 1, 2, 3 — three iterations total. The stop value 4 is not included: a classic off-by-one trap."},{"topic":"Loops","q":"What is the final value of n after this loop finishes?\nn = 1\nwhile n < 4:\n    n = n + 1\nprint(n)","options":["1","3","5","4"],"answer":3,"explain":"n goes 1 → 2 → 3 → 4; when n reaches 4 the condition n < 4 is False, so the loop stops with n = 4."},{"topic":"Functions","q":"What is the main benefit of putting repeated code into a function?","options":["It makes the program run on any computer","You write it once and reuse it, so a fix or improvement happens in one place","Functions make code impossible for others to read","Functions automatically delete all bugs"],"answer":1,"explain":"A function packages a task into one reusable, named block (def ...) that you call wherever needed — less duplication, and a fix happens in one place."},{"topic":"Input and types","q":"What does this Python code do if the user types 7?\nage = input(\"Age: \")\nprint(age + 1)","options":["Prints 8","Prints 71","Prints \"Age: 8\"","It crashes with a TypeError"],"answer":3,"explain":"input() always returns a string, so age is \"7\" (text). Adding the number 1 to text raises a TypeError — convert first with int(age)."},{"topic":"Tracing code","q":"What value is printed by the last line?\na = 2\nb = 3\nc = a * b + 1\nprint(c)","options":["6","5","7","9"],"answer":2,"explain":"Multiplication comes first: a * b = 6, then + 1 gives 7, which is stored in c and printed."},{"topic":"Operators","q":"In Python, what is the difference between = and == ?","options":["There is no difference between them","= stores a value in a variable, while == compares two values","== stores a value, while = compares two values","Both delete the variable"],"answer":1,"explain":"A single = assigns (stores) a value; a double == tests whether two values are equal — mixing them up is a classic beginner bug."},{"topic":"Debugging","q":"This loop was meant to total 1+2+3+4+5 = 15, but it prints 5. What is the bug?\ncount = 0\nfor i in range(1, 6):\n    count = count + 1\nprint(count)","options":["The loop runs the wrong number of times","count should start at 1 instead of 0","print should be inside the loop","It adds 1 each time instead of adding i, so the total is 5 instead of 15"],"answer":3,"explain":"The loop correctly runs 5 times (range(1, 6) gives 1–5), but count = count + 1 just counts iterations; adding i each time would accumulate 1+2+3+4+5 = 15."}],"shortBank":[{"topic":"Variables and operators","q":"What is printed? Explain what each line does.\nprice = 20\ndiscount = 0.25\ntotal = price - price * discount\nprint(total)","marks":2,"answer":"15.0 is printed. Line 1 stores 20 in price; line 2 stores 0.25 in discount; line 3 computes 20 − (20 × 0.25) = 20 − 5.0 = 15.0 (multiplication first); line 4 prints total."},{"topic":"Conditionals","q":"Write Python code that reads a number and prints \"positive\" if it is above zero, \"negative\" if it is below zero, and \"zero\" otherwise.","marks":3,"answer":"One correct version, for example:\nn = float(input(\"Enter a number: \"))\nif n > 0:\n    print(\"positive\")\nelif n < 0:\n    print(\"negative\")\nelse:\n    print(\"zero\")\nOne mark each for handling positive, negative, and zero correctly."},{"topic":"Loops","q":"Write Python code using a loop that prints the numbers 10, 9, 8, 7, 6, 5 — one per line.","marks":3,"answer":"One correct version, for example:\nfor i in range(10, 4, -1):\n    print(i)\nFull marks for a loop that produces exactly 10 down to 5."},{"topic":"Debugging","q":"This program should print the average of three test scores, but the answer always comes out too small. Find the bug and explain the fix.\navg = s1 + s2 + s3 / 3\nprint(avg)","marks":4,"answer":"Bug: division runs before addition (order of operations), so only s3 is divided by 3 and then added to s1 + s2 — the sum is barely reduced, giving too small a result. Fix: add parentheses so the sum happens first: avg = (s1 + s2 + s3) / 3. Two marks for spotting the order-of-operations bug, two for the correct fix."}]}]},
{"id":"fsf2d","name":"Core French (FSF2D1)","semester":1,"units":[{"id":"fsf-listening","name":"Listening and Speaking","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":1,"explain":"En écoute, on utilise le contexte et les mots-clés pour deviner le sens au lieu de s'arrêter sur chaque mot inconnu.","options":["Arrêter d'écouter complètement","Deviner le sens avec le contexte","Traduire chaque mot en anglais","Demander la définition en anglais"],"q":"Quand tu n'entends pas bien un mot en français, que dois-tu faire en premier ?","topic":"Stratégies d'écoute"},{"answer":2,"explain":"Les mots apparentés (cognates) se ressemblent en français et en anglais, ce qui aide beaucoup la compréhension orale.","options":["C'est un mot inventé","C'est toujours expliqué en anglais","C'est un mot apparenté (cognate) à l'anglais « television »","C'est un mot très rare"],"q":"Dans une conversation, tu entends « la télévision ». Pourquoi comprends-tu ce mot facilement ?","topic":"Mots apparentés"},{"answer":0,"explain":"Il y a une liaison entre « les » et « amis » : le s final se prononce /z/.","options":["On le prononce /z/","On ne le prononce pas","On le prononce /s/","On le prononce /ʃ/ (ch)"],"q":"Comment prononce-t-on le « s » dans « les amis » ?","topic":"Liaison"},{"answer":3,"explain":"On ne fait jamais de liaison après « et » : on dit « et aussi » en détachant les deux mots.","options":["les enfants","nous avons","vous êtes","et aussi"],"q":"Dans quelle expression n'y a-t-il PAS de liaison ?","topic":"Liaison"},{"answer":1,"explain":"« Ça va bien, merci ! Et toi ? » est la réponse naturelle et polie à « Ça va ? ».","options":["Je suis aller bien.","Ça va bien, merci ! Et toi ?","Ça va mal toujours.","Bien, je suis."],"q":"Ton ami te demande : « Ça va ? » Que réponds-tu ?","topic":"Expressions courantes"},{"answer":2,"explain":"« Répétez, s'il vous plaît » est la façon polie de demander une répétition en classe.","options":["Quoi ?","Parlez anglais !","Répétez, s'il vous plaît.","Je ne sais pas."],"q":"Tu n'as pas compris la question du professeur. Que dis-tu poliment ?","topic":"Demander de répéter"},{"answer":0,"explain":"L'intonation montante à la fin de la phrase indique souvent une question en français oral.","options":["La voix monte à la fin","La voix descend à la fin","On parle plus vite","On parle plus fort"],"q":"En français parlé, qu'est-ce qui montre souvent que c'est une question ?","topic":"Intonation"},{"answer":3,"explain":"On répond « De rien ! » après « Merci ! ». (« À tes souhaits » s'utilise après un éternuement.)","options":["S'il vous plaît","Pardon ?","À tes souhaits !","De rien !"],"q":"Quelqu'un te dit « Merci ! ». Que réponds-tu ?","topic":"Expressions courantes"},{"answer":1,"explain":"En écoute, on cherche les mots-clés et l'idée générale plutôt que de vouloir comprendre chaque mot.","options":["Sur chaque mot, sans exception","Sur les mots-clés et l'idée générale","Sur la grammaire seulement","Sur l'accent du locuteur"],"q":"Pour bien comprendre un dialogue, sur quoi dois-tu te concentrer ?","topic":"Stratégies d'écoute"},{"answer":2,"explain":"Il y a une liaison entre « nous » et « avons » : le s final se prononce /z/.","options":["nou-a-von (sans liaison)","nou-sa-von (liaison en /s/)","nou-za-von (liaison en /z/)","nou-avons (pause entre les mots)"],"q":"Comment prononce-t-on « nous avons » ?","topic":"Liaison"},{"answer":0,"explain":"On utilise « vous » avec un professeur ou une personne qu'on connaît peu, par politesse.","options":["Vous, par politesse","Tu, toujours","On, c'est plus facile","Aucune, on ne parle pas"],"q":"Tu parles à ton professeur pour la première fois. Quelle forme utilises-tu ?","topic":"Tu ou vous"},{"answer":3,"explain":"« Oui, avec plaisir ! » accepte l'invitation de façon naturelle et enthousiaste.","options":["Non, je ne veux pas du tout.","Peut-être, je déteste le cinéma.","Je ne sais pas parler.","Oui, avec plaisir !"],"q":"Ton amie demande : « Tu viens au cinéma ce soir ? » Que réponds-tu pour accepter ?","topic":"Expressions courantes"}],"shortBank":[{"answer":"Exemple : — Salut ! Comment tu t'appelles ? — Je m'appelle Léo. Et toi ? — Moi, c'est Maya. Tu viens d'où ? — Je viens de Montréal. Bienvenue à notre école !","marks":3,"q":"Écris un mini-dialogue de 4 répliques : tu rencontres un nouvel élève et tu lui poses des questions pour faire connaissance.","topic":"Conversation"},{"answer":"Écouter les mots-clés et deviner le sens avec le contexte ; demander poliment à la personne de répéter ou de parler moins vite.","marks":2,"q":"Nomme deux stratégies pour mieux comprendre quand quelqu'un parle vite en français.","topic":"Stratégies d'écoute"},{"answer":"On prononce la consonne finale quand le mot suivant commence par une voyelle. Exemple : « les‿amis », où le s se prononce /z/.","marks":2,"q":"Explique la liaison avec un exemple : quand prononce-t-on la consonne finale d'un mot ?","topic":"Prononciation"},{"answer":"a) « Pardon ! » ou « Excusez-moi, s'il vous plaît. » b) « Excusez-moi pour le retard. » ou « Désolé(e), je suis en retard. »","marks":2,"q":"Écris ce que tu dis dans ces deux situations : a) tu veux passer devant quelqu'un dans l'autobus ; b) tu arrives en classe en retard.","topic":"Expressions courantes"}]},{"id":"fsf-reading","name":"Reading","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":1,"explain":"« Important » est un mot apparenté (cognate) : il a le même sens en français et en anglais.","options":["Impossible (faux ami)","La même chose qu'en anglais : important","Malade","En retard"],"q":"Dans un texte, tu lis le mot « important ». Que signifie-t-il ?","topic":"Mots apparentés"},{"answer":2,"explain":"Le contexte (le froid, le manteau, les gants) indique un vêtement d'hiver : un foulard (scarf).","options":["Un chapeau","Un pantalon","Un foulard (scarf)","Un manteau d'hiver"],"q":"« Il faisait très froid, alors il a mis son manteau, son foulard et ses gants. » Que veut dire « foulard » ?","topic":"Indices du contexte"},{"answer":0,"explain":"On utilise l'imparfait (« faisait ») pour décrire le temps qu'il faisait, une description dans le passé.","options":["faisait","a fait","fait","fera"],"q":"Choisis la bonne forme : « Hier, il ___ très beau. »","topic":"Imparfait"},{"answer":3,"explain":"« Soudain » introduit une action ponctuelle et terminée : on utilise le passé composé (« a sonné »).","options":["sonnait","sonne","sonnera","a sonné"],"q":"Choisis la bonne forme : « Soudain, le téléphone ___. »","topic":"Passé composé"},{"answer":1,"explain":"« Que » remplace un complément d'objet direct : j'ai vu le film (j'ai vu quoi ? le film).","options":["qui","que","dont","où"],"q":"Complète : « Le film ___ j'ai vu était excellent. »","topic":"Pronoms relatifs"},{"answer":2,"explain":"« Qui » remplace le sujet du verbe : mon amie habite (qui habite ? mon amie).","options":["que","dont","qui","où"],"q":"Complète : « C'est mon amie ___ habite à Québec. »","topic":"Pronoms relatifs"},{"answer":3,"explain":"« Fleurs » est féminin pluriel, donc « blanc » devient « blanches ».","options":["blancs","blanche","blance","blanches"],"q":"Choisis la forme correcte : « des fleurs ___ » (blanc)","topic":"Accord des adjectifs"},{"answer":0,"explain":"« Garçon » est masculin singulier : « heureux » ne change pas, car il finit déjà par x.","options":["heureux","heureuse","heureuxes","heureuses"],"q":"Choisis la forme correcte : « un garçon ___ » (heureux)","topic":"Accord des adjectifs"},{"answer":2,"explain":"« Elles » est féminin pluriel : « content » devient « contentes ».","options":["content","contente","contentes","contents"],"q":"Choisis la forme correcte : « Elles sont ___ . » (content)","topic":"Accord des adjectifs"},{"answer":1,"explain":"« Actuellement » est un faux ami : il veut dire « en ce moment », pas « actually ».","options":["En réalité (actually)","En ce moment (currently)","Autrefois","Jamais"],"q":"Dans un texte : « Actuellement, j'habite à Ottawa. » Que veut dire « actuellement » ?","topic":"Faux amis"},{"answer":3,"explain":"« Chaque jour » indique une habitude dans le passé : on utilise l'imparfait (« jouais »).","options":["ai joué","joue","jouerai","jouais"],"q":"Choisis la bonne forme : « Quand j'étais petit, je ___ au parc chaque jour. »","topic":"Imparfait"},{"answer":0,"explain":"« Que » remplace le complément d'objet direct : tu m'as prêté le livre (prêté quoi ? le livre).","options":["que","qui","dont","où"],"q":"Complète : « Voici le livre ___ tu m'as prêté. »","topic":"Pronoms relatifs"}],"shortBank":[{"answer":"« Hier soir, il pleuvait (imparfait : description et continuité) quand je suis rentré(e) (passé composé : action ponctuelle et terminée) à la maison. »","marks":2,"q":"Complète avec le passé composé ou l'imparfait : « Hier soir, il ___ (pleuvoir) quand je ___ (rentrer) à la maison. »","topic":"Passé composé et imparfait"},{"answer":"« J'ai un chat qui dort sur mon lit. » (« Qui » remplace le sujet : le chat dort.)","marks":2,"q":"Relie les deux phrases avec « qui » ou « que » : « J'ai un chat. Le chat dort sur mon lit. »","topic":"Pronoms relatifs"},{"answer":"« Les maisons sont grandes et les jardins sont verts. » (« Maisons » est féminin pluriel ; « jardins » est masculin pluriel.)","marks":2,"q":"Accorde l'adjectif entre parenthèses : « Les maisons sont ___ (grand) et les jardins sont ___ (vert). »","topic":"Accord des adjectifs"},{"answer":"Ils sont restés dehors parce qu'ils voulaient finir le match, malgré la pluie.","marks":3,"q":"Lis la phrase et réponds : « Malgré la pluie, les élèves sont restés dehors parce qu'ils voulaient finir le match. » Pourquoi les élèves sont-ils restés dehors ?","topic":"Compréhension"}]},{"id":"fsf-writing","name":"Writing","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":2,"explain":"Le futur proche = aller conjugué + infinitif. Avec « je » : « je vais visiter ».","options":["vas","va","vais","vont"],"q":"Complète : « Demain, je ___ visiter le musée. »","topic":"Futur proche"},{"answer":0,"explain":"« Partir » se conjugue avec l'auxiliaire être au passé composé : « elles sont parties ».","options":["sont","ont","est","a"],"q":"Complète : « Elles ___ parties à 8 h. »","topic":"Passé composé"},{"answer":1,"explain":"« Mais » marque l'opposition entre aimer le hockey et préférer le soccer.","options":["et","mais","parce que","donc"],"q":"Choisis le bon mot de liaison : « J'aime le hockey, ___ je préfère le soccer. »","topic":"Mots de liaison"},{"answer":3,"explain":"« Grand » se place avant le nom et « blanc » après : « une grande maison blanche ».","options":["Une maison grande et blanche.","Une maison blanche grande.","Grande une maison blanche.","Une grande maison blanche."],"q":"Choisis la phrase correcte.","topic":"Place de l'adjectif"},{"answer":0,"explain":"Au présent, « finir » donne « nous finissons » (base finiss- + terminaison -ons).","options":["finissons","finissez","finissent","finirons"],"q":"Complète : « Nous ___ nos devoirs. » (finir)","topic":"Présent"},{"answer":1,"explain":"Avec l'auxiliaire être, le participe passé s'accorde avec le sujet féminin : « elle s'est levée ».","options":["levé","levée","levés","lever"],"q":"Complète : « Elle s'est ___ tôt. » (lever)","topic":"Accord du participe"},{"answer":2,"explain":"« Parce que » explique la cause : je reste à la maison parce que je suis malade.","options":["mais","et","parce que","ou"],"q":"Choisis le bon mot de liaison : « Je reste à la maison ___ je suis malade. »","topic":"Mots de liaison"},{"answer":1,"explain":"Après « vont » (futur proche), le verbe reste à l'infinitif : « ils vont jouer ».","options":["jouent","jouer","joué","jouant"],"q":"Complète : « Ils vont ___ au parc. »","topic":"Futur proche"},{"answer":3,"explain":"L'adverbe « toujours » se place après le verbe conjugué.","options":["Je toujours mange à midi.","Toujours je mange à midi.","Je mange à midi toujours.","Je mange toujours à midi."],"q":"Choisis la phrase avec le bon ordre des mots.","topic":"Structure de phrase"},{"answer":3,"explain":"Le participe passé de « prendre » est irrégulier : « pris ».","options":["prendu","prené","prisent","pris"],"q":"Complète : « Nous avons ___ nos clés. » (prendre)","topic":"Passé composé"},{"answer":2,"explain":"« Finalement » introduit la dernière étape ou la conclusion d'un texte.","options":["D'abord","Ensuite","Finalement","Puis"],"q":"Quel mot de liaison annonce la conclusion d'un paragraphe ?","topic":"Mots de liaison"},{"answer":0,"explain":"Avec « vous », le verbe être se conjugue « vous êtes ».","options":["êtes","est","sont","es"],"q":"Complète : « Vous ___ prêts ? » (être)","topic":"Présent"}],"shortBank":[{"answer":"Exemple : Samedi, je vais jouer au tennis avec mon frère. Dimanche, nous allons visiter ma grand-mère.","marks":2,"q":"Écris deux phrases au futur proche pour décrire tes projets de la fin de semaine.","topic":"Futur proche"},{"answer":"« Elle est venue hier et nous avons mangé ensemble. » (« Venir » prend l'auxiliaire être et s'accorde avec le sujet ; « manger » prend avoir.)","marks":3,"q":"Conjugue au passé composé : « Elle (venir) ___ hier et nous (manger) ___ ensemble. »","topic":"Passé composé"},{"answer":"Exemple : D'abord, je me lève à 7 h. Ensuite, je prends mon petit-déjeuner. Finalement, je marche jusqu'à l'arrêt d'autobus.","marks":4,"q":"Écris trois phrases pour décrire ta routine du matin. Utilise au moins un mot de liaison (d'abord, ensuite, finalement).","topic":"Rédaction"},{"answer":"« Je vais toujours à l'école en autobus. » L'adverbe « toujours » se place après le verbe conjugué.","marks":2,"q":"Corrige la phrase : « Je vais à l'école en autobus toujours. » Explique ton choix.","topic":"Structure de phrase"}]},{"id":"fsf-culture","name":"Francophone Culture","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":1,"explain":"Le français est la seule langue officielle du Québec depuis la Charte de la langue française.","options":["L'anglais","Le français","Le français et l'anglais","L'espagnol"],"q":"Quelle est la seule langue officielle du Québec ?","topic":"Québec"},{"answer":3,"explain":"Le drapeau franco-ontarien est vert et blanc, avec une fleur de lys et un trillium.","options":["Le bleu, le blanc et le rouge","Le jaune et le noir","Le rouge et le blanc","Le vert et le blanc"],"q":"Quelles sont les couleurs du drapeau franco-ontarien ?","topic":"Franco-Ontariens"},{"answer":0,"explain":"Le Canada a deux langues officielles : l'anglais et le français.","options":["L'anglais et le français","Le français et l'espagnol","L'anglais et le mandarin","Le français et l'italien"],"q":"Quelles sont les deux langues officielles du Canada ?","topic":"Bilinguisme"},{"answer":2,"explain":"Le français est très parlé en Afrique, par exemple au Sénégal, en Côte d'Ivoire et au Maroc.","options":["L'Asie","L'Océanie","L'Afrique","L'Antarctique"],"q":"En plus de l'Europe et de l'Amérique, sur quel continent le français est-il beaucoup parlé ?","topic":"Francophonie mondiale"},{"answer":1,"explain":"Le 24 juin, c'est la Saint-Jean-Baptiste, la fête nationale du Québec.","options":["La fête du Canada","La Saint-Jean-Baptiste (fête nationale du Québec)","L'Action de grâce","La fête du Travail"],"q":"Quelle fête célèbre-t-on le 24 juin au Québec ?","topic":"Québec"},{"answer":0,"explain":"Le 25 septembre, on célèbre la communauté franco-ontarienne en Ontario.","options":["Le 25 septembre","Le 1er juillet","Le 24 juin","Le 15 août"],"q":"Quand célèbre-t-on le Jour des Franco-Ontariens et des Franco-Ontariennes ?","topic":"Franco-Ontariens"},{"answer":2,"explain":"« Bilingue » veut dire parler deux langues, par exemple le français et l'anglais.","options":["Parler très vite","Habiter dans deux pays","Parler deux langues","Aimer deux cultures"],"q":"Que veut dire « être bilingue » ?","topic":"Bilinguisme"},{"answer":3,"explain":"Le Cirque du Solei es du gouvernement fédéral sont offerts dans les deux langues officielles.","marks":2,"q":"Donne deux exemples du bilinguisme dans la vie quotidienne au Canada.","topic":"Bilinguisme"},{"answer":"C'est la fête nationale du Québec, célébrée le 24 juin avec des spectacles, des feux d'artifice et des rassemblements.","marks":2,"q":"Qu'est-ce que la Saint-Jean-Baptiste et quand la célèbre-t-on ?","topic":"Culture québécoise"},{"answer":"Exemple : la France (en Europe) et le Sénégal (en Afrique). On accepte aussi : la Belgique, la Suisse, la Côte d'Ivoire, le Maroc, etc.","marks":3,"q":"Nomme deux pays francophones hors du Canada et dis sur quel continent chacun se trouve.","topic":"Francophonie mondiale"}]}]},

{"id":"mpm2d","name":"Principles of Mathematics (MPM2D1)","semester":0,"units":[{"id":"mpm2d-quadratics","name":"Quadratic Relations","instructions":"Answer all questions. Show your work for full marks.","quizFormat":{"mc":12,"short":4},"mcBank":[{"answer":0,"explain":"In y = a(x - h)^2 + k the vertex is (h, k). Here h = 3 and k = 5. Watch the sign: (x - 3) means h is positive 3, not negative.","options":["(3, 5)","(-3, 5)","(3, -5)","(-3, -5)"],"q":"What is the vertex of the parabola y = 2(x - 3)^2 + 5?","topic":"Vertex form"},{"answer":1,"explain":"Since a = -1 is negative, the parabola opens downward, so the vertex is a maximum point. The vertex is (-1, -4), so the greatest y-value the graph reaches is -4.","options":["4","-4","-1","1"],"q":"What is the maximum value of y = -(x + 1)^2 - 4?","topic":"Maximum value"},{"answer":2,"explain":"The axis of symmetry is the vertical line through the vertex. The vertex is (2, 7), so the axis is x = 2. Note it is a vertical line, so it is written as x = a constant, not y = a constant.","options":["x = -2","x = 3","x = 2","y = 2"],"q":"What is the equation of the axis of symmetry of y = 3(x - 2)^2 + 7?","topic":"Axis of symmetry"},{"answer":0,"explain":"A vertical stretch multiplies every y-value, which happens when |a| > 1. In y = 2x^2, a = 2, so the graph is narrower (stretched). y = (1/2)x^2 is a compression, and the other two are translations, not stretches.","options":["y = 2x^2","y = (1/2)x^2","y = x^2 + 2","y = (x - 2)^2"],"q":"Which equation represents a vertical stretch of the parabola y = x^2?","topic":"Transformations"},{"answer":3,"explain":"The x-intercepts occur where y = 0, so set each factor to zero: x - 4 = 0 gives x = 4, and x + 2 = 0 gives x = -2.","options":["4 and 2","-4 and 2","-4 and -2","4 and -2"],"q":"What are the x-intercepts of y = (x - 4)(x + 2)?","topic":"Factored form"},{"answer":1,"explain":"A parabola is symmetric, so its axis lies exactly halfway between its x-intercepts. The intercepts are 1 and 7, and (1 + 7) / 2 = 4, so the axis is x = 4.","options":["x = 8","x = 4","x = 3","x = -4"],"q":"For y = (x - 1)(x - 7), what is the axis of symmetry?","topic":"Axis from factored form"},{"answer":2,"explain":"The y-intercept is where the graph crosses the y-axis, i.e. x = 0. Substituting gives y = 2. In standard form y = ax^2 + bx + c, the y-intercept is always the constant term c.","options":["3","-5","2","0"],"q":"What is the y-intercept of y = 3x^2 - 5x + 2?","topic":"Standard form"},{"answer":3,"explain":"For y = ax^2 + bx + c the axis of symmetry is x = -b / (2a). Here a = 2 and b = 8, so x = -8 / (2 x 2) = -8 / 4 = -2.","options":["x = 2","x = 4","x = -4","x = -2"],"q":"What is the axis of symmetry of y = 2x^2 + 8x - 3?","topic":"Axis from standard form"},{"answer":1,"explain":"Factor the trinomial: x^2 - 5x + 6 = (x - 2)(x - 3). Setting each factor to zero gives x = 2 or x = 3. (Check: 2 + 3 = 5 and 2 x 3 = 6.)","options":["x = -2 or x = -3","x = 2 or x = 3","x = 2 or x = -3","x = 1 or x = 6"],"q":"Solve x^2 - 5x + 6 = 0.","topic":"Solving by factoring"},{"answer":2,"explain":"The discriminant is b^2 - 4ac = (-7)^2 - 4(2)(3) = 49 - 24 = 25. Then x = (7 +/- 5) / 4, giving x = 12/4 = 3 or x = 2/4 = 1/2.","options":["x = 3 or x = -1/2","x = -3 or x = 1/2","x = 3 or x = 1/2","x = 1 or x = 3"],"q":"Solve 2x^2 - 7x + 3 = 0 using the quadratic formula.","topic":"Quadratic formula"},{"answer":0,"explain":"The discriminant is b^2 - 4ac = (-3)^2 - 4(2)(4) = 9 - 32 = -23. A negative discriminant means the equation has no real solutions (the parabola never touches the x-axis).","options":["none","one","two","infinitely many"],"q":"How many real solutions does 2x^2 - 3x + 4 = 0 have?","topic":"Discriminant"},{"answer":1,"explain":"If the width is w metres, the length is 20 - w metres (since 2w + 2L = 40). Area A = w(20 - w) is a downward-opening parabola with its maximum at w = 10, giving an area of 10 x 10 = 100 m^2.","options":["200 m^2","100 m^2","400 m^2","80 m^2"],"q":"A farmer has 40 m of fencing to enclose a rectangular pen. What is the maximum possible area of the pen?","topic":"Application: maximum area"}],"shortBank":[{"answer":"x^2 + 6x + 5 = (x^2 + 6x + 9) - 9 + 5 = (x + 3)^2 - 4. This is vertex form y = a(x - h)^2 + k with h = -3 and k = -4, so the vertex is (-3, -4).","marks":3,"q":"Find the vertex of y = x^2 + 6x + 5 by completing the square. Show your steps.","topic":"Completing the square"},{"answer":"The discriminant is b^2 - 4ac = (-5)^2 - 4(3)(-2) = 25 + 24 = 49. Then x = (5 +/- 7) / 6, so x = 12/6 = 2 or x = -2/6 = -1/3.","marks":3,"q":"Solve 3x^2 - 5x - 2 = 0 using the quadratic formula. Show your steps.","topic":"Quadratic formula"},{"answer":"The maximum height occurs at the vertex, where t = -b / (2a) = -30 / (2 x -5) = 3 seconds. Substituting: h(3) = -5(9) + 30(3) + 2 = -45 + 90 + 2 = 47. The ball reaches a maximum height of 47 m after 3 seconds.","marks":4,"q":"A ball is thrown upward. Its height in metres after t seconds is h(t) = -5t^2 + 30t + 2. What is the maximum height of the ball, and when does it reach it?","topic":"Application: projectile"},{"q":"A rectangle's length is 4 cm more than its width, and its area is 60 cm^2. Find the width of the rectangle.","marks":3,"answer":"Let the width be w cm; then the length is (w + 4) cm. So w(w + 4) = 60, i.e. w^2 + 4w - 60 = 0. Factoring: (w + 10)(w - 6) = 0, so w = 6 or w = -10. A width cannot be negative, so reject -10. The width is 6 cm (check: 6 x 10 = 60).","topic":"Application: solving"}]},{"id":"mpm2d-geometry","name":"Analytic Geometry","instructions":"Answer all questions. Show your work for full marks.","quizFormat":{"mc":12,"short":4},"mcBank":[{"answer":0,"explain":"Average the x-coordinates and average the y-coordinates: ((-3 + 5)/2, (7 + (-1))/2) = (2/2, 6/2) = (1, 3).","options":["(1, 3)","(1, 4)","(4, 3)","(2, 6)"],"q":"Find the midpoint of the line segment with endpoints A(-3, 7) and B(5, -1).","topic":"Midpoint"},{"answer":0,"explain":"d = sqrt((4 - 1)^2 + (6 - 2)^2) = sqrt(9 + 16) = sqrt(25) = 5. Remember to take the square root at the end.","options":["5","7","25","sqrt(7)"],"q":"Find the length of the line segment joining P(1, 2) and Q(4, 6).","topic":"Distance"},{"answer":0,"explain":"m = (11 - 3)/(6 - 2) = 8/4 = 2. Slope is rise over run: change in y divided by change in x.","options":["2","1/2","-2","4"],"q":"Find the slope of the line passing through (2, 3) and (6, 11).","topic":"Slope"},{"answer":0,"explain":"Rewrite L as y = (-2/3)x + 2, so L has slope -2/3. Parallel lines have equal slopes.","options":["-2/3","3/2","-3/2","2/3"],"q":"Line L has equation 2x + 3y = 6. What is the slope of any line parallel to L?","topic":"Parallel lines"},{"answer":0,"explain":"Flip the fraction and change the sign: the opposite reciprocal of 2/5 is -5/2. Check: (2/5)(-5/2) = -1.","options":["-5/2","5/2","2/5","-2/5"],"q":"A line has slope 2/5. What is the slope of a line perpendicular to it?","topic":"Perpendicular lines"},{"answer":0,"explain":"Substitute into y = mx + b: 10 = 2(3) + b, so b = 4. The equation is y = 2x + 4.","options":["y = 2x + 4","y = 2x - 4","y = 2x + 16","y = -2x + 4"],"q":"Write the equation of the line with slope 2 that passes through (3, 10).","topic":"Equation from slope and point"},{"answer":0,"explain":"Move every term to the left side: 2x + y - 5 = 0. In standard form the x-term is usually kept positive.","options":["2x + y - 5 = 0","-2x + y - 5 = 0","2x + y + 5 = 0","2x - y + 5 = 0"],"q":"Write y = -2x + 5 in the form Ax + By + C = 0.","topic":"Standard form"},{"answer":0,"explain":"Set y = 0: 3x = 12, so x = 4. (The y-intercept is -3; do not mix the two up.)","options":["4","-3","3","-4"],"q":"What is the x-intercept of the line 3x - 4y = 12?","topic":"Intercepts"},{"answer":0,"explain":"m = (9 - 5)/(3 - 1) = 4/2 = 2. Then 5 = 2(1) + b gives b = 3, so y = 2x + 3.","options":["y = 2x + 3","y = 2x + 7","y = 4x + 1","y = x + 4"],"q":"Find the equation of the line passing through (1, 5) and (3, 9).","topic":"Equation from two points"},{"answer":1,"explain":"Slope of AB = (6 - 2)/(4 - 1) = 4/3 and slope of BC = (3 - 6)/(8 - 4) = -3/4. Their product is -1, so AB is perpendicular to BC and the right angle is at B.","options":["Vertex A","Vertex B","Vertex C","There is no right angle"],"topic":"Right triangles and slope","q":"The triangle has vertices A(1, 2), B(4, 6), C(8, 3). At which vertex is the right angle?"},{"answer":0,"explain":"The midpoint of BC is ((8 + 4)/2, (3 + 9)/2) = (6, 6). The slope from A(2, 1) to (6, 6) is 5/4, so y - 1 = (5/4)(x - 2), which rearranges to 5x - 4y - 6 = 0.","options":["5x - 4y - 6 = 0","5x + 4y - 6 = 0","4x - y - 7 = 0","5x - 4y + 6 = 0"],"q":"Triangle ABC has vertices A(2, 1), B(8, 3), C(4, 9). Find the equation of the median from vertex A to side BC, in Ax + By + C = 0 form.","topic":"Median of a triangle"},{"answer":0,"explain":"Intercept form: x/5 + y/(-2) = 1. Multiply by 10 to clear denominators: 2x - 5y = 10. Check: x = 5 when y = 0, and y = -2 when x = 0.","options":["2x - 5y = 10","2x + 5y = 10","5x - 2y = 10","-2x + 5y = 10"],"q":"Which equation represents the line with x-intercept 5 and y-intercept -2?","topic":"Intercepts and equations"}],"shortBank":[{"answer":"Midpoint M = ((-2 + 6)/2, (5 + (-3))/2) = (2, 1). Length AB = sqrt((6 - (-2))^2 + (-3 - 5)^2) = sqrt(64 + 64) = sqrt(128) = 8sqrt(2) units.","marks":3,"q":"A(-2, 5) and B(6, -3) are endpoints of a line segment. Find the midpoint M and the exact length AB (simplest radical form).","topic":"Midpoint and distance"},{"answer":"Substitute into y = mx + b: -4 = -2(3) + b, so b = 2 and y = -2x + 2. Moving all terms left gives standard form 2x + y - 2 = 0.","marks":3,"q":"Write the equation of the line with slope -2 passing through (3, -4) in y = mx + b form and in Ax + By + C = 0 form.","topic":"Line equations"},{"answer":"DE = sqrt((4-1)^2 + (6-2)^2) = 5, EF = sqrt((7-4)^2 + (2-6)^2) = 5, DF = 6. Two equal sides, so the triangle is isosceles. Slopes: DE = 4/3, EF = -4/3; their product is -16/9, not -1 (and 5^2 + 5^2 != 6^2), so it is not right-angled.","marks":4,"q":"Triangle DEF has vertices D(1, 2), E(4, 6), F(7, 2). Classify it as scalene, isosceles, or equilateral, and state whether it is right-angled. Justify with slopes or side lengths.","topic":"Classifying triangles"},{"answer":"Midpoint of AC = ((-1 + 3)/2, (4 + 8)/2) = (1, 6). Slope from B(5, 2) to (1, 6) is (6 - 2)/(1 - 5) = -1. Point-slope form: y - 2 = -1(x - 5), so y = -x + 7.","marks":3,"q":"Triangle ABC has vertices A(-1, 4), B(5, 2), C(3, 8). Find the equation of the median from vertex B to side AC, in y = mx + b form.","topic":"Median of a triangle"}]},{"id":"mpm2d-trig","name":"Trigonometry","instructions":"A calculator is allowed. Round as directed in each question.","quizFormat":{"mc":12,"short":4},"mcBank":[{"q":"In right triangle ABC, the right angle is at C. For acute angle A, which side is opposite angle A?","options":["BC","AB","AC","It cannot be determined from this information"],"answer":0,"explain":"The side opposite an angle is the one that does not touch that angle's vertex. Angle A touches sides AB and AC, so the side opposite angle A is BC.","topic":"Naming triangle sides"},{"q":"Right triangle DEF has its right angle at E, with DE = 3, EF = 4 and DF = 5. What is sin(D)?","options":["4/5","3/5","3/4","4/3"],"answer":0,"explain":"Sine is opposite over hypotenuse. For angle D, the opposite side is EF = 4 and the hypotenuse is DF = 5, so sin(D) = 4/5.","topic":"Writing trig ratios"},{"q":"In a right triangle, one acute angle is 35° and the side adjacent to it measures 12 cm. What is the length of the hypotenuse, to the nearest tenth of a centimetre?","options":["14.6 cm","9.8 cm","6.9 cm","20.9 cm"],"answer":0,"explain":"Cosine relates the adjacent side and the hypotenuse: cos(35°) = 12/h, so h = 12/cos(35°) ≈ 14.6 cm.","topic":"Solving for a side"},{"q":"In a right triangle, the hypotenuse is 20 cm and one acute angle is 52°. What is the length of the side opposite the 52° angle, to the nearest tenth of a centimetre?","options":["15.8 cm","12.3 cm","32.5 cm","25.6 cm"],"answer":0,"explain":"Sine relates the opposite side and the hypotenuse: sin(52°) = opposite/20, so opposite = 20 × sin(52°) ≈ 15.8 cm.","topic":"Solving for a side"},{"q":"In a right triangle, the side opposite an acute angle measures 9 cm and the hypotenuse measures 20 cm. What is the angle, to the nearest degree?","options":["27°","63°","24°","45°"],"answer":0,"explain":"sin(x) = opposite/hypotenuse = 9/20 = 0.45, so x = sin⁻¹(0.45) ≈ 27°.","topic":"Solving for an angle"},{"q":"In a right triangle, the legs measure 11 cm (opposite an acute angle) and 5 cm (adjacent to it). What is the acute angle, to the nearest degree?","options":["66°","24°","63°","65°"],"answer":0,"explain":"Tangent relates opposite and adjacent: tan(x) = 11/5 = 2.2, so x = tan⁻¹(2.2) ≈ 66°.","topic":"Solving for an angle"},{"q":"A kite string is 50 m long and makes an angle of elevation of 60° with the ground. How high is the kite, to the nearest tenth of a metre? (Ignore any sag in the string.)","options":["43.3 m","25.0 m","57.7 m","86.6 m"],"answer":0,"explain":"The height is opposite the 60° angle and the string is the hypotenuse, so height = 50 × sin(60°) ≈ 43.3 m.","topic":"Angle of elevation"},{"q":"From the top of a 30 m cliff, the angle of depression to a boat is 25°. How far is the boat from the base of the cliff horizontally, to the nearest tenth of a metre?","options":["64.3 m","14.0 m","71.0 m","12.7 m"],"answer":0,"explain":"The angle of depression equals the angle of elevation from the boat (alternate angles). Then tan(25°) = 30/distance, so distance = 30/tan(25°) ≈ 64.3 m.","topic":"Angle of depression"},{"q":"A 6 m ladder leans against a wall, making a 70° angle with the ground. How far up the wall does the ladder reach, to the nearest tenth of a metre?","options":["5.6 m","2.1 m","16.5 m","17.5 m"],"answer":0,"explain":"The height is opposite the 70° angle and the ladder is the hypotenuse, so height = 6 × sin(70°) ≈ 5.6 m.","topic":"Applications: ladder"},{"q":"A building casts an 18 m shadow when the sun's angle of elevation is 48°. How tall is the building, to the nearest tenth of a metre?","options":["20.0 m","13.4 m","26.9 m","12.0 m"],"answer":0,"explain":"Tangent relates the height and the shadow: tan(48°) = height/18, so height = 18 × tan(48°) ≈ 20.0 m.","topic":"Applications: shadows"},{"q":"A right triangle has a 40° angle, and the side adjacent to the 40° angle is 9 cm long. Which equation correctly solves for the hypotenuse h?","options":["cos(40°) = 9/h","sin(40°) = 9/h","tan(40°) = 9/h","cos(40°) = h/9"],"answer":0,"explain":"Cosine relates the adjacent side and the hypotenuse: cos(angle) = adjacent/hypotenuse, so cos(40°) = 9/h.","topic":"Setting up trig equations"},{"q":"An observer on the ground looks up at a drone flying overhead. The angle between the observer's horizontal line of sight and the line to the drone is called the angle of ___.","options":["elevation","depression","incidence","reflection"],"answer":0,"explain":"An angle measured upward from the horizontal is an angle of elevation; measured downward from the horizontal it would be an angle of depression.","topic":"Elevation vs depression"}],"shortBank":[{"q":"In right triangle PQR, the right angle is at Q, angle P = 28°, and the hypotenuse PR = 15 cm. Find the length of QR, to the nearest tenth of a centimetre. Show your setup.","marks":3,"answer":"QR is opposite the 28° angle, so sin(28°) = QR/15. QR = 15 × sin(28°) ≈ 15 × 0.4695 ≈ 7.0 cm.","topic":"Solving for a side"},{"q":"In right triangle ABC, the right angle is at B, AB = 8 cm and AC = 17 cm. Find the measure of angle A, to the nearest degree. Show your setup.","marks":3,"answer":"AC is the hypotenuse and AB is adjacent to angle A, so cos(A) = 8/17 ≈ 0.4706. A = cos⁻¹(0.4706) ≈ 61.9° ≈ 62°.","topic":"Solving for an angle"},{"q":"A student whose eyes are 1.7 m above the ground stands 25 m from the base of a flagpole. The angle of elevation from the student's eyes to the top of the flagpole is 32°. How tall is the flagpole, to the nearest tenth of a metre? Show your work.","marks":4,"answer":"Let h be the height above eye level: tan(32°) = h/25, so h = 25 × tan(32°) ≈ 25 × 0.6249 ≈ 15.6 m. Add the eye height: 15.6 + 1.7 = 17.3 m. The flagpole is about 17.3 m tall.","topic":"Angle of elevation"},{"q":"An airplane flying 1200 m above the ground spots an airport runway at an angle of depression of 18°. What is the horizontal distance from the plane to the runway, to the nearest metre? Show your work.","marks":4,"answer":"The angle of depression from the plane equals the angle of elevation from the runway (alternate interior angles), so tan(18°) = 1200/d, where d is the horizontal distance. d = 1200/tan(18°) ≈ 1200/0.3249 ≈ 3693 m.","topic":"Angle of depression"}]}]},
