cision-Making"},{"answer":3,"explain":"OSAP is Ontario's student financial aid program. It offers grants, which you do not repay, and loans for college, university, and other approved programs.","options":["A scholarship only for athletes","A loan you must repay with interest while still in school","Funding only for university students","Ontario's student financial aid program, offering grants and loans for post-secondary study"],"q":"What is OSAP (Ontario Student Assistance Program)?","topic":"Post-Secondary Costs"},{"answer":0,"explain":"A good plan works backward from your goal: the courses you take now must cover OSSD graduation requirements plus the prerequisites for your chosen college, university, apprenticeship, or workplace pathway.","options":["The courses you take now to your graduation requirements and the post-secondary path you want","Your favourite teachers to your timetable","Your part-time job to your weekends","Your electives to your friends' schedules"],"q":"A high-school education plan should connect…","topic":"Education Plans"},{"answer":2,"explain":"The real cost of school goes well beyond tuition. Housing, food, and transportation often rival tuition itself, especially if you move away from home.","options":["Tuition only","Tuition and textbooks","Tuition, housing, food, transportation, and personal expenses","Tuition and entertainment"],"q":"When planning for post-secondary costs, which list is the most complete budget?","topic":"Post-Secondary Costs"},{"answer":1,"explain":"The OSSD requires 40 hours of community involvement. Volunteering also builds experience and references you can put on a resume.","options":["100 volunteer hours","40 hours of community involvement","A paid part-time job","A full co-op placement"],"q":"To earn an Ontario Secondary School Diploma (OSSD), students must complete…","topic":"Education Plans"},{"answer":3,"explain":"Plans meet reality: programs fill up, interests shift, and costs change. A backup path means one setback does not stall your whole future.","options":["Because a first plan never works out","To impress the guidance counsellor","Because the government requires two plans","Because interests, marks, costs, or admission cutoffs can change, and a second path keeps you moving forward"],"q":"Why should a career plan include a backup (Plan B)?","topic":"Decision-Making"},{"answer":0,"explain":"SHSM programs bundle sector-focused courses, industry certifications such as First Aid, and co-op experience, giving students a head start on a career path.","options":["Bundle related courses, certifications, and co-op experience around a career sector like health or business","Skip all math requirements","Graduate a year early automatically","Guarantee a university scholarship"],"q":"A Specialist High Skills Major (SHSM) lets Ontario high school students…","topic":"Education Plans"},{"answer":2,"explain":"Good short-term goals are stepping stones. Signing up for OYAP and keeping math marks up feeds directly into the long-term goal of an electrical apprenticeship.","options":["Long-term: win the lottery / Short-term: buy a ticket","Long-term: become a nurse / Short-term: finish this week's homework","Long-term: become an electrician / Short-term: sign up for OYAP and keep my math marks up this semester","Long-term: travel the world / Short-term: skip class"],"q":"Which pair correctly shows a short-term goal supporting a long-term goal?","topic":"SMART Goals"},{"answer":1,"explain":"Prerequisites chain together: the courses you pick in Grade 10 unlock, or block, the Grade 11 and 12 courses that college and university programs require.","options":["The week applications are due","Now, because Grade 10 course choices affect prerequisites for the Grade 11 and 12 courses that programs require","After graduation","Only if their marks drop"],"q":"When should a Grade 10 student start seriously researching post-secondary programs?","topic":"Education Plans"},{"answer":3,"explain":"Salary alone ignores fit. Hours, work environment, training costs, and whether the work suits you all determine whether a well-paying job is actually good for you.","options":["Talking to a guidance counsellor","Researching two or three options first","Writing down pros and cons","Deciding based only on starting salary, without considering fit, costs, or lifestyle"],"q":"Which decision-making mistake should students avoid?","topic":"Decision-Making"}],"shortBank":[{"answer":"A SMART version covers all five elements, for example: I will raise my French mark from 70% to 78% by the end of the semester by practising vocabulary 15 minutes each night and completing all homework. (Specific: French mark. Measurable: 70 to 78%. Achievable: with nightly practice. Relevant: it lifts my average. Time-bound: end of semester.)","marks":3,"q":"Rewrite this vague goal as a SMART goal: I want to do better in French.","topic":"SMART Goals"},{"answer":"Engineering programs require specific Grade 12 courses such as advanced functions, calculus, physics, chemistry, and English, and each of those requires its Grade 11 prerequisite, which requires the right Grade 10 courses. Waiting until Grade 12 can leave you missing a link in the chain and delay your plans by a full year.","marks":2,"q":"Explain why a Grade 10 student who wants to study engineering should check university prerequisites now, not in Grade 12.","topic":"Education Plans"},{"answer":"Costs beyond tuition: housing or rent, food and groceries, transportation, textbooks and supplies, personal expenses (any four). Help paying: OSAP grants and loans, scholarships and bursaries, RESP savings, part-time or co-op earnings (any two).","marks":4,"q":"List four kinds of costs beyond tuition that a student should budget for when planning for college or university, and name two ways Ontario students can get help paying for school.","topic":"Post-Secondary Costs"},{"answer":"Any two valid strategies, for example: list the pros and cons of each option; compare each option against your interests, values, and skills; talk to a guidance counsellor or someone working in the field; research labour-market outlooks and the education each option needs; test an option first through a related course, volunteer role, or co-op.","marks":2,"q":"Describe two decision-making strategies you could use when choosing between two career options.","topic":"Decision-Making"}],"notes":"<h3>SMART Goals</h3>\n<p>A vague goal like \"do better in school\" is easy to ignore. A <strong>SMART goal</strong> is built so you can actually follow through:</p>\n<table>\n<tr><th>Letter</th><th>Stands for</th><th>Example</th></tr>\n<tr><td><strong>S</strong></td><td><strong>Specific</strong> — says exactly what you will do</td><td>Raise my chemistry mark — not \"do better in science\"</td></tr>\n<tr><td><strong>M</strong></td><td><strong>Measurable</strong> — trackable with numbers</td><td>From 75% to 82%, so you know when you've succeeded</td></tr>\n<tr><td><strong>A</strong></td><td><strong>Achievable</strong> — realistic with real effort</td><td>Reviewing 20 minutes each night, not 3 hours</td></tr>\n<tr><td><strong>R</strong></td><td><strong>Relevant</strong> — connects to your bigger plans</td><td>Chemistry matters for the health-science programs I'm considering</td></tr>\n<tr><td><strong>T</strong></td><td><strong>Time-bound</strong> — has a deadline</td><td>By December</td></tr>\n</table>\n<p>Put together: <strong>\"I will raise my chemistry mark from 75% to 82% by December by reviewing 20 minutes each night.\"</strong></p>\n<p>Use <strong>short-term goals as stepping stones</strong> to long-term ones. Long-term: become an electrician. Short-term: sign up for OYAP and keep my math marks up this semester.</p>\n<h3>Making Good Decisions</h3>\n<p>Big choices — courses, programs, careers — deserve a process, not a gut feeling. The <strong>DECIDE</strong> model:</p>\n<ol>\n<li><strong>D — Define</strong> the decision. (\"Which Grade 11 science courses should I take?\")</li>\n<li><strong>E — Establish</strong> your criteria: interests, values, skills, costs, lifestyle.</li>\n<li><strong>C — Consider</strong> the alternatives. List every real option.</li>\n<li><strong>I — Identify</strong> the best option by weighing pros and cons against your criteria.</li>\n<li><strong>D — Develop</strong> an action plan with steps and deadlines.</li>\n<li><strong>E — Evaluate</strong> the result and adjust if needed.</li>\n</ol>\n<p><strong>Mistakes to avoid:</strong> deciding on starting salary alone (fit, hours, work environment, training costs and lifestyle all matter); copying what friends choose; putting the decision off until options disappear.</p>\n<h3>Building Your Education and Career Plan</h3>\n<p>Work <strong>backward from your goal</strong>. If you want engineering, check university prerequisites <strong>now</strong>: they require specific Grade 12 courses (advanced functions, calculus, physics, chemistry, English), each needing its Grade 11 prerequisite — the choices you make in Grade 10 open or close those doors.</p>\n<h4>Know your graduation requirements</h4>\n<ul>\n<li><strong>OSSD</strong>: 30 credits, <strong>40 hours of community involvement</strong>, and the literacy requirement (the OSSLT test or the literacy course).</li>\n<li>Map your courses each year against both the OSSD and your post-secondary prerequisites.</li>\n</ul>\n<h4>Build experience while you're in school</h4>\n<ul>\n<li><strong>SHSM (Specialist High Skills Major)</strong>: bundle sector-focused courses, certifications (e.g. First Aid) and co-op experience around a field like health or business.</li>\n<li><strong>OYAP</strong>: start an apprenticeship (e.g. electrician) while still in high school.</li>\n<li><strong>Co-op, volunteering and part-time jobs</strong>: build skills and references you can put on a resume.</li>\n</ul>\n<h4>Always have a Plan B</h4>\n<p>Interests change, marks fluctuate, programs fill up and admission cutoffs move. A <strong>backup path</strong> means one setback doesn't stall your whole future.</p>\n<h3>Paying for Post-Secondary School</h3>\n<p>The real cost goes well beyond tuition. A complete budget covers:</p>\n<table>\n<tr><th>Cost</th><th>Rough Ontario range per year</th></tr>\n<tr><td>Tuition</td><td>College roughly $3,000–$5,000; university roughly $6,000–$11,000+ depending on the program</td></tr>\n<tr><td>Housing</td><td>Residence with a meal plan roughly $12,000–$17,000 — living at home saves the most</td></tr>\n<tr><td>Food and transportation</td><td>Several thousand per year if you live away from home</td></tr>\n<tr><td>Books and supplies</td><td>Roughly $1,000–$2,000</td></tr>\n<tr><td>Personal expenses</td><td>Set a monthly amount and track it</td></tr>\n</table>\n<h4>Ways to pay</h4>\n<ul>\n<li><strong>OSAP</strong> (Ontario Student Assistance Program): the province's financial aid — <strong>grants you don't repay</strong> plus loans, based on financial need. You apply for each year you're in school.</li>\n<li><strong>Scholarships</strong> (awarded for marks, athletics, community involvement) and <strong>bursaries</strong> (awarded for financial need) — free money, so apply to many.</li>\n<li><strong>RESP</strong>: an education savings account — the government adds 20% on the first $2,500 saved each year.</li>\n<li><strong>Part-time and summer work</strong>: covers personal costs and builds your resume at the same time.</li>\n</ul>\n<p><strong>Budgeting rule:</strong> list every cost before you commit, compare total costs across schools (living at home vs. away changes everything), and re-check your plan each year.</p>\n"},{"id":"finlit-basics","name":"Financial Literacy","instructions":"No notes. Aim for about 15 minutes.","quizFormat":{"mc":10,"short":0},"scoringGuide":"<strong>9–10:</strong> Ready. Walk in confident. <strong>7–8:</strong> Passing range — review the ones you missed and make sure you can explain why. <strong>Below 7:</strong> Redo the missed questions until you can explain each answer in your own words.","mcBank":[{"topic":"Budgeting","q":"Erica earns $240 a month from a part-time job. She spends $80 on bus fare and lunches, $60 on clothes, and puts the rest into savings. What percentage of her income is she saving?","options":["25%","About 42%","50%","60%"],"answer":1,"explain":"Savings = 240 − 80 − 60 = $100. 100 ÷ 240 ≈ 42%."},{"topic":"Earning","q":"Erica's first paycheque shows gross pay of $500, but only $435 lands in her account. What is the most likely reason?","options":["Her employer kept a fee","CPP, EI, and income tax were deducted","The bank charged her a fee","She was paid for fewer hours than she worked"],"answer":1,"explain":"CPP, EI, and income tax come off your gross pay before the money reaches you. Gross pay is never what you take home."},{"topic":"Taxes","q":"In Ontario, HST is 13%. A pair of headphones is priced at $80 before tax. About how much will Erica pay at the checkout?","options":["$80","$86","$90","$93"],"answer":2,"explain":"$80 × 1.13 = $90.40, so about $90. In Ontario, always add 13% HST to the sticker price."},{"topic":"Interest","q":"Erica puts $1,000 in a savings account earning 5% per year, compounded annually, and doesn't touch it. Roughly how much is in the account after 2 years?","options":["$1,050","$1,100","$1,103","$1,200"],"answer":2,"explain":"Year 1: $1,050. Year 2: $1,050 × 1.05 = $1,102.50 ≈ $1,103. That's compounding: you earn interest on last year's interest."},{"topic":"Credit","q":"Erica gets a credit card charging 19.99% annual interest. She charges $600 and then makes only the minimum payment each month. What is the main danger?","options":["Her credit limit drops immediately","Interest piles up and the $600 ends up costing far more over time","The card gets cancelled","Nothing — minimum payments are always fine"],"answer":1,"explain":"At 19.99%, unpaid balances grow fast. Minimum payments mostly cover interest, so the debt shrinks very slowly while the total cost balloons."},{"topic":"Credit score","q":"Which habit helps build a good credit score?","options":["Paying the full balance on time every month","Applying for five credit cards at once","Regularly using 95% of your credit limit","Ignoring the monthly statement"],"answer":0,"explain":"On-time full payments build your score. Multiple applications, maxed-out limits, and missed payments all hurt it."},{"topic":"Consumer awareness","q":"Two cereal boxes: 400 g for $3.20, or 600 g for $4.50. Which is the better deal per gram?","options":["The 400 g box","The 600 g box","They cost the same per gram","Impossible to tell"],"answer":1,"explain":"400 g box: $3.20 ÷ 400 = $0.008/g. 600 g box: $4.50 ÷ 600 = $0.0075/g. Always compare unit prices, not sticker prices."},{"topic":"Fraud","q":"Erica gets a text: “TD Bank: your account is locked. Verify now: td-secure-login.xyz”. What is the safest move?","options":["Click the link and log in quickly before the account closes","Reply with her password to prove it's her","Delete the text and log in through the bank's official app","Forward it to friends so they can check it too"],"answer":2,"explain":"Banks never ask you to log in through a texted link, and “td-secure-login.xyz” is not the bank's real site. When in doubt, go to the official app yourself."},{"topic":"Interest","q":"Erica borrows $300 and agrees to pay 10% simple interest for one year. How much does she repay after the year?","options":["$300","$310","$330","$360"],"answer":2,"explain":"$300 × 10% = $30 interest. $300 + $30 = $330."},{"topic":"Saving","q":"Why do financial planners suggest keeping an emergency fund of a few months' expenses in a savings account?","options":["To earn the highest possible returns","So unexpected costs don't force you into high-interest debt","To avoid paying income tax","Because savings accounts are fun to watch grow"],"answer":1,"explain":"The emergency fund exists so a surprise expense (phone repair, car trouble) doesn't land on a 19.99% credit card."},{"topic":"Budgeting","q":"Which of these is a need rather than a want?","options":["Courtside-style sneakers everyone at school has","A monthly bus pass to get to school and work","Concert tickets for your favourite artist","The newest phone case"],"answer":1,"explain":"A need is something you require to live, work, or get to school. Everything else on the list is a want — nice to have, but optional."},{"topic":"Interest","q":"A handy shortcut: divide 72 by your yearly interest rate to estimate how long money takes to double. If Erica's savings earn 6% per year, roughly how long until her money doubles?","options":["6 years","12 years","18 years","72 years"],"answer":1,"explain":"72 ÷ 6 = 12 years. The Rule of 72 is a quick estimate, not exact, but it shows why even small rate differences matter over time."},{"topic":"Earning","q":"Erica earns $17.50 an hour and works a 12-hour week. What is her gross pay for the week?","options":["$180","$192.50","$210","$227.50"],"answer":2,"explain":"$17.50 × 12 = $210. That's gross pay — before CPP, EI, and income tax come off."},{"topic":"Taxes","q":"Canada's income tax system is progressive. What does that mean?","options":["Everyone pays the same flat rate","Higher earners pay a higher tax rate on their additional income","Students never pay income tax","Tax rates go down as you earn more"],"answer":1,"explain":"Progressive means the rate steps up as income rises. A common myth is that earning more can leave you with less — it can't; only the dollars above each threshold are taxed at the higher rate."},{"topic":"Credit","q":"A store offers headphones for “4 payments of $25 — 0% interest!” What is the main catch to watch for?","options":["There is none; it's always free money","Miss a payment and you can face late fees, and the debt is still real money you owe","The headphones cost more than $100 this way","You can't return them"],"answer":1,"explain":"“0% interest” is real only if every payment lands on time. Miss one and late fees kick in — and $100 of headphones is still $100 of debt either way."},{"topic":"Credit","q":"Erica has a credit card with a $1,000 limit and currently owes $800 on it. She pays on time every month — so why might her credit score still drop?","options":["It won't; on-time payments are all that matter","Using 80% of her limit makes her look risky to lenders","Her limit is too high","Credit scores ignore balances"],"answer":1,"explain":"This is called utilization. Using most of your available credit signals risk, even with perfect payments. Staying under ~30% of your limit is the usual guideline."},{"topic":"Consumer awareness","q":"A video game is priced at $60, then marked “40% OFF”. What does Erica actually pay (before tax)?","options":["$20","$24","$36","$40"],"answer":2,"explain":"40% off $60 = $24 discount. $60 − $24 = $36. (Quick check: 10% of $60 is $6, so 40% is $24.)"},{"topic":"Fraud","q":"Erica sees an Instagram ad: “Earn $500/week reposting ads! No interview needed — just send us your bank login so we can set up direct deposit.” What should she do?","options":["Send the login — $500/week is worth it","Send it but change her password after","Walk away — it's a scam; real employers never ask for your bank login","Ask for $600/week first"],"answer":2,"explain":"No legitimate employer hires through DMs with no interview, and nobody legitimate ever needs your bank login — direct deposit uses an account number and transit number, which is very different from login access."},{"topic":"Saving","q":"Erica has $200 saved. She can spend it on concert tickets or keep saving it. If she buys the tickets, what is the opportunity cost?","options":["The price of the tickets","The $200 in savings — and any interest it would have earned — that she gives up","Zero, because concerts are priceless","The cost of getting to the concert"],"answer":1,"explain":"Opportunity cost is what you give up when you choose. It's not just the $200 — it's also whatever that $200 could have grown into."},{"topic":"Banking","q":"Why do people keep everyday spending money in a chequing account and savings goals in a separate savings account?","options":["It's required by law","Savings accounts earn interest, and separating the money makes it harder to accidentally spend your savings","Chequing accounts charge you for saving","There's no real reason"],"answer":1,"explain":"Two jobs, two accounts: chequing for money in motion, savings for money with a mission. Mixing them is how savings quietly become spending."}],"shortBank":[],"notes":"<h3>Budgeting</h3>\n<ul>\n<li>A <strong>budget</strong> is a plan for your money: what comes in, what goes out, and what you keep.</li>\n<li><strong>Needs</strong> are things you must have to live and function (food, housing, transportation, phone plan). <strong>Wants</strong> are things you'd like but can live without (new sneakers, streaming subscriptions, eating out).</li>\n<li>The <strong>50/30/20 rule</strong> is a simple starting budget: about <strong>50%</strong> of income for needs, <strong>30%</strong> for wants, and <strong>20%</strong> for savings. Track spending for a month first — most people are surprised where it goes.</li>\n</ul>\n<h3>Earning Income</h3>\n<ul>\n<li><strong>Gross pay</strong> is what you earn before anything is taken off. <strong>Net pay</strong> (take-home pay) is what you actually receive after deductions.</li>\n<li>A <strong>pay stub</strong> shows your gross pay, hours worked, and each deduction: income tax, CPP (Canada Pension Plan), and EI (Employment Insurance).</li>\n<li>Ontario's <strong>minimum wage</strong> is about <strong>$17.60/hour</strong> (adjusted regularly — check the current rate).</li>\n</ul>\n<h3>Taxes</h3>\n<ul>\n<li><strong>Income tax</strong> is a percentage of your earnings collected by the federal and Ontario governments to pay for services like health care, schools, and roads.</li>\n<li>Canada uses <strong>tax brackets</strong>: higher income is taxed at higher rates, but only the income <em>within</em> each bracket.</li>\n<li>The <strong>basic personal amount</strong> (roughly $16,000 federally) is tax-free — which is why many students get a tax refund.</li>\n<li><strong>HST</strong> (Harmonized Sales Tax) in Ontario is <strong>13%</strong> — 5% federal + 8% provincial — added to most purchases. A $20 item costs $22.60 after HST.</li>\n</ul>\n<h3>Interest: Simple vs Compound</h3>\n<ul>\n<li><strong>Interest</strong> is the price of borrowing money — or the reward for lending/saving it.</li>\n<li><strong>Simple interest</strong> is calculated only on the original amount: <strong>I = P × r × t</strong>.</li>\n<li><strong>Compound interest</strong> is calculated on the original amount <em>plus</em> previously earned interest — \"interest on interest\" — so money grows faster over time.</li>\n</ul>\n<h4>Worked example</h4>\n<p>You save $1,000 at 5% annual interest for 3 years:</p>\n<ul>\n<li>Simple: $1,000 + ($1,000 × 0.05 × 3) = <strong>$1,150.00</strong></li>\n<li>Compound: $1,000 × 1.05<sup>3</sup> = <strong>$1,157.63</strong></li>\n</ul>\n<p>The gap is small after 3 years but enormous over decades — which is why starting to save early matters.</p>\n<h3>Saving and Banking</h3>\n<ul>\n<li>A <strong>chequing account</strong> is for everyday money: debit purchases, e-transfers, bill payments. It earns little or no interest.</li>\n<li>A <strong>savings account</strong> earns interest and is meant for money you don't need right away — but rates at big banks are low, so shop around.</li>\n<li>An <strong>emergency fund</strong> is savings for surprises (phone repair, car trouble). Aim for a few hundred dollars as a student; adults aim for 3–6 months of expenses.</li>\n<li><strong>Pay yourself first</strong>: move savings out on payday, before you spend.</li>\n</ul>\n<h3>Credit and Borrowing</h3>\n<ul>\n<li>A <strong>credit card</strong> lets you borrow up to a limit and pay later. Used well it builds credit history; used badly it creates expensive debt.</li>\n<li>Interest on unpaid balances is high — often around <strong>20%</strong> per year. But there is a <strong>grace period</strong> (~21 days): pay the full balance by the due date and you pay no interest.</li>\n<li>The <strong>minimum payment</strong> (often ~$10 or a small percent) keeps the account in good standing but barely shrinks the debt.</li>\n</ul>\n<h4>Worked example</h4>\n<p>A $1,000 balance at 20% interest, paying only $25/month: it takes about <strong>5½ years</strong> to clear and costs roughly <strong>$660 in interest</strong> — you pay back $1,660 for $1,000 of purchases.</p>\n<h3>Credit Scores</h3>\n<ul>\n<li>A <strong>credit score</strong> (300–900 in Canada) sums up how reliably you handle borrowed money. Lenders check it before approving loans, credit cards, phone plans, or rentals.</li>\n<li>Scores around <strong>660+</strong> are considered fair, <strong>700+</strong> good, <strong>760+</strong> excellent.</li>\n</ul>\n<table>\n<tr><th>Builds your score</th><th>Hurts your score</th></tr>\n<tr><td>Paying every bill on time</td><td>Missed or late payments</td></tr>\n<tr><td>Keeping balances low (well under your limit)</td><td>Maxing out cards (high utilization)</td></tr>\n<tr><td>Keeping older accounts open</td><td>Applying for lots of credit at once</td></tr>\n</table>\n<h3>Consumer Awareness</h3>\n<ul>\n<li><strong>Comparison shop</strong>: check the <strong>unit price</strong> (price per 100 g, per litre) rather than the package price — bigger isn't always cheaper.</li>\n<li><strong>Read contracts before signing</strong>: know the total cost, the cancellation terms, and any fees. Never sign something you don't understand.</li>\n<li>A <strong>warranty</strong> promises repair or replacement if a product fails — check what it covers, for how long, and what voids it before paying extra for extended coverage.</li>\n<li>In Ontario, some contracts (like door-to-door sales) have a <strong>cooling-off period</strong> — days when you can cancel for a full refund.</li>\n</ul>\n<h3>Fraud and Scams</h3>\n<ul>\n<li><strong>Phishing</strong>: fake emails, texts, or calls pretending to be your bank, a delivery company, or the CRA to steal passwords or banking details.</li>\n<li><strong>Identity theft</strong>: someone uses your personal info (like your SIN) to open accounts or borrow money in your name.</li>\n</ul>\n<h4>Red flags</h4>\n<ul>\n<li>Urgent threats (\"your account will be closed today!\") or pressure to act immediately.</li>\n<li>Requests for payment by gift cards, cryptocurrency, or wire transfer.</li>\n<li>Deals that seem too good to be true, or links from senders you don't recognize.</li>\n</ul>\n<h4>Protect yourself</h4>\n<ul>\n<li>Never share your <strong>SIN, passwords, or banking codes</strong> — real banks and the CRA never ask by text or email.</li>\n<li>Use <strong>strong, unique passwords</strong> plus <strong>two-factor authentication</strong>; check statements regularly and shred documents with personal info.</li>\n<li>If scammed, tell your bank immediately and report it to the <strong>Canadian Anti-Fraud Centre</strong>.</li>\n</ul>\n"},{"id":"glc-job","name":"Job Search and Employability Skills","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":1,"explain":"Employers need to reach you, so your name, phone number, and email go first. Photos, references' private numbers, and elementary school grades do not belong on a resume.","options":["Your photo","Your name and contact information","Your references' phone numbers","Your elementary school grades"],"q":"What belongs at the top of a high-school resume?","topic":"Resumes"},{"answer":0,"explain":"A cover letter connects your skills to this specific employer's needs. It is tailored, concise, and shows you researched the company.","options":["Explain why you fit this specific job and employer, beyond what the resume lists","Repeat your resume word for word","List every course you have ever taken","Ask what the salary is"],"q":"What is the main job of a cover letter?","topic":"Cover Letters"},{"answer":2,"explain":"STAR turns rambling stories into clear evidence: describe the Situation and Task, explain the Action you took, and finish with the Result.","options":["Dress more formally","Answer questions in single words","Structure answers about past experiences as Situation, Task, Action, Result","Eliminate all nervousness"],"q":"In a job interview, the STAR method helps you…","topic":"Interviews"},{"answer":3,"explain":"Asking about success signals genuine interest and gives you real insight into the job. The other questions suggest you are already checked out.","options":["How soon can I take a vacation?","What is the least I would have to do?","Can I leave early on Fridays?","What does success look like in this role in the first few months?"],"q":"Which is a strong question to ask the employer at the end of an interview?","topic":"Interviews"},{"answer":0,"explain":"Most teen jobs come through people who already know you. Networking simply means letting teachers, coaches, family friends, and coworkers know you are looking and what you are good at.","options":["Building relationships through teachers, coaches, family friends, volunteering, and part-time work","Collecting hundreds of online connections","Handing out business cards at conferences","Only talking to company executives"],"q":"For a high-school student, networking most realistically means…","topic":"Networking"},{"answer":2,"explain":"Employers can train job-specific tasks, but they cannot train attitude. Showing up on time, communicating clearly, and cooperating are the real day-one requirements.","options":["Owning a car and a suit","Perfect grades in every subject","Reliability, communication, teamwork, and willingness to learn","Knowing the company's stock price"],"q":"Which set lists the employability skills an employer expects on day one?","topic":"Employability Skills"},{"answer":1,"explain":"The ESA sets the floor for Ontario workplaces: minimum wage, maximum hours, overtime pay, vacation pay, and termination notice all come from it.","options":["The school curriculum","Minimum standards for pay, hours, overtime, vacation, and termination","University admission rules","Traffic laws"],"q":"Ontario's Employment Standards Act (ESA) sets out…","topic":"Employee Rights"},{"answer":3,"explain":"Ontario workers have three basic safety rights: to know the hazards, to participate in safety, and to refuse unsafe work without being punished.","options":["Do it anyway to prove they are tough","Quit on the spot with no explanation","Post about it online first","Refuse the unsafe work, which is their legal right, and report it to a supervisor"],"q":"Under Ontario's Occupational Health and Safety Act, a young worker asked to do something dangerously unsafe should…","topic":"Workplace Safety"},{"answer":0,"explain":"WHMIS covers labels, safety data sheets, and safe handling of hazardous products. It is required wherever such products are used, from restaurant kitchens to retail stockrooms.","options":["It teaches you to recognize hazardous products and handle them safely","It replaces all other job training","It is only relevant for scientists","It guarantees a pay raise"],"q":"Why does WHMIS training matter even for a part-time job?","topic":"Workplace Safety"},{"answer":2,"explain":"A generic resume buries what matters. Moving the most relevant experience and skills to the top shows the employer, in seconds, why you are a fit for this job.","options":["Employers enjoy reading long resumes","Fancy fonts impress hiring managers","To highlight the skills and experience most relevant to that specific job","So the same file can be reused forever"],"q":"Why should you tailor your resume for each job application?","topic":"Resumes"},{"answer":1,"explain":"Available upon request keeps private contact details off your resume. You provide references later, ideally teachers, coaches, or supervisors who have seen your work.","options":["List three friends with their cell numbers","Write References available upon request","Attach copies of your report card","Skip it, since employers never check"],"q":"On a resume, what is the best way to handle references?","topic":"Resumes"},{"answer":3,"explain":"A short thank-you note restates your interest and keeps you memorable. It is professional without being pushy.","options":["Call every hour to check on the decision","Assume you got the job","Send the interviewer funny memes","Send a brief thank-you email within 24 hours"],"q":"After a job interview, what is the best next step?","topic":"Interviews"}],"shortBank":[{"answer":"Any three specific fixes, for example: cut it to one page, since a teen resume should fit on a single page; use one clean, readable font throughout; remove the reference's private phone number and write References available upon request instead; tailor the content to the job being applied for; add clear section headings such as contact, education, experience, and skills.","marks":3,"q":"Your friend's resume is two pages long, uses three different fonts, and lists a reference's personal phone number. Give three specific fixes.","topic":"Resumes"},{"answer":"Any two valid preparations, for example: research the company; plan your route and lay out what to wear; prepare answers to common questions like tell me about yourself using the STAR method; print extra copies of your resume; prepare one or two questions to ask them; get a good night's sleep.","marks":2,"q":"Name two things you should do to prepare the night before a job interview.","topic":"Interviews"},{"answer":"1) The right to know: to be informed about hazards in the workplace and trained to work safely. 2) The right to participate: to take part in keeping the workplace safe, for example through a health and safety representative or committee. 3) The right to refuse: to refuse work you believe is dangerously unsafe, without being punished or fired.","marks":4,"q":"Name the three basic health-and-safety rights Ontario workers have, and explain what each one means.","topic":"Workplace Safety"},{"answer":"They mean technical tasks are trainable, but work habits are not, so employers hire for reliability and character. Examples of the attitude they want: showing up on time for every shift; staying off your phone; helping teammates without being asked; accepting feedback gracefully; taking initiative.","marks":2,"q":"An employer says: I can teach anyone to run the cash register, but I can't teach attitude. Explain what they mean, and give two examples of the attitude they want.","topic":"Employability Skills"}],"notes":"<h3>The Resume</h3>\n<p>A resume is a one-page summary that sells your skills to an employer. Employers skim fast, so it must be clear and error-free.</p>\n<ul>\n<li><strong>Contact info</strong> — name, phone, professional email, city. No photos, no social media handles.</li>\n<li><strong>Objective or summary</strong> — 1–2 lines about the kind of work you want and what you offer.</li>\n<li><strong>Education</strong> — school, expected graduation year, relevant courses or awards.</li>\n<li><strong>Experience</strong> — paid jobs, volunteering, co-op, school clubs, sports. List the most recent first.</li>\n<li><strong>Skills</strong> — languages, computer skills, certifications (e.g. first aid, WHMIS).</li>\n</ul>\n<p>Start each bullet with a strong <strong>action verb</strong>: <em>organized, trained, assisted, created, managed, communicated</em>. <strong>Tailor</strong> every resume to the posting — mirror the employer's keywords and put the most relevant experience first. Proofread twice: a single typo can get a resume thrown out.</p>\n<h3>The Cover Letter</h3>\n<p>A cover letter (three short paragraphs) explains <em>why you</em> for <em>this</em> job:</p>\n<ul>\n<li><strong>Hook</strong> — which job you are applying for and one line that grabs attention.</li>\n<li><strong>Fit</strong> — connect 2–3 of your skills or experiences to what the posting asks for. Give a brief example.</li>\n<li><strong>Close</strong> — thank them, say you welcome an interview, and give your contact info.</li>\n</ul>\n<p>Keep it to one page, address a named person when possible, and never reuse the same letter for different jobs.</p>\n<h3>The Interview</h3>\n<p><strong>Prepare</strong> by researching the company, re-reading the posting, planning your route, and dressing one step above the job's dress code. Bring extra resumes and arrive 10 minutes early.</p>\n<h4>The STAR method</h4>\n<p>For behavioural questions (\"Tell me about a time you…\"), answer with <strong>STAR</strong>:</p>\n<ul>\n<li><strong>S</strong>ituation — set the scene briefly.</li>\n<li><strong>T</strong>ask — what needed to be done.</li>\n<li><strong>A</strong>ction — what <em>you</em> did.</li>\n<li><strong>R</strong>esult — the positive outcome.</li>\n</ul>\n<p>Ask <strong>questions</strong> at the end (about training, the team, next steps) — it shows genuine interest. Afterward, send a short <strong>thank-you email</strong> within 24 hours.</p>\n<h3>Networking</h3>\n<p><strong>Networking</strong> means building relationships that can lead to opportunities — most jobs are found through people, not postings. Tell family, teachers, and coaches you are looking; volunteer; do informational interviews (a 20-minute chat asking someone about their career). Always follow up and say thank you.</p>\n<h3>Employability Skills</h3>\n<p>Employers hire for attitude as much as ability. The core <strong>employability skills</strong> are:</p>\n<ul>\n<li><strong>Communication</strong> — clear speaking, writing, and listening.</li>\n<li><strong>Teamwork</strong> — cooperating, sharing credit, handling conflict calmly.</li>\n<li><strong>Reliability</strong> — showing up on time, every time; doing what you promised.</li>\n<li><strong>Problem-solving</strong> — thinking through solutions instead of freezing.</li>\n<li><strong>Adaptability</strong> — learning new tasks and accepting feedback.</li>\n</ul>\n<h3>Your Rights at Work in Ontario</h3>\n<p>The <strong>Employment Standards Act (ESA)</strong> sets minimum rules every employer must follow:</p>\n<ul>\n<li><strong>Minimum wage</strong> — about <strong>$17.95/hour</strong> general rate as of October 2026 (it rises most Octobers, so check the current rate). Students under 18 working 28 hours or less per week during school — or during school breaks — have a lower <strong>student rate of about $16.90/hour</strong>.</li>\n<li><strong>Hours</strong> — generally a maximum of 8 hours a day or 48 a week; <strong>overtime pay (1.5×)</strong> after 44 hours in a week.</li>\n<li><strong>Pay</strong> — vacation pay of at least 4% of wages, paid public holidays, and regular paydays. The <strong>3-hour rule</strong>: if you regularly work more than 3 hours a day and report for a shift, you are generally entitled to at least 3 hours of pay.</li>\n<li><strong>Protection from reprisal</strong> — it is illegal for an employer to punish or fire you for asking about or claiming your ESA rights.</li>\n</ul>\n<p>Most workplaces cannot hire anyone under <strong>age 14</strong>, and some hazardous jobs have higher age limits.</p>\n<h3>Workplace Safety</h3>\n<ul>\n<li><strong>WHMIS</strong> (Workplace Hazardous Materials Information System) — the Canada-wide system for hazardous products. Learn to read supplier <strong>labels</strong> (pictograms, hazard statements) and <strong>Safety Data Sheets (SDS)</strong>, which detail hazards, safe handling, and first aid. Your employer must train you.</li>\n<li><strong>Right to know</strong> — you have the right to be told about hazards in your workplace.</li>\n<li><strong>Right to refuse unsafe work</strong> — under Ontario's Occupational Health and Safety Act, you may refuse work you believe endangers your health or safety. Report it to your supervisor; the employer must investigate, and you cannot be punished for refusing in good faith.</li>\n</ul>\n<p>Questions about a right or a safety concern? Ontario's Employment Standards Information Centre answers them for free.</p>\n"}]},
{"id":"icd2o","name":"Digital Technology and Innovations (ICD2O1)","semester":1,"units":[{"id":"icd-computational","name":"Computational Thinking, Planning, and Purpose","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":1,"explain":"Decomposition means breaking a large problem into smaller sub-problems — here, the calendar, the sign-up form, and the reminders — that can be tackled one at a time.","options":["Writing all the code in one long sitting without a plan","Breaking the app into the calendar, the sign-up form, and the reminders, then solving each part","Copying a finished app from the internet","Starting with the colour scheme and fonts"],"q":"Erica is planning a school event app with a calendar, a sign-up form, and reminders. Which approach best shows decomposition?","topic":"Decomposition"},{"answer":2,"explain":"Pattern recognition is spotting similarities across problems; once you see the shared input-process-output pattern, you can reuse one solution design for all three apps.","options":["abstraction","decomposition","pattern recognition","debugging"],"q":"A student notices that a quiz app, a survey app, and a store checkout program all ask for input, process it, then show a result. Spotting this repeated input-process-output structure is an example of:","topic":"Pattern recognition"},{"answer":0,"explain":"Abstraction keeps only the details that matter for the task (the route) and hides the rest (trees, houses) to make the problem simpler.","options":["Abstraction","Decomposition","Pattern matching","Iteration"],"q":"A navigation app shows your route as a simple line instead of drawing every tree and house along the street. Which computational thinking skill is this?","topic":"Abstraction"},{"answer":3,"explain":"An algorithm is an ordered set of steps that solves a problem or completes a task — a sorting recipe qualifies; hardware and files do not.","options":["A fast computer","A printed photo","A computer virus","A step-by-step recipe for sorting names alphabetically"],"q":"Which of the following is an algorithm?","topic":"Algorithms"},{"answer":1,"explain":"Pseudocode lets you work out the logic in readable plain-language steps first, so syntax details do not get in the way of problem-solving.","options":["To make the program run faster","To plan the logic in plain language before worrying about exact programming syntax","To hide the code from other people","To automatically find and fix bugs"],"q":"What is the main purpose of writing pseudocode before coding?","topic":"Pseudocode"},{"answer":2,"explain":"A computational artifact is built for a purpose and an audience — knowing the users shapes what the app does and how it looks and talks to them.","options":["Teenagers never use apps","Professional developers are the only ones who plan","The features, wording, and design should fit the people who will actually use it","Adults and teens always want exactly the same app"],"q":"Erica is designing a budgeting app for teenagers. Why should she think about her audience while planning?","topic":"Planning for purpose and audience"},{"answer":0,"explain":"Computers follow steps exactly in order; putting on shoes before socks fails in real life the same way wrong sequence fails in a program.","options":["Doing steps out of order can produce a wrong result, so the sequence must be correct","Order never matters in an algorithm","Only the first step of an algorithm matters","Computers automatically shuffle steps into the right order"],"q":"In an algorithm, why does the order of steps (sequence) matter?","topic":"Algorithms"},{"answer":3,"explain":"AI learns from its data — if the data is unbalanced, the system copies that imbalance, which is why checking data for bias matters.","options":["The tool runs too fast","The tool costs too much electricity","The tool needs a bigger screen","Bias in the training data can make technology treat people unfairly"],"q":"A hiring tool trained mostly on resumes from one group keeps recommending candidates from that group. What issue does this show?","topic":"Digital technology and society"},{"answer":1,"explain":"Accessibility means people with different abilities can use the technology — image descriptions let blind users access visual content through screen readers.","options":["Tiny light-grey text on a white background","Adding text descriptions to images so screen readers can read them aloud","Auto-playing loud background music","Hiding all navigation buttons in a secret menu"],"q":"Which design choice best improves the accessibility of a website?","topic":"Digital technology and society"},{"answer":0,"explain":"Digital technology and programming appear across industries — from CNC machines in skilled trades to data tools in medicine — and keep evolving.","options":["Programming skills are used in many fields, including skilled trades, medicine, and business","Programming is only useful for making video games","Only university professors ever write code","Technology careers never change, so learning it once is enough"],"q":"Which statement about programming in careers is TRUE?","topic":"Careers and applications"},{"answer":3,"explain":"Safe data practices mean asking why an app wants your personal information and refusing access that has nothing to do with what the app does.","options":["Grant everything — free apps are always safe","Post your contacts online so the app works","Turn off your phone and never use apps again","Question it: a flashlight has no reason to need your contacts, so deny the permissions or delete the app"],"q":"A free flashlight app demands access to your contacts and location before it will turn on. What is the safest response?","topic":"Digital technology and society"},{"answer":2,"explain":"Iteration is repeating the design-test-improve cycle; each round uses real feedback to make the artifact better fit its purpose and audience.","options":["decomposition","abstraction","iteration","compilation"],"q":"Erica tests her program with classmates, finds the buttons confusing, and redesigns them. This cycle of testing, getting feedback, and improving is called:","topic":"Planning and iteration"}],"shortBank":[{"answer":"Any three sensible sub-problems, for example: (1) collect the student's classes, deadlines, and free time as input; (2) decide how to split study time across subjects; (3) display the schedule and let the student edit it. Each part is small enough to design and test on its own.","marks":3,"q":"Erica wants to build a program that helps students plan a weekly study schedule. Break this project into at least three smaller sub-problems she could solve one at a time.","topic":"Decomposition"},{"answer":"One correct version, for example: INPUT score \n IF score >= 60 THEN \n   OUTPUT \"Pass\" \n ELSE \n   OUTPUT \"Fail\" \n ENDIF. Full marks for correct input, condition, and both outputs.","marks":2,"q":"Write pseudocode for an algorithm that takes a student's test score (0–100) as input and outputs \"Pass\" if the score is 60 or more, otherwise outputs \"Fail\".","topic":"Algorithms and pseudocode"},{"answer":"Any clear example showing both sides, for example: in a school-bus tracker app you keep the bus location and route (they matter for the purpose) but leave out the colour of the bus seats (irrelevant). Full marks for naming the purpose, one kept detail with a reason, and one removed detail with a reason.","marks":3,"q":"Explain, using your own example, the difference between a detail you would KEEP and a detail you would LEAVE OUT when abstracting a real-world situation into a program.","topic":"Abstraction"},{"answer":"Any one sensible benefit (e.g., translation tools, medical image analysis, voice assistants) and any one sensible limitation or concern (e.g., it can reflect biased data, make confident mistakes, or raise privacy concerns). One mark each.","marks":2,"q":"Give one benefit and one limitation of artificial intelligence in everyday life.","topic":"Digital technology and society"}],"notes":"<h3>The Four Pillars of Computational Thinking</h3>\n<p><strong>Computational thinking</strong> is a problem-solving approach you use before you write any code. It has four parts:</p>\n<ul>\n<li><strong>Decomposition</strong> — breaking a big problem into smaller, manageable pieces. Building a school event app? Split it into a calendar, a sign-up form, and reminders, then solve each piece separately.</li>\n<li><strong>Pattern recognition</strong> — spotting similarities between problems. A quiz app, a survey app, and a store checkout all ask for input, check it, and store it. If you've solved one, you can reuse the pattern for the others.</li>\n<li><strong>Abstraction</strong> — hiding unnecessary detail and keeping only what matters. A navigation app shows your route as a simple line instead of drawing every tree and house along the way.</li>\n<li><strong>Algorithms</strong> — the step-by-step solution you design after the first three steps. A good algorithm is <strong>clear</strong> (unambiguous steps), <strong>correct</strong> (produces the right output), <strong>efficient</strong> (doesn't waste steps), and <strong>terminating</strong> (it finishes).</li>\n</ul>\n<h3>Algorithms and Sequence</h3>\n<ul>\n<li>An <strong>algorithm</strong> is a precise sequence of instructions for solving a problem — a recipe is a real-world algorithm.</li>\n<li><strong>Sequence matters</strong>: doing steps in the wrong order gives the wrong result (put on socks, then shoes — not the other way around).</li>\n<li>Algorithms are built from three structures: <strong>sequence</strong> (steps in order), <strong>selection</strong> (if/else decisions), and <strong>iteration</strong> (loops that repeat).</li>\n</ul>\n<h3>Pseudocode and Flowcharts</h3>\n<ul>\n<li><strong>Pseudocode</strong> is a plain-language outline of an algorithm written before coding, so you can plan the logic without worrying about syntax errors.</li>\n<li>A <strong>flowchart</strong> shows the same logic visually. Learn these basic symbols:</li>\n</ul>\n<table>\n<tr><th>Symbol</th><th>Shape</th><th>Meaning</th></tr>\n<tr><td>Oval</td><td>Start / End</td><td>Where the program begins and finishes</td></tr>\n<tr><td>Rectangle</td><td>Process</td><td>An action, e.g. <em>calculate total</em></td></tr>\n<tr><td>Parallelogram</td><td>Input / Output</td><td>Getting data in or showing results</td></tr>\n<tr><td>Diamond</td><td>Decision</td><td>A yes/no question that branches the flow</td></tr>\n<tr><td>Arrows</td><td>Flow lines</td><td>The direction the program follows</td></tr>\n</table>\n<h3>Planning for Purpose and Audience</h3>\n<ul>\n<li>Before building anything, ask: <strong>who is the user</strong> and <strong>what problem does this solve</strong>? A budgeting app for teenagers needs simple language and relatable examples — not the same design as banking software for adults.</li>\n<li>Good planning means defining the <strong>purpose</strong> (what the product must do), the <strong>audience</strong> (who will use it), and the <strong>constraints</strong> (time, tools, devices).</li>\n<li>Planning first saves time: fixing a design flaw on paper is cheap; fixing it after coding is expensive.</li>\n</ul>\n<h3>Iteration and Testing</h3>\n<ul>\n<li><strong>Iteration</strong> means building, testing, getting feedback, and improving — in cycles, not all at once.</li>\n<li><strong>Test with real users</strong>: if classmates find your buttons confusing, that's valuable data, not failure. Redesign and test again.</li>\n<li>Test <strong>edge cases</strong> too: empty input, huge numbers, unexpected clicks. Programs break where you least expect.</li>\n</ul>\n<h3>Digital Technology and Society</h3>\n<p>Technology brings benefits and drawbacks. Know both sides:</p>\n<table>\n<tr><th>Benefits</th><th>Drawbacks</th></tr>\n<tr><td>Instant access to information and learning</td><td><strong>Privacy risks</strong> — apps that demand contacts or location they don't need</td></tr>\n<tr><td>Connection across distances</td><td><strong>Bias</strong> — a hiring tool trained mostly on one group's resumes keeps recommending that group</td></tr>\n<tr><td>Tools for creativity and productivity</td><td>Overuse, distraction, and unequal access (the <strong>digital divide</strong>)</td></tr>\n</table>\n<ul>\n<li><strong>Accessibility</strong> is part of responsible design: high-contrast text, keyboard navigation, and alt text for images let everyone use your product.</li>\n<li>Ask the ethics question: <strong>who benefits, who could be harmed, and who was left out</strong> of this design?</li>\n</ul>\n<h3>Careers and Applications</h3>\n<ul>\n<li>Programming shows up far beyond \"programmer\" jobs: scientists analyze data, artists build digital media, engineers run simulations, and businesses automate routine work.</li>\n<li>Common paths include software development, web design, data analysis, cybersecurity, and IT support — and computational thinking is useful even in careers that never touch code.</li>\n<li>The common thread: every one of these careers starts with the same four pillars — decompose, find patterns, abstract, and design the algorithm.</li>\n</ul>\n"},{"id":"icd-hardware","name":"Hardware, Software, and Innovations","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":2,"explain":"The CPU (central processing unit) executes instructions — doing the actual calculations and control — which is why it is called the brain of the computer.","options":["Hard drive","Monitor","CPU","Keyboard"],"q":"Which component is often called the \"brain\" of the computer because it carries out program instructions?","topic":"Hardware components"},{"answer":0,"explain":"RAM holds data programs are actively using and is wiped at shutdown; storage (hard drive/SSD) keeps files permanently. Confusing the two is a classic mix-up.","options":["RAM is temporary working memory that is cleared when the computer turns off; the hard drive keeps files long-term","RAM and the hard drive do exactly the same job","RAM stores your files forever, even with no power","A bigger hard drive makes programs run faster"],"q":"Erica is choosing between more RAM and a bigger hard drive. Which statement is TRUE?","topic":"Memory vs storage"},{"answer":3,"explain":"System software (operating system, drivers, firmware) runs the computer itself; application software like a web browser is a tool the user runs on top of it.","options":["The operating system","Device drivers","The BIOS/UEFI firmware","A web browser"],"q":"Which of the following is application software rather than system software?","topic":"Types of software"},{"answer":1,"explain":"Input devices send data into the computer (microphone, keyboard, mouse); printers, speakers, and monitors send data out, so they are output devices.","options":["Printer","Microphone","Speaker","Monitor"],"q":"Which of these is an input device?","topic":"Hardware components"},{"answer":3,"explain":"Good file management — clear names and folders — means you can locate work quickly and back it up reliably instead of hunting through clutter.","options":["The desktop cannot hold any files","Folders use less electricity","Folders make programs run faster","Named folders make files easier to find, back up, and share"],"q":"Why is it good practice to organize files into named folders instead of saving everything on the desktop?","topic":"File management"},{"answer":0,"explain":"Cloud storage keeps a copy on remote servers, so your work is safe from a lost, stolen, or broken device and reachable anywhere you can log in.","options":["Files are reachable from any device and survive even if the laptop is lost or broken","Cloud files can never be deleted by anyone","Files open instantly with no internet connection needed","Cloud storage is always free and unlimited"],"q":"What is a main advantage of saving schoolwork to cloud storage instead of keeping it only on one laptop?","topic":"Cloud storage"},{"answer":1,"explain":"Long, unique passphrases resist guessing, and using a different one per account means one leaked password cannot open everything else.","options":["Using your birthday for every account","Using a long, unique passphrase for each important account","Sharing passwords with trusted friends","Writing passwords on a sticky note on the monitor"],"q":"Which password practice is safest?","topic":"Cybersecurity"},{"answer":2,"explain":"This is phishing: the misspelled domain and urgent threat are red flags. Never log in through an emailed link — go to the real site yourself.","options":["Click the link quickly before time runs out","Reply with her password to prove it is her","Delete the email and log in through the bank's official site or app","Forward it to all her contacts so they can check it"],"q":"Erica gets an email from \"support@yourbankk.com\" urging her to log in through the link before her account is closed. What should she do?","topic":"Cybersecurity"},{"answer":3,"explain":"AI finds patterns in its training data rather than truly understanding; bad or narrow data means confident mistakes and biased results.","options":["AI understands the world exactly like a human","AI works with no data at all","AI can never make a mistake","AI systems learn patterns from data, so they can be wrong or biased"],"q":"Which statement about artificial intelligence is TRUE?","topic":"Artificial intelligence"},{"answer":1,"explain":"A fair assessment weighs benefits (speed, consistency) against limitations (job loss, maintenance needs, loss of human judgment) — innovations always have both.","options":["Robots never break down or need repairs","Automation can eliminate jobs, and the robots still need humans to maintain, program, and oversee them","Robots work for free with no costs at all","Automation has no downsides worth considering"],"q":"A factory replaces assembly-line workers with robots. Which is a limitation of this automation?","topic":"Automation and innovations"},{"answer":2,"explain":"A router forwards data packets between your devices and the wider internet, deciding where each packet needs to go next.","options":["Cools down the computer","Prints documents","Directs data between the home devices and the internet","Charges the laptop battery"],"q":"What does a router do on a home network?","topic":"Networks"},{"answer":0,"explain":"Safe data practices start with informed choices: if an app wants more personal data than its job requires, that is a reason to say no.","options":["Collected data can be shared, sold, or misused, so you should only hand over what the app truly needs","Apps never collect any personal data","Checking wastes time and changes nothing","Every app is required by law to be completely safe"],"q":"Why should you check what personal data an app collects before installing it?","topic":"Data practices"}],"shortBank":[{"answer":"Any two correct components with roles, for example: the CPU carries out the game's instructions and calculations; RAM holds the data the game is actively using; the GPU (graphics card) draws the images; an SSD loads game data faster than a hard drive. Award marks for two components named with a correct role each.","marks":3,"q":"A friend says, \"I need a new computer because mine is too slow at running games.\" Name two hardware components that affect how fast games run, and explain what each one does.","topic":"Hardware components"},{"answer":"Cloud storage (or a backup drive) keeps a separate copy of the files away from the laptop, so losing the device does not mean losing the work — she could log in elsewhere and keep going.","marks":2,"q":"Erica's laptop was stolen, and her school project was saved only on that laptop. Explain how cloud storage or a regular backup would have prevented losing her work.","topic":"File management and backups"},{"answer":"Any two with reasons, for example: use long unique passwords (one leak cannot open all accounts); do not click suspicious links and check sender addresses (avoids phishing); keep software updated (patches security holes); limit app permissions (less data exposed). One mark per practice, one for a correct reason.","marks":3,"q":"Describe two safe practices Erica should follow to protect her personal data online, and explain why each one helps.","topic":"Cybersecurity"},{"answer":"Any one sensible benefit (e.g., fewer crashes caused by human error, mobility for people who cannot drive) and any one sensible limitation or concern (e.g., mistakes in bad weather, job losses for drivers, privacy from constant sensors, who is liable in a crash). One mark each.","marks":2,"q":"Self-driving cars are an emerging innovation. Give one potential benefit and one potential limitation or concern.","topic":"Emerging innovations"}],"notes":"<h3>Hardware Components</h3>\n<ul>\n<li>The <strong>CPU</strong> (central processing unit) is the \"brain\" of the computer: it carries out program instructions. Its speed is measured in <strong>gigahertz (GHz)</strong>, and most CPUs have multiple <strong>cores</strong> so they can do several things at once.</li>\n<li><strong>RAM</strong> (random access memory) is the computer's short-term working memory. It holds the programs and data the CPU is using right now. It is <strong>volatile</strong>: everything in RAM disappears when the power goes off.</li>\n<li><strong>Storage</strong> (hard drive HDD, or faster solid-state drive SSD) keeps data <strong>permanently</strong>, even with no power. This is where your files, apps, and the operating system live.</li>\n<li>The <strong>motherboard</strong> is the main circuit board that connects the CPU, RAM, storage, and everything else so they can communicate.</li>\n<li>The <strong>GPU</strong> (graphics processing unit) handles images, video, and 3D graphics — and is also used for AI workloads.</li>\n<li><strong>Peripherals</strong> are external devices. <strong>Input</strong> devices send data in (keyboard, mouse, microphone); <strong>output</strong> devices send data out (monitor, printer, speakers).</li>\n</ul>\n<h4>RAM vs Storage</h4>\n<table>\n<tr><th></th><th>RAM (memory)</th><th>Storage (drive)</th></tr>\n<tr><td>Purpose</td><td>Working space for active programs</td><td>Permanent home for files and apps</td></tr>\n<tr><td>When power is off</td><td>Emptied</td><td>Data stays</td></tr>\n<tr><td>Speed / size</td><td>Very fast, smaller (e.g. 8–16 GB)</td><td>Slower, much bigger (e.g. 256 GB–2 TB)</td></tr>\n</table>\n\n<h3>Types of Software</h3>\n<ul>\n<li><strong>System software</strong> runs the computer itself. The <strong>operating system</strong> (Windows, macOS, Linux, iOS, Android) manages the hardware, runs programs, and handles files. Drivers and utilities are also system software.</li>\n<li><strong>Application software</strong> (apps) is what you use to do tasks: web browsers, word processors, games, photo editors.</li>\n</ul>\n<h3>File Management</h3>\n<ul>\n<li>Organize files into <strong>named folders</strong> so you can find things later — saving everything on the desktop gets unmanageable fast.</li>\n<li>A <strong>file path</strong> shows a file's location, e.g. Documents/School/Science/notes.txt.</li>\n<li>The <strong>file extension</strong> (the part after the dot, like .txt, .docx, .pdf, .png) tells the operating system which app should open the file.</li>\n<li>Use clear names (e.g. science-quiz-1.txt) instead of \"untitled\".</li>\n</ul>\n<h3>Cloud Storage</h3>\n<ul>\n<li><strong>Cloud storage</strong> keeps your files on internet servers (Google Drive, OneDrive, iCloud) instead of only on your device.</li>\n<li><strong>Advantages:</strong> access from any device, automatic backup if a device is lost, easy sharing.</li>\n<li><strong>Disadvantages:</strong> needs internet, limited free space, and you trust a company with your data.</li>\n</ul>\n<h3>Networks</h3>\n<ul>\n<li>A <strong>LAN</strong> (local area network) connects devices in one place, like a home or school. A <strong>WAN</strong> (wide area network) spans long distances — the internet is the biggest WAN.</li>\n<li>A <strong>router</strong> directs traffic on a home network: it connects your devices to each other and to the internet, and gives each device a local address.</li>\n</ul>\n<h3>Cybersecurity</h3>\n<ul>\n<li>Use <strong>strong, unique passwords</strong> (long, mixed characters, different per account). A <strong>password manager</strong> remembers them, and <strong>two-factor authentication (2FA)</strong> adds a second check at login.</li>\n<li><strong>Phishing</strong> is a fake email, text, or site that steals login or banking details. Red flags: urgent threats, misspelled senders (e.g. support@yourbankk.com), \"log in now\" links. Never log in through a suspicious link.</li>\n<li><strong>Malware</strong> is harmful software: viruses, spyware, <strong>ransomware</strong> (locks files until you pay). Don't download from untrusted sources.</li>\n<li>Keep your OS and apps <strong>updated</strong> — updates patch the security holes attackers exploit.</li>\n<li>Keep <strong>backups</strong> of important work (cloud plus an external drive).</li>\n</ul>\n<h3>Data Practices</h3>\n<ul>\n<li>Many apps collect <strong>personal data</strong> (location, contacts, browsing). Before installing, check what data an app collects and what <strong>permissions</strong> it asks for — deny access it doesn't need.</li>\n<li>Skim the <strong>privacy policy</strong>, limit what you share publicly, and review phone app permissions regularly.</li>\n</ul>\n<h3>Artificial Intelligence</h3>\n<ul>\n<li><strong>Artificial intelligence (AI)</strong> means systems that do tasks needing human-like intelligence: recognizing images, understanding speech, recommending videos, generating text.</li>\n<li>Most modern AI uses <strong>machine learning</strong>: the system is <strong>trained on large amounts of data</strong> and finds patterns itself, instead of following fixed programmed rules.</li>\n<li>Examples: voice assistants, spam filters, autocorrect, recommendation feeds.</li>\n<li><strong>Limitations:</strong> AI can be confidently wrong, can reflect bias in its training data, and doesn't truly understand meaning — always verify important output.</li>\n</ul>\n<h3>Automation and Recent Innovations</h3>\n<ul>\n<li><strong>Automation</strong> uses machines or software to do work with less human involvement: factory robots, self-checkouts, self-driving cars.</li>\n<li><strong>Benefits:</strong> faster, more consistent work; safer for dangerous jobs.</li>\n<li><strong>Limitations:</strong> expensive, can displace workers, and may fail in situations it wasn't designed for — why self-driving cars still need testing and oversight.</li>\n</ul>\n"},{"id":"icd-programming","name":"Programming","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"topic":"Variables","q":"What is stored in x after this runs?\nx = 5\nx = x + 3\nprint(x)","options":["5","8","3","x"],"answer":1,"explain":"The second line reads the current value of x (5), adds 3, and stores 8 back into x."},{"topic":"Data types","q":"Which of these is a string (text) data type in Python?","options":["42","3.14","True","\"hello\""],"answer":3,"explain":"Quotes mark text data: \"hello\" is a string (str), while 42 is an int, 3.14 is a float, and True is a bool."},{"topic":"Operators","q":"What does 7 % 3 evaluate to in Python? (% gives the remainder after division.)","options":["1","4","2","10"],"answer":0,"explain":"7 ÷ 3 = 2 remainder 1, so 7 % 3 is 1. The % operator returns the remainder, not the quotient."},{"topic":"Input and output","q":"A user types Erica when the program asks for a name. What is displayed?\nname = input(\"Enter your name: \")\nprint(\"Hi, \" + name)","options":["Enter your name:","Hi, name","Hi, Erica","Hi, + name"],"answer":2,"explain":"input() stores what the user typed (\"Erica\") in name, then + joins \"Hi, \" and the value, giving \"Hi, Erica\"."},{"topic":"Conditionals","q":"For age = 15, what does this program output?\nage = 15\nif age >= 16:\n    print(\"can drive\")\nelse:\n    print(\"too young\")","options":["can drive","16","too young","age"],"answer":2,"explain":"The condition 15 >= 16 is False, so Python skips to the else branch and prints \"too young\"."},{"topic":"Loops","q":"How many times does the loop body run?\nfor i in range(1, 4):\n    print(i)","options":["3","1","4","0"],"answer":0,"explain":"range(1, 4) produces 1, 2, 3 — three iterations total. The stop value 4 is not included: a classic off-by-one trap."},{"topic":"Loops","q":"What is the final value of n after this loop finishes?\nn = 1\nwhile n < 4:\n    n = n + 1\nprint(n)","options":["1","3","5","4"],"answer":3,"explain":"n goes 1 → 2 → 3 → 4; when n reaches 4 the condition n < 4 is False, so the loop stops with n = 4."},{"topic":"Functions","q":"What is the main benefit of putting repeated code into a function?","options":["It makes the program run on any computer","You write it once and reuse it, so a fix or improvement happens in one place","Functions make code impossible for others to read","Functions automatically delete all bugs"],"answer":1,"explain":"A function packages a task into one reusable, named block (def ...) that you call wherever needed — less duplication, and a fix happens in one place."},{"topic":"Input and types","q":"What does this Python code do if the user types 7?\nage = input(\"Age: \")\nprint(age + 1)","options":["Prints 8","Prints 71","Prints \"Age: 8\"","It crashes with a TypeError"],"answer":3,"explain":"input() always returns a string, so age is \"7\" (text). Adding the number 1 to text raises a TypeError — convert first with int(age)."},{"topic":"Tracing code","q":"What value is printed by the last line?\na = 2\nb = 3\nc = a * b + 1\nprint(c)","options":["6","5","7","9"],"answer":2,"explain":"Multiplication comes first: a * b = 6, then + 1 gives 7, which is stored in c and printed."},{"topic":"Operators","q":"In Python, what is the difference between = and == ?","options":["There is no difference between them","= stores a value in a variable, while == compares two values","== stores a value, while = compares two values","Both delete the variable"],"answer":1,"explain":"A single = assigns (stores) a value; a double == tests whether two values are equal — mixing them up is a classic beginner bug."},{"topic":"Debugging","q":"This loop was meant to total 1+2+3+4+5 = 15, but it prints 5. What is the bug?\ncount = 0\nfor i in range(1, 6):\n    count = count + 1\nprint(count)","options":["The loop runs the wrong number of times","count should start at 1 instead of 0","print should be inside the loop","It adds 1 each time instead of adding i, so the total is 5 instead of 15"],"answer":3,"explain":"The loop correctly runs 5 times (range(1, 6) gives 1–5), but count = count + 1 just counts iterations; adding i each time would accumulate 1+2+3+4+5 = 15."}],"shortBank":[{"topic":"Variables and operators","q":"What is printed? Explain what each line does.\nprice = 20\ndiscount = 0.25\ntotal = price - price * discount\nprint(total)","marks":2,"answer":"15.0 is printed. Line 1 stores 20 in price; line 2 stores 0.25 in discount; line 3 computes 20 − (20 × 0.25) = 20 − 5.0 = 15.0 (multiplication first); line 4 prints total."},{"topic":"Conditionals","q":"Write Python code that reads a number and prints \"positive\" if it is above zero, \"negative\" if it is below zero, and \"zero\" otherwise.","marks":3,"answer":"One correct version, for example:\nn = float(input(\"Enter a number: \"))\nif n > 0:\n    print(\"positive\")\nelif n < 0:\n    print(\"negative\")\nelse:\n    print(\"zero\")\nOne mark each for handling positive, negative, and zero correctly."},{"topic":"Loops","q":"Write Python code using a loop that prints the numbers 10, 9, 8, 7, 6, 5 — one per line.","marks":3,"answer":"One correct version, for example:\nfor i in range(10, 4, -1):\n    print(i)\nFull marks for a loop that produces exactly 10 down to 5."},{"topic":"Debugging","q":"This program should print the average of three test scores, but the answer always comes out too small. Find the bug and explain the fix.\navg = s1 + s2 + s3 / 3\nprint(avg)","marks":4,"answer":"Bug: division runs before addition (order of operations), so only s3 is divided by 3 and then added to s1 + s2 — the sum is barely reduced, giving too small a result. Fix: add parentheses so the sum happens first: avg = (s1 + s2 + s3) / 3. Two marks for spotting the order-of-operations bug, two for the correct fix."}],"notes":"<h3>Variables and Assignment</h3>\n<p>A <strong>variable</strong> is a named container that stores a value. Use <code>=</code> to assign a value (this is <em>not</em> the equals sign from math).</p>\n<pre><code>name = \"Erica\"\nage = 15\nprint(name, age)   # prints: Erica 15</code></pre>\n<ul>\n<li>Variable names use letters, numbers, and underscores, and cannot start with a number (<code>score1</code> is fine, <code>1score</code> is not).</li>\n<li>Names are <strong>case-sensitive</strong>: <code>Score</code> and <code>score</code> are different variables.</li>\n<li>You can reassign a variable any time: <code>age = 16</code> replaces the old value.</li>\n</ul>\n\n<h3>Data Types</h3>\n<p>Every value has a type. Use <code>type()</code> to check it.</p>\n<table>\n<tr><th>Type</th><th>Meaning</th><th>Example</th></tr>\n<tr><td><code>int</code></td><td>whole number</td><td><code>7</code></td></tr>\n<tr><td><code>float</code></td><td>decimal number</td><td><code>3.5</code></td></tr>\n<tr><td><code>str</code></td><td>text in quotes</td><td><code>\"hi\"</code></td></tr>\n<tr><td><code>bool</code></td><td>True or False</td><td><code>True</code></td></tr>\n</table>\n\n<h3>Operators</h3>\n<h4>Arithmetic</h4>\n<table>\n<tr><th>Operator</th><th>Meaning</th><th>Example</th></tr>\n<tr><td><code>+ - *</code></td><td>add, subtract, multiply</td><td><code>3 * 4</code> → <code>12</code></td></tr>\n<tr><td><code>/</code></td><td>division (always gives a <code>float</code>)</td><td><code>5 / 2</code> → <code>2.5</code></td></tr>\n<tr><td><code>//</code></td><td>floor division (rounds down)</td><td><code>7 // 2</code> → <code>3</code></td></tr>\n<tr><td><code>%</code></td><td>remainder (modulo)</td><td><code>7 % 2</code> → <code>1</code></td></tr>\n<tr><td><code>**</code></td><td>power</td><td><code>2 ** 3</code> → <code>8</code></td></tr>\n</table>\n<h4>Comparison (result is always <code>True</code> or <code>False</code>)</h4>\n<p><code>==</code> <code>!=</code> <code>&gt;</code> <code>&lt;</code> <code>&gt;=</code> <code>&lt;=</code> — note the <strong>double</strong> equals for comparison. A single <code>=</code> assigns; <code>==</code> asks \"are they equal?\"</p>\n<h4>Logical</h4>\n<p><code>and</code> (both must be True), <code>or</code> (at least one True), <code>not</code> (flips it). Example: <code>True and False</code> → <code>False</code>; <code>not True</code> → <code>False</code>.</p>\n\n<h3>Input and Output</h3>\n<pre><code>n = int(input(\"Enter a number: \"))\nprint(n + 1)</code></pre>\n<ul>\n<li><code>print()</code> displays values on the screen.</li>\n<li><strong><code>input()</code> always returns a string</strong>, even if the user types digits. Convert it before doing math: <code>int()</code> for whole numbers, <code>float()</code> for decimals.</li>\n<li>Forgetting to convert is a classic bug: <code>\"7\" + 1</code> crashes with a <code>TypeError</code> because you can't add a string and a number.</li>\n</ul>\n\n<h3>Conditionals</h3>\n<pre><code>mark = 72\nif mark >= 80:\n    print(\"A\")\nelif mark >= 70:\n    print(\"B\")\nelse:\n    print(\"C\")   # prints: B</code></pre>\n<ul>\n<li>Each condition ends with a <strong>colon</strong>, and the block underneath is <strong>indented</strong> (4 spaces).</li>\n<li>Python checks from the top and runs the <strong>first</strong> branch whose condition is True, then skips the rest.</li>\n<li><code>elif</code> means \"else if\" — you can have as many as you need, but only one <code>else</code> at the end.</li>\n</ul>\n\n<h3>Loops</h3>\n<h4><code>for</code> loops (when you know how many times)</h4>\n<pre><code>for i in range(3):\n    print(i)   # prints: 0 1 2\n\nfor i in range(2, 8, 2):\n    print(i)   # prints: 2 4 6</code></pre>\n<ul>\n<li><code>range(3)</code> counts 0, 1, 2 — it <strong>stops before</strong> the end value.</li>\n<li><code>range(start, stop, step)</code> gives full control: start at 2, stop before 8, step by 2.</li>\n</ul>\n<h4><code>while</code> loops (repeat while a condition is True)</h4>\n<pre><code>n = 3\nwhile n > 0:\n    print(n)   # prints: 3 2 1\n    n = n - 1</code></pre>\n<ul>\n<li>Something inside the loop <strong>must</strong> eventually make the condition False, or the loop runs forever. Here <code>n = n - 1</code> counts down to 0.</li>\n</ul>\n\n<h3>Functions</h3>\n<pre><code>def add(a, b):\n    return a + b\n\nprint(add(4, 5))   # prints: 9</code></pre>\n<ul>\n<li><code>def</code> defines a function; <code>a</code> and <code>b</code> are <strong>parameters</strong> (placeholders for the values passed in).</li>\n<li><code>return</code> sends a value back to the caller. Without <code>return</code>, a function gives back <code>None</code>.</li>\n<li>Calling <code>add(4, 5)</code> runs the function with <code>a = 4</code> and <code>b = 5</code>.</li>\n</ul>\n\n<h3>Tracing Code</h3>\n<p><strong>Tracing</strong> means stepping through code by hand and tracking each variable's value, line by line. Make a small table with one column per variable and update it as you go.</p>\n<pre><code>x = 2\nfor i in range(3):\n    x = x + i\nprint(x)   # prints: 5</code></pre>\n<ul>\n<li>Trace: <code>i = 0</code> → <code>x = 2</code>; <code>i = 1</code> → <code>x = 3</code>; <code>i = 2</code> → <code>x = 5</code>.</li>\n<li>Slow down on loops and conditionals — most tracing mistakes come from skipping an iteration or misreading which branch runs.</li>\n</ul>\n\n<h3>Errors and Debugging</h3>\n<table>\n<tr><th>Error type</th><th>What it means</th><th>Example</th></tr>\n<tr><td><strong>Syntax error</strong></td><td>The code breaks Python's grammar rules, so it won't run at all.</td><td>Missing colon after <code>if</code>; writing <code>if x = 5:</code> instead of <code>==</code>.</td></tr>\n<tr><td><strong>Runtime error</strong></td><td>The code starts but crashes partway.</td><td><code>5 / 0</code> → <code>ZeroDivisionError</code>; using a variable that was never assigned → <code>NameError</code>.</td></tr>\n<tr><td><strong>Logic error</strong></td><td>The code runs but gives the wrong answer — the hardest to find.</td><td><code>a + b / 2</code> gives <code>125.0</code> instead of the average <code>85.0</code>; you meant <code>(a + b) / 2</code>.</td></tr>\n</table>\n<ul>\n<li>When Python crashes it prints a <strong>traceback</strong>. Read the <strong>last line first</strong> — it names the error (e.g. <code>ZeroDivisionError: division by zero</code>) — then look at the line number above it to find where it happened.</li>\n<li>Debug strategy: reproduce it, read the traceback, check the exact line, and test your fix with a quick <code>print()</code> of the suspicious values.</li>\n</ul>\n"}]},
