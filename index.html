{"id":"deca","name":"DECA — Ontario Business Exam","semester":"ec","units":[{"id":"on-mkt","name":"Marketing Foundations","instructions":"Closed book — about 40 seconds per question, like the real exam.","quizFormat":{"mc":14,"short":0},"notes":"- The 4Ps of the marketing mix: **Product** (what you sell), **Price** (what customers pay), **Place** (where and how they buy), **Promotion** (how you tell them).\n- **Target markets** are described with demographics — age, income, gender, education — and lifestyle (psychographics).\n- **Emotional** buying motives come from feelings (pride, confidence, belonging); **rational** motives come from logic (price, quality, fuel efficiency).\n- **AIDA** = Attention → Interest → Desire → Action, the stages a customer moves through before buying.\n- Promotion tools: **advertising** (paid messages), **publicity** (unpaid media coverage), **sales promotion** (coupons, contests, free samples, BOGO), **personal selling** (face-to-face selling).\n- Consumer goods: **impulse** (unplanned, e.g. checkout candy), **staple** (everyday basics like milk), **emergency** (urgent need, e.g. a snow shovel in a storm), **specialty** (a specific brand shoppers seek out).\n- The four **utilities**: form (making the product), place (available where wanted), time (available when wanted), possession (making ownership transfer easy, e.g. credit cards and instalment plans).\n- The goal of marketing is to create **exchanges of value**; a **clientele** is a base of repeat customers; **prospecting** is an ongoing process; **value-added services** (e.g. free home delivery) make an offer more attractive.","mcBank":[{"q":"Canadian Tire begins selling its tools on its website as well as in its physical stores. Which of the 4Ps is the company changing?","choices":["Product — what the company sells","Place — how and where customers can buy it","Price — what customers pay","Promotion — how the company advertises"],"answer":1,"explain":"Place (distribution) is about where and how customers can buy a product. Adding online sales changes the place, not the product itself."},{"q":"A company selling luxury watches targets men aged 35 to 55 with household incomes above $150,000. Which bases is it using to define its target market?","choices":["Geographic location and climate","Personality and values only","Shopping habits and brand loyalty","Demographics such as age and income"],"answer":3,"explain":"Age and income are demographics — measurable traits like age, income, gender, and education used to describe a target market."},{"q":"Jamal buys limited-edition sneakers mainly because owning them makes him feel confident and admired. What type of buying motive is this?","choices":["An emotional buying motive","A rational buying motive","A wholesale buying motive","A production motive"],"answer":0,"explain":"Emotional motives are driven by feelings such as pride, confidence, or belonging. A rational motive would rely on logic, like comparing prices or durability."},{"q":"In the AIDA model, what is the correct order of the four stages?","choices":["Action, Interest, Desire, Attention","Attention, Desire, Interest, Action","Attention, Interest, Desire, Action","Interest, Attention, Action, Desire"],"answer":2,"explain":"AIDA stands for Attention → Interest → Desire → Action: first win the customer's attention, build interest, create desire, then prompt the purchase."},{"q":"A Toronto food blogger writes a glowing review of a new poutine shop without being paid by the shop. Which promotion tool is this?","choices":["Advertising","Publicity","Personal selling","A coupon"],"answer":1,"explain":"Publicity is unpaid media coverage — the shop did not pay for the review. Advertising, by contrast, is a paid-for message."},{"q":"At the grocery store, Maya hands the cashier a printed slip that takes $1.00 off a jar of peanut butter. What is this promotion tool called?","choices":["A coupon","Publicity","Personal selling","A product warranty"],"answer":0,"explain":"A coupon is a certificate giving a discount on a specific product. Coupons are one kind of sales promotion, a category that also includes contests, free samples, and buy-one-get-one-free offers."},{"q":"Chocolate bars stacked beside the checkout are meant to be grabbed without any planning. What type of consumer good are they?","choices":["A staple good","An emergency good","A specialty good","An impulse good"],"answer":3,"explain":"Impulse goods are bought on the spur of the moment. Staple goods are everyday basics like milk, emergency goods meet an urgent need, and specialty goods are specific brands shoppers seek out."},{"q":"A furniture store lets customers pay in twelve monthly instalments and accepts all major credit cards. Which utility does this mainly create?","choices":["Form utility","Time utility","Possession utility","Place utility"],"answer":2,"explain":"Possession utility comes from making the transfer of ownership easy — flexible payments and credit acceptance help the customer take the product home."},{"q":"A convenience store in Oakville stays open 24 hours a day so customers can buy snacks at 2 a.m. Which utility does this mainly create?","choices":["Time utility","Form utility","Possession utility","Price utility"],"answer":0,"explain":"Time utility is created by having products available when customers want them — such as a store that never closes."},{"q":"A local bakery offers free home delivery for birthday cakes ordered online. This extra benefit is best described as:","choices":["A price reduction","A specialty good","Personal selling","A value-added service"],"answer":3,"explain":"A value-added service is an extra benefit — like free delivery — that makes the offer more attractive without changing the core product."},{"q":"In marketing, what does the term 'clientele' refer to?","choices":["First-time shoppers drawn in by an ad","Repeat customers who regularly buy from a business","The employees who serve customers","The suppliers who deliver inventory"],"answer":1,"explain":"A clientele is a business's base of repeat, loyal customers — the people who keep coming back."},{"q":"What is the main goal of marketing?","choices":["To produce as many goods as possible","To eliminate all competitors","To create value exchanges that satisfy both buyer and seller","To charge the highest price the market will bear"],"answer":2,"explain":"Marketing aims to create exchanges of value: the customer gets something they want and the business earns a profit, so both sides benefit."},{"q":"A real estate agent keeps meeting new people and adding contacts to her list even during her busiest months. What does this show about prospecting?","choices":["It is an ongoing process, not a one-time task","It is only done when sales are slow","It replaces the need for advertising","It is the final step of a sale"],"answer":0,"explain":"Prospecting — finding potential new customers — never stops. A steady pipeline of prospects keeps future sales coming."},{"q":"A salesperson from a business software company visits offices in person to demonstrate the product and answer questions. Which promotion tool is this?","choices":["Sales promotion","Publicity","Advertising","Personal selling"],"answer":3,"explain":"Personal selling is direct, person-to-person communication between a salesperson and a customer — ideal for complex products that need explanation."}],"shortBank":[]},{"id":"on-price","name":"Pricing & Break-Even","instructions":"Closed book — about 40 seconds per question, like the real exam.","quizFormat":{"mc":14,"short":0},"notes":"- **Penetration pricing**: a low opening price to win market share quickly.\n- **Price skimming**: a high opening price aimed at eager early buyers, lowered over time.\n- **Cost-plus pricing**: calculate the cost per unit, then add a markup to set the price.\n- **Competitive pricing**: set prices at or near what competitors charge.\n- The **break-even point** is where total revenue equals total costs, so profit is $0.\n- Break-even units = **fixed costs ÷ (price − variable cost per unit)**. The (price − variable cost) part is the **contribution margin** — what each sale contributes toward fixed costs.\n- E-businesses often price low to grow **market share** first and earn bigger profits later.\n- A price set **too low can signal poor quality** to shoppers.\n- **Ethical pricing** is honest — e.g. cause-related packaging that really donates as promised; bait-and-switch pricing is unethical.","mcBank":[{"q":"A new Canadian streaming service launches at $3.99 per month — far below its rivals — to attract subscribers as fast as possible. Which pricing strategy is this?","choices":["Price skimming","Cost-plus pricing","Penetration pricing","Competitive pricing"],"answer":2,"explain":"Penetration pricing sets a low opening price to penetrate the market quickly and win market share."},{"q":"A tech company releases its newest smartphone at $1,899, planning to lower the price next year once early demand fades. Which pricing strategy is this?","choices":["Price skimming","Penetration pricing","Competitive pricing","Cost-plus pricing"],"answer":0,"explain":"Price skimming starts high to 'skim' the eager, least price-sensitive buyers, then the price is lowered over time."},{"q":"A bakery calculates that each cake costs $18 to make, adds a 50% markup, and sells it for $27. Which pricing strategy is this?","choices":["Penetration pricing","Price skimming","Competitive pricing","Cost-plus pricing"],"answer":3,"explain":"Cost-plus pricing starts with the cost of making the product ($18) and adds a markup (50% → $27) to set the price."},{"q":"A new pizza shop checks what nearby pizzerias charge for a large pizza and sets its own price at the same level. Which pricing strategy is this?","choices":["Price skimming","Competitive pricing","Cost-plus pricing","Penetration pricing"],"answer":1,"explain":"Competitive pricing sets prices based on what competitors charge, rather than on costs or customer demand alone."},{"q":"Which of the following is NOT a pricing strategy?","choices":["Market segmentation","Penetration pricing","Price skimming","Cost-plus pricing"],"answer":0,"explain":"Market segmentation means dividing customers into groups for marketing — it is not a method of setting prices."},{"q":"A business reaches its break-even point when:","choices":["Its revenue is double its costs","It earns its very first dollar of profit","Its total revenue equals its total costs","Its fixed costs drop to zero"],"answer":2,"explain":"At the break-even point, revenue exactly covers all costs, so profit is zero — every unit sold after that adds to profit."},{"q":"A business has fixed costs of $8,000 per month. It sells a product for $20, and each unit costs $12 to make. How many units must it sell to break even?","choices":["400 units","667 units","800 units","1,000 units"],"answer":3,"explain":"Each unit contributes $20 − $12 = $8 toward fixed costs. $8,000 ÷ $8 = 1,000 units to break even."},{"q":"A company has fixed costs of $3,600. It sells each unit for $45, and the variable cost per unit is $27. What is the break-even point in units?","choices":["80 units","200 units","133 units","240 units"],"answer":1,"explain":"Contribution per unit is $45 − $27 = $18. $3,600 ÷ $18 = 200 units. (Dividing by the $45 price alone is a common mistake — you must subtract variable cost first.)"},{"q":"A company sells T-shirts for $25 each, and each shirt costs $15 in materials and labour. The $10 difference is called the:","choices":["Contribution margin","Fixed cost","Break-even point","Markup percentage"],"answer":0,"explain":"The contribution margin (price minus variable cost) is what each sale contributes toward covering fixed costs — and then toward profit."},{"q":"An online bookstore keeps its prices very low even though profits are thin. Which pricing goal is it most likely pursuing?","choices":["Maximizing short-term profit","Creating a prestige image","Covering fixed costs only","Growing its market share"],"answer":3,"explain":"Many e-businesses price low to grow their market share first — winning customers now and aiming for bigger profits later."},{"q":"A company launches a 'premium' leather wallet priced at $9.99, but sales are poor because shoppers assume it must be fake or low quality. This shows that:","choices":["Low prices always increase sales","Customers never pay attention to prices","A very low price can make customers doubt the quality","Premium products should be given away free"],"answer":2,"explain":"Price sends a quality signal: shoppers often assume a surprisingly cheap 'premium' product is poor quality, so pricing too low can backfire."},{"q":"A granola company prints on each box that 25 cents from every purchase goes to school breakfast programs — and it honours that promise. This is an example of:","choices":["Price skimming","Ethical pricing","Bait-and-switch pricing","Penetration pricing"],"answer":1,"explain":"Ethical pricing is honest and socially responsible — like cause-related packaging that really donates as promised. Bait-and-switch, which lures buyers with a fake low price, is unethical."},{"q":"A game-console maker launches at a high price for eager early buyers, then cuts the price each holiday season to attract more cautious shoppers. Which strategy is this?","choices":["Price skimming","Penetration pricing","Competitive pricing","Cost-plus pricing"],"answer":0,"explain":"This is skimming: start high to capture the least price-sensitive buyers first, then lower the price in steps to reach each new group."},{"q":"A bakery sells muffins for $2.00 each, but ingredients and packaging cost $2.50 per muffin. What happens with every muffin sold?","choices":["It earns a $0.50 profit","It breaks even","Its fixed costs disappear","It loses money on every muffin sold"],"answer":3,"explain":"When the price is below the variable cost, each sale adds to the loss. The price must rise above $2.50 (or costs must fall) before fixed costs even matter."}],"shortBank":[]},{"id":"on-own","name":"Business Ownership","instructions":"Closed book — about 40 seconds per question, like the real exam.","quizFormat":{"mc":14,"short":0},"notes":"- **Sole proprietorship**: one owner, often financed by **personal savings**; simple with full control, but **unlimited liability**.\n- **Unlimited liability**: the owner's personal savings and property can be seized to pay business debts.\n- **Partnership**: two or more co-owners share the investment, the work, the profits — and the liability.\n- **Corporation**: a separate legal entity; **limited liability** protects owners' personal property; it can raise large sums by selling shares.\n- **Shareholders** are part-owners who elect the **board of directors**.\n- A **public corporation** sells shares to the general public (e.g. on the TSX); a private corporation's shares stay with a small group.\n- A **franchise** is the right to operate under a brand's proven system — the best fit for a risk-averse, first-time owner who wants training and support.\n- A **co-operative**: the customers and the owners are the same people — members fund it, use it, and vote on it.","mcBank":[{"q":"Priya opens a dog-walking business using $4,000 from her own savings account and runs it entirely by herself. What form of ownership is this?","choices":["A sole proprietorship — financed by the owner's personal savings","A corporation — financed by selling shares","A franchise — financed by royalty payments","A co-operative — financed by government grants"],"answer":0,"explain":"A sole proprietorship is owned and run by one person, and it is commonly started with the owner's personal savings."},{"q":"A sole proprietor's catering business fails owing suppliers $60,000. What does 'unlimited liability' mean for her?","choices":["She owes nothing once the business closes","Only the business equipment can be seized","Creditors can claim her personal savings and property","The government pays the remaining debt"],"answer":2,"explain":"With unlimited liability there is no legal wall between owner and business — creditors can go after the owner's personal savings, car, or house."},{"q":"Two friends open a bike repair shop together, splitting the startup costs, the daily work, and the profits. What form of ownership is this?","choices":["A sole proprietorship","A partnership","A corporation","A co-operative"],"answer":1,"explain":"A partnership is a business co-owned by two or more people who share the investment, the work, and the profits."},{"q":"A corporation goes bankrupt owing $200,000. Thanks to limited liability, what happens to the owner's personal house?","choices":["It is sold to help pay the debt","It becomes company property","It is divided among the shareholders","It is protected — creditors cannot seize it"],"answer":3,"explain":"A corporation is a separate legal entity, so limited liability shields the owners' personal property from the business's debts."},{"q":"In a corporation, who elects the board of directors?","choices":["The shareholders","The customers","The suppliers","The bank that holds the company loan"],"answer":0,"explain":"Shareholders are part-owners of the corporation, and they vote to elect the board of directors that oversees management."},{"q":"A company lists its shares on the Toronto Stock Exchange so that anyone can buy them. What type of corporation is it?","choices":["A Crown corporation","A private corporation","A sole proprietorship","A public corporation"],"answer":3,"explain":"A public corporation sells shares to the general public. A private corporation's shares are held by a small, restricted group."},{"q":"Devon wants to open his first business. He isn't very creative, dislikes risk, and wants a proven system with training and a known brand name. Which option fits him best?","choices":["Starting an independent business from scratch","Buying a franchise","Forming a co-operative","Launching a public corporation"],"answer":1,"explain":"A franchise gives a first-time, risk-averse owner a tested business model, brand recognition, and ongoing support — ideal for someone who doesn't want to invent everything."},{"q":"Members of a neighbourhood food co-op each pay $50 for a membership share, shop at the store, and vote on how it is run. What makes this a co-operative?","choices":["It is owned by the government","It pays no taxes","Its customers and owners are the same people","It is not allowed to earn a surplus"],"answer":2,"explain":"In a co-operative, the members who use the business also own it — they fund it, shop there, and vote on decisions."},{"q":"Amara is a talented baker who wants full control over her recipes and business decisions, and she is comfortable accepting the risks herself. Which ownership form suits her?","choices":["A public corporation","A co-operative","A franchise","A sole proprietorship"],"answer":3,"explain":"A sole proprietorship gives one owner complete control and keeps things simple — the trade-off is unlimited liability."},{"q":"When you buy one share of a Canadian company, what do you become?","choices":["A part-owner of the company","An employee of the company","A lender to the company","A member of the board of directors"],"answer":0,"explain":"Each share is a slice of ownership, so a shareholder is a part-owner with voting rights — not an employee or a lender."},{"q":"A tech startup needs $2 million to grow, and its founders do not want to risk their homes if the business fails. Which ownership form should they choose?","choices":["A sole proprietorship","A general partnership","A corporation","A co-operative"],"answer":2,"explain":"Only the corporation combines limited liability (personal assets protected) with the ability to raise large amounts by selling shares."},{"q":"A group of neighbours starts a bulk-buying club: everyone contributes money, everyone shops there, and everyone votes on decisions. Which form of ownership is this?","choices":["A franchise","A co-operative","A sole proprietorship","A public corporation"],"answer":1,"explain":"When the customers are also the owners who fund and govern the business, it is a co-operative."},{"q":"Two sisters run a landscaping company as a general partnership. If the business cannot pay a $30,000 supplier bill, who is responsible?","choices":["Only the sister who signed the contract","Nobody — partnerships cannot be sued","Only the business bank account","Both partners — each has unlimited liability for the firm's debts"],"answer":3,"explain":"In a general partnership, every partner is personally liable for the business's debts — one reason some owners prefer a corporation's limited liability."},{"q":"What does a franchisee buy from a franchisor?","choices":["The right to operate under the brand's name and proven system","Shares in the parent company","Ownership of every location in the chain","A government business licence"],"answer":0,"explain":"A franchise is the right to run a business using the franchisor's brand, products, and methods — in exchange for fees and following the system."}],"shortBank":[]},{"id":"on-mgmt","name":"Management & Leadership","instructions":"Closed book — about 40 seconds per question, like the real exam.","quizFormat":{"mc":14,"short":0},"notes":"- **Planning** = setting goals and deciding how to reach them; **organizing** = arranging people, equipment, and schedules; **leading** = guiding, coaching, and motivating people; **controlling** = measuring results against the plan and fixing problems.\n- **Authoritarian** leaders decide alone (fast, but hurts morale); **democratic** leaders involve the team (slower, more buy-in); **laissez-faire** leaders are hands-off — best with skilled, self-directed, creative workers.\n- **Motivation** = the internal forces that drive a person's effort at work; managers tap it with recognition, growth opportunities, and fair rewards, not just orders.\n- **HR functions** include recruiting (finding and hiring), training, and managing employees — not product design or marketing.\n- When **selecting training methods**, start from the training objectives: first define what staff must be able to do, then pick the method that teaches it.\n- In a **crisis**, lead with calm, clear priorities plus support and encouragement — panic and blame make overwhelmed teams perform worse.\n- A report's **appendix** holds supporting materials (data, charts, details) so the main text stays clear and readable.\n- A **concession** is something one side gives up or agrees to in a negotiation to close the deal (e.g., a buyer asking a seller for free delivery).\n- **Intrapreneurship** = innovation and new ventures inside an existing company; **entrepreneurship** = starting your own business.","mcBank":[{"q":"A bakery owner sets a goal to raise holiday sales by 15% and decides which new pastries to promote and how much to spend on advertising. Which management function is she performing?","choices":["Controlling","Planning","Leading","Organizing"],"answer":1,"explain":"Planning means setting goals and deciding in advance how to reach them — exactly what she is doing before the holiday season starts."},{"q":"A warehouse supervisor assigns each worker to a zone, orders the scanners they need, and posts the new shift rotation. This is mainly an example of:","choices":["Leading","Controlling","Organizing","Planning"],"answer":2,"explain":"Organizing is arranging people, equipment, and schedules so the plan can actually happen."},{"q":"A restaurant manager holds weekly one-on-one meetings to coach servers, praise good work, and keep morale high during a busy season. Which management function is this?","choices":["Leading","Planning","Controlling","Organizing"],"answer":0,"explain":"Leading means guiding, coaching, and motivating people — the human side of management."},{"q":"At month-end, a clothing store manager compares actual sales to the sales target, spots a shortfall, and schedules extra weekend staff. This is an example of:","choices":["Planning","Organizing","Leading","Controlling"],"answer":3,"explain":"Controlling means measuring results against the plan and taking corrective action when there is a gap."},{"q":"A game studio manager lets her experienced designers pick their own projects and set their own hours, checking in only when they ask for help. Her leadership style is:","choices":["Authoritarian","Laissez-faire","Democratic","Crisis leadership"],"answer":1,"explain":"Laissez-faire leadership is hands-off; it works best with skilled, self-directed, creative workers who don't need close supervision."},{"q":"Before finalizing the new shift schedule, a café owner asks all the baristas to discuss the options and vote on their favourite. This leadership style is:","choices":["Laissez-faire","Authoritarian","Democratic","Bureaucratic"],"answer":2,"explain":"Democratic leaders involve the team in decisions. It takes longer but builds commitment to the outcome."},{"q":"A factory owner issues daily production orders, expects them followed exactly, and never asks workers for input. This leadership style is:","choices":["Authoritarian","Democratic","Laissez-faire","Coaching"],"answer":0,"explain":"Authoritarian leaders decide alone and expect obedience — fast in emergencies, but it can damage morale over time."},{"q":"In management, employee motivation refers to:","choices":["The personality traits people are born with","The minimum wage set by the government","The number of hours an employee works each week","The internal forces that drive a person's effort at work"],"answer":3,"explain":"Motivation comes from within — needs, goals, and desires. Managers influence it with recognition, growth, and fair rewards."},{"q":"Which of the following is NOT a typical human resources function?","choices":["Recruiting new employees","Training new hires","Designing the company's product packaging","Managing employee relations"],"answer":2,"explain":"HR covers recruiting, training, and managing people. Product packaging is a marketing/operations job, not an HR one."},{"q":"A hotel manager is choosing how to train new front-desk staff. The best first step is to:","choices":["Pick the cheapest training option available","Identify the training objectives — what staff must be able to do","Copy the training program used by a rival hotel","Ask staff which method sounds the most fun"],"answer":1,"explain":"Start from the objectives: define the skills staff must learn first, then choose the method that teaches those skills."},{"q":"During an unexpected dinner rush with two staff calling in sick, the best thing a restaurant manager can do for her overwhelmed team is to:","choices":["Stay calm, set clear priorities, and encourage the team","Wait in the office until the rush is over","Blame the team for being too slow","Cancel all breaks without any explanation"],"answer":0,"explain":"In a crisis, people need calm direction plus support and encouragement — panic and blame only make an overwhelmed team perform worse."},{"q":"The purpose of an appendix in a business report is to:","choices":["List the report's main conclusions up front","Replace the executive summary","Introduce the person who wrote the report","Provide supporting materials, such as data and charts, without cluttering the main text"],"answer":3,"explain":"The appendix holds extra detail for readers who want it, keeping the main report clear and readable."},{"q":"A café owner tells a supplier, \"I'll sign the one-year contract if you include free staff training on the new machine.\" The free training is an example of a:","choices":["Budget","Invoice","Concession","Warranty"],"answer":2,"explain":"A concession is something one side gives up or agrees to during a negotiation in order to close the deal."},{"q":"A bank gives employees paid time each month to develop their own new app ideas, and funds the best ones. This policy encourages:","choices":["Entrepreneurship","Intrapreneurship","Outsourcing","Downsizing"],"answer":1,"explain":"Intrapreneurship is creativity and new ventures inside an existing company; entrepreneurship means starting your own separate business."}],"shortBank":[]},{"id":"on-fin","name":"Finance & Accounting","instructions":"Closed book — about 40 seconds per question, like the real exam.","quizFormat":{"mc":14,"short":0},"notes":"- **Accounts receivable** = money customers owe YOU (billed but not yet received); **accounts payable** = money YOU owe your suppliers.\n- **Income statement** = revenues minus expenses over a period (shows profit or loss); **balance sheet** = assets, liabilities, and owner's equity at one point in time; **cash flow statement** = actual cash moving in and out.\n- Trade terms **a/b, net n**: take a b% discount if you pay within a days; otherwise the full amount is due within n days. Discount = invoice amount × b%.\n- **Average inventory = annual sales ÷ stock turnover rate** (e.g., $300,000 ÷ 6 = $50,000).\n- **Gross profit = sales revenue − cost of goods sold**; gross income (revenue) is total sales before subtracting any costs.\n- Most **sole proprietors** start their business with their own personal savings, since they cannot sell shares.\n- A **credit sale** = customer takes the goods now and pays later; **layaway** is the reverse — the customer pays over time and takes the goods after the final payment.\n- **Stocks** represent ownership and are riskier because their value falls if the company does poorly; **bonds** are loans that pay fixed interest and are generally safer.\n- The first step in a realistic **personal budget** is to track and record what you actually spend — you can't plan spending you haven't measured.","mcBank":[{"q":"A florist delivers $900 of wedding flowers and sends the client an invoice due in 30 days. Until the client pays, the $900 is the florist's:","choices":["Accounts payable","Gross profit","Accounts receivable","Cash on hand"],"answer":2,"explain":"Accounts receivable is money billed to customers but not yet received — the client owes the florist."},{"q":"The same florist receives a $250 bill from its flower supplier, payable next month. The $250 is the florist's:","choices":["Accounts payable","Accounts receivable","Revenue","Owner's equity"],"answer":0,"explain":"Accounts payable is money the business itself owes to its suppliers."},{"q":"Which financial statement shows a company's revenues and expenses over a period such as a quarter or a year?","choices":["Balance sheet","Income statement","Bank statement","Purchase order"],"answer":1,"explain":"The income statement (profit-and-loss statement) reports revenue minus expenses, showing profit or loss over time."},{"q":"A balance sheet shows:","choices":["Only the cash a business holds","Revenues and expenses for the year","The owner's personal budget","What a company owns and owes at a specific point in time"],"answer":3,"explain":"The balance sheet lists assets, liabilities, and owner's equity as of one date — a snapshot, not a period report."},{"q":"Which statement tracks the actual cash moving in and out of a business?","choices":["Cash flow statement","Income statement","Balance sheet","Sales forecast"],"answer":0,"explain":"The cash flow statement follows real cash inflows and outflows — a business can look profitable yet still run short of cash."},{"q":"An invoice is marked \"2/10, net 30.\" This means:","choices":["Pay 2% now and the rest in 10 days","A 2% penalty applies after 30 days","Take a 2% discount if you pay within 10 days; otherwise the full amount is due in 30 days","Pay in 2 instalments spread over 30 days"],"answer":2,"explain":"In terms a/b, net n: the first number is the discount percent, the second is the discount window, and net n is the final payment deadline."},{"q":"A bike shop orders 8 helmets at $95 each, terms 2/10, net 30, and pays within 10 days. How much does it owe?","choices":["$760.00","$744.80","$15.20","$95.00"],"answer":1,"explain":"Invoice = 8 × $95 = $760. The 2% discount is $15.20, so the amount due is $760 − $15.20 = $744.80."},{"q":"A sporting goods store has annual sales of $300,000 and a stock turnover rate of 6. Its average inventory is:","choices":["$1,800,000","$300,006","$60,000","$50,000"],"answer":3,"explain":"Average inventory = annual sales ÷ turnover rate = $300,000 ÷ 6 = $50,000."},{"q":"Maya sells phone cases at a school fair, collecting $640 in sales. The cases and supplies cost her $260. Her gross profit is:","choices":["$380","$640","$900","$260"],"answer":0,"explain":"Gross profit = revenue − cost of goods sold = $640 − $260 = $380. The $640 alone is gross income (total sales)."},{"q":"How do most sole proprietors finance their business when starting out?","choices":["By selling shares to the public","With loans from the Bank of Canada","With their own personal savings","With customer deposits"],"answer":2,"explain":"A sole proprietor cannot issue shares, so most founders start with personal savings, sometimes topped up with small loans."},{"q":"A customer takes a winter jacket home today, and the store bills her with payment due in 30 days. This is a:","choices":["Cash sale","Layaway plan","Barter deal","Credit sale"],"answer":3,"explain":"A credit sale means goods now, payment later. Layaway is the reverse: pay over time, take the goods after the final payment."},{"q":"Why are stocks generally considered riskier than bonds?","choices":["Stocks pay a fixed interest rate","A stock's value depends on how the company performs — if it does poorly, investors can lose money","Bonds represent ownership in a company","Stocks are issued by governments"],"answer":1,"explain":"Stocks are ownership shares whose value rises and falls with the company; bonds are loans that pay fixed interest, making them generally safer."},{"q":"What is the recommended first step in building a realistic personal budget?","choices":["Track and record what you actually spend for a few weeks","Cancel all entertainment spending immediately","Open a second bank account","Set a savings goal of 50% of your income"],"answer":0,"explain":"You cannot plan spending you haven't measured — tracking real expenses first makes the budget honest and workable."},{"q":"A corner store's income statement shows revenue of $90,000 and total expenses of $64,000 for the year. Its net income is:","choices":["$90,000","$154,000","$64,000","$26,000"],"answer":3,"explain":"Net income = revenue − expenses = $90,000 − $64,000 = $26,000."}],"shortBank":[]},{"id":"on-econ","name":"Economics","instructions":"Closed book — about 40 seconds per question, like the real exam.","quizFormat":{"mc":14,"short":0},"notes":"- **GDP** = the total value of final goods and services produced in a country in a year. Intermediate goods (used to make other goods) and used goods are not counted separately — that would be double counting.\n- The four **factors of production**: land (natural resources), labour (workers), capital (tools, machines, buildings), and entrepreneurship (organizing the other three and taking the risk).\n- The **equilibrium price** is where quantity supplied equals quantity demanded.\n- **Opportunity cost** = the value of the best alternative you give up when you make a choice.\n- **Fiscal policy** (government: taxes and spending) vs **monetary policy** (Bank of Canada: interest rates and the money supply).\n- Lower **customs duties** (tariffs) make cross-border trade easier and imported goods cheaper.\n- Governments encourage **small business** mainly because small firms create a large share of jobs.\n- **Sustainability** = meeting present needs without harming future generations' ability to meet their own needs.\n- A **business case** analyzes a problem and compares possible solutions to justify a project or change; a **business plan** outlines the business's long-term objectives and strategies.","mcBank":[{"q":"Which of the following purchases is counted in Canada's GDP?","choices":["A bakery buys $200 of flour to bake bread it will sell","A student buys a $60 sweater from a Canadian retailer","A family buys a used couch from a neighbour","A bakery buys a second-hand oven"],"answer":1,"explain":"GDP counts final goods and services only. The new sweater is a final good; flour is an intermediate good, and used items are not new production."},{"q":"A bakery buys $500 of sugar to make cakes it will sell this month. How is the sugar treated when measuring GDP?","choices":["Counted twice — once as sugar and once as cake","Counted as a final good","Counted only if the bakery is a small business","Not counted separately — it is an intermediate good whose value is captured when the cakes are sold"],"answer":3,"explain":"Intermediate goods are excluded from GDP to avoid double counting; their value shows up in the final product's price."},{"q":"Which list names all four factors of production?","choices":["Land, labour, capital, entrepreneurship","Money, land, labour, technology","Land, labour, money, machines","Capital, stocks, bonds, entrepreneurship"],"answer":0,"explain":"The four factors are land (natural resources), labour (workers), capital (tools and buildings), and entrepreneurship (organizing and risk-taking)."},{"q":"In a pizza shop, the ovens, delivery scooters, and the building itself are examples of which factor of production?","choices":["Land","Labour","Capital","Entrepreneurship"],"answer":2,"explain":"Capital means the human-made tools, equipment, and buildings used to produce goods and services."},{"q":"At $12 a ticket, a concert organizer is willing to sell 500 tickets and exactly 500 fans want to buy them. The $12 price is the:","choices":["Price ceiling","Equilibrium price","Surplus price","Opportunity cost"],"answer":1,"explain":"Equilibrium is the point where quantity supplied equals quantity demanded — the market clears at that price."},{"q":"Liam quits a part-time job paying $400 a month so he can spend weekends training for a tennis tournament. His opportunity cost is:","choices":["The cost of his tennis racket","The total hours he spends training","Zero, because training is free","The $400 a month in wages he gives up"],"answer":3,"explain":"Opportunity cost is the value of the best alternative you give up — here, the wages from the job."},{"q":"To fight a recession, the federal government cuts taxes and increases spending on infrastructure. This is an example of:","choices":["Fiscal policy","Monetary policy","Trade policy","Competition policy"],"answer":0,"explain":"Fiscal policy covers government decisions about taxes and spending used to influence the economy."},{"q":"The Bank of Canada raises interest rates to slow inflation. This action is an example of:","choices":["Fiscal policy","A customs duty","Monetary policy","A government subsidy"],"answer":2,"explain":"Monetary policy is the central bank's job: managing interest rates and the money supply."},{"q":"Canada lowers its customs duties on imported bicycles. The most likely result is that:","choices":["Imported bicycles become more expensive","Imported bicycles become cheaper and cross-border trade increases","Bicycle imports are banned","Canadian bike shops must close"],"answer":1,"explain":"Lower duties cut the cost of importing, so foreign goods get cheaper and trade between countries grows."},{"q":"Why do Canadian governments run programs to encourage small businesses?","choices":["Small businesses never fail","Small businesses pay no taxes","Small businesses don't need employees","Small businesses create a large share of jobs"],"answer":3,"explain":"Small firms are major job creators, so supporting them is really about supporting employment."},{"q":"A furniture company plants two trees for every one it harvests, so future generations can also make furniture. This is an example of:","choices":["Sustainability","A monopoly","Outsourcing","Equilibrium"],"answer":0,"explain":"Sustainability means meeting today's needs without harming future generations' ability to meet theirs."},{"q":"Before approving a costly new delivery app, a retailer writes a document analyzing the delivery problem and comparing possible solutions. This document is a:","choices":["Receipt","Warranty","Business case","Pay stub"],"answer":2,"explain":"A business case analyzes a problem and the options for solving it, used to justify a project or change."},{"q":"The primary goal of a business plan is to:","choices":["File the company's taxes","Outline the business's long-term objectives and the strategies to achieve them","List every employee's job title","Record daily sales totals"],"answer":1,"explain":"A business plan maps out where the business is headed and how it will get there — its long-term goals and strategies."},{"q":"Priya brings together investors' money, hired bakers, rented ovens, and her own recipe idea to open a new bakery, accepting the risk that it might fail. Priya provides:","choices":["Land","Capital","Labour","Entrepreneurship"],"answer":3,"explain":"Entrepreneurship is organizing land, labour, and capital into a new venture and taking on the risk."}],"shortBank":[]},{"id":"on-can","name":"Canadian Business Environment","instructions":"Closed book — about 40 seconds per question, like the real exam.","quizFormat":{"mc":14,"short":0},"notes":"- The **Canada Labour Code** covers federally regulated workplaces (banks, airlines, telecom) and requires **overtime pay** after 8 hours/day or 40 hours/week.\n- The **Bank of Canada** controls **monetary policy**, mainly by setting the policy interest rate to fight inflation.\n- **Fiscal policy** (government spending and taxation) is set by the **federal government**, not the Bank of Canada.\n- **Team Canada trade missions**, led by **Global Affairs Canada**, help Canadian businesses meet customers and suppliers abroad.\n- **Mark Carney** is the Prime Minister of Canada (note the spelling).\n- The four workplace hazard types: **chemical, physical, biological, ergonomic**.\n- Governments encourage small business because small businesses **provide many jobs** for Canadians.","mcBank":[{"q":"A bank teller in Toronto works 9 hours on Monday. Under the Canada Labour Code, when must her federally regulated employer start paying overtime?","choices":["After 8 hours in a day or 40 hours in a week","After 10 hours in a day","After 44 hours in a week","Only on weekends and statutory holidays"],"answer":0,"explain":"The Canada Labour Code covers federally regulated workplaces like banks and requires overtime beyond 8 hours a day or 40 hours a week. (The 44-hour rule applies to most provincially regulated Ontario workers, not federally regulated ones.)"},{"q":"The Bank of Canada wants to cool down inflation. Which action is an example of its monetary policy?","choices":["Increasing federal spending on highways","Raising its policy interest rate","Cutting personal income taxes","Introducing a new federal budget"],"answer":1,"explain":"The Bank of Canada carries out monetary policy mainly by adjusting its policy interest rate; higher rates slow borrowing and spending, which cools inflation. Spending and tax decisions are fiscal policy."},{"q":"In Canada, fiscal policy — decisions about government spending and taxation — is controlled by:","choices":["The Bank of Canada","Each province acting entirely on its own","The federal government","The Toronto Stock Exchange"],"answer":2,"explain":"Fiscal policy is set by the federal government through its budgets, while the Bank of Canada handles monetary policy — the money supply and interest rates."},{"q":"The federal government announces it will lower the GST to encourage shoppers to spend more. This decision is an example of:","choices":["Fiscal policy","Monetary policy","Trade policy","Labour policy"],"answer":0,"explain":"Changing a tax like the GST is fiscal policy because it involves government taxation. Monetary policy involves the money supply and interest rates."},{"q":"A Team Canada trade mission to Japan is organized mainly to:","choices":["Train Canadian diplomats posted abroad","Promote tourism to Canadian ski resorts","Inspect imported goods at the border","Help Canadian businesses meet potential customers and suppliers"],"answer":3,"explain":"Team Canada missions take Canadian business people abroad so they can build relationships with foreign customers and suppliers."},{"q":"Team Canada trade missions are led by which federal department?","choices":["The Bank of Canada","Global Affairs Canada","The Canada Revenue Agency","The CRTC"],"answer":1,"explain":"Global Affairs Canada (formerly called DFAIT) leads Team Canada missions, since promoting trade abroad is part of its foreign-affairs role."},{"q":"Who is the Prime Minister of Canada?","choices":["Pierre Poilievre","Doug Ford","Mark Carney","Justin Trudeau"],"answer":2,"explain":"Mark Carney is the Prime Minister of Canada. (Watch the spelling — Carney, not 'Carny.' Poilievre leads the opposition, Ford is Ontario's premier, and Trudeau is a former prime minister.)"},{"q":"Which list names the four main types of workplace hazards?","choices":["Electrical, mechanical, thermal, and digital","Noise, heat, light, and radiation","Stress, fatigue, boredom, and conflict","Chemical, physical, biological, and ergonomic"],"answer":3,"explain":"Workplace safety training groups hazards into four types: chemical, physical, biological, and ergonomic."},{"q":"A warehouse worker develops chronic back pain from repeatedly lifting heavy boxes. This is an example of which hazard type?","choices":["Chemical","Ergonomic","Biological","Physical"],"answer":1,"explain":"Ergonomic hazards come from how work is designed — heavy lifting, repetition, and poor posture that strain the body over time."},{"q":"Constant loud noise from stamping machines on a factory floor is an example of which hazard type?","choices":["Physical","Biological","Chemical","Ergonomic"],"answer":0,"explain":"Physical hazards are environmental factors like noise, vibration, heat, and radiation that can harm workers."},{"q":"A hospital lab technician who handles blood samples faces which type of workplace hazard?","choices":["Ergonomic","Chemical","Biological","Physical"],"answer":2,"explain":"Biological hazards involve living organisms or their products — viruses, bacteria, and bodily fluids like blood."},{"q":"Industrial cleaning solvents that can burn workers' skin are which type of hazard?","choices":["Biological","Ergonomic","Physical","Chemical"],"answer":3,"explain":"Chemical hazards are dangerous substances — solvents, acids, and fumes — that can harm workers through skin contact or inhalation."},{"q":"Canadian governments encourage small business development mainly because small businesses:","choices":["Never go bankrupt","Provide many jobs for Canadians","Pay higher wages than large corporations","Do not need bank loans"],"answer":1,"explain":"Small businesses are a huge source of employment in Canada, so governments support them to keep job creation strong."},{"q":"A Tim Hortons franchisee in Oakville wants to schedule a 17-year-old employee for late-night shifts during exam week. Before finalizing the schedule, the franchisee's most responsible first step is to:","choices":["Check the Bank of Canada's latest interest rate","Call Global Affairs Canada about a trade mission","Review Ontario employment-standards rules on hours for young workers","Order extra coffee cups for the busy week"],"answer":2,"explain":"Employment-standards rules limit hours and late shifts for young workers, so a responsible employer checks the labour rules before scheduling — just as the Canada Labour Code sets overtime rules for federally regulated jobs."}],"shortBank":[]},{"id":"on-law","name":"Business Law & Ethics","instructions":"Closed book — about 40 seconds per question, like the real exam.","quizFormat":{"mc":14,"short":0},"notes":"- **Discrimination** = unfair treatment or denying benefits because of personal characteristics; **prejudice** = a negative attitude; the **glass ceiling** = the invisible barrier blocking advancement (often for women and minorities).\n- Online businesses must respect **consumer protection** — violations destroy the public's **goodwill** and trust.\n- **Unethical competitive intelligence**: fake job interviews to steal plans, bribery, hacking. Ethical intelligence uses **public sources** like annual reports and news.\n- Advertising copywriters must **avoid negative comments about competitors** — promote your own product instead.\n- A **concession** = something given up in negotiations; a **commitment** = a binding promise to act; a **commission** = pay calculated as a percentage of sales.\n- **Cause-related marketing** links a product to a good cause — the business must honestly deliver exactly what it promises.\n- Never sell or share **customer profiles** without informed, opt-in consent — it is a privacy violation.","mcBank":[{"q":"A store manager refuses to promote qualified employees because of their ethnic background. This unfair treatment is an example of:","choices":["Discrimination","Prejudice","A glass ceiling","A concession"],"answer":0,"explain":"Discrimination means treating people unfairly or denying them benefits because of personal characteristics — here, acting on bias in a promotion decision."},{"q":"A hiring manager privately dislikes working with teenagers but evaluates every teen applicant fairly. The manager's private dislike is best described as:","choices":["Discrimination","A glass ceiling","Prejudice","A contract"],"answer":2,"explain":"Prejudice is an attitude — a pre-judgment about a group — while discrimination is acting on it. This manager holds the attitude but does not act on it."},{"q":"A highly qualified woman is repeatedly passed over for vice-president roles while less-qualified men are promoted. This invisible barrier to advancement is called:","choices":["A concession","The glass ceiling","Prejudice","A commission"],"answer":1,"explain":"The glass ceiling is the unseen barrier that blocks qualified women and minorities from reaching top positions, even when no formal rule stops them."},{"q":"Why should an online business take consumer protection laws seriously?","choices":["Because the Bank of Canada sets online prices","Because it guarantees higher profits","Because it lowers website hosting costs","Because violations can destroy the public's goodwill and trust"],"answer":3,"explain":"Customers who feel cheated stop buying and warn others — losing goodwill hurts an online business far more than any fine."},{"q":"A company invites a rival's engineer to a fake job interview just to learn the rival's secret product plans. This tactic is:","choices":["Unethical competitive intelligence","A standard, ethical research method","A contract concession","Cause-related marketing"],"answer":0,"explain":"Gathering intelligence through deception — like fake interviews — crosses the ethical line, even though studying competitors itself is legal."},{"q":"An advertising copywriter is drafting an ad for a new smartphone. Which approach should the copywriter avoid?","choices":["Highlighting the phone's battery life","Showing the phone's price clearly","Making negative comments about a competitor's phone","Using humour to get attention"],"answer":2,"explain":"Ethical advertising focuses on your own product's strengths; attacking competitors looks unprofessional and can backfire with customers."},{"q":"During contract negotiations, a supplier agrees to drop its price by 5% to win the order. That price reduction is a:","choices":["Commission","Concession","Commitment","Warranty"],"answer":1,"explain":"A concession is something one side gives up during negotiations to reach an agreement — here, the supplier gives up part of its price."},{"q":"A real estate agent earns 2.5% of every home's sale price. That performance-based payment is a:","choices":["Commission","Concession","Commitment","Retainer"],"answer":0,"explain":"A commission is pay calculated as a percentage of sales — the more the agent sells, the more the agent earns."},{"q":"Two companies sign a contract promising to deliver 500 laptops by June 1. Their signed promise is a:","choices":["Concession","Commission","Suggestion","Commitment"],"answer":3,"explain":"A commitment is a binding promise to do something — signing the contract commits both sides to the June 1 delivery."},{"q":"A granola company prints an endangered sea turtle on its packaging and donates 10 cents from every box to ocean conservation. This strategy is:","choices":["Bait advertising","Cause-related marketing","A sales concession","Price fixing"],"answer":1,"explain":"Cause-related marketing ties a product to a good cause; to stay ethical, the company must honestly donate exactly what it promises."},{"q":"An online clothing store considers selling its customers' names, email addresses, and purchase histories to an advertising firm. The main ethical issue is:","choices":["The store's website loading speed","The cost of web hosting","Violating customers' privacy","Choosing a domain name"],"answer":2,"explain":"Customers share personal data expecting it to stay private — selling their profiles without consent betrays that trust."},{"q":"Before sharing customer profiles with another company, the ethical e-business should first:","choices":["Obtain each customer's informed consent","Delete its privacy policy","Raise its product prices","Redesign its logo"],"answer":0,"explain":"Informed, opt-in consent is the ethical standard — customers should clearly agree before their data is shared or sold."},{"q":"Which of the following is an ethical way to gather competitive intelligence?","choices":["Bribing a competitor's employee for secrets","Holding fake job interviews to extract plans","Hacking into a rival's email system","Reading a competitor's public annual report"],"answer":3,"explain":"Public sources like annual reports, news articles, and company websites are fair game; deception, bribery, and hacking are not."},{"q":"A customer orders a jacket online but receives a cheaper knockoff, and the site refuses a refund. Consumer protection laws exist mainly to:","choices":["Set the prices businesses may charge","Protect buyers from unfair or deceptive practices","Guarantee next-day delivery","Protect businesses from competition"],"answer":1,"explain":"Consumer protection laws give buyers recourse against deception and unfair treatment — which is why honest online businesses follow them closely."}],"shortBank":[]},{"id":"on-ebiz","name":"E-Business & Technology","instructions":"Closed book — about 40 seconds per question, like the real exam.","quizFormat":{"mc":14,"short":0},"notes":"- **B2B** = business selling to business, often through web portals linking organizations; **B2C** = business selling directly to consumers.\n- **Opt-in offers** (e.g. a free sample for an email signup) help online businesses **identify their target market**.\n- A website's **navigation system** (menus, search, breadcrumbs) lets users **know where they are** and find what they need.\n- List with major **search engines and directories** so customers can find the site.\n- **Spreadsheet software** analyzes numerical data (sales totals, trends); word processors handle text, presentation software handles slides.\n- E-commerce lets small marketers reach **international customers**.\n- A cost closely tied to e-commerce: **creating and maintaining the website**.\n- **Brick-and-clicks** retailers use sales-check (receipt) data for **unit inventory control**.\n- **Stock turnover rate** — how fast inventory sells and is replaced — drives storage planning.","mcBank":[{"q":"A flour mill sells 500-kg bags of flour to bakeries through an online ordering portal. This is an example of:","choices":["B2C e-commerce","B2B e-commerce","C2C e-commerce","Retail franchising"],"answer":1,"explain":"B2B (business-to-business) e-commerce is trade between companies — here, the mill selling to bakeries."},{"q":"A homeowner buys a barbecue from Canadian Tire's website for backyard cookouts. This transaction is:","choices":["B2C e-commerce","B2B e-commerce","B2G e-commerce","Wholesale distribution"],"answer":0,"explain":"B2C (business-to-consumer) is a business selling directly to the final customer — the homeowner buying for personal use."},{"q":"In B2B e-commerce, companies use IT systems and web portals mainly to:","choices":["Chat with individual shoppers","Post photos on social media","Link their organizations for ordering and communication","Stream training videos to staff"],"answer":2,"explain":"B2B portals digitally connect buying and selling organizations so they can place orders, track shipments, and share data efficiently."},{"q":"An online bookstore offers a free e-book chapter to visitors who sign up with their email and favourite genres. This opt-in offer helps the business:","choices":["Reduce its shipping costs","Design a new company logo","Avoid paying income tax","Identify its target market"],"answer":3,"explain":"Opt-in offers attract people interested in the product, revealing exactly who the target market is and how to reach them."},{"q":"Menus, breadcrumb trails, and search bars are parts of a website's navigation system. Their main purpose is to help users:","choices":["Pay lower prices","Know where they are and find what they need","Download pages faster","Create stronger passwords"],"answer":1,"explain":"Good navigation tells visitors where they are on a site and how to get where they want to go — confused visitors leave."},{"q":"A new online business lists its website with major search engines and directories mainly so that:","choices":["Potential customers can find the site","Competitors cannot see its prices","The government approves the business","Shipping becomes free"],"answer":0,"explain":"The best website is useless if nobody finds it — search engines and directories are how most customers discover online stores."},{"q":"A store manager wants to analyze monthly sales figures, calculate totals, and spot trends. The best software for this numerical analysis is:","choices":["Word processing software","Presentation software","Spreadsheet software","Email software"],"answer":2,"explain":"Spreadsheets are built for numbers — formulas, totals, and charts make sales analysis fast and accurate."},{"q":"Word processing software is designed mainly for:","choices":["Performing numerical calculations","Building slide presentations","Managing customer databases","Creating and editing text documents"],"answer":3,"explain":"Word processors handle text — letters, reports, and documents — while calculations belong in spreadsheets."},{"q":"The biggest advantage of e-commerce for a small Canadian marketer is:","choices":["Access to international customers","Eliminating all business costs","Avoiding all government regulations","Guaranteed same-day delivery"],"answer":0,"explain":"A small business with a website can sell to customers around the world — a reach impossible from a single storefront."},{"q":"Which of the following is a cost closely associated with running an e-commerce business?","choices":["Paying rent for a physical storefront","Creating and maintaining the website","Hiring in-store cashiers","Printing paper shopping bags"],"answer":1,"explain":"Website design, hosting, and updates are costs every online seller faces — a cost category that barely exists for a purely physical shop."},{"q":"A brick-and-clicks retailer studies its daily sales-check (receipt) data mainly to:","choices":["Design TV commercials","Choose paint colours for stores","Maintain accurate unit inventory control records","Plan employee vacation schedules"],"answer":2,"explain":"Each sale on a receipt tells the system one unit left the shelf — tracking this keeps inventory records accurate across stores and the website."},{"q":"An online apparel outlet is planning how much warehouse storage it will need. The most important factor to consider is its:","choices":["Advertising slogan","Number of social media followers","Owner's personal style preferences","Stock turnover rate"],"answer":3,"explain":"Stock turnover — how fast inventory sells and is replaced — determines how much product sits in storage at any time."},{"q":"A high stock turnover rate means a business:","choices":["Keeps products in storage for years","Sells and replaces its inventory quickly","Has stopped ordering new stock","Sells only to wholesalers"],"answer":1,"explain":"High turnover means goods move off the shelves fast and must be reordered often — great for cash flow, demanding for storage planning."},{"q":"A shopper lands on a product page but cannot find the shopping cart, shipping info, or return policy. The site most likely suffers from poor:","choices":["Website navigation","Product quality","Pricing strategy","Colour scheme"],"answer":0,"explain":"When customers can't find basic pages, the navigation system has failed — and frustrated shoppers abandon their carts."}],"shortBank":[]},{"id":"on-research","name":"Research, Planning & Operations","instructions":"Closed book — about 40 seconds per question, like the real exam.","quizFormat":{"mc":14,"short":0},"notes":"- Step 1 in assessing marketing-information needs: **accurately define the problem**.\n- **Exploratory** research uses open-ended questions to explore new topics; **descriptive** research measures what is happening; **causal** research tests cause-and-effect.\n- **Qualitative** research explores reasons and motivations; **quantitative** research produces numbers for statistical analysis (surveys, experiments).\n- Systematic research helps businesses **understand customer needs** and improve strategies.\n- A **slotting allowance** is a fee manufacturers pay retailers to cover the cost of stocking a new product.\n- **Just-in-time (JIT)** inventory: materials arrive exactly as needed — shorter production times, smaller inventories, lower costs.\n- A **network organization** focuses on core activities and contracts out the rest, coordinated through IT.\n- Effective marketing reports give a **clear interpretation of findings**, not just raw data.\n- Evaluate a marketing plan by **comparing objectives with actual results**.","mcBank":[{"q":"The first step in assessing a business's marketing-information needs is to:","choices":["Collect survey data immediately","Accurately define the problem","Write the final research report","Hire an outside consultant"],"answer":1,"explain":"You can't find the right information until you know the exact question you're trying to answer — defining the problem comes first."},{"q":"A juice company asks open-ended questions like 'What do you like about our new flavour?' to explore a topic it knows little about. This is:","choices":["Exploratory research","Descriptive research","Causal research","Experimental research"],"answer":0,"explain":"Exploratory research uses open-ended questions to investigate new or unclear topics before committing to detailed study."},{"q":"A survey measuring how many Ontario teens buy energy drinks each week is an example of:","choices":["Exploratory research","Causal research","Descriptive research","Qualitative research"],"answer":2,"explain":"Descriptive research describes what is happening — who buys, how often, how much — without testing why."},{"q":"A retailer tests whether a 10% price cut causes higher sales by comparing two similar stores, one with the cut and one without. This is:","choices":["Exploratory research","Descriptive research","Qualitative research","Causal research"],"answer":3,"explain":"Causal research tests cause-and-effect relationships — here, whether the price cut (cause) changes sales (effect)."},{"q":"A focus group explores why customers feel loyal to a brand. The reasons and motivations it uncovers are:","choices":["Quantitative data","Qualitative data","Numerical data","Statistical data"],"answer":1,"explain":"Qualitative research digs into the why — opinions, feelings, and motivations — rather than counting things."},{"q":"Surveys and experiments that produce numbers for statistical analysis are examples of:","choices":["Quantitative research","Qualitative research","Exploratory research","Secondary research"],"answer":0,"explain":"Quantitative research collects numerical data that can be measured and analyzed statistically — like survey percentages or experiment results."},{"q":"Conducting systematic marketing research helps a business mainly by:","choices":["Eliminating all competitors","Guaranteeing higher profits","Helping it understand customer needs and improve strategies","Removing the need for advertising"],"answer":2,"explain":"Research replaces guessing with evidence about what customers want, so strategies can be built on facts."},{"q":"A cereal maker pays a grocery chain a fee to get its new product placed on store shelves. This fee is called a:","choices":["Sales commission","Slotting allowance","Franchise royalty","Trade discount"],"answer":1,"explain":"A slotting allowance is the fee manufacturers pay retailers for shelf space for a new product."},{"q":"A slotting allowance is meant to cover the retailer's:","choices":["TV advertising budget","Employee training costs","Building rent","Cost of stocking a new product"],"answer":3,"explain":"Adding a new product costs the retailer — shelf space, handling, and the risk if it doesn't sell — and the slotting allowance offsets that cost."},{"q":"A just-in-time (JIT) inventory system gives a manufacturer:","choices":["Shorter production times","Reduced inventory levels","Lower inventory costs","All of the above"],"answer":3,"explain":"JIT delivers materials exactly when needed, which shortens production time, shrinks stockpiles, and cuts the cost of storing inventory — all three at once."},{"q":"Under a just-in-time inventory system, materials and parts arrive:","choices":["Just as they are needed for production","Several months before they are needed","Only once a year in bulk","After the finished product ships"],"answer":0,"explain":"The whole idea of JIT is timing deliveries to the moment production needs them, so almost nothing sits in storage."},{"q":"A company focuses on product design — its core strength — and contracts out manufacturing and payroll to specialists linked through IT. This structure is a:","choices":["Sole proprietorship","Franchise","Network organization","Co-operative"],"answer":2,"explain":"A network organization concentrates on what it does best and uses technology to coordinate outside specialists who handle everything else."},{"q":"An effective marketing research report must present:","choices":["A clear interpretation of the findings","Only raw data tables with no explanation","The researcher's personal opinions as facts","As much technical jargon as possible"],"answer":0,"explain":"Decision-makers need to understand what the data means — a good report interprets findings clearly instead of dumping raw numbers."},{"q":"To evaluate whether its marketing plan worked, a business should:","choices":["Count how many meetings were held","Compare its original objectives with the actual results","Ask competitors for their opinion","Rewrite the plan immediately"],"answer":1,"explain":"Evaluation means measuring results against the goals set in the plan — if sales were supposed to rise 10% and did, the plan worked."}],"shortBank":[]}]},

{"id":"ap-micro","name":"AP Microeconomics","semester":"ap","units":[{"id":"apmicro-basics","name":"Basic Economic Concepts","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"q":"Maya can spend Saturday afternoon either working a shift that pays $60 or attending a concert she values at $80 (the ticket was a gift, so she paid nothing). What is Maya's opportunity cost of attending the concert?","options":["$0, because the ticket was free","$60, the wages she gives up","$80, the value she places on the concert","$140, the wages plus the concert's value"],"answer":1,"explain":"Correct is B: opportunity cost is the value of the next-best alternative forgone — the $60 shift. A is wrong because 'free' ignores the forgone wages. C confuses the benefit of the chosen activity with its cost. D double-counts by adding the benefit of the chosen option to its cost."},{"q":"An economy produces only wheat and robots. A severe drought permanently reduces the fertility of the country's farmland. How does the production possibilities curve change?","options":["It shifts inward along the wheat axis only","The economy moves to a point inside the existing curve","It shifts outward along the robot axis only","It becomes a straight line"],"answer":0,"explain":"Correct is A: the drought reduces the maximum wheat the economy can produce, so the PPC pivots inward on the wheat axis (robot capacity is unaffected). B is wrong because a move inside the curve describes inefficiency or unemployment, not a loss of productive capacity. C is wrong: nothing improves robot production. D is wrong: the curve's shape reflects opportunity cost, which the drought does not change."},{"q":"Which of the following points is both attainable and productively efficient for an economy?","options":["A point inside the PPC","A point outside the PPC","A point on the PPC","Any point, because all production is efficient"],"answer":2,"explain":"Correct is C: points on the curve use all resources fully — attainable and productively efficient. A is attainable but inefficient (resources sit idle). B is unattainable with current resources and technology. D is wrong because points inside the curve waste resources."},{"q":"In one day, Country X can produce 100 tons of steel or 50 tons of wheat. Country Y can produce 60 tons of steel or 60 tons of wheat. Which statement is correct?","options":["X has a comparative advantage in wheat","Y has a comparative advantage in steel","X has a comparative advantage in steel and Y has a comparative advantage in wheat","Neither country has a comparative advantage"],"answer":2,"explain":"Correct is C. X's opportunity cost of 1 ton of steel is 50/100 = 0.5 tons of wheat, below Y's cost of 60/60 = 1 ton — so X has the comparative advantage in steel. Y's opportunity cost of 1 ton of wheat is 60/60 = 1 ton of steel, below X's 100/50 = 2 tons — so Y has the comparative advantage in wheat. A and B assign the goods backwards; D is wrong because opportunity costs differ."},{"q":"Using the same two countries (X: 100 steel or 50 wheat; Y: 60 steel or 60 wheat), which terms of trade for 1 ton of wheat would allow both countries to gain from trade?","options":["1 ton of wheat for 0.5 tons of steel","1 ton of wheat for 1.5 tons of steel","1 ton of wheat for 2.5 tons of steel","1 ton of wheat for 3 tons of steel"],"answer":1,"explain":"Correct is B. Y will only export wheat if it receives more than its opportunity cost of 1 ton of steel, and X will only import wheat if it pays less than its own cost of 2 tons of steel — so the price must lie between 1 and 2 tons of steel, and only 1.5 qualifies. A is below Y's cost, so Y gains nothing. C and D exceed X's cost, so X would rather produce its own wheat."},{"q":"In the circular flow model, which of the following flows from households to firms?","options":["Wages, rent, and profit","Goods and services","Labor, land, and capital","Taxes and transfer payments"],"answer":2,"explain":"Correct is C: households own the factors of production and supply labor, land, and capital to firms through factor markets. A flows the other way (factor payments from firms to households). B flows from firms to households through product markets. D involves the government sector."},{"q":"The 'invisible hand' described by Adam Smith refers to which of the following?","options":["Government planners directing resources to their best use","Self-interested individuals unintentionally promoting the public interest through markets","The central bank guiding the economy with interest rates","Trade unions negotiating higher wages for workers"],"answer":1,"explain":"Correct is B: Smith argued that individuals pursuing their own gain are led, as if by an invisible hand, to outcomes that benefit society. A describes a command economy — the opposite of Smith's point. C and D describe real institutions but not Smith's concept."},{"q":"A production possibilities curve is typically bowed outward (concave to the origin). This shape reflects which of the following?","options":["Constant opportunity cost","Increasing opportunity cost as more of a good is produced","Decreasing opportunity cost as more of a good is produced","The law of diminishing marginal utility"],"answer":1,"explain":"Correct is B: resources are not equally suited to both goods, so shifting production toward one good means giving up ever-larger amounts of the other. A would produce a straight-line PPC. C is the reverse of what happens. D is about consumption satisfaction, not production trade-offs."},{"q":"Which of the following best illustrates the economic concept of scarcity?","options":["A store runs out of a popular toy before the holidays","Human wants exceed the resources available to satisfy them","The price of oil rises after a supply disruption","A government sets a price ceiling on rent"],"answer":1,"explain":"Correct is B: scarcity means limited resources relative to unlimited wants — it exists even when markets work perfectly. A describes a temporary shortage, not scarcity. C is a price change driven by supply and demand. D is a policy that can cause shortages."},{"q":"An economy is producing on its PPC. It decides to produce more capital goods this year. What must happen now, and what is the likely long-run effect?","options":["It must produce fewer consumer goods now; the PPC may shift outward in the future","It must produce fewer consumer goods now; the PPC shifts inward permanently","It can produce more of both goods immediately with no trade-off","Unemployment must rise to free up resources"],"answer":0,"explain":"Correct is A: on the curve, more of one good requires less of the other (opportunity cost), but extra capital goods expand future productive capacity, shifting the PPC out later. B is wrong: the trade-off is temporary, not a permanent inward shift. C violates the PPC — both goods cannot rise while on the curve. D is wrong: the economy is already fully employed on the curve."}],"shortBank":[{"q":"Country A can produce 200 cars or 100 trucks per year. Country B can produce 120 cars or 120 trucks per year.\n(a) Calculate each country's opportunity cost of producing 1 truck. (2 marks)\n(b) Identify which country has the comparative advantage in trucks and which in cars. (1 mark)\n(c) Give a range for the terms of trade (in cars per truck) that would allow both countries to gain from trade. (1 mark)","marks":4,"answer":"(a) A: 200/100 = 2 cars per truck. B: 120/120 = 1 car per truck.\n(b) B has the lower opportunity cost of trucks (1 < 2), so B has the comparative advantage in trucks and A has the comparative advantage in cars.\n(c) B must receive more than 1 car per truck and A must pay fewer than 2 cars per truck, so the terms of trade must be between 1 and 2 cars per truck."},{"q":"An economy's PPC for education and healthcare is bowed outward.\n(a) Explain what it means for the economy to be producing at a point inside the PPC, and give one reason this might occur. (2 marks)\n(b) Explain why the PPC is bowed outward rather than a straight line. (1 mark)\n(c) A new medical technology doubles the productivity of the healthcare sector. Describe the effect on the PPC. (1 mark)","marks":4,"answer":"(a) A point inside the PPC is attainable but productively inefficient — the economy is not using all its resources fully. One reason: unemployment or idle factories during a recession.\n(b) Resources are not equally productive in both sectors, so shifting resources toward one good sacrifices increasing amounts of the other — opportunity cost rises.\n(c) The PPC pivots (shifts) outward along the healthcare axis only; the maximum education output is unchanged."}],"notes":"<h3>Scarcity and Opportunity Cost</h3>\n<p><strong>Scarcity</strong> means human wants exceed the resources available to satisfy them. Because of scarcity, every choice has an <strong>opportunity cost</strong>: the value of the next-best alternative forgone. There is no such thing as a free lunch — even a 'free' gift costs the time or money you could have used elsewhere.</p>\n<h3>The Production Possibilities Curve (PPC)</h3>\n<ul>\n<li>Shows the maximum combinations of two goods an economy can produce with its resources and technology.</li>\n<li><strong>On the curve:</strong> productively efficient — all resources fully employed.</li>\n<li><strong>Inside the curve:</strong> attainable but inefficient (e.g., unemployment).</li>\n<li><strong>Outside the curve:</strong> unattainable with current resources.</li>\n<li><strong>Movement along the curve</strong> = reallocating resources (a trade-off). <strong>Shift of the curve</strong> = a change in resources, technology, or productivity. Economic growth shifts it outward.</li>\n<li>The curve is <strong>bowed outward</strong> because of <strong>increasing opportunity cost</strong>: resources are not equally suited to both goods.</li>\n</ul>\n<h3>Comparative Advantage and Trade</h3>\n<ul>\n<li><strong>Absolute advantage:</strong> producing more output with the same resources.</li>\n<li><strong>Comparative advantage:</strong> the <em>lower opportunity cost</em>. This — not absolute advantage — determines who should specialize.</li>\n<li>Opportunity cost of 1 unit of Good X = (max Good Y forgone) / (max Good X possible).</li>\n<li><strong>Terms of trade</strong> must lie <em>between</em> the two countries' opportunity costs for both to gain.</li>\n</ul>\n<h3>Circular Flow and Economic Systems</h3>\n<p>In the <strong>circular flow model</strong>, households supply factors of production (labor, land, capital) to firms through <strong>factor markets</strong> and receive wages, rent, and profit; firms supply goods and services to households through <strong>product markets</strong>. In a <strong>market economy</strong>, prices coordinate decisions (Smith's 'invisible hand'); in a <strong>command economy</strong>, the government directs resources.</p>\n<h3>Common Traps</h3>\n<ul>\n<li>Confusing a <em>movement along</em> the PPC (reallocation) with a <em>shift</em> of the PPC (more/fewer resources).</li>\n<li>Using absolute advantage instead of comparative (lowest opportunity cost) advantage for trade questions.</li>\n<li>Forgetting that the terms of trade must fall strictly <em>between</em> the two opportunity costs.</li>\n<li>Calling a temporary shortage 'scarcity' — scarcity is permanent and universal.</li>\n</ul>\n"},{"id":"apmicro-supply-demand","name":"Supply and Demand","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"q":"The price of coffee rises from $3 to $4 per cup, and the quantity demanded falls from 1,000 to 800 cups per day. This is best described as:","options":["a decrease in demand","a decrease in quantity demanded","an increase in demand","a leftward shift of the demand curve"],"answer":1,"explain":"Correct is B: a price change causes movement along the demand curve — a change in quantity demanded. A and D describe a shift of the whole curve, which only non-p
