rice factors (income, tastes, prices of related goods) cause. C is the wrong direction."},{"q":"Tea and coffee are substitutes. If the price of tea rises, what happens in the market for coffee, holding all else constant?","options":["Demand for coffee decreases","Demand for coffee increases","Quantity demanded of coffee decreases","Supply of coffee increases"],"answer":1,"explain":"Correct is B: when a substitute gets more expensive, consumers switch toward coffee — demand (the whole curve) shifts right. A is backwards. C confuses a shift with a movement along the curve. D is wrong: nothing changed coffee producers' costs."},{"q":"A drought raises the price of wheat, a key input for bread. What happens in the bread market?","options":["Supply of bread increases","Demand for bread decreases","Supply of bread decreases","Both supply and demand decrease"],"answer":2,"explain":"Correct is C: higher input costs make production less profitable at every price, shifting supply left. A is backwards. B is wrong: consumers' desire for bread is unchanged. D is wrong: only supply shifts."},{"q":"At a price of $2, quantity demanded is 500 units and quantity supplied is 300 units. Which statement is correct?","options":["There is a surplus of 200 units, and price will fall","There is a shortage of 200 units, and price will rise","There is a surplus of 200 units, and price will rise","The market is in equilibrium"],"answer":1,"explain":"Correct is B: Qd > Qs means a shortage of 200 units; frustrated buyers bid the price up toward equilibrium. A and C misidentify the imbalance. D is wrong because Qd does not equal Qs."},{"q":"The equilibrium rent for apartments is $1,500 per month. The government imposes a rent ceiling of $1,000 per month. Which result follows?","options":["A surplus of apartments, because the ceiling is non-binding","A shortage of apartments, because the ceiling is binding","No effect, because the ceiling is above equilibrium","A shortage of apartments, because the ceiling is non-binding"],"answer":1,"explain":"Correct is B: a ceiling set below equilibrium is binding — quantity demanded exceeds quantity supplied, creating a persistent shortage (plus deadweight loss from trades that no longer happen). A and D contradict themselves: a non-binding control has no effect. C misreads the numbers: $1,000 is below, not above, equilibrium."},{"q":"The equilibrium wage for farm labor is $10 per hour. A minimum wage of $14 per hour is introduced. Assuming the labor market is competitive, what happens?","options":["A binding price floor creates a surplus of labor (unemployment)","A non-binding price floor has no effect","A binding price ceiling creates a shortage of labor","Employment rises because wages are higher"],"answer":0,"explain":"Correct is A: $14 is above the $10 equilibrium, so the floor binds — quantity of labor supplied exceeds quantity demanded, i.e., unemployment. B is wrong because $14 is above, not below, equilibrium. C confuses floors with ceilings. D ignores the demand side: employers hire fewer workers at the higher wage."},{"q":"When the price of movie tickets rises by 10%, attendance falls by 20%. What is the price elasticity of demand, and is demand elastic or inelastic?","options":["0.5; inelastic","2; elastic","0.5; elastic","2; inelastic"],"answer":1,"explain":"Correct is B: elasticity = % change in Q / % change in P = 20/10 = 2 (absolute value). Since 2 > 1, demand is elastic — quantity is relatively responsive. A and C divide the wrong way (10/20). D gets the classification backwards."},{"q":"A firm's product has inelastic demand. If the firm raises its price, what happens to total revenue?","options":["Total revenue falls, because quantity drops sharply","Total revenue rises, because the price effect outweighs the quantity effect","Total revenue stays the same","Total revenue falls to zero"],"answer":1,"explain":"Correct is B: with inelastic demand the percentage drop in quantity is smaller than the percentage rise in price, so price x quantity increases. A describes elastic demand. C describes unit-elastic demand. D is nonsense."},{"q":"The cross-price elasticity of demand between peanut butter and jelly is -1.4. What does this indicate?","options":["They are substitutes","They are complements","Peanut butter is a normal good","Demand for jelly is elastic"],"answer":1,"explain":"Correct is B: a negative cross elasticity means a rise in the price of one lowers demand for the other — complements. A would require a positive value. C is about income elasticity. D is about own-price elasticity of jelly."},{"q":"Which of the following goods is likely to have the most elastic demand?","options":["Insulin for a diabetic patient","A specific brand of luxury handbag","Salt","Gasoline in the short run"],"answer":1,"explain":"Correct is B: luxuries with many close substitutes have elastic demand — buyers walk away when the price rises. A, C, and D are necessities with few substitutes (and D is short-run), so their demand is inelastic."}],"shortBank":[{"q":"The market for concert tickets has demand Qd = 200 - 2P and supply Qs = -40 + 2P, where P is the ticket price in dollars.\n(a) Solve for the equilibrium price and quantity. (2 marks)\n(b) The venue caps ticket prices at $40. Is the cap binding? Calculate the resulting shortage or surplus. (2 marks)","marks":4,"answer":"(a) Set Qd = Qs: 200 - 2P = -40 + 2P, so 240 = 4P and P = $60. Q = 200 - 2(60) = 80 tickets.\n(b) $40 is below the $60 equilibrium, so the cap is binding. At P = 40: Qd = 200 - 80 = 120, Qs = -40 + 80 = 40. Shortage = 120 - 40 = 80 tickets."},{"q":"A coffee shop raises the price of a latte from $4.00 to $4.50 and weekly sales fall from 500 to 450 lattes.\n(a) Use the midpoint formula to compute the price elasticity of demand. (2 marks)\n(b) Is demand elastic, inelastic, or unit elastic? Should the shop expect total revenue to rise or fall? Explain. (2 marks)","marks":4,"answer":"(a) % change in Q = (450 - 500)/475 = -10.53%; % change in P = 0.50/4.25 = 11.76%. Elasticity = 10.53/11.76 = 0.90 (absolute value).\n(b) 0.90 < 1, so demand is inelastic. Total revenue should rise: the price increase outweighs the small drop in quantity (check: $4 x 500 = $2,000 vs $4.50 x 450 = $2,025)."}],"notes":"<h3>The Laws of Demand and Supply</h3>\n<p><strong>Law of demand:</strong> price up, quantity demanded down (movement <em>along</em> the curve). <strong>Law of supply:</strong> price up, quantity supplied up. A change in <strong>price</strong> moves you along a curve; a change in anything else <strong>shifts</strong> the curve.</p>\n<h3>Shifters</h3>\n<ul>\n<li><strong>Demand shifts</strong> (remember T-I-P-E-N): Tastes, Income (normal vs inferior goods), Prices of related goods (substitutes vs complements), Expectations, Number of buyers.</li>\n<li><strong>Supply shifts</strong>: input Prices, technology, taxes/subsidies, expectations, Number of sellers.</li>\n<li>Equilibrium is where Qd = Qs. Below equilibrium price: <strong>shortage</strong> (Qd > Qs), price rises. Above: <strong>surplus</strong> (Qs > Qd), price falls.</li>\n</ul>\n<h3>Price Controls</h3>\n<ul>\n<li><strong>Price ceiling</strong> (max price): <em>binding</em> only if set <strong>below</strong> equilibrium — creates a persistent <strong>shortage</strong> plus deadweight loss.</li>\n<li><strong>Price floor</strong> (min price): <em>binding</em> only if set <strong>above</strong> equilibrium — creates a persistent <strong>surplus</strong> (e.g., unemployment from a minimum wage).</li>\n<li>Non-binding controls (ceiling above, or floor below, equilibrium) have no effect.</li>\n</ul>\n<h3>Elasticity</h3>\n<ul>\n<li><strong>Price elasticity of demand</strong> = % change in Qd / % change in P (use absolute value). Elastic (&gt; 1), inelastic (&lt; 1), unit elastic (= 1).</li>\n<li>More elastic when: many substitutes, a luxury, a long time horizon, a large share of the budget.</li>\n<li><strong>Total revenue test:</strong> if demand is elastic, a price cut raises TR; if inelastic, a price cut lowers TR (and a price hike raises TR).</li>\n<li><strong>Income elasticity:</strong> positive = normal good, negative = inferior good. <strong>Cross elasticity:</strong> positive = substitutes, negative = complements.</li>\n</ul>\n<h3>Common Traps</h3>\n<ul>\n<li>Saying 'demand decreases' when you mean 'quantity demanded decreases' (price change = movement, not shift).</li>\n<li>Calling a price control binding when it is set on the wrong side of equilibrium.</li>\n<li>Forgetting the absolute value on price elasticity, or mixing up the sign rules for cross and income elasticity.</li>\n<li>Assuming a minimum wage always reduces employment — only a <em>binding</em> one does.</li>\n</ul>\n"},{"id":"apmicro-cost-perfect","name":"Production, Cost & Perfect Competition","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"q":"A bakery has a fixed number of ovens. As it hires more bakers, output rises but each additional baker adds less output than the previous one. This illustrates:","options":["economies of scale","the law of diminishing marginal returns","increasing opportunity cost","diseconomies of scale"],"answer":1,"explain":"Correct is B: with a fixed input (ovens), the marginal product of the variable input eventually falls. A and D are long-run concepts about firm size, not short-run input changes. C is about the PPC, not the production function."},{"q":"Which of the following is a fixed cost for a restaurant in the short run?","options":["The cost of ingredients","Hourly wages of servers","Monthly rent on the building","The electricity used by the ovens"],"answer":2,"explain":"Correct is C: rent does not change with the number of meals served — it is fixed in the short run. A, B, and D all vary with output, so they are variable costs."},{"q":"The marginal cost curve crosses the average variable cost and average total cost curves at their:","options":["maximum points","minimum points","intersection with the demand curve","zero points"],"answer":1,"explain":"Correct is B: when MC is below average it pulls the average down; when MC is above it pulls the average up — so MC intersects AVC and ATC at their minimums. A is backwards. C and D are not meaningful points for cost curves."},{"q":"A wheat farmer is a price taker facing a market price of $6 per bushel. The marginal cost of the 100th bushel is $5 and of the 101st bushel is $6.50. To maximize profit, the farmer should produce:","options":["100 bushels","101 bushels","99 bushels","as many bushels as possible"],"answer":0,"explain":"Correct is A: keep producing while P exceeds MC and stop before MC exceeds P. The 100th bushel adds $6 - $5 = $1 of profit; the 101st would lose $0.50. C leaves the profitable 100th bushel unproduced. D ignores rising marginal cost."},{"q":"A perfectly competitive firm has P = $8, ATC = $10, and AVC = $6 at its current output. In the short run the firm should:","options":["shut down immediately","continue producing, because P > AVC","raise its price to cover ATC","exit the industry permanently"],"answer":1,"explain":"Correct is B: the firm is making a loss (P < ATC) but covers its variable costs (P > AVC), so producing loses less than shutting down — shutdown would still leave the fixed costs unpaid. A is wrong: the shutdown rule requires P < min AVC. C is impossible for a price taker. D is a long-run decision."},{"q":"In long-run equilibrium, a perfectly competitive firm earns:","options":["positive economic profit because of barriers to entry","zero economic profit, producing at minimum ATC","positive accounting profit but negative economic profit","maximum profit at P > MC"],"answer":1,"explain":"Correct is B: entry and exit drive price to minimum ATC, where P = MC = min ATC — zero economic profit (a normal return on investment is still earned). A describes monopoly. C is contradictory. D is wrong: P = MC under perfect competition."},{"q":"A firm's long-run average total cost falls as output rises from 1,000 to 10,000 units. This is an example of:","options":["diminishing marginal returns","economies of scale","a sunk cost","the shutdown rule"],"answer":1,"explain":"Correct is B: falling long-run ATC as output rises is economies of scale (spreading fixed costs, specialization). A is a short-run phenomenon. C is about unrecoverable past costs. D is about comparing P to AVC."},{"q":"For a perfectly competitive firm, marginal revenue equals price because:","options":["the firm can raise its price without losing customers","each additional unit sells at the same market price","the firm faces a downward-sloping demand curve","marginal cost is constant"],"answer":1,"explain":"Correct is B: a price taker sells every unit at the market price, so the extra revenue from one more unit is exactly that price. A is false — raising price loses all its customers. C describes imperfect competition (where MR < P). D is irrelevant to marginal revenue."},{"q":"A firm sells 50 units at $12 each. Its total variable cost is $500 and total fixed cost is $300. In the short run, the firm should:","options":["shut down, because it is making a loss","continue producing, because total revenue covers total variable cost","shut down, because P < ATC","raise its price"],"answer":1,"explain":"Correct is B: TR = $600 exceeds TVC = $500, so operating covers all variable costs plus $100 of fixed costs — the $200 loss is smaller than the $300 loss from shutting down. A and C ignore the shutdown rule (compare P = $12 to AVC = $10). D is impossible for a price taker."},{"q":"Perfect competition is allocatively efficient because:","options":["firms earn zero economic profit","P = MC, so the value consumers place on the last unit equals its production cost","firms produce at minimum ATC","there are no fixed costs"],"answer":1,"explain":"Correct is B: P = MC means resources are allocated so marginal benefit equals marginal cost — society gets the right quantity. A and C describe the long-run zero-profit outcome and productive efficiency, not allocative efficiency. D is false."}],"shortBank":[{"q":"A firm's short-run costs are: at Q = 0, TC = $100; Q = 1, TC = $150; Q = 2, TC = $190; Q = 3, TC = $240.\n(a) Compute the firm's fixed cost, and the marginal cost of the 2nd and 3rd units. (2 marks)\n(b) The firm is a price taker with P = $55. How many units should it produce to maximize profit? Explain using the MR = MC rule. (2 marks)","marks":4,"answer":"(a) Fixed cost = TC at Q = 0 = $100. MC of the 2nd unit = 190 - 150 = $40; MC of the 3rd unit = 240 - 190 = $50.\n(b) Produce 3 units. The firm should expand output while MR (= P = $55) exceeds MC: MC is $50 for the 1st unit, $40 for the 2nd, and $50 for the 3rd — all below $55 — so each of the first three units adds to profit."},{"q":"A perfectly competitive apple grower faces P = $4 per bushel. At the profit-maximizing quantity, ATC = $5 and AVC = $3.\n(a) Should the grower produce or shut down in the short run? Explain. (2 marks)\n(b) What will happen in this industry in the long run, and where will the long-run price settle relative to minimum ATC? (2 marks)","marks":4,"answer":"(a) Produce. P ($4) exceeds AVC ($3), so operating covers all variable costs and contributes $1 per bushel toward fixed costs; shutting down would mean losing the entire fixed cost.\n(b) Firms are making losses (P < ATC), so firms will exit in the long run. Market supply falls and the price rises until P = minimum ATC, where the remaining firms earn zero economic profit."}],"notes":"<h3>Production and Diminishing Returns</h3>\n<p>In the <strong>short run</strong>, at least one input is fixed. The <strong>law of diminishing marginal returns</strong>: as more of a variable input is added to a fixed input, marginal product eventually falls. In the <strong>long run</strong>, all inputs are variable.</p>\n<h3>Cost Curves</h3>\n<ul>\n<li><strong>TC = TFC + TVC.</strong> TFC is flat; TVC rises with output.</li>\n<li><strong>MC = change in TC / change in Q.</strong> MC falls then rises (diminishing returns), giving the U-shape.</li>\n<li><strong>ATC = AFC + AVC.</strong> AFC falls continuously; AVC and ATC are U-shaped.</li>\n<li><strong>MC crosses AVC and ATC at their minimum points.</strong></li>\n<li><strong>Long-run ATC:</strong> falls with <em>economies of scale</em>, flat with constant returns, rises with <em>diseconomies</em> of scale.</li>\n</ul>\n<h3>Perfect Competition</h3>\n<ul>\n<li>Many sellers, identical product, free entry/exit, perfect information. Each firm is a <strong>price taker</strong>: demand is horizontal, so <strong>P = MR = AR</strong>.</li>\n<li><strong>Profit max:</strong> produce where <strong>MR = MC</strong> (so P = MC).</li>\n<li>Short run: profit if P &gt; ATC; loss if P &lt; ATC. <strong>Shutdown rule:</strong> produce only if <strong>P &gt; min AVC</strong>; shut down if P &lt; min AVC.</li>\n<li><strong>Long run:</strong> entry/exit drives <strong>P = min ATC</strong> — zero economic profit, allocative efficiency (P = MC), productive efficiency (min ATC).</li>\n</ul>\n<h3>Common Traps</h3>\n<ul>\n<li>Using ATC instead of AVC in the shutdown rule.</li>\n<li>Counting fixed costs in short-run produce-or-shut-down decisions — they are sunk.</li>\n<li>Confusing <em>economic</em> profit (includes opportunity cost; zero in long-run equilibrium) with <em>accounting</em> profit.</li>\n<li>Thinking a price taker can choose its price — it chooses only quantity.</li>\n</ul>\n"},{"id":"apmicro-imperfect","name":"Imperfect Competition","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"q":"A monopolist faces the demand schedule: P = $10 at Q = 1; P = $9 at Q = 2; P = $8 at Q = 3. What is the marginal revenue of the 3rd unit?","options":["$8","$6","$9","$24"],"answer":1,"explain":"Correct is B: TR rises from $18 (2 x $9) to $24 (3 x $8), so MR = $6 — below the $8 price, because selling the 3rd unit requires cutting the price on all units. A confuses MR with price. C is the price of the 2nd unit. D is total revenue, not marginal revenue."},{"q":"Compared with a perfectly competitive industry with the same costs, a monopoly produces:","options":["more output at a lower price","less output at a higher price, creating deadweight loss","the same output at the same price","less output at a lower price"],"answer":1,"explain":"Correct is B: the monopolist sets MR = MC, producing less than the competitive P = MC quantity and charging more — the forgone mutually beneficial trades are deadweight loss. A and C describe competition. D gets the price direction wrong."},{"q":"An airline charges business travelers more than vacation travelers for similar seats. Which condition is NOT required for this price discrimination to work?","options":["The airline has some market power","The airline can prevent resale between the two groups","The two groups have different price elasticities of demand","The airline's marginal cost is constant"],"answer":3,"explain":"Correct is D: price discrimination needs market power, identifiable groups with different elasticities, and no resale — whether marginal cost is constant is irrelevant. A, B, and C are all genuine requirements."},{"q":"A natural monopoly's average total cost falls over the entire range of market demand. If regulators require P = MC (the socially optimal price), the firm will:","options":["earn zero economic profit","incur a loss, because P < ATC at that quantity","earn monopoly profit","produce the monopoly quantity"],"answer":1,"explain":"Correct is B: with falling ATC, MC lies below ATC, so P = MC does not cover average cost — the firm would need a subsidy to survive. A describes fair-return regulation (P = ATC). C and D describe the unregulated monopoly outcome."},{"q":"In the long run, a monopolistically competitive firm earns zero economic profit because:","options":["the government breaks it up","entry of new firms shifts its demand curve left until P = ATC","it becomes a perfect competitor","its marginal cost rises to meet price"],"answer":1,"explain":"Correct is B: short-run profits attract entrants with differentiated products, stealing customers until the firm's demand curve is tangent to ATC. A is antitrust, not the market mechanism. C is wrong: products stay differentiated (P > MC). D reverses the mechanism."},{"q":"The defining feature of an oligopoly is:","options":["a single seller","identical products","mutual interdependence among a few large firms","free entry and exit"],"answer":2,"explain":"Correct is C: each firm's decisions depend on rivals' expected reactions — the basis of game theory. A defines monopoly. B also occurs under perfect competition. D describes competitive markets, not oligopoly."},{"q":"In a game, Firm A's best choice is to advertise whether or not Firm B advertises. Advertising is therefore Firm A's:","options":["Nash equilibrium","dominant strategy","collusive agreement","prisoner's dilemma"],"answer":1,"explain":"Correct is B: a dominant strategy is optimal regardless of the rival's move. A is an outcome in which neither player wants to deviate, not a single strategy. C requires an agreement between firms. D is a type of game, not a strategy."},{"q":"Two firms in a cartel agree to restrict output, but each can earn more by secretly producing extra. The most likely outcome is:","options":["both firms honor the agreement forever","each firm cheats, and both end up worse off than if both had cooperated","the government subsidizes both firms","both firms become monopolies"],"answer":1,"explain":"Correct is B: cheating is the dominant strategy (a prisoner's dilemma), so cartels are unstable — mutual cheating leaves both worse off than successful collusion. A ignores the incentive to cheat. C and D are unrelated to cartel behavior."},{"q":"Unlike a perfectly competitive firm in long-run equilibrium, a monopolistically competitive firm:","options":["produces at minimum ATC","has P > MC and excess capacity","earns positive economic profit forever","faces a horizontal demand curve"],"answer":1,"explain":"Correct is B: product differentiation gives a downward-sloping demand curve, so P > MC and output sits below the minimum-ATC quantity (excess capacity). A and D describe perfect competition. C is wrong: entry eliminates long-run economic profit."},{"q":"Which of the following is a barrier to entry that helps sustain a monopoly?","options":["A patent on a production process","A large number of buyers","Identical products across firms","Easy access to the industry's technology"],"answer":0,"explain":"Correct is A: a patent legally blocks rivals from copying the process. B, C, and D all describe competitive conditions that undermine monopoly power rather than protect it."}],"shortBank":[{"q":"A monopolist has constant MC = $5 and faces a downward-sloping linear demand curve.\n(a) Explain why the monopolist's marginal revenue is less than price for every unit beyond the first. (2 marks)\n(b) The monopolist produces where MR = MC. Explain why this quantity is less than the perfectly competitive quantity and identify the deadweight loss. (2 marks)","marks":4,"answer":"(a) To sell an extra unit the monopolist must lower the price on ALL units sold, not just the marginal one — the price cut on existing units drags marginal revenue below price.\n(b) A competitive industry produces where P = MC; the monopolist restricts output to where MR = MC, a smaller quantity at a higher price. The units between the monopoly quantity and the competitive quantity — which consumers value above marginal cost — are never produced, and that lost total surplus is deadweight loss."},{"q":"Two gas stations, A and B, each choose High or Low prices. Payoffs (A, B) in thousands of dollars: (High, High) = (8, 8); (High, Low) = (2, 10); (Low, High) = (10, 2); (Low, Low) = (4, 4).\n(a) Identify each firm's dominant strategy. (1 mark)\n(b) What is the Nash equilibrium? Explain why neither firm wants to deviate from it. (2 marks)\n(c) Is the Nash equilibrium the best joint outcome? Explain. (1 mark)","marks":4,"answer":"(a) Low is dominant for both: if B chooses High, A earns 10 (Low) vs 8 (High); if B chooses Low, A earns 4 vs 2. The same logic holds for B.\n(b) (Low, Low) with payoffs (4, 4). Given B plays Low, A earns 4 from Low vs 2 from High, so A will not deviate; symmetrically, B will not deviate.\n(c) No — (High, High) gives (8, 8), which is better for both, but it is unstable because each firm is tempted to undercut to earn 10."}],"notes":"<h3>Monopoly</h3>\n<ul>\n<li>Single seller, unique product, <strong>barriers to entry</strong> (patents, control of resources, legal franchise, natural monopoly).</li>\n<li>Faces the downward-sloping <strong>market</strong> demand curve, so <strong>MR &lt; P</strong> for every unit beyond the first (the MR curve has twice the slope of linear demand).</li>\n<li><strong>Profit max:</strong> produce where <strong>MR = MC</strong>, then charge the price on the demand curve above that quantity.</li>\n<li>Vs perfect competition: <strong>higher price, lower quantity, deadweight loss</strong>.</li>\n</ul>\n<h3>Price Discrimination and Regulation</h3>\n<ul>\n<li><strong>Price discrimination</strong> (different prices to different groups) requires: market power, identifiable groups with different elasticities, and no resale.</li>\n<li><strong>Natural monopoly</strong> (ATC falls over the whole market): <em>socially optimal</em> regulation P = MC needs a subsidy (P &lt; ATC); <em>fair-return</em> regulation P = ATC gives zero economic profit.</li>\n</ul>\n<h3>Monopolistic Competition and Oligopoly</h3>\n<ul>\n<li><strong>Monopolistic competition:</strong> many sellers, differentiated products. Short-run profit or loss; long-run entry shifts demand left until <strong>P = ATC</strong> — zero economic profit, but <strong>P &gt; MC</strong> and <strong>excess capacity</strong> (not productively efficient).</li>\n<li><strong>Oligopoly:</strong> a few interdependent firms. <strong>Game theory:</strong> a <em>dominant strategy</em> is best no matter what the rival does; a <em>Nash equilibrium</em> is an outcome where no player wants to deviate unilaterally.</li>\n<li><strong>Cartels</strong> (e.g., OPEC) try to act like a monopoly but are unstable: cheating is the dominant strategy (prisoner's dilemma).</li>\n</ul>\n<h3>Common Traps</h3>\n<ul>\n<li>Setting monopoly output where P = MC — the monopolist uses <strong>MR = MC</strong>, then reads price off <em>demand</em>.</li>\n<li>Thinking monopolistic competition is efficient long-run — it has excess capacity and P &gt; MC.</li>\n<li>Confusing a dominant strategy (a choice) with a Nash equilibrium (an outcome).</li>\n<li>Assuming cartels last — the incentive to cheat makes them unstable.</li>\n</ul>\n"},{"id":"apmicro-factors","name":"Factor Markets","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"q":"The demand for autoworkers is best described as:","options":["derived from the demand for automobiles","independent of car prices","perfectly elastic","determined only by union negotiations"],"answer":0,"explain":"Correct is A: factor demand is derived — it comes from demand for the final product the factor helps make. B is wrong: higher car prices raise MRP and labor demand. C and D overstate special cases."},{"q":"A firm's marginal revenue product of labor (MRP_L) equals:","options":["the wage rate","marginal product of labor times marginal revenue","total revenue divided by workers hired","the price of labor times the wage"],"answer":1,"explain":"Correct is B: MRP_L = MP_L x MR — the extra output from one more worker valued at what that output sells for. A is the cost of labor (MFC in competitive markets). C is average revenue product. D is meaningless."},{"q":"A competitive firm hires labor at a constant wage of $20 per hour. The MRP of the 5th worker is $24 and of the 6th worker is $18. How many workers should the firm hire?","options":["5","6","4","As many as possible"],"answer":0,"explain":"Correct is A: hire while MRP exceeds MFC ($20). The 5th worker adds $24 - $20 = $4 of profit; the 6th would lose $2. C stops too early — the 5th worker is profitable. D ignores the hiring rule."},{"q":"A new technology makes factory workers more productive. What happens in the labor market?","options":["Labor demand shifts right; wages and employment rise","Labor supply shifts right; wages fall","Labor demand shifts left; wages fall","Nothing changes"],"answer":0,"explain":"Correct is A: higher productivity raises MP and hence MRP at every wage — firms demand more labor, pushing wages and employment up. B and C shift the wrong curve or the wrong direction. D ignores the change in MRP."},{"q":"An increase in the working-age population will, all else equal:","options":["shift labor demand right","shift labor supply right, lowering the wage","shift labor supply left, raising the wage","raise the marginal revenue product of labor"],"answer":1,"explain":"Correct is B: more potential workers shift supply right; with demand unchanged, the equilibrium wage falls and employment rises. A confuses supply with demand. C is the wrong direction. D is about productivity, not population."},{"q":"A firm uses labor (wage $10, MP = 20) and capital (rental $20, MP = 60). To minimize cost for its current output, the firm should:","options":["hire more labor and use less capital","hire more capital and use less labor","keep the input mix unchanged","reduce both inputs"],"answer":1,"explain":"Correct is B: MP_K/P_K = 60/20 = 3 exceeds MP_L/P_L = 20/10 = 2, so shifting a dollar from labor to capital raises output — the firm should substitute toward capital until the ratios equalize. A moves the wrong way. C ignores the inequality. D changes output rather than the mix."},{"q":"In a perfectly competitive labor market, an individual firm's marginal factor cost of labor equals:","options":["the market wage, because the firm is a wage taker","the MRP of labor","zero, because labor is abundant","total labor cost divided by output"],"answer":0,"explain":"Correct is A: the firm can hire any number of workers at the going wage, so each extra worker costs exactly the wage (MFC is horizontal). B is the benefit side, which is equated to MFC at the optimum. C and D are incorrect definitions."},{"q":"The price of wheat rises. What happens to a wheat farm's demand for farm labor?","options":["It decreases, because costs are higher","It increases, because MRP rises","It stays the same; only wages matter","It becomes perfectly inelastic"],"answer":1,"explain":"Correct is B: MRP = MP x product price, so a higher wheat price raises the value of each worker's output — labor demand shifts right. A confuses the product price with an input cost. C ignores the MRP link. D is an extreme claim with no basis."},{"q":"Robots become cheaper as a substitute for assembly-line workers. What is the likely effect on the demand for assembly-line workers?","options":["Increases, because production is cheaper","Decreases, as firms substitute robots for workers","No change in the short run","Increases, because MRP rises"],"answer":1,"explain":"Correct is B: cheaper substitute inputs shift labor demand left as firms swap robots for workers. A describes the scale effect, which AP treats as secondary here. C is wrong: firms respond to input prices. D is backwards — MRP is unchanged; the input mix changes."},{"q":"In a competitive labor market, the equilibrium wage is determined by:","options":["the intersection of labor demand (MRP) and labor supply","government minimum wage laws alone","the firm's total revenue","the average product of labor"],"answer":0,"explain":"Correct is A: the market wage clears where the MRP-based demand curve meets the supply curve. B only matters if the minimum wage binds above equilibrium. C and D are not the market-clearing mechanism."}],"shortBank":[{"q":"A sandwich shop sells sandwiches at $6 each in a competitive market. Hiring data: with 2 workers, total output is 40 sandwiches per hour; with 3 workers, 55; with 4 workers, 65. The wage is $60 per hour.\n(a) Compute the MRP of the 3rd and 4th workers. (2 marks)\n(b) How many workers should the shop hire? Explain with the MRP = MFC rule. (2 marks)","marks":4,"answer":"(a) MP of the 3rd worker = 55 - 40 = 15 sandwiches; MRP = 15 x $6 = $90. MP of the 4th worker = 65 - 55 = 10; MRP = 10 x $6 = $60.\n(b) Hire 4 workers. The hiring rule is MRP = MFC (the $60 wage): the 3rd worker adds $90 > $60 and the 4th adds exactly $60, so both are worth hiring; a 5th worker would only be hired if its MRP also covered the $60 wage."},{"q":"A firm produces with labor and capital. Currently MP_L = 30, wage = $15, MP_K = 40, rental rate = $10.\n(a) State the least-cost rule and check whether the firm satisfies it. (2 marks)\n(b) What specific change should the firm make to lower its costs while holding output constant? (2 marks)","marks":4,"answer":"(a) Least-cost rule: MP_L/P_L = MP_K/P_K. Here 30/15 = 2 and 40/10 = 4 — not equal, so the firm is not minimizing cost.\n(b) Capital yields more output per dollar (4 > 2), so the firm should substitute capital for labor — use more capital and less labor — until the two ratios are equal."}],"notes":"<h3>Derived Demand</h3>\n<p>Firms do not demand labor for its own sake — <strong>factor demand is derived</strong> from demand for the final product. Anything that raises the product's price or the workers' productivity raises demand for labor.</p>\n<h3>MRP, MFC, and the Hiring Rule</h3>\n<ul>\n<li><strong>MRP (marginal revenue product)</strong> = MP x MR — the extra revenue from one more unit of the factor. The labor demand curve <em>is</em> the MRP curve.</li>\n<li><strong>MFC (marginal factor cost)</strong> = the extra cost of one more unit of the factor. In a competitive factor market the firm is a price taker, so <strong>MFC = the factor price</strong> (e.g., the wage).</li>\n<li><strong>Hiring rule:</strong> hire until <strong>MRP = MFC</strong> — keep adding workers while each worker's MRP exceeds the wage.</li>\n</ul>\n<h3>Shifts in Factor Demand and Supply</h3>\n<ul>\n<li><strong>Labor demand shifts:</strong> product price, worker productivity/technology, prices of substitute or complementary inputs.</li>\n<li><strong>Labor supply shifts:</strong> population/demographics, worker preferences, alternative opportunities.</li>\n<li>Equilibrium wage and employment are set where labor demand meets labor supply.</li>\n</ul>\n<h3>The Least-Cost Rule</h3>\n<p>To minimize cost for a given output, allocate spending so that <strong>MP_L/P_L = MP_K/P_K</strong> — the last dollar spent on each input must yield the same extra output. If one ratio is higher, shift spending toward that input.</p>\n<h3>Common Traps</h3>\n<ul>\n<li>Using MP instead of MRP in the hiring decision — the wage must be compared to the <em>revenue</em> the worker generates.</li>\n<li>Shifting labor supply when the shock is to productivity or product price (those shift <em>demand</em>).</li>\n<li>Forgetting that in competitive factor markets MFC is flat at the market price.</li>\n</ul>\n"},{"id":"apmicro-market-failure","name":"Market Failure & the Role of Government","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"q":"A factory pollutes a river, harming downstream fisheries. Because the factory ignores the external cost:","options":["it produces less than the socially optimal quantity","it produces more than the socially optimal quantity","it produces the socially optimal quantity","the market creates no deadweight loss"],"answer":1,"explain":"Correct is B: the factory produces where MPC = MPB, ignoring the external cost (MSC > MPC) — output exceeds the social optimum (MSC = MSB), creating deadweight loss. A describes a positive externality. C and D ignore the unpriced harm."},{"q":"To correct the pollution externality above, the government should impose a tax equal to:","options":["the total external cost at the monopoly output","the marginal external cost at the socially optimal quantity","the factory's total fixed cost","zero, because taxes always create deadweight loss"],"answer":1,"explain":"Correct is B: a per-unit tax equal to the marginal external damage shifts the MPC curve up to MSC, aligning private and social incentives. A uses the wrong quantity benchmark. C is irrelevant. D is wrong: this corrective tax <em>reduces</em> deadweight loss rather than creating it."},{"q":"Flu vaccinations create positive externalities. The free market will:","options":["provide more than the socially optimal quantity","provide less than the socially optimal quantity","provide exactly the socially optimal quantity","provide zero vaccinations"],"answer":1,"explain":"Correct is B: individuals ignore the external benefit (MSB > MPB), so market output falls short of the social optimum — a case for subsidies. A is the negative-externality case. C ignores the spillover. D is too extreme."},{"q":"National defense is a public good because it is:","options":["rival and excludable","nonrival and nonexcludable","provided by private firms","paid for with user fees"],"answer":1,"explain":"Correct is B: one person's protection does not reduce another's (nonrival), and non-payers cannot be excluded (nonexcludable) — hence the free-rider problem and the need for government provision. A describes private goods. C and D describe market provision, which fails for public goods."},{"q":"Ocean fisheries are a common resource (rival but nonexcludable). The likely market outcome is:","options":["underuse, because of the free-rider problem","overuse, because each fisher ignores the depletion cost imposed on others","the socially optimal harvest","no fishing at all"],"answer":1,"explain":"Correct is B: rivalry without excludability leads to the tragedy of the commons — overexploitation. A describes public goods (nonrival). C ignores the missing property rights. D is unrealistic."},{"q":"In a market with a positive externality in production, the socially optimal quantity is found where:","options":["MPC = MPB","MSC = MSB","MPC = MSB","supply equals zero"],"answer":1,"explain":"Correct is B: the social optimum always equates marginal social cost and marginal social benefit. A is the unregulated market outcome. C mixes private and social curves. D is meaningless."},{"q":"A country's Lorenz curve bows further away from the line of perfect equality. This indicates:","options":["greater income inequality","greater income equality","higher average income","lower unemployment"],"answer":0,"explain":"Correct is A: a more bowed Lorenz curve means income is more concentrated — greater inequality (a higher Gini coefficient). B is the opposite. C and D are about the level of income and jobs, not how income is distributed."},{"q":"Which of the following is an example of antitrust policy?","options":["A per-unit tax on cigarettes","Blocking a merger that would create a monopoly","A subsidy for flu vaccines","A price ceiling on rent"],"answer":1,"explain":"Correct is B: antitrust laws (e.g., the Sherman Act) block mergers and break up firms that would create monopoly power. A is a corrective tax. C addresses a positive externality. D is price regulation."},{"q":"Instead of a pollution tax, the government issues a fixed number of tradable pollution permits. Firms with high pollution-cutting costs will:","options":["sell their permits and cut pollution deeply","buy permits from firms with low cutting costs","ignore the permits","shut down immediately"],"answer":1,"explain":"Correct is B: trade sends permits to the firms for which cutting pollution is most expensive, achieving the pollution cap at the lowest total cost. A describes low-cost firms, which profit by selling. C and D ignore the market for permits."},{"q":"A neighborhood considers hiring private security, but many residents refuse to pay, hoping others will foot the bill. This is the:","options":["tragedy of the commons","free-rider problem","moral hazard","adverse selection"],"answer":1,"explain":"Correct is B: nonexcludability lets residents enjoy the security without paying — free-riding leads to underprovision of the good. A is about rival common resources. C and D are insurance-market problems."}],"shortBank":[{"q":"A market has MPB = 100 - Q, MPC = 20 + Q, and a marginal external cost of $20 per unit.\n(a) Find the market equilibrium quantity. (1 mark)\n(b) Find the socially optimal quantity. (2 marks)\n(c) What per-unit tax achieves the social optimum? (1 mark)","marks":4,"answer":"(a) Market: MPB = MPC → 100 - Q = 20 + Q → Q = 40.\n(b) MSC = MPC + 20 = 40 + Q. Social optimum: MSB (= MPB) = MSC → 100 - Q = 40 + Q → Q = 30.\n(c) A $20 per-unit tax — equal to the marginal external cost — shifts MPC up to MSC, moving output from 40 to 30."},{"q":"(a) State the two characteristics (rivalry and excludability) that make a good a public good, and give one example. (2 marks)\n(b) Contrast a public good with a common resource, and explain why each is misallocated by unregulated markets. (2 marks)","marks":4,"answer":"(a) A public good is nonrival (one person's use does not reduce availability to others) and nonexcludable (non-payers cannot be prevented from using it). Example: national defense (or a lighthouse).\n(b) A common resource is rival but nonexcludable (e.g., ocean fisheries). Public goods are underprovided because of free-riding — nobody pays. Common resources are overused because each user ignores the depletion cost imposed on others (the tragedy of the commons)."}],"notes":"<h3>Externalities</h3>\n<ul>\n<li><strong>Negative externality</strong> (e.g., pollution): MSC &gt; MPC — the market <em>overproduces</em>. Fix with a per-unit <strong>tax</strong> equal to the marginal external cost, or quantity regulation / tradable permits.</li>\n<li><strong>Positive externality</strong> (e.g., vaccines, education): MSB &gt; MPB — the market <em>underproduces</em>. Fix with a per-unit <strong>subsidy</strong> equal to the marginal external benefit.</li>\n<li>The <strong>social optimum</strong> is always where <strong>MSC = MSB</strong>. The gap between market and optimal output is <strong>deadweight loss</strong>.</li>\n</ul>\n<h3>Public Goods and Common Resources</h3>\n<ul>\n<li><strong>Public good:</strong> nonrival + nonexcludable (national defense) — <strong>free-rider problem</strong> leads to <em>underprovision</em>; government must provide it.</li>\n<li><strong>Common resource:</strong> rival + nonexcludable (fisheries, clean air) — <strong>tragedy of the commons</strong> leads to <em>overuse</em>; fix with regulation, quotas, or property rights.</li>\n<li>Private goods are rival + excludable; artificially scarce (club) goods are nonrival + excludable.</li>\n</ul>\n<h3>Inequality and Antitrust</h3>\n<ul>\n<li>The <strong>Lorenz curve</strong> plots cumulative income shares; the more it bows from the 45-degree line of equality, the <strong>greater the inequality</strong> (higher Gini coefficient).</li>\n<li><strong>Antitrust policy</strong> (e.g., the Sherman Act) blocks anticompetitive mergers and breaks up monopolies to protect competition.</li>\n</ul>\n<h3>Common Traps</h3>\n<ul>\n<li>Taxing the wrong side or wrong amount — the corrective tax equals the <em>marginal external cost at the social optimum</em>.</li>\n<li>Mixing up which curve shifts: a tax on producers shifts <em>supply</em> (MPC) up; a subsidy for a positive consumption externality shifts <em>demand</em> (MPB) up.</li>\n<li>Calling a common resource a public good — check rivalry: fisheries are rival, defense is not.</li>\n<li>Thinking a corrective tax creates deadweight loss — it <em>removes</em> the DWL from the externality.</li>\n</ul>\n"}]},{"id":"ap-stats","name":"AP Statistics","semester":"ap","units":[{"id":"apstats-onevar","name":"Exploring One-Variable Data","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"q":"A researcher surveys high school students and records each student's number of siblings, hours of sleep per night, favorite streaming service, and height in centimeters. Which of these variables is categorical?","options":["number of siblings","hours of sleep per night","favorite streaming service","height in centimeters"],"answer":2,"explain":"Favorite streaming service places students into categories (Netflix, Hulu, ...) with no numerical meaning, so it is categorical. The other three take numerical values that can be ordered and used in arithmetic, so they are quantitative."},{"q":"A survey recorded nightly sleep hours for 20 college students. The distribution has median 7.75 hours, mean 7.875 hours, and one value of 12.5 hours while all other values fall between 5.5 and 10 hours. Which of the following best describes the shape of the distribution?","options":["roughly symmetric","skewed left","approximately uniform","skewed right"],"answer":3,"explain":"The single high value of 12.5 hours stretches the tail toward the larger values, so the distribution is skewed right. The mean sitting slightly above the median is consistent with right skew."},{"q":"Incomes in a small town have a strongly right-skewed distribution because of a few very high earners. Which statement about the mean and median income is most likely true?","options":["The mean is less than the median.","The mean is greater than the median.","The mean is approximately equal to the median.","The relationship between the mean and median cannot be determined from the shape."],"answer":1,"explain":"Skew pulls the mean toward the tail: the few very large incomes inflate the mean, so mean > median in a right-skewed distribution. The median, which depends only on the middle value(s), is not pulled."},{"q":"A data set contains one extreme outlier. Which of the following measures of spread is resistant to outliers, meaning its value barely changes when the outlier is removed?","options":["range","standard deviation","interquartile range","variance"],"answer":2,"explain":"The IQR = Q3 - Q1 depends only on the middle 50% of the data, so an extreme value does not change it. Range, standard deviation, and variance all use the extreme values directly and are not resistant."},{"q":"For 20 nightly sleep values, Q1 = 6.625 hours and Q3 = 8.875 hours. One student reported sleeping 12.5 hours. Using the 1.5 x IQR rule, is 12.5 hours an outlier?","options":["No, because 12.5 is below the upper fence.","Yes, because 12.5 exceeds the upper fence of 12.25 hours.","Yes, because 12.5 is greater than Q3.","No, because 12.5 is within two standard deviations of the mean."],"answer":1,"explain":"IQR = 8.875 - 6.625 = 2.25, so the upper fence is Q3 + 1.5(IQR) = 8.875 + 3.375 = 12.25. Since 12.5 > 12.25, it is an outlier. Simply exceeding Q3 is not the rule, and the SD is irrelevant to the 1.5 x IQR rule."},{"q":"The 20 sleep values have mean 7.875 hours and standard deviation 1.637 hours. What is the z-score for a student who slept 5.5 hours?","options":["-1.45","1.45","2.83","-2.83"],"answer":0,"explain":"z = (x - mean)/SD = (5.5 - 7.875)/1.637 = -1.45. The negative sign is required because 5.5 is below the mean. 2.83 is the z-score of the 12.5-hour outlier, not of 5.5 hours."},{"q":"One student slept 5.5 hours, the lowest value in the survey; the other 19 students all slept more. Approximately what percentile is the 5.5-hour value?","options":["95th percentile","50th percentile","5th percentile","10th percentile"],"answer":2,"explain":"About 1/20 = 5% of the values are at or below 5.5 hours, so it is at approximately the 5th percentile. The 95th percentile would mean 95% are at or below, which describes a high value, not the minimum."},{"q":"Heights of adult women are approximately normally distributed with mean 64 inches and standard deviation 2.5 inches. About what percent of adult women are between 61.5 and 66.5 inches tall?","options":["about 68%","about 50%","about 95%","about 99.7%"],"answer":0,"explain":"61.5 to 66.5 is exactly one standard deviation below and above the mean (64 +/- 2.5). By the empirical (68-95-99.7) rule, about 68% of a normal distribution falls within one standard deviation of the mean."},{"q":"SAT math scores are approximately normal with mean 520 and standard deviation 100, written N(520, 100). A student scores 720. How many standard deviations above the mean is this score?","options":["1","3","2","0.5"],"answer":2,"explain":"z = (720 - 520)/100 = 2, so the score is 2 standard deviations above the mean. In a normal model, a z-score of 2 is unusually high (above about 97.5% of scores)."},{"q":"The standard deviation of the 20 sleep values is about 1.64 hours. Which is the best interpretation of this number in context?","options":["Sleep times typically differ from the mean by about 1.64 hours.","The range of sleep times is 1.64 hours.","Half the students sleep within 1.64 hours of the median.","The average sleep time is 1.64 hours."],"answer":0,"explain":"The standard deviation measures the typical distance of values from the mean. The range here is 12.5 - 5.5 = 7 hours, and the mean itself is 7.875 hours, so the other options confuse SD with different summaries."}],"shortBank":[{"q":"The five-number summary for the 20 nightly sleep values (in hours) is: minimum 5.5, Q1 6.625, median 7.75, Q3 8.875, maximum 12.5.\n(a) Compute the interquartile range (IQR). (1 mark)\n(b) Use the 1.5 x IQR rule to determine whether this data set has any outliers. Show your work. (2 marks)","marks":3,"answer":"(a) IQR = Q3 - Q1 = 8.875 - 6.625 = 2.25 hours.\n(b) Lower fence = Q1 - 1.5(IQR) = 6.625 - 3.375 = 3.25 hours; upper fence = Q3 + 1.5(IQR) = 8.875 + 3.375 = 12.25 hours. The maximum, 12.5, exceeds the upper fence of 12.25, so 12.5 hours is an outlier. The minimum, 5.5, is above the lower fence of 3.25, so there are no low outliers."},{"q":"Heights of adult men are approximately normally distributed with mean 70 inches and standard deviation 3 inches, written N(70, 3).\n(a) Use the empirical rule to estimate the percent of men whose heights are between 64 and 76 inches. (1 mark)\n(b) Compute the z-score for a man who is 76 inches tall, and interpret it in context. (2 marks)\n(c) About what percent of men are taller than 73 inches? (1 mark)","marks":4,"answer":"(a) 64 to 76 inches is two standard deviations below and above the mean (70 +/- 6), so by the 68-95-99.7 rule about 95% of men fall in this interval.\n(b) z = (76 - 70)/3 = 2. A height of 76 inches is 2 standard deviations above the mean height for adult men.\n(c) 73 inches is one standard deviation above the mean. About 68% of values lie within one SD of the mean, leaving 32% outside; half of that (16%) is above one SD, so about 16% of men are taller than 73 inches."}],"notes":"<h3>Variables: Categorical vs Quantitative</h3>\n<p>A <strong>categorical variable</strong> places individuals into groups or categories (eye color, favorite streaming service). A <strong>quantitative variable</strong> takes numerical values you can order and do arithmetic with (height, hours of sleep, number of siblings). The type of variable decides which graphs and summaries are appropriate: bar charts and pie charts for categorical data, dotplots, stemplots, histograms, and boxplots for quantitative data.</p>\n<h3>Displaying One-Variable Quantitative Data</h3>\n<p><strong>Dotplots</strong> show every individual value as a dot above a number line — great for small data sets. <strong>Stemplots</strong> (stem-and-leaf plots) also show every value while organizing them by leading digits. <strong>Histograms</strong> group values into equal-width bins (classes) and show frequencies as bars; unlike bar charts for categorical data, the bars touch and the horizontal axis is a numerical scale. <strong>Boxplots</strong> summarize data with the five-number summary (minimum, Q1, median, Q3, maximum) and flag outliers as separate points.</p>\n<h3>Describing Distributions: SOCS</h3>\n<p>Always describe a distribution with <strong>SOCS</strong>: <strong>Shape</strong> (symmetric, skewed left, skewed right, uniform, bimodal), <strong>Outliers</strong> (values far from the rest), <strong>Center</strong> (a typical value — mean or median), and <strong>Spread</strong> (how spread out the values are — range, IQR, or standard deviation). Interpret everything <strong>in context</strong>: say \"the distribution of nightly sleep hours is skewed right,\" not just \"it is skewed right.\"</p>\n<h3>Center: Mean vs Median</h3>\n<p>The <strong>mean</strong> (x-bar) is the arithmetic average: x-bar = (sum of all values) / n. The <strong>median</strong> is the middle value when data are ordered (average of the two middle values for an even number of observations). The median is <strong>resistant</strong> — outliers barely move it — while the mean is not. Skew <strong>pulls the mean toward the tail</strong>: in a right-skewed distribution, mean &gt; median; in a left-skewed distribution, mean &lt; median; in a symmetric distribution they are approximately equal.</p>\n<h3>Spread: Range, IQR, Standard Deviation</h3>\n<p>The <strong>range</strong> = maximum - minimum. The <strong>interquartile range</strong> measures the spread of the middle 50%: IQR = Q3 - Q1. Like the median, the IQR is resistant to outliers. The <strong>standard deviation</strong> (SD) measures the typical distance of values from the mean and is <em>not</em> resistant — one extreme value inflates it. A larger SD means values are more spread out around the mean. Report center and spread as a pair: median with IQR for skewed data, mean with SD for roughly symmetric data.</p>\n<h3>The 1.5 x IQR Rule for Outliers</h3>\n<p>An observation is a suspected <strong>outlier</strong> if it falls more than 1.5 x IQR below Q1 or above Q3:</p>\n<ul>\n<li>Lower fence = Q1 - 1.5(IQR); any value below this is an outlier.</li>\n<li>Upper fence = Q3 + 1.5(IQR); any value above this is an outlier.</li>\n</ul>\n<p>Boxplots draw these flagged points individually instead of extending the whiskers to them. Always investigate outliers — they may be errors, or the most interesting part of the data.</p>\n<h3>Measuring Position: Percentiles and z-Scores</h3>\n<p>A value at the <strong>kth percentile</strong> has about k percent of the data at or below it. <strong>z-scores</strong> standardize a value by measuring how many standard deviations it sits from the mean: z = (x - mean) / SD. A positive z-score means the value is above the mean; a negative z-score means it is below. z-scores let you compare values from different distributions (for example, comparing an SAT score to an ACT score).</p>\n<h3>Normal Distributions and the Empirical Rule</h3>\n<p>A <strong>normal distribution</strong> is symmetric, single-peaked, and bell-shaped, described by N(mu, sigma) where mu is the mean (and median) and sigma is the standard deviation. For approximately normal data, the <strong>empirical (68-95-99.7) rule</strong> says: about <strong>68%</strong> of values fall within 1 SD of the mean, about <strong>95%</strong> within 2 SD, and about <strong>99.7%</strong> within 3 SD. So in N(70, 3), about 95% of values lie between 64 and 76. Always check that data are approximately normal (roughly symmetric, no strong outliers) before using normal models.</p>\n"},{"id":"apstats-twovar","name":"Exploring Two-Variable Data","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"q":"A researcher records the number of hours (x) ten students spent studying for a final exam and each student's exam score out of 100 (y). The data are (1, 64.1), (2, 55.2), (3, 62.2), (4, 68.4), (5, 65.3), (6, 74.0), (7, 78.0), (8, 71.5), (9, 92.1), (10, 93.6), and the correlation is r = 0.89. Which of the following best describes the association shown in the scatterplot?","options":["weak, negative, linear association","strong, positive, linear association","strong, positive, nonlinear association","no association between the variables"],"answer":1,"explain":"The points rise from left to right (positive direction), cluster fairly tightly around a straight-line pattern (linear form, strong strength with r = 0.89), and show no extreme points. Strength refers to how closely points follow the form, not how steep the line is."},{"q":"Which of the following statements about the correlation coefficient r is TRUE?","options":["If r = 0, there is no association of any kind between the variables","The correlation r is resistant to outliers","If study time is measured in minutes instead of hours, the correlation r stays the same","A correlation of 0.8 means 80% of the change in y is caused by x"],"answer":2,"explain":"Correlation is unaffected by linear rescaling such as changing hours to minutes, because r is based on standardized values. An r of 0 does not rule out a nonlinear association, r is not resistant to outliers, and correlation never implies causation."},{"q":"The least-squares regression line for predicting exam score (y, in points) from study time (x, in hours) is y-hat = 52.18 + 3.68x. Which of the following is the correct interpretation of the slope?","options":["For each additional hour of studying, the predicted exam score increases by 3.68 points","For each additional point on the exam, the predicted study time increases by 3.68 hours","The predicted exam score for a student who studies 0 hours is 3.68 points","About 3.68% of the variation in exam scores is explained by study time"],"answer":0,"explain":"Slope is the predicted change in y per one-unit increase in x: each extra hour of studying is associated with a predicted increase of 3.68 points. The reverse (points to hours), the intercept value, and a percent of variation are all different concepts."},{"q":"For the regression line y-hat = 52.18 + 3.68x (x = hours studied, y = exam score in points), which is the correct interpretation of the y-intercept, 52.18?","options":["The lowest exam score any student in the study earned","Each hour of studying adds 52.18 points to the predicted score","The correlation between study hours and exam score is 52.18","The predicted exam score for a student who studies 0 hours is 52.18 points"],"answer":3,"explain":"The y-intercept is the predicted y-value when x = 0: a student who studies 0 hours is predicted to score 52.18 points. It is a prediction from the model, not an observed minimum or a rate of change."},{"q":"Using y-hat = 52.18 + 3.68x, what is the predicted exam score for a student who studies 6 hours?","options":["70.6 points","74.3 points","78.0 points","85.3 points"],"answer":1,"explain":"Substitute x = 6 into the line: 52.18 + 3.68(6) = 52.18 + 22.08 = 74.26, about 74.3 points. The value 85.3 is the prediction for 9 hours, and 78.0 is an observed score, not a prediction."},{"q":"One student studied 9 hours and scored 92.1 on the exam. Using y-hat = 52.18 + 3.68x, what is the residual for this student, and what does it mean?","options":["-6.8; the student's score was 6.8 points below the predicted score","85.3; the residual is equal to the predicted value","6.8; the student's score was 6.8 points above the predicted score","6.8; the predicted score was 6.8 points above the student's score"],"answer":2,"explain":"Predicted score = 52.18 + 3.68(9) = 85.30. Residual = observed - predicted = 92.1 - 85.30 = 6.8. A positive residual means the actual score was 6.8 points above what the line predicted."},{"q":"For the study-time data, r-squared = 0.80. Which of the following is the correct interpretation?","options":["The correlation between study hours and exam scores is 0.80","About 80% of the variation in study hours is explained by exam scores","Studying causes about 80% of the variation in exam scores","About 80% of the variation in exam scores is explained by the linear relationship with study hours"],"answer":3,"explain":"r-squared is the percent of variation in the response variable (exam scores) explained by the least-squares regression on the explanatory variable. It says nothing about causation, and the direction of explanation cannot be reversed."},{"q":"A residual plot for predicting exam score from study time shows a clear U-shaped curved pattern. Which of the following is the best conclusion?","options":["A linear model is not appropriate; the association appears to be nonlinear","A linear model is appropriate because the residuals always sum to zero","The correlation between the variables must be close to 0","The curved pattern proves that study time causes the exam scores"],"answer":0,"explain":"A curved pattern in the residual plot means the linear model systematically over- and under-predicts, so a straight line is not appropriate. A good linear fit shows residuals scattered randomly with no pattern."},{"q":"For ten students (study hours 1 to 10), the regression line is y-hat = 50.20 + 4.11x with r = 0.998. After adding one student who studied 14 hours and scored 60, the line becomes y-hat = 61.47 + 1.62x with r = 0.50. The point (14, 60) is best described as","options":["An outlier that is not influential, since it follows the overall trend","An influential point, because it substantially changes the regression line and correlation","A lurking variable that explains the association","Evidence that studying causes higher exam scores"],"answer":1,"explain":"The point (14, 60) is far from the other x-values and pulls the line toward itself, sharply changing the slope (4.11 to 1.62) and weakening r (0.998 to 0.50). An observation that substantially changes the regression results is influential."},{"q":"Data from a city show a strong positive association between the number of firefighters sent to a fire and the dollar amount of damage the fire causes. Which of the following is the best explanation?","options":["Sending more firefighters causes more damage","The association must be a coincidence, so it should be ignored","A lurking variable, the size of the fire, is related to both the number of firefighters and the damage","The correlation must be exactly 1 for the association to be meaningful"],"answer":2,"explain":"A lurking variable, the size/severity of the fire, is associated with both variables: bigger fires require more firefighters and cause more damage. Association alone never establishes causation."}],"shortBank":[{"q":"A study of ten students gives the least-squares regression line y-hat = 52.18 + 3.68x for predicting exam score (y, in points) from hours studied (x), with r-squared = 0.80. (a) Interpret the slope in context. (b) Interpret the y-intercept in context. (c) Interpret r-squared in context.","marks":3,"answer":"(a) Slope: for each additional hour a student spends studying, the predicted exam score increases by about 3.68 points. (b) Y-intercept: the predicted exam score for a student who studies 0 hours is 52.18 points. (c) r-squared: about 80% of the variation in exam scores is explained by the least-squares regression line on study hours (the linear relationship with hours studied); the remaining 20% is due to other factors."},{"q":"Using y-hat = 52.18 + 3.68x (hours studied vs. exam score, data range 1 to 10 hours): (a) One student studied 9 hours and scored 92.1. Calculate the residual and interpret it in context. (b) Explain why using this line to predict the score of a student who studies 20 hours would be unreliable.","marks":3,"answer":"(a) Predicted score = 52.18 + 3.68(9) = 85.30. Residual = observed - predicted = 92.1 - 85.30 = 6.8. The student's actual score was 6.8 points higher than the score predicted by the regression line. (b) 20 hours is far outside the observed range of study times (1 to 10 hours), so this is extrapolation: the linear pattern may not continue beyond the data. In fact the line predicts 125.78 points, which is impossible on a 100-point exam."}],"notes":"<h3>Describing a Scatterplot</h3>\n<p>Start every two-variable analysis by looking at the scatterplot of the response variable (y) against the explanatory variable (x). Describe the association with four words: <strong>form</strong> (usually linear or nonlinear), <strong>direction</strong> (positive or negative), <strong>strength</strong> (weak to strong), and any <strong>unusual points</strong> such as outliers or clusters.</p>\n<h3>Correlation r</h3>\n<p>The correlation coefficient <strong>r</strong> measures the strength and direction of a <em>linear</em> association and is always between -1 and 1. The sign gives the direction; values near -1 or 1 mean a strong linear pattern, values near 0 a weak one. Key properties: r has no units; it is not resistant, so outliers can change it a lot; it is unaffected by linear rescaling, so changing units leaves r unchanged; and r = 0 does not mean no association, only no <em>linear</em> association, since a strong curved pattern can still have r near 0.</p>\n<h3>The Least-Squares Regression Line</h3>\n<p>The least-squares regression line, written y-hat = a + bx, is the line that makes the sum of the squared vertical distances from the points to the line as small as possible. It is the model we use to predict y from x. The slope <strong>b</strong> is the predicted change in y for each one-unit increase in x. The y-intercept <strong>a</strong> is the predicted y-value when x = 0, which is only meaningful if x = 0 makes sense in context.</p>\n<h4>Interpreting in context</h4>\n<p>Always interpret with units and the word <strong>predicted</strong>. For a line predicting exam score from hours studied, y-hat = 52.18 + 3.68x: the slope means that for each additional hour of studying, the <em>predicted</em> exam score increases by about 3.68 points. The intercept means the predicted score for a student who studies 0 hours is 52.18 points. The slope describes the model's prediction, not the actual change for any individual.</p>\n<h3>Predictions and Extrapolation</h3>\n<p>To predict, substitute the x-value into the equation. Predictions are trustworthy only near the observed data. <strong>Extrapolation</strong>, predicting for x-values far outside the observed range, is dangerous because the linear pattern may not continue, and it can even produce impossible values, such as a score above 100 on a 100-point exam.</p>\n<h3>Residuals and Residual Plots</h3>\n<p>A <strong>residual</strong> is the prediction error for one observation: residual = observed y - predicted y. A positive residual means the actual value was above the line; a negative one means it was below. A <strong>residual plot</strong> graphs residuals against x and is the main tool for judging whether a linear model fits. If the residuals scatter randomly with no pattern and roughly constant spread, a linear model is appropriate. A curved or fan-shaped pattern means the linear model is not appropriate.</p>\n<h3>r-Squared</h3>\n<p>The coefficient of determination, <strong>r-squared</strong>, is the percent of the variation in the response variable explained by the least-squares regression on the explanatory variable. If r-squared = 0.80, about 80% of the variation in exam scores is explained by the linear relationship with study hours, and the other 20% is due to other factors. Take the square root to recover r, keeping the sign of the association's direction.</p>\n<h3>Outliers, Leverage, and Influential Points</h3>\n<p>An <strong>outlier</strong> in regression is a point that does not follow the overall pattern. A point with an extreme x-value has high <strong>leverage</strong>. A point is <strong>influential</strong> if removing it would substantially change the regression line or correlation. Not every outlier is influential, and not every influential point looks like an obvious outlier, so always check by refitting without the suspicious point.</p>\n<h3>Association Is Not Causation</h3>\n<p>A strong association, even with a high r-squared, never proves that x causes y. A <strong>lurking variable</strong> is an unmeasured variable associated with both x and y that may explain the relationship, such as fire size explaining the link between number of firefighters and damage. Before claiming cause and effect, rule out lurking variables; only a well-designed experiment can establish causation.</p>\n<table>\n<tr><th>Concept</th><th>What to remember</th></tr>\n<tr><td>residual</td><td>observed y minus predicted y</td></tr>\n<tr><td>r-squared</td><td>percent of variation in y explained by the linear model</td></tr>\n<tr><td>extrapolation</td><td>predicting outside the observed x-range; unreliable</td></tr>\n<tr><td>influential point</td><td>removing it markedly changes the line or r</td></tr>\n<tr><td>lurking variable</td><td>hidden variable linked to both x and y</td></tr>\n</table>\n"},{"id":"apstats-collect","name":"Collecting Data","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"q":"A school nurse wants to know whether students who eat breakfast score higher on morning quizzes. She records the breakfast habits and quiz scores of 200 students for one month, without changing anything about their routines. What kind of study is this, and what can she conclude?","options":["Observational study; causation cannot be established because confounding variables cannot be ruled out","Experiment; because the nurse compared two groups, she can conclude breakfast causes higher scores","Observational study; because she used random assignment, she can conclude causation","Experiment; but without a placebo group the results are meaningless"],"answer":0,"explain":"Correct: nothing was manipulated, so this is an observational study. Without random assignment, confounding variables (for example, students who eat breakfast may also get more sleep or come from higher-income households) cannot be ruled out, so causation cannot be established. The other options are wrong: no treatment was imposed (not an experiment), and observational studies cannot randomly assign."},{"q":"A principal wants to estimate the average time students spend on homework. She divides the students by grade level (9, 10, 11, 12), then randomly selects 25 students from each grade to survey. This is an example of a:","options":["Simple random sample","Stratified random sample","Cluster sample","Convenience sample"],"answer":1,"explain":"Correct: the population was first divided into homogeneous groups (grades) and a random sample taken within each — the definition of a stratified random sample. It is not a simple random sample (selection was not from the whole school at once), not a cluster sample (she did not take whole pre-existing groups intact), and not convenience (selection was random, not just whoever was nearby)."},{"q":"A school district has 40 schools. The district office randomly selects 8 of the schools and surveys every student in those 8 schools about bus service. This is an example of a:","options":["Stratified random sample","Systematic random sample","Cluster sample","Convenience sample"],"answer":2,"explain":"Correct: whole pre-existing groups (schools) were selected at random and every member of the chosen groups was surveyed — a cluster sample. It is not stratified (she did not sample within every school), not systematic (no every-kth selection), and not convenience (schools were randomly chosen, not just the nearest ones)."},{"q":"A radio station asks listeners to call in and vote on a proposed later school start time. Of the 300 callers, 85% oppose the change. The station reports that ‘residents overwhelmingly oppose the later start.’ What is the main problem with this conclusion?","options":["Undercoverage","Response bias","Nonresponse bias","Voluntary response bias"],"answer":3,"explain":"Correct: people chose on their own to call in, and those with strong opinions are far more likely to respond — voluntary response bias. It is not undercoverage (everyone could call), not response bias (the question itself was not the problem), and nonresponse bias refers to selected people who fail to respond, not self-selected callers."},{"q":"A survey asks: ‘Given rising crime rates in our neighbourhood, do you support increasing the school security budget?’ What is wrong with this survey question?","options":["The question is neutral and well worded","The question is leading — the wording encourages a ‘yes’ answer","The survey should have been double-blind","The results are affected by the placebo effect"],"answer":1,"explain":"Correct: the phrase ‘given rising crime rates’ is a leading introduction that pushes respondents toward answering yes — a wording bias. The question is not neutral, and the problem has nothing to do with blinding or placebos, which belong to experiments, not surveys."},{"q":"A researcher tests two fertilizers on tomato plants. Thirty plants are randomly assigned to receive either fertilizer A or fertilizer B, and the total mass of tomatoes each plant produces is recorded. In this experiment, what are the explanatory and response variables?","options":["Explanatory variable: tomato yield; response variable: fertilizer type","Explanatory variable: fertilizer type; response variable: number of plants","Explanatory variable: fertilizer type; response variable: tomato yield","Explanatory variable: tomato yield; response variable: soil moisture"],"answer":2,"explain":"Correct: the explanatory variable is what is manipulated (fertilizer type), and the response variable is what is measured (tomato yield). The plants receiving the treatments are the experimental units. The other options swap explanatory and response or name variables that were not part of the design."},{"q":"An experiment tests a new painkiller on 60 volunteers aged 18 to 80. Because age may affect pain relief, the researchers first divide the volunteers into two groups — under 40 and 40 and over — and then randomly assign the drug or a placebo within each age group. This design uses:","options":["Matched pairs design","Stratified random sampling","An observational study, because no placebo was used","Blocking"],"answer":3,"explain":"Correct: age is a variable expected to affect the response, so the subjects were grouped by age before randomizing within each group — blocking. It is not a matched pairs design (subjects were not paired one-to-one), and it is still an experiment because treatments were imposed."},{"q":"In a trial of a new allergy medication, neither the patients nor the doctors who evaluate their symptoms know which patients received the medication and which received an inactive pill. This study is:","options":["Double-blind","Single-blind","Placebo-controlled but not blinded","Matched pairs"],"answer":0,"explain":"Correct: neither the patients nor the evaluating doctors know who received the drug — double-blind. Single-blind would mean only one side is unaware. A placebo alone does not describe who is blinded, and matched pairs is a different design (paired subjects)."},{"q":"A study finds that people who drink more coffee report higher stress levels. The researchers also note that the coffee drinkers in the study tend to sleep fewer hours per night. Which statement is correct?","options":["The study proves that coffee causes stress","The number of hours of sleep is a confounding variable","Stress is the explanatory variable in this study","Random assignment eliminates this problem"],"answer":1,"explain":"Correct: sleep is related to both coffee drinking and stress and was not controlled, so it is a confounding (lurking) variable that offers an alternative explanation. The study did not prove causation, stress is the response variable (not explanatory), and random assignment was never used."},{"q":"A researcher recruits 100 volunteers at one gym and randomly assigns them to either a new workout program or their usual routine. After 8 weeks, the new-program group has gained significantly more muscle. Which conclusion is valid?","options":["The results generalize to all adults, but causation cannot be claimed","Neither causation nor generalization is valid","Causation can be claimed for these volunteers, but the results cannot be generalized to all adults","Both causation and generalization to all adults are valid"],"answer":2,"explain":"Correct: random assignment of the volunteers lets the researcher claim the program caused the extra muscle gain (for these subjects), but because the subjects were volunteers at one gym — not a random sample of any larger population — the results cannot be generalized to all adults. Causation requires a randomized experiment; generalization requires random sampling."}],"shortBank":[{"q":"A company claims its new energy drink improves reaction time. Describe how you would design a well-controlled experiment to test this claim. Your design must include random assignment, a control or comparison group, and blinding.","marks":4,"answer":"A well-designed experiment: (1) Randomly assign volunteers to two groups — one receives the energy drink, the other receives a placebo drink that looks and tastes the same (control/comparison group). (2) Keep the study double-blind: neither the participants nor the people measuring reaction time know who got which drink, so expectations cannot influence the results. (3) Measure every participant's reaction time with the same test under the same conditions, then compare the average reaction times of the two groups. (4) Use enough subjects (replication) so the results are reliable and not driven by a few unusual individuals. If the drink group is significantly faster, the random assignment lets you conclude the drink caused the difference."},{"q":"A town surveys residents about a new park by calling landline phone numbers on weekday mornings. Identify two sources of bias in this method, explain how each could distort the results, and suggest one improvement.","marks":3,"answer":"Two sources of bias: (1) Undercoverage — households without landlines (cell-phone-only homes, common among younger adults) and anyone at work or school on weekday mornings are never reached, so the sample systematically misses large groups of residents. (2) Nonresponse bias — the people who do pick up and agree to answer may differ from those who refuse or are unavailable (for example, retirees are overrepresented), so their opinions may not reflect the whole town. One improvement: use random digit dialing that includes cell phone numbers and call at varied times (evenings and weekends), or draw a simple random sample from the town's resident registry and contact everyone selected."}],"notes":"<h3>Collecting Data — Key Ideas</h3>\n\n<h4>Observational Studies vs Experiments</h4>\n<p>In an <strong>observational study</strong>, the researcher observes and records but does not impose any treatment — for example, tracking students' sleep habits and test scores. In an <strong>experiment</strong>, the researcher deliberately imposes a <strong>treatment</strong> on the subjects and observes the response — for example, randomly giving some students an extra hour of study time and comparing scores. The critical difference: a well-designed experiment can establish <strong>cause and effect</strong>; an observational study can only show an association, because confounding variables cannot be ruled out.</p>\n\n<h4>Population, Sample, and Scope of Inference</h4>\n<p>The <strong>population</strong> is the entire group you want to learn about; a <strong>sample</strong> is the subset you actually observe. Two questions always matter:</p>\n<ul>\n<li><strong>Can we claim causation?</strong> Only with a <strong>randomized experiment</strong> (random assignment of treatments).</li>\n<li><strong>Can we generalize to the population?</strong> Only with <strong>random sampling</strong> from that population.</li>\n</ul>\n<p>You can have one without the other: a randomized experiment on volunteers supports causation but not generalization, while a random sample in an observational study supp
