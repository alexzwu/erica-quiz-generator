orts generalization but not causation.</p>\n\n<h4>Sampling Methods</h4>\n<table>\n<tr><th>Method</th><th>How it works</th><th>Watch out for</th></tr>\n<tr><td><strong>Simple random sample (SRS)</strong></td><td>Every group of size n has an equal chance of selection, via a random number generator</td><td>The gold standard, but can miss small subgroups</td></tr>\n<tr><td><strong>Stratified random sample</strong></td><td>Divide the population into homogeneous groups (strata), then take an SRS within each stratum</td><td>Reduces variability; represents each stratum</td></tr>\n<tr><td><strong>Cluster sample</strong></td><td>Divide into heterogeneous groups (clusters), randomly select a few clusters, survey everyone in them</td><td>Convenient, but clusters may differ</td></tr>\n<tr><td><strong>Systematic random sample</strong></td><td>Random start, then select every kth individual</td><td>Simple, but a hidden pattern matching k can bias it</td></tr>\n<tr><td><strong>Convenience sample</strong></td><td>Survey whoever is easy to reach</td><td>Almost always biased</td></tr>\n</table>\n\n<h4>Sources of Bias in Sampling and Surveys</h4>\n<ul>\n<li><strong>Voluntary response bias:</strong> people choose to respond, so only those with strong opinions show up (call-in polls, online reviews).</li>\n<li><strong>Undercoverage:</strong> some groups are systematically left out of the sampling frame (a landline-only survey misses cell-phone-only households).</li>\n<li><strong>Nonresponse bias:</strong> selected individuals who do not respond may differ from those who do.</li>\n<li><strong>Response bias:</strong> the respondent's answer is influenced by the interviewer, the setting, or lying about sensitive topics.</li>\n<li><strong>Question wording:</strong> leading or emotionally loaded wording pushes respondents toward one answer.</li>\n</ul>\n\n<h4>Experiment Vocabulary</h4>\n<ul>\n<li><strong>Explanatory variable:</strong> what is manipulated (the treatment factor). <strong>Response variable:</strong> what is measured.</li>\n<li><strong>Experimental units</strong> (called <strong>subjects</strong> when people) receive the treatments.</li>\n<li><strong>Treatments</strong> are the specific conditions imposed — including a <strong>control</strong> group that receives no treatment or a placebo for comparison.</li>\n</ul>\n\n<h4>Principles of Experimental Design</h4>\n<ol>\n<li><strong>Control:</strong> keep everything the same except the treatment; include a control group as a baseline.</li>\n<li><strong>Random assignment:</strong> assign subjects to treatments by chance, so groups are similar in every way except the treatment. This is what allows causal conclusions.</li>\n<li><strong>Replication:</strong> use enough subjects (and repeat) so results are reliable and not driven by a few unusual individuals.</li>\n</ol>\n\n<h4>Placebo, Blinding, Blocking, and Matched Pairs</h4>\n<ul>\n<li>The <strong>placebo effect</strong> is improvement from the belief that one received treatment. A <strong>placebo</strong> (inactive look-alike) controls for it.</li>\n<li><strong>Single-blind:</strong> subjects do not know their treatment. <strong>Double-blind:</strong> neither subjects nor evaluators know — strong protection against bias.</li>\n<li><strong>Blocking:</strong> group subjects by a variable expected to affect the response (for example, age), then randomize within each block. This removes that variable's influence from the comparison.</li>\n<li><strong>Matched pairs design:</strong> pair similar subjects (or use the same subject twice, e.g., left hand vs right hand) and randomly assign the two treatments within each pair.</li>\n</ul>\n\n<h4>Confounding</h4>\n<p>A <strong>confounding variable</strong> is related to both the explanatory and response variables and offers an alternative explanation for the results. Confounding is the main reason observational studies cannot prove causation — random assignment in experiments balances out confounding variables across treatment groups.</p>\n\n<h4>Exam Tips</h4>\n<ul>\n<li>Name the design flaw precisely: self-selected callers are <em>voluntary response</em>; people who were never reachable are <em>undercoverage</em>; selected people who refuse are <em>nonresponse</em>.</li>\n<li><strong>Random sampling</strong> and <strong>random assignment</strong> do different jobs — sampling lets you generalize, assignment lets you claim causation. The AP exam loves testing this distinction.</li>\n<li>For design questions, always mention a control group, random assignment, and blinding where appropriate.</li>\n</ul>\n"},{"id":"apstats-prob","name":"Probability & Random Variables","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"q":"In a survey, 68% of commuters arrive at work on time. If one commuter is randomly selected, what is the probability that the commuter does NOT arrive on time?","options":["0.32","0.68","0.46","1.68"],"answer":0,"explain":"The complement rule: P(not on time) = 1 - P(on time) = 1 - 0.68 = 0.32. Option b repeats the given probability, and probabilities can never exceed 1, ruling out d."},{"q":"Of 200 students, 120 are taking math, 90 are taking physics, and 60 are taking both. If one student is chosen at random, what is the probability the student takes math or physics (or both)?","options":["1.05","0.75","0.30","0.45"],"answer":1,"explain":"Use the general addition rule: P(math or physics) = P(math) + P(physics) - P(both) = (120 + 90 - 60)/200 = 150/200 = 0.75. Option a forgets to subtract the overlap; d is P(both), not P(either)."},{"q":"Events A and B are mutually exclusive, and each has a probability greater than 0. Which of the following must be true?","options":["P(A|B) = P(A)","P(A and B) = P(A) x P(B)","P(A and B) = 0","A and B are independent"],"answer":2,"explain":"Mutually exclusive means A and B cannot both occur, so P(A and B) = 0. That actually makes them dependent (knowing B happened tells you A did not), which rules out b and d; c is the multiplication rule for independent events."},{"q":"A cafe surveys 200 customers about coffee preference. The results: 75 adults like coffee and 45 adults dislike it; 30 teens like coffee and 50 teens dislike it. Given that a randomly selected customer likes coffee, what is the probability the customer is an adult?","options":["0.714","0.625","0.525","0.375"],"answer":0,"explain":"Condition on the 105 coffee-likers: P(adult | likes coffee) = 75/105 ≈ 0.714. Option b is P(likes coffee | adult) = 75/120, the reverse conditional; d ignores the condition entirely."},{"q":"A bag contains 3 red marbles and 2 blue marbles. Two marbles are drawn one at a time without replacement. What is the probability the first is red and the second is blue?","options":["0.60","0.24","0.50","0.30"],"answer":3,"explain":"Without replacement, the probabilities change: P(red then blue) = (3/5) x (2/4) = 6/20 = 0.30. Option b uses (2/5), which would only be correct if the first marble were replaced; a is just P(red first)."},{"q":"Which of the following sets of values is a valid probability distribution for a discrete random variable?","options":["0.25, 0.35, 0.48","0.20, 0.50, -0.05, 0.35","0.15, 0.25, 0.30, 0.30","0.10, 0.20, 0.40, 0.27"],"answer":2,"explain":"A valid discrete distribution needs every probability between 0 and 1 and a total of exactly 1. Option a sums to 1.08, b contains a negative probability, and d sums to 0.97; only c satisfies both requirements."},{"q":"A carnival game pays $0 with probability 0.5, $10 with probability 0.3, and $20 with probability 0.2. What is the expected (mean) payout per play?","options":["$6","$7","$10","$15"],"answer":1,"explain":"Expected value = sum of (value x probability) = 0(0.5) + 10(0.3) + 20(0.2) = 0 + 3 + 4 = $7. Option c ($10) is just the middle payout, not weighted by its probability."},{"q":"A random variable X has mean 50 and standard deviation 8. Define Y = 3X + 10. What are the mean and standard deviation of Y?","options":["Mean 160, SD 24","Mean 160, SD 34","Mean 60, SD 24","Mean 160, SD 8"],"answer":0,"explain":"For Y = aX + b: mean_Y = a(mean_X) + b = 3(50) + 10 = 160, and SD_Y = |a|(SD_X) = 3(8) = 24. Adding a constant shifts the mean but never changes the spread, ruling out b; a forgets to multiply the mean."},{"q":"Random variables X and Y are independent. X has mean 20 and standard deviation 4; Y has mean 30 and standard deviation 3. What are the mean and standard deviation of X + Y?","options":["Mean 50, SD 7","Mean 50, SD 25","Mean 50, SD 1","Mean 50, SD 5"],"answer":3,"explain":"For independent X and Y: mean(X+Y) = 20 + 30 = 50, and variances add: Var = 16 + 9 = 25, so SD = sqrt(25) = 5. Standard deviations do not add directly (that gives 7), and variances add for sums and differences alike."},{"q":"A basketball player makes 70% of free throws, with each attempt independent. In 5 attempts, what is the probability she makes exactly 4?","options":["0.240","0.072","0.360","0.560"],"answer":2,"explain":"P(X = 4) = C(5,4)(0.7)^4(0.3)^1 = 5(0.2401)(0.3) ≈ 0.360. Option a drops the C(5,4) = 5 ways to choose which attempt misses; b drops the (0.3) for the missed shot as well."}],"shortBank":[{"q":"A golfer makes a hole-in-one with probability 0.02 on any given round, independently of other rounds. (a) What is the expected number of rounds until her first hole-in-one? (b) What does this value mean in context? (2 marks for the calculation, 1 for the interpretation)","marks":3,"answer":"Mean = 1/p = 1/0.02 = 50 rounds. On average, the golfer waits about 50 rounds between holes-in-one."},{"q":"A factory produces light bulbs, and each bulb is defective with probability 0.08, independently. An inspector tests a random sample of 20 bulbs. Let X = the number of defective bulbs. (a) Verify that X satisfies the BINS conditions for a binomial distribution. (b) Find P(X = 2). (c) Find the mean and standard deviation of X.","marks":4,"answer":"(a) BINS: Binary outcomes (defective or not); Independent bulbs; fixed Number of trials n = 20; Same probability p = 0.08 each trial. (1 mark)\n(b) P(X = 2) = C(20,2)(0.08)^2(0.92)^18 ≈ 0.271. (1 mark)\n(c) Mean = np = 20(0.08) = 1.6 defective bulbs; SD = sqrt(np(1-p)) = sqrt(20(0.08)(0.92)) ≈ 1.21. (2 marks)"}],"notes":"<h3>Probability Rules</h3>\n<p>Every probability is a number between 0 and 1, and the probabilities of all possible outcomes in a sample space add up to 1. Three rules do most of the work:</p>\n<ul>\n<li><strong>Complement:</strong> P(not A) = 1 − P(A).</li>\n<li><strong>Addition (unions):</strong> P(A or B) = P(A) + P(B) − P(A and B). If A and B are <strong>mutually exclusive</strong> (they cannot both happen), the last term is 0, so the probabilities simply add.</li>\n<li><strong>Multiplication:</strong> P(A and B) = P(A) × P(B|A). If A and B are <strong>independent</strong> (one occurring does not change the other's probability), then P(B|A) = P(B), so P(A and B) = P(A) × P(B).</li>\n</ul>\n<p>A common trap: <strong>mutually exclusive is not the same as independent.</strong> If A and B are mutually exclusive and both have positive probability, they are actually <em>dependent</em> — knowing B happened tells you A did not.</p>\n<h3>Conditional Probability</h3>\n<p>P(A|B) means \"the probability of A <em>given that</em> B has occurred.\" The formula is P(A|B) = P(A and B) / P(B). In a two-way table, condition on the given row or column and divide the cell by that row/column total — not by the grand total. A tree diagram shows the same idea: multiply along branches for \"and\" (joint) probabilities, and add the relevant completed paths when you need a total probability.</p>\n<h3>Discrete Random Variables</h3>\n<p>A <strong>probability distribution</strong> lists each possible value of a discrete random variable with its probability. It is valid only if every probability is between 0 and 1 and they sum to exactly 1.</p>\n<p>The <strong>mean</strong> (expected value) is the long-run average: mu_X = sum of x × P(x) over all values. The <strong>standard deviation</strong> measures the typical spread around that mean: sigma_X = sqrt( sum of (x − mu_X)^2 × P(x) ).</p>\n<h4>Transforming a random variable</h4>\n<p>For Y = aX + b: mu_Y = a × mu_X + b, and sigma_Y = |a| × sigma_X. Adding a constant shifts the center but does not change the spread; multiplying stretches or shrinks both the center and the spread.</p>\n<h4>Combining random variables</h4>\n<p>For independent X and Y: mu of (X + Y) = mu_X + mu_Y, and <strong>variances add</strong>: sigma^2 of (X + Y) = sigma_X^2 + sigma_Y^2, so sigma of (X + Y) = sqrt(sigma_X^2 + sigma_Y^2). The same variance rule holds for X − Y. Standard deviations never add directly — always convert to variances first, add, then take the square root.</p>\n<h3>Binomial Distributions</h3>\n<p>X follows B(n, p) when the <strong>BINS</strong> conditions hold: <strong>B</strong>inary outcomes (success/failure), <strong>I</strong>ndependent trials, fixed <strong>N</strong>umber of trials n, <strong>S</strong>ame probability of success p on each trial.</p>\n<p>P(X = k) = C(n, k) × p^k × (1 − p)^(n−k), where C(n, k) counts the ways to arrange the k successes. The mean is mu_X = n × p and the standard deviation is sigma_X = sqrt(n × p × (1 − p)).</p>\n<h3>Geometric Distributions</h3>\n<p>The geometric distribution counts the number of trials until the <em>first</em> success, with the same success probability p each trial. Its mean is mu = 1/p — for example, with p = 0.02 the expected wait is 50 trials. Use binomial when the number of trials is fixed and you count successes; use geometric when you keep going until the first success.</p>\n"},{"id":"apstats-sampling","name":"Sampling Distributions","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"q":"Which of the following best describes the sampling distribution of a statistic?","options":["The distribution of individual values in the population","The distribution of values of a statistic, calculated from all possible samples of size n from the population","The distribution of values in one particular sample of size n","The distribution of the population parameter across different studies"],"answer":1,"explain":"A sampling distribution is built from a statistic (computed from samples), not from individual values, and it considers all possible samples of a fixed size n. Individual data values belong to the population or sample distributions; a parameter is a fixed number, not a distribution."},{"q":"To estimate the proportion of students who prefer the new cafeteria menu, a school tries two methods. Method A: survey a convenience sample of 200 students eating in the cafeteria. Method B: survey a random sample of 40 students from the whole school. Which statement correctly compares the two methods?","options":["Method A has less bias and less variability than Method B","Method B has less bias and less variability than Method A","Method A is likely biased but has less variability; Method B is unbiased but has more variability","Both methods are unbiased, but Method A has more variability because it is not random"],"answer":2,"explain":"Method A is a convenience sample, so it is likely biased (lunch-goers may differ from all students), though its large size keeps variability low. Method B is random, so it is unbiased, but its smaller sample size gives it more variability than Method A. Random sampling removes bias; only a larger n reduces variability."},{"q":"A factory claims that 60% of its parts pass quality inspection. An auditor takes a random sample of 400 parts and calculates p-hat, the sample proportion that pass. Which of the following describes the sampling distribution of p-hat?","options":["Approximately Normal with mean 0.6 and standard deviation 0.0245","Approximately Normal with mean 0.6 and standard deviation 0.0490","Skewed right with mean 0.6 and standard deviation 0.0245","Approximately Normal with mean 0.6 and standard deviation 0.245"],"answer":0,"explain":"The sampling distribution of p-hat is centered at the true proportion p = 0.6, with standard deviation sqrt(p(1 - p)/n) = sqrt(0.6(0.4)/400) = sqrt(0.0006) ≈ 0.0245. It is approximately Normal because np = 240 ≥ 10 and n(1 - p) = 160 ≥ 10. The other options use the wrong standard deviation or the wrong shape condition."},{"q":"The heights of a certain species of pine tree have a mean of 70 feet and a standard deviation of 15 feet. A random sample of 36 trees is taken. Which of the following describes the sampling distribution of the sample mean height x-bar?","options":["Approximately Normal with mean 70 ft and standard deviation 15 ft","Approximately Normal with mean 70 ft and standard deviation 0.42 ft","Skewed with mean 70 ft and standard deviation 2.5 ft","Approximately Normal with mean 70 ft and standard deviation 2.5 ft"],"answer":3,"explain":"The sampling distribution of x-bar is centered at the population mean mu = 70 ft, with standard deviation sigma/sqrt(n) = 15/sqrt(36) = 15/6 = 2.5 ft. With n = 36 the Central Limit Theorem makes it approximately Normal. Dividing sigma by n instead of sqrt(n), or leaving it at 15, are common errors."},{"q":"Household incomes in a town are strongly right-skewed. Repeated random samples of size n = 5 and size n = 100 are taken, and the sample mean income x-bar is recorded each time. Which statement about the sampling distributions of x-bar is correct?","options":["For n = 100, the sampling distribution has the same right-skewed shape as the population","For n = 100, the sampling distribution is approximately Normal; for n = 5 it is still noticeably skewed","For n = 5, the sampling distribution is exactly Normal by the Central Limit Theorem","For n = 100, the sampling distribution is centered at a larger mean than the population mean"],"answer":1,"explain":"The Central Limit Theorem says the sampling distribution of x-bar becomes approximately Normal as n grows, regardless of the population's shape. With n = 5 the sampling distribution still resembles the skewed population; with n = 100 it is approximately Normal, centered at the population mean with smaller spread than for n = 5."},{"q":"A population has standard deviation sigma = 12. A researcher first takes samples of size n = 25, then switches to samples of size n = 100. What happens to the standard deviation of the sampling distribution of x-bar?","options":["The standard deviation becomes 4 times smaller","The standard deviation becomes 2 times larger","The standard deviation becomes 2 times smaller (from 2.4 to 1.2)","The standard deviation stays the same; only the shape changes"],"answer":2,"explain":"The standard deviation of x-bar is sigma/sqrt(n). Quadrupling n multiplies sqrt(n) by 2, so the standard deviation is divided by 2: it goes from 12/5 = 2.4 to 12/10 = 1.2. Larger samples reduce variability (spread), but do not change the center."},{"q":"A researcher takes a random sample of 50 students from a school of 200 students to estimate the proportion who walk to school. What is the main statistical concern with this plan?","options":["The sample is more than 10% of the population, so the observations may not be independent and the standard error formula may not apply","The sample size is below 30, so the Central Limit Theorem does not apply","Random sampling introduces bias, so the sample proportion will be systematically off","The Large Counts condition fails because 50(0.5) < 10"],"answer":0,"explain":"The standard formulas for the spread of a sampling distribution assume the sampled individuals are independent, which holds when sampling without replacement only if the sample is no more than 10% of the population (10% condition). A sample of 50 from 200 is 25%, so the independence assumption fails and the usual standard error may be off."},{"q":"Suppose 30% of all voters in a district support a ballot proposal. In a random sample of 100 voters, what is the approximate probability that more than 35% of the sample support the proposal?","options":["0.5000","0.8624","0.0668","0.1376"],"answer":3,"explain":"Mean of p-hat = p = 0.30; SD = sqrt(0.3(0.7)/100) = sqrt(0.0021) ≈ 0.0458. Normality is justified since np = 30 ≥ 10 and n(1 - p) = 70 ≥ 10. z = (0.35 - 0.30)/0.0458 ≈ 1.09, so P(p-hat > 0.35) = P(Z > 1.09) ≈ 0.1376. Using 0.8624 confuses the tail direction."},{"q":"Which statement correctly distinguishes the population distribution, the sample distribution, and the sampling distribution?","options":["The population distribution and the sampling distribution both describe individual observations","The population distribution describes individuals in the population, the sample distribution describes individuals in one sample, and the sampling distribution describes a statistic across many samples","The sampling distribution describes one sample, while the sample distribution describes many samples","All three distributions have the same shape and spread"],"answer":1,"explain":"The population distribution shows individual values in the whole population; the sample distribution shows individual values in one sample; the sampling distribution shows values of a statistic across many repeated samples. The sampling distribution is the only one of the three made of statistics rather than individual observations."},{"q":"Scores on a standardized test are approximately normally distributed with mean 500 and standard deviation 100. For a random sample of 25 test-takers, what is the approximate probability that the sample mean score exceeds 530?","options":["0.9332","0.3821","0.0668","0.5000"],"answer":2,"explain":"The sampling distribution of x-bar has mean mu = 500 and standard deviation sigma/sqrt(n) = 100/5 = 20. Because scores are approximately Normal, so is x-bar. z = (530 - 500)/20 = 1.5, giving P(x-bar > 530) = P(Z > 1.5) ≈ 0.0668. Using sigma = 100 instead of the standard error 20 gives the wrong z-score and the distractor 0.3821's neighborhood."}],"shortBank":[{"q":"A city council claims that 45% of all residents support building a new bike lane. A reporter takes a random sample of 200 residents. (a) Describe the sampling distribution of p-hat: give its center, spread, and shape, justifying the shape (assume the city is large enough that the 10% condition is met). (b) Find the approximate probability that fewer than 40% of the sampled residents support the bike lane.","marks":4,"answer":"(a) Center: mean of p-hat = p = 0.45. Spread: standard deviation = sqrt(0.45(1 - 0.45)/200) = sqrt(0.2475/200) ≈ 0.0352. Shape: approximately Normal, because np = 200(0.45) = 90 ≥ 10 and n(1 - p) = 200(0.55) = 110 ≥ 10 (Large Counts condition), and the 10% condition is met since 200 is less than 10% of the city's population, so individual responses are approximately independent.\n(b) z = (0.40 - 0.45)/0.0352 ≈ -1.42. P(p-hat < 0.40) = P(Z < -1.42) ≈ 0.0776, about a 7.8% chance."},{"q":"Commute times for workers in a large city are strongly right-skewed, with a mean of 12 minutes and a standard deviation of 6 minutes. A random sample of 64 workers is taken. (a) Describe the sampling distribution of the sample mean x-bar. (b) Find the approximate probability that the sample mean commute time exceeds 13 minutes.","marks":3,"answer":"(a) The sampling distribution of x-bar is centered at the population mean, 12 minutes. Its standard deviation is sigma/sqrt(n) = 6/sqrt(64) = 0.75 minutes. By the Central Limit Theorem, because n = 64 is large, the sampling distribution is approximately Normal even though the population distribution is strongly right-skewed.\n(b) z = (13 - 12)/0.75 ≈ 1.33. P(x-bar > 13) = P(Z > 1.33) ≈ 0.0912, about a 9.1% chance."}],"notes":"<h3>What Is a Sampling Distribution?</h3>\n<p>A <strong>parameter</strong> describes a whole population (like the true proportion p or the true mean mu). A <strong>statistic</strong> describes a sample (like p-hat or x-bar). Because every random sample comes out a little different, a statistic <strong>varies from sample to sample</strong>. The <strong>sampling distribution</strong> of a statistic is the distribution of that statistic's values over <em>all possible</em> samples of size n from the population. It tells you what values of the statistic are likely and how much they bounce around.</p>\n<h3>Center, Shape, and Spread</h3>\n<p>Every sampling distribution is described with the same three features: <strong>center</strong> (where it is centered), <strong>shape</strong> (Normal or not), and <strong>spread</strong> (its standard deviation, often called the <strong>standard error</strong>).</p>\n<h4>The Sampling Distribution of p-hat</h4>\n<p>For a categorical variable with true population proportion p, based on a random sample of size n:</p>\n<ul>\n<li><strong>Center:</strong> mu_p-hat = p. The sampling distribution is centered at the true proportion, so p-hat is an unbiased estimator.</li>\n<li><strong>Spread:</strong> sigma_p-hat = sqrt(p(1-p)/n). Notice the n in the denominator: <strong>bigger samples give a smaller spread</strong>, so p-hat varies less from sample to sample.</li>\n<li><strong>Shape:</strong> approximately Normal when the <strong>Large Counts condition</strong> holds: np &gt;= 10 <em>and</em> n(1-p) &gt;= 10.</li>\n</ul>\n<h4>The Sampling Distribution of x-bar</h4>\n<p>For a quantitative variable with population mean mu and standard deviation sigma, based on a random sample of size n:</p>\n<ul>\n<li><strong>Center:</strong> mu_x-bar = mu. The sample mean is also unbiased.</li>\n<li><strong>Spread:</strong> sigma_x-bar = sigma/sqrt(n). Again, increasing n shrinks the spread: quadrupling the sample size cuts the standard deviation in half.</li>\n<li><strong>Shape:</strong> the <strong>Central Limit Theorem (CLT)</strong> says the sampling distribution of x-bar becomes approximately Normal as n gets large, <em>no matter what shape the population has</em>. It is also exactly Normal if the population itself is Normal. A common rule of thumb is that n &gt;= 30 is \"large enough,\" but the more skewed the population, the larger n needs to be.</li>\n</ul>\n<h3>Bias and Variability</h3>\n<p>An estimator has <strong>bias</strong> when its sampling distribution is centered away from the parameter it estimates — the values are systematically too high or too low. <strong>Variability</strong> is how spread out the sampling distribution is. A good estimator has <strong>low bias and low variability</strong>: centered on the truth and tightly clustered. Random sampling fixes bias; only a <strong>larger sample size</strong> reduces variability. Making n bigger never fixes a biased sampling method.</p>\n<h3>Conditions Checklist</h3>\n<p>Before using the Normal model for a sampling distribution, check all three:</p>\n<ul>\n<li><strong>Random:</strong> the data come from a random sample or randomized experiment, so the statistic is unbiased.</li>\n<li><strong>10% condition:</strong> when sampling <em>without replacement</em>, the sample size n must be no more than 10% of the population size. This keeps the observations approximately independent, which the standard error formulas assume.</li>\n<li><strong>Large Counts / Large Sample:</strong> for p-hat, need np &gt;= 10 and n(1-p) &gt;= 10; for x-bar, need a large n (CLT) or a Normal population.</li>\n</ul>\n<h3>Three Distributions: Don't Mix Them Up</h3>\n<table>\n<tr><th>Distribution</th><th>What it shows</th></tr>\n<tr><td>Population distribution</td><td>Individual values for the entire population; centered at the parameter</td></tr>\n<tr><td>Sample distribution</td><td>Individual values in <em>one</em> sample of size n; looks like a rough picture of the population</td></tr>\n<tr><td>Sampling distribution</td><td>Values of a <em>statistic</em> (p-hat or x-bar) across many repeated samples; centered at the parameter with spread sigma/sqrt(n) or sqrt(p(1-p)/n)</td></tr>\n</table>\n<p><strong>Key idea for the exam:</strong> always answer in three parts — center (the mean of the statistic), shape (Normal or not, with the condition that justifies it), and spread (the standard error). And remember that the standard error formulas describe the sampling distribution, never a single sample.</p>\n"},{"id":"apstats-prop","name":"Inference for Proportions","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"q":"In a random sample of 400 likely voters, 216 say they will vote for Candidate A. Which of the following is a 95% confidence interval for the true proportion of all likely voters who will vote for Candidate A?","options":["(0.491, 0.589)","(0.476, 0.604)","(0.500, 0.580)","(0.515, 0.565)"],"answer":0,"explain":"p-hat = 216/400 = 0.54. The standard error is sqrt(0.54(0.46)/400) ≈ 0.0249, and the margin of error is z* × SE = 1.96(0.0249) ≈ 0.049, giving (0.491, 0.589). Option B uses the 99% critical value (2.576), and D forgets z* entirely, using the standard error as the margin of error."},{"q":"At one school, 96 of a random sample of 150 students passed the fitness test. At another school, 110 of a random sample of 200 students passed. Which of the following is a 90% confidence interval for the difference in the true pass proportions (school 1 − school 2)?","options":["(−0.013, 0.193)","(−0.177, −0.003)","(0.003, 0.177)","(0.037, 0.143)"],"answer":2,"explain":"p1-hat − p2-hat = 0.64 − 0.55 = 0.09. The standard error is sqrt(0.64(0.36)/150 + 0.55(0.45)/200) ≈ 0.0527, and ME = 1.645(0.0527) ≈ 0.087, giving (0.003, 0.177). Option A mistakenly uses the 95% critical value, and B subtracts the proportions in the wrong order."},{"q":"A 95% confidence interval for the proportion of high school students who get at least 8 hours of sleep is (0.31, 0.39). Which of the following is a correct interpretation?","options":["There is a 95% probability that the true proportion is between 0.31 and 0.39.","If this sampling procedure were repeated many times, about 95% of the resulting intervals would capture the true population proportion.","About 95% of the students in the sample get at least 8 hours of sleep.","We are 95% confident that 95% of all high school students get at least 8 hours of sleep."],"answer":1,"explain":"The confidence level describes the long-run capture rate of the procedure, not the probability that this particular interval contains the parameter — the true proportion either is or is not inside it. Option C confuses the confidence level with a sample percentage."},{"q":"A researcher constructs a 90% confidence interval and a 99% confidence interval from the same sample data. Compared with the 90% interval, the 99% interval will have:","options":["a smaller margin of error and be narrower","the same margin of error and the same width","a larger margin of error and be wider","a larger margin of error but be narrower"],"answer":2,"explain":"Margin of error = z* × SE, and the critical value z* grows with the confidence level (1.645 for 90%, 2.576 for 99%). With the same data the standard error is unchanged, so higher confidence means a larger margin of error and a wider interval."},{"q":"A polling firm wants to estimate the proportion of adults who support a new policy within 3 percentage points (margin of error 0.03) at 95% confidence, and it has no prior estimate of the proportion. What sample size is required?","options":["752","1068","1067","1843"],"answer":1,"explain":"n = (z*/ME)² × p*(1 − p*) = (1.96/0.03)²(0.25) ≈ 1067.1. With no prior estimate use p* = 0.5 (the most conservative choice), and always round UP, so n = 1068. Option C forgets to round up; A and D use the wrong critical values (90% and 99%)."},{"q":"A company claims 70% of its customers are satisfied. In a random sample of 250 customers, 160 report being satisfied. The company tests H0: p = 0.70 versus Ha: p < 0.70 at α = 0.05. Which conclusion is correct?","options":["The p-value is about 0.038, which is less than 0.05, so reject H0; there is convincing evidence that less than 70% are satisfied.","The p-value is about 0.019, which is less than 0.05, so fail to reject H0.","The p-value is about 0.019, which is less than 0.05, so reject H0; there is convincing evidence that the true proportion satisfied is less than 0.70.","The p-value is about 0.019, so we accept H0 and conclude that exactly 70% are satisfied."],"answer":2,"explain":"Using p0 = 0.70, SE = sqrt(0.70(0.30)/250) ≈ 0.0290 and z = (0.64 − 0.70)/0.0290 ≈ −2.07. The one-sided p-value is about 0.019 < 0.05, so reject H0 with the required linkage. Option A doubles the p-value (two-sided), and we never “accept” H0 (D)."},{"q":"A health researcher believes that more than 40% of adults exercise at least three times per week. Which pair of hypotheses should she test?","options":["H0: p = 0.40 versus Ha: p > 0.40","H0: p-hat = 0.40 versus Ha: p-hat > 0.40","H0: p = 0.40 versus Ha: p ≠ 0.40","H0: p > 0.40 versus Ha: p = 0.40"],"answer":0,"explain":"Hypotheses are always statements about the population parameter p, never about the statistic p-hat (ruling out B). “More than 40%” calls for a one-sided alternative, Ha: p > 0.40."},{"q":"A significance test of H0: p = 0.5 produces a p-value of 0.03. Which statement is correct?","options":["The probability that H0 is true is 0.03.","The probability that Ha is true is 0.97.","About 3% of all possible samples would produce exactly this sample proportion.","Assuming H0 is true, the probability of getting a sample proportion at least as far from 0.5 as the one observed is 0.03."],"answer":3,"explain":"A p-value is a conditional probability computed assuming H0 is true — it is not the probability that H0 or Ha is true (ruling out A and B). It measures how surprising the data are under H0 by considering results at least as extreme, not exactly equal (ruling out C)."},{"q":"Which of the following is NOT a required condition for a one-sample z-interval for a population proportion?","options":["The data come from a random sample.","The population distribution is Normally distributed.","The sample size is no more than 10% of the population.","Both n(p-hat) ≥ 10 and n(1 − p-hat) ≥ 10."],"answer":1,"explain":"The Normality we rely on comes from the sampling distribution of p-hat, justified by the Large Counts condition — the population itself does not need to be Normal. The genuine conditions are Random (A), 10% (C), and Large Counts (D)."},{"q":"A significance test uses H0: p = 0.30 versus Ha: p > 0.30 with α = 0.05. Which statement is correct?","options":["A Type II error is failing to reject H0 when the true proportion is actually greater than 0.30; the power of the test would increase with a larger sample size.","A Type II error is rejecting H0 when the true proportion equals 0.30; the power of the test increases when α is decreased.","A Type II error is failing to reject H0 when the true proportion equals 0.30; the power of the test increases with a larger sample size.","A Type II error is rejecting H0 when the true proportion exceeds 0.30; the power of the test increases with a smaller sample size."],"answer":0,"explain":"A Type II error means failing to reject a false H0 — here, missing a real increase above 0.30. (Rejecting a true H0 is a Type I error.) Power = 1 − P(Type II error) rises with a larger sample size, a larger α, or a larger true effect."}],"shortBank":[{"q":"In a random sample of 300 city residents, 132 support building a new public park. In an independent random sample of 250 suburban residents, 90 support it. Do the data provide convincing evidence, at α = 0.05, that the true proportions of supporters differ between city and suburban residents?","marks":3,"answer":"Hypotheses: H0: p1 − p2 = 0 versus Ha: p1 − p2 ≠ 0, where p1 and p2 are the true proportions of supporters among city and suburban residents. Conditions: two independent random samples; the 10% condition is satisfied (both samples are far less than 10% of their populations); Large Counts holds since 132, 168, 90, and 160 are all at least 10. The pooled proportion is p-hat = (132 + 90)/(300 + 250) = 222/550 ≈ 0.404. The test statistic is z = (0.44 − 0.36)/sqrt(0.404(0.596)(1/300 + 1/250)) ≈ 0.08/0.0420 ≈ 1.90, giving a two-sided p-value of about 0.057. Because 0.057 > 0.05, we fail to reject H0. There is not convincing evidence that the true proportions of park supporters differ between city and suburban residents."},{"q":"A quality inspector examines a random sample of 500 light bulbs and finds 18 defective. (a) Construct and interpret a 95% confidence interval for the true proportion of defective bulbs. (b) The company wants to estimate the proportion within 1 percentage point (margin of error at most 0.01) at 95% confidence. Using this sample as a pilot estimate, what sample size is required?","marks":4,"answer":"(a) p-hat = 18/500 = 0.036. Conditions: random sample; Large Counts holds (18 ≥ 10 and 482 ≥ 10); 500 bulbs are less than 10% of production. SE = sqrt(0.036(0.964)/500) ≈ 0.00833, so ME = 1.96(0.00833) ≈ 0.0163 and the interval is 0.036 ± 0.0163 = (0.020, 0.052). Interpretation: we are 95% confident that the true proportion of defective bulbs is between 0.020 and 0.052. (b) Using p* = 0.036 from the pilot study, n = p*(1 − p*)(z*/ME)² = 0.036(0.964)(1.96/0.01)² ≈ 1333.2. Always round up, so 1334 bulbs are required."}],"notes":"<h3>The Sampling Distribution of p-hat</h3>\n<p>When you take a random sample of size n from a population with true proportion p, the sample proportion p-hat varies from sample to sample. If the <strong>Large Counts condition</strong> holds (np ≥ 10 and n(1 − p) ≥ 10), the sampling distribution of p-hat is approximately Normal with mean p and standard deviation sqrt(p(1 − p)/n). This is what justifies every z-procedure below — the Normality comes from the <em>sampling distribution</em>, never from the population itself.</p>\n<h3>One-Sample Confidence Interval for p</h3>\n<p>A C% confidence interval for the true proportion is</p>\n<p><code>p-hat ± z* · sqrt(p-hat(1 − p-hat)/n)</code></p>\n<p>Common critical values: z* = 1.645 for 90%, 1.96 for 95%, 2.576 for 99%. The <strong>margin of error</strong> is the z* · SE part. Check three conditions before calculating: <strong>Random</strong> (random sample), <strong>10%</strong> (n is at most 10% of the population, so observations are effectively independent), and <strong>Large Counts</strong> (n(p-hat) ≥ 10 and n(1 − p-hat) ≥ 10).</p>\n<h4>Interpreting the interval vs. the confidence level</h4>\n<p>Interpret the <strong>interval</strong> in context: \"We are C% confident that the true proportion of [context] is between [lower] and [upper].\" Interpret the <strong>confidence level</strong> as a long-run capture rate: \"If we repeated this sampling process many times, about C% of the intervals constructed would capture the true population proportion.\" The true proportion is fixed — it is either in your interval or it isn't — so never say there is a C% probability the parameter lies in this specific interval.</p>\n<h3>Choosing a Sample Size</h3>\n<p>To get margin of error ME at confidence level C, solve ME = z* · SE for n:</p>\n<p><code>n = (z*/ME)<sup>2</sup> · p*(1 − p*)</code></p>\n<p>Use a prior estimate for p* if you have one; otherwise use p* = 0.5, which gives the largest (safest) sample size. <strong>Always round n up</strong> — rounding down would make the margin of error slightly too big.</p>\n<h3>One-Sample Significance Test for p</h3>\n<p>State hypotheses about the <strong>parameter</strong>, never the statistic: H0: p = p0 versus Ha: p &lt; p0, p &gt; p0, or p ≠ p0. The test statistic is</p>\n<p><code>z = (p-hat − p0) / sqrt(p0(1 − p0)/n)</code></p>\n<p>Note the standard error uses p0 (the claimed value), not p-hat. The <strong>p-value</strong> is the probability, assuming H0 is true, of getting a sample result at least as extreme as the one observed, in the direction of Ha. If p-value &lt; α, reject H0; otherwise fail to reject H0. Always link the decision to the p-value and α, then conclude in context (\"there is convincing evidence that...\"). Check the same three conditions, using p0 for Large Counts: np0 ≥ 10 and n(1 − p0) ≥ 10.</p>\n<h3>Comparing Two Proportions</h3>\n<p>For the difference p1 − p2, the confidence interval is</p>\n<p><code>(p1-hat − p2-hat) ± z* · sqrt(p1-hat(1 − p1-hat)/n1 + p2-hat(1 − p2-hat)/n2)</code></p>\n<p>Conditions: two <strong>independent</strong> random samples, the 10% condition for each, and Large Counts in <em>both</em> samples. For a <strong>test</strong> of H0: p1 − p2 = 0, pool the data because H0 claims one common proportion: p-hat = (x1 + x2)/(n1 + n2), and the test statistic is</p>\n<p><code>z = ((p1-hat − p2-hat) − 0) / sqrt(p-hat(1 − p-hat)(1/n1 + 1/n2))</code></p>\n<h3>Type I and Type II Errors, and Power</h3>\n<ul>\n<li><strong>Type I error:</strong> rejecting H0 when H0 is actually true. Its probability is α, the significance level you chose.</li>\n<li><strong>Type II error:</strong> failing to reject H0 when Ha is actually true (missing a real effect).</li>\n<li><strong>Power</strong> = 1 − P(Type II error) = the probability of correctly rejecting a false H0.</li>\n</ul>\n<p>Power increases with a larger sample size, a larger significance level α, or a larger true difference from H0. In context, always describe errors in words: a Type I error here means concluding the proportion changed when it really didn't; a Type II error means missing a real change.</p>\n"},{"id":"apstats-means","name":"Inference for Means","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"q":"A researcher wants a 95% confidence interval for the mean battery life of a new phone model. She tests a random sample of 40 phones and finds x-bar = 18.2 hours and s = 2.6 hours. The population standard deviation σ is unknown. Which critical value should she use?","options":["z* = 1.645","t* with 40 degrees of freedom","t* with 39 degrees of freedom","z* = 1.96"],"answer":2,"explain":"The population standard deviation σ is unknown, so the sampling distribution uses the t-distribution with df = n − 1 = 39. The z critical value is only valid when σ is known."},{"q":"A random sample of 25 students has a mean weekly study time of x-bar = 12.4 hours with s = 3.1 hours. Which is the 95% confidence interval for the population mean weekly study time?","options":["(11.12, 13.68)","(11.18, 13.62)","(6.00, 18.80)","(11.34, 13.46)"],"answer":0,"explain":"Correct: SE = s/sqrt(n) = 3.1/5 = 0.62, t*(df = 24) = 2.064, so the interval is 12.4 ± 2.064(0.62) = (11.12, 13.68). Using z* = 1.96 gives (11.18, 13.62); forgetting the square root of n widens it to (6.00, 18.80); and t* = 1.711 is the 90% critical value, not 95%."},{"q":"A track coach records the 400 m sprint times of 15 athletes before and after a 6-week training program. Which procedure should be used to test whether the program reduced the mean sprint time?","options":["A two-sample t-test for μ1 − μ2","A paired t-test on the before-minus-after differences","A one-sample z-test for μ","A two-sample t-interval for μ1 − μ2"],"answer":1,"explain":"The same 15 athletes are measured twice, so the data are matched pairs. Analyze the before-minus-after differences with a paired t-test. A two-sample t-test wrongly assumes the two groups are independent."},{"q":"A school compares mean exam scores for students taught with method A (n = 30) versus method B (n = 34). The two classes are independent. Which procedure gives a 95% confidence interval for the difference in population mean scores?","options":["A paired t-interval for the mean difference","A one-sample t-interval on the combined scores","A one-sample z-interval","A two-sample t-interval for μ1 − μ2"],"answer":3,"explain":"The two classes are independent groups, so the parameter is the difference of population means μ1 − μ2 and the procedure is the two-sample t-interval. A paired interval is only for matched pairs, and combining the data into one sample destroys the group comparison."},{"q":"A random sample of n = 12 houses has a strongly right-skewed distribution of sale prices with one extreme outlier. Which statement about inference for the mean price is correct?","options":["t procedures are fine because the sample was randomly selected","t procedures should not be used, because the normality condition fails with a small, strongly skewed sample","Use a z procedure instead, since z does not require normality","Raise the significance level to α = 0.10 to fix the problem"],"answer":1,"explain":"The random condition is met, but the normality condition fails: with only n = 12, a strongly skewed distribution with an outlier makes the t procedures unreliable. A z procedure has the same normality requirement, so it is not a fix."},{"q":"A fuel additive claims a mean efficiency above 30 mpg. In a random sample of 20 cars, x-bar = 31.2 mpg and s = 2.8 mpg. For H0: μ = 30 versus Ha: μ > 30, the test statistic is t = 1.917 with p-value ≈ 0.035. At α = 0.05, what is the correct conclusion?","options":["Fail to reject H0; there is not convincing evidence the mean exceeds 30 mpg","Reject H0; there is convincing evidence the mean is less than 30 mpg","Reject H0; there is convincing evidence the mean exceeds 30 mpg","The test is inconclusive because the p-value is greater than α"],"answer":2,"explain":"Correct: t = (31.2 − 30)/(2.8/sqrt(20)) = 1.917 with df = 19 gives p-value ≈ 0.035. Since 0.035 < 0.05, reject H0; the data give convincing evidence that the mean exceeds 30 mpg. A p-value below α is evidence against H0, not for it, and the alternative was one-sided upward."},{"q":"A 95% confidence interval for the mean nightly sleep of students at a school is (7.8, 8.6) hours. Which interpretation is correct?","options":["We are 95% confident that the interval from 7.8 to 8.6 hours captures the true mean nightly sleep of all students at the school","95% of the students at the school sleep between 7.8 and 8.6 hours per night","There is a 95% probability that the true mean lies between 7.8 and 8.6 hours","95% of all possible sample means fall between 7.8 and 8.6 hours"],"answer":0,"explain":"Correct: a confidence interval estimates the population parameter, so we are 95% confident the interval captures the true mean nightly sleep of all students at the school. It does not describe 95% of individual students, and the true mean is fixed — it either is or is not in this particular interval."},{"q":"Which sample is MOST appropriate for t procedures for a population mean?","options":["A sample of n = 10 that is strongly skewed with an outlier","A sample of n = 15 with a clearly bimodal distribution","A sample of n = 18 that is moderately skewed with no outliers","A sample of n = 55 that is slightly skewed with no strong outliers"],"answer":3,"explain":"t procedures are robust: with a large sample (n = 55), mild skewness without strong outliers is fine. They are not trustworthy with small samples that are strongly skewed or contain outliers (options with n = 10 or n = 15)."},{"q":"For a two-sample t procedure with independent samples of sizes n1 = 15 and n2 = 20, what are the conservative (by-hand) degrees of freedom?","options":["33","14","19","34"],"answer":1,"explain":"Without technology, use the conservative degrees of freedom: the smaller of n1 − 1 and n2 − 1, which is min(14, 19) = 14. Technology would give a non-integer df between 14 and 33, but 14 is the safe by-hand choice."},{"q":"Which statement about choosing between z and t procedures for means is true?","options":["Use a z procedure whenever the sample size is at least 30","t and z procedures always give identical results for small samples","The t procedure is the default because the population standard deviation σ is rarely known; z requires σ to be known","t procedures require the population distribution to be exactly Normal no matter how large the sample is"],"answer":2,"explain":"Correct: the z procedures require the population standard deviation σ to be known, which is rare in practice, so t is the default. Sample size alone does not justify z, and t procedures do not demand a perfectly normal population when n is large."}],"shortBank":[{"q":"A bottled-water company claims its bottles contain a mean of 500 mL. A quality inspector randomly selects 30 bottles and finds a mean fill of x-bar = 497.5 mL with s = 4.2 mL. Test at α = 0.05 whether the true mean fill is less than 500 mL. State hypotheses, check conditions, compute the test statistic and p-value, and conclude in context.","marks":4,"answer":"State: H0: μ = 500 mL versus Ha: μ < 500 mL, where μ is the true mean fill of all bottles. Plan: one-sample t-test for μ (σ unknown). Conditions: the 30 bottles were randomly selected; 30 bottles are less than 10% of all bottles produced; with n = 30 the sampling distribution is approximately Normal (large-sample robustness). Do: t = (497.5 − 500)/(4.2/sqrt(30)) = −2.5/0.767 ≈ −3.26 with df = 29, giving p-value ≈ 0.0014. Conclude: because 0.0014 < 0.05, reject H0. There is convincing evidence that the true mean fill is less than 500 mL."},{"q":"Two independent classes try different review methods. Method A: n = 28, x-bar = 78.5, s = 6.4. Method B: n = 32, x-bar = 74.9, s = 7.1. Construct and interpret a 90% confidence interval for the difference in population mean exam scores (μA − μB). Check conditions and show your work.","marks":4,"answer":"Plan: two-sample t-interval for μA − μB (σ unknown, independent groups). Conditions: both classes are independent random samples; each sample is less than 10% of all students who could take each method; both sample sizes are near or above 30, so the sampling distributions are approximately Normal. Do: difference = 78.5 − 74.9 = 3.6 points; SE = sqrt(6.4²/28 + 7.1²/32) ≈ 1.743; with df ≈ 57.9, t* ≈ 1.672 for 90% confidence; margin = 1.672(1.743) ≈ 2.91. The interval is 3.6 ± 2.91 = (0.69, 6.51) points. Conclude: we are 90% confident the interval from 0.69 to 6.51 points captures the true difference in mean exam scores (method A minus method B). Because the entire interval is positive (it does not contain 0), the data give evidence that method A produces a higher mean score than method B."}],"notes":"<h3>When to Use t Instead of z</h3>\n<p>In practice, the population standard deviation <strong>σ is almost never known</strong>, so <strong>t procedures are the default</strong> for inference about means. Use a z procedure only when σ is actually known (rare on the AP exam). Because we estimate σ with the sample standard deviation s, the sampling distribution has extra variability, and the t-distribution accounts for it with heavier tails. As the sample size grows, t looks more and more like z.</p>\n<h3>One-Sample t Procedures</h3>\n<p>For a single sample estimating or testing a population mean μ:</p>\n<ul>\n<li><strong>Confidence interval:</strong> x-bar ± t* (s / sqrt(n)), with df = n − 1</li>\n<li><strong>Test statistic:</strong> t = (x-bar − μ0) / (s / sqrt(n)), with df = n − 1</li>\n</ul>\n<p>Example: n = 40, x-bar = 68.2, s = 9.5. The 95% interval is 68.2 ± t*(9.5 / sqrt(40)) = 68.2 ± 2.02(1.50), or about <strong>(65.2, 71.2)</strong>. We are 95% confident this interval captures the true population mean.</p>\n<h3>Paired t Procedures (Matched Pairs)</h3>\n<p>When each subject is measured <strong>twice</strong> (before/after, two treatments on the same person, twins), do <strong>not</strong> use two-sample procedures. Instead, compute the <strong>differences</strong> for each pair and run a <strong>one-sample t procedure on the differences</strong>, testing whether the mean difference is zero. Pairing removes person-to-person variability and gives a more powerful test. Ask: are the two samples linked? If yes, pair them.</p>\n<h3>Two-Sample t Procedures</h3>\n<p>For comparing the means of <strong>two independent groups</strong>, the parameter is μ1 − μ2:</p>\n<ul>\n<li><strong>Confidence interval:</strong> (x-bar1 − x-bar2) ± t* × sqrt(s1²/n1 + s2²/n2)</li>\n<li><strong>Test statistic:</strong> t = ((x-bar1 − x-bar2) − 0) / sqrt(s1²/n1 + s2²/n2)</li>\n</ul>\n<p>Degrees of freedom come from a messy formula, so <strong>use technology</strong> for the df (it will not be a whole number). By hand, use the <strong>conservative</strong> df = the smaller of n1 − 1 and n2 − 1.</p>\n<h3>Conditions — Check Every Time</h3>\n<ul>\n<li><strong>Random:</strong> the data come from a random sample or randomized experiment, so results generalize.</li>\n<li><strong>10%:</strong> the sample size is no more than 10% of the population (needed when sampling without replacement).</li>\n<li><strong>Approximately Normal:</strong> the population is Normal, OR n ≥ 30 (roughly), OR the sample shows <strong>no strong skew and no outliers</strong>. This is the condition students forget most.</li>\n</ul>\n<h3>How Robust Are t Procedures?</h3>\n<p>t procedures are <strong>robust</strong>: they still work well when the population is not perfectly Normal, especially with larger samples. Mild skewness is fine when n is large. They are <strong>not</strong> safe with small samples that are strongly skewed or contain outliers — in that case, do not do the inference (or collect more data). Always look at a graph (dotplot, boxplot, or histogram) of quantitative data before proceeding.</p>\n<h3>Interpreting Results in Context</h3>\n<p>A confidence interval means: <strong>we are C% confident that the interval captures the true population mean</strong> (or true difference of means). It does <strong>not</strong> mean C% of the data lie in the interval, and it is not a probability about this one fixed interval. For a test, link the p-value to α: if <strong>p-value &lt; α, reject H0</strong> — the data give convincing evidence for the alternative <strong>in context</strong> (always finish with what the result says about the real-world claim, not just \"reject H0\").</p>\n<h4>Common Traps</h4>\n<ul>\n<li>Using z* (1.96) instead of t* when σ is unknown — on the exam this loses credit.</li>\n<li>Running a two-sample t-test on paired data — always analyze the differences instead.</li>\n<li>Forgetting units and context in conclusions (\"the mean\" of <em>what</em>?).</li>\n<li>Writing \"accept H0\" — we only ever <strong>fail to reject</strong> it.</li>\n</ul>"},{"id":"apstats-chisq","name":"Chi-Square Inference","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"q":"A student rolls a six-sided die 120 times and records how often each face appears. For a chi-square goodness-of-fit test of H0: the die is fair, the test statistic is 2.70 with df = 5, giving a p-value of about 0.75. At α = 0.05, which conclusion is correct?","options":["Reject H0; there is convincing evidence the die is unfair.","Fail to reject H0; there is not convincing evidence the die is unfair.","Reject H0; the die is definitely fair.","Fail to reject H0; there is convincing evidence the die is fair."],"answer":1,"explain":"The p-value (0.75) exceeds α (0.05), so we fail to reject H0. That means the data do not give convincing evidence against fairness — but it never proves the die is fair, and rejecting H0 would require a small p-value."},{"q":"In a survey, 100 boys and 100 girls (200 students total) are asked whether they support a later school start time. Altogether 125 students say yes. Under the null hypothesis of no association between gender and support, what is the expected number of boys who say yes?","options":["55.0","60.0","62.5","68.75"],"answer":2,"explain":"Expected count = (row total × column total) / table total = (100 × 125) / 200 = 62.5. The value 55 is the observed count, not the expected count."},{"q":"Random samples of 100 students are taken from each of grades 9, 10, and 11, and each student names a preferred lunch: pizza, salad, or sandwich. Which test should be used to investigate whether the distribution of lunch preferences differs by grade?","options":["Chi-square test for goodness of fit","Two-sample t-test for a difference in means","Chi-square test for independence","Chi-square test for homogeneity"],"answer":3,"explain":"Separate random samples from three populations are being compared on one categorical variable's distribution — that is the homogeneity setup. Goodness of fit uses one sample against a claimed distribution, and independence needs a single sample classified on two variables."},{"q":"A chi-square test is performed on a 4 × 3 two-way table. What are the degrees of freedom for the test?","options":["12","7","6","11"],"answer":2,"explain":"For a two-way table, df = (rows − 1)(columns − 1) = (4 − 1)(3 − 1) = 3 × 2 = 6. The product 12 ignores the subtraction, and 11 is the goodness-of-fit style formula applied wrongly."},{"q":"A researcher wants to run a chi-square goodness-of-fit test with 5 categories. The expected counts are 12, 8, 4, 6, and 10. Which statement is true?","options":["The large-counts condition is violated because one expected count is less than 5.","All conditions are met, so the test may proceed.","The random condition is violated because some counts are small.","The 10% condition is violated because the total sample size is only 40."],"answer":0,"explain":"The large-counts condition requires every expected count to be at least 5, and one category has an expected count of 4. Whether the sample was random or the 10% rule holds cannot be judged from counts alone."},{"q":"Why is a chi-square test always performed as an upper-tail (right-tail) test?","options":["Because the chi-square distribution is symmetric about its mean","Because the statistic sums squared differences, so values near 0 support H0 and only large values count against H0","Because the p-value must always be less than 0.05","Because the degrees of freedom are always positive"],"answer":1,"explain":"Squaring erases direction: χ² = 0 means observed matches expected perfectly (null looks fine), and bigger mismatches give bigger statistics. So only the right tail is evidence against H0. The chi-square distribution is actually skewed right, not symmetric."},{"q":"For the gender × later-start-time survey, a chi-square test of independence gives χ² = 4.80 with df = 1 and a p-value of about 0.029. At α = 0.05, which conclusion in context is correct?","options":["There is not convincing evidence of an association; gender and support appear independent.","There is convincing evidence that gender causes a change in support for a later start.","The probability that gender and support are independent is 0.029.","There is convincing evidence of an association between gender and support for a later start time."],"answer":3,"explain":"The p-value (0.029) is less than α (0.05), so reject H0 of independence: the data support an association. But this is observational data, so causation cannot be claimed, and a p-value is never the probability that H0 is true."},{"q":"A researcher takes one random sample of 300 adults and classifies each person by employment status (employed or unemployed) and by whether they have health insurance. Which test addresses whether the two variables are related?","options":["Chi-square test for homogeneity","Chi-square test for independence","Chi-square test for goodness of fit","One-sample t-test for a mean"],"answer":1,"explain":"One sample classified two ways on categorical variables is the independence setup. Homogeneity would require separate samples from two or more populations, and goodness of fit applies to a single categorical variable against a claimed distribution."},{"q":"A chi-square goodness-of-fit test yields a p-value of 0.003. Which is the correct interpretation?","options":["If H0 were true, the probability of getting a test statistic at least as extreme as the one observed is 0.003.","There is a 0.3% chance the null hypothesis is true.","There is a 99.7% chance the alternative hypothesis is true.","The probability of making a Type I error on this test is 0.003."],"answer":0,"explain":"A p-value is a conditional probability computed assuming H0 is true — it is not the probability that H0 (or Ha) is true. The Type I error probability is the significance level α, chosen before the test."},{"q":"A seed company claims its packets contain flower colors in the ratio 1 : 2 : 3 (red : white : blue). A gardener plants 120 seeds to test the claim. Under H0, what are the expected counts for red, white, and blue?","options":["40, 40, 40","30, 30, 60","20, 40, 60","1, 2, 3"],"answer":2,"explain":"The ratio has 1 + 2 + 3 = 6 parts, so expected counts are 120 × 1/6 = 20, 120 × 2/6 = 40, and 120 × 3/6 = 60. This test would have df = 3 − 1 = 2."}],"shortBank":[{"q":"A city claims its commuters' travel modes follow this distribution: 60% drive, 25% take public transit, 15% bike. In a random sample of 200 commuters, the observed counts are: drive 110, transit 60, bike 30. (a) Compute the expected counts under the city's claim. (b) The chi-square statistic is 2.83 with df = 2. At α = 0.05, state your conclusion in context.","marks":3,"answer":"(a) Expected counts: drive = 200 × 0.60 = 120, transit = 200 × 0.25 = 50, bike = 200 × 0.15 = 30. (b) χ² = 2.83 with df = 2 gives a p-value of about 0.24, which is greater than 0.05, so fail to reject H0. The sample does not provide convincing evidence that the city's claimed commute-mode distribution is wrong."},{"q":"A school club takes a random sample of 150 students (75 in grades 9–10 and 75 in grades 11–12) and asks whether each prefers morning or afternoon meetings. Results: grades 9–10 — 35 morning, 40 afternoon; grades 11–12 — 45 morning, 30 afternoon. (a) State the hypotheses for a chi-square test of independence, in context. (b) Check the large-counts condition. (c) Compute the expected count for grades 9–10 students who prefer morning. The test statistic is χ² = 2.68 with df = 1 (p-value ≈ 0.10). (d) State your conclusion in context at α = 0.05.","marks":4,"answer":"(a) H0: grade level and meeting-time preference are independent (there is no association). Ha: there is an association between grade level and meeting-time preference. (b) Expected counts are (75 × 80)/150 = 40, (75 × 70)/150 = 35, 40, 35 — all are at least 5, so the condition is met. (c) Expected = (75 × 80)/150 = 40. (d) The p-value (≈ 0.10) exceeds 0.05, so fail to reject H0. There is not convincing evidence of an association between grade level and meeting-time preference."}],"notes":"<h3>What Chi-Square Tests Do</h3>\n<p>All three chi-square tests compare <strong>observed</strong> counts in categories to the counts you would <strong>expect</strong> if the null hypothesis were true. Every test uses the same statistic:</p>\n<p><code>chi-sq = sum (observed - expected)^2 / expected</code></p>\n<p>Each term measures how far one category is from its expected count, scaled by the size of that count. A statistic near 0 means the data match the null hypothesis well; a large statistic means they do not.</p>\n<h3>The Three Tests — Pick the Right One</h3>\n<table>\n<tr><th>Test</th><th>Question it answers</th><th>Data setup</th></tr>\n<tr><td>Goodness of fit</td><td>Does one categorical variable follow a claimed distribution?</td><td>One sample, one variable</td></tr>\n<tr><td>Homogeneity</td><td>Do several populations share the same distribution?</td><td>Separate random samples from each population</td></tr>\n<tr><td>Independence</td><td>Are two categorical variables associated?</td><td>One sample, classified two ways</td></tr>\n</table>\n<p>Goodness of fit compares one sample to a <em>claimed</em> distribution. Homogeneity compares the distributions across <em>several populations</em>. Independence asks whether two variables are related <em>within one sample</em>.</p>\n<h3>Hypotheses</h3>\n<ul>\n<li><strong>Goodness of fit:</strong> H0: the variable follows the claimed distribution. Ha: it does not.</li>\n<li><strong>Homogeneity:</strong> H0: the distribution is the same across all populations. Ha: at least one population's distribution differs.</li>\n<li><strong>Independence:</strong> H0: the two variables are independent (no association). Ha: the two variables are associated.</li>\n</ul>\n<h3>Expected Counts</h3>\n<p>Goodness of fit: expected = (sample size) x (claimed proportion for the category). Two-way tables: <code>expected = row total x column total / table total</code>.</p>\n<h3>Degrees of Freedom</h3>\n<p>Goodness of fit: df = (number of categories) - 1. Two-way tables: <code>df = (rows - 1) x (columns - 1)</code>.</p>\n<h3>Conditions (Check Every Time)</h3>\n<ul>\n<li><strong>Random:</strong> the data come from random sampling (or random assignment) from the population(s) of interest.</li>\n<li><strong>10%:</strong> when sampling without replacement, the sample size is at most 10% of the population.</li>\n<li><strong>Large counts:</strong> <em>every</em> expected count is at least 5. (It is the expected counts that matter, not the observed counts.)</li>\n</ul>\n<h3>Why the Right Tail Only</h3>\n<p>Squaring erases direction: the statistic can only measure total mismatch. A value near 0 means observed is close to expected (the null looks fine), and only large values argue against H0. So the p-value is always the area to the <em>right</em> of the statistic. Note the chi-square distribution is skewed right, not symmetric.</p>\n<h3>Association Is Not Causation</h3>\n<p>Rejecting H0 in a test of independence means the variables are <strong>associated</strong>, not that one causes the other — observational data can always hide confounding variables. And \"fail to reject H0\" never proves the null; it only means the evidence was not convincing.</p>\n<h3>Worked Example</h3>\n<p>Random samples of 100 students from each of grades 9, 10, and 11 name a preferred lunch (pizza, salad, sandwich). Observed counts:</p>\n<table>\n<tr><th></th><th>Pizza</th><th>Salad</th><th>Sandwich</th></tr>\n<tr><td>Grade 9</td><td>45</td><td>25</td><td>30</td></tr>\n<tr><td>Grade 10</td><td>40</td><td>30</td><td>30</td></tr>\n<tr><td>Grade 11</td><td>35</td><td>35</td><td>30</td></tr>\n</table>\n<p>This is a test of homogeneity. Each row total is 100 and the column totals are 120, 90, 90 (table total 300), so each row's expected counts are 40, 30, 30 — all at least 5, so the large-counts condition holds. The statistic is chi-sq = 2.92 with df = (3 - 1) x (3 - 1) = 4, giving a p-value of about 0.57. Since 0.57 &gt; 0.05, we fail to reject H0: the data do not provide convincing evidence that the distribution of lunch preferences differs by grade.</p>\n"},{"id":"apstats-slopes","name":"Inference for Slopes","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"q":"A botanist wants to test whether there is a linear relationship between the amount of fertilizer applied (x, in grams) and tomato plant height after 6 weeks (y, in cm). Let beta represent the slope of the population regression line. Which are the correct hypotheses?","options":["H0: b = 0; Ha: b != 0","H0: beta = 0; Ha: beta > 0","H0: beta = 0; Ha: beta != 0","H0: beta = 19.528; Ha: beta != 19.528"],"answer":2,"explain":"Hypotheses are about the population parameter beta, not the sample statistic b. A test for \"a linear relationship\" (in either direction) is two-sided; a one-sided alternative is only used when a specific direction is claimed before seeing the data. Option d confuses the slope with the intercept estimate."},{"q":"The computer output is shown below.\n\nPredictor   Coef    SE Coef    T      P\nConstant    19.528   1.521   12.83  0.000\nFertilizer   0.916   0.0509   18.0  0.000\n\nS = 2.847, R-Sq = 93.6%\n\nUsing this output, what is the value of the test statistic for a test of H0: beta = 0 versus Ha: beta != 0?","options":["18.0","12.83","0.0509","2.847"],"answer":0,"explain":"The t statistic in the slope (Fertilizer) row is 18.0, computed as t = (0.916 - 0)/0.0509. The value 12.83 tests the intercept, 0.0509 is the standard error of the slope, and 2.847 is S, the standard deviation of the residuals."},{"q":"Before doing inference for the slope, the botanist checks the LINER conditions. Which of the following is NOT one of the required conditions?","options":["The relationship between fertilizer and height is linear.","The 24 plants were randomly selected, so the observations are independent.","The standard deviation of the residuals is constant across fertilizer amounts.","The amounts of fertilizer applied are normally distributed."],"answer":3,"explain":"LINER stands for Linear, Independent, Normal residuals, Equal SD, Random. Normality is required for the residuals (checked with a normal probability plot of the residuals), never for the explanatory variable itself."},{"q":"The standard error of the slope is 0.0509. Which is the best interpretation of this value?","options":["The typical distance of a plant's height from the regression line is 0.0509 cm.","The slope estimates from repeated random samples of 24 plants would typically vary by about 0.0509 from the true slope.","95% of all possible slope estimates fall within 0.0509 of 0.916.","The margin of error for the 95% confidence interval for the slope is 0.0509."],"answer":1,"explain":"SE_b estimates the standard deviation of the sampling distribution of the slope statistic b - it measures how much slope estimates would typically vary from sample to sample. Option a describes S (2.847), option c misstates the empirical rule, and option d confuses the standard error with the margin of error (t* x SE_b, about 0.106)."},{"q":"A 95% confidence interval for the population slope beta is (0.810, 1.022). Which is the correct interpretation?","options":["We are 95% confident that the true mean increase in plant height per additional gram of fertilizer is between 0.810 cm and 1.022 cm.","95% of the 24 tomato plants had heights consistent with a slope between 0.810 and 1.022.","There is a 95% probability that the sample slope 0.916 falls between 0.810 and 1.022.","We are 95% confident that each additional gram of fertilizer causes a plant to grow between 0.810 cm and 1.022 cm taller."],"answer":0,"explain":"The interval estimates the population slope: the mean change in y per one-unit change in x, stated with proper units and \"95% confident\" language. Option b describes the sample data, option c is backwards (the sample slope is fixed and known), and option d claims causation, which an observational study cannot support."},{"q":"The p-value for the two-sided test of the slope is 0.000 (rounded). At alpha = 0.05, what is the correct conclusion?","options":["Fail to reject H0; there is not convincing evidence of a linear relationship between fertilizer and plant height.","Reject H0; there is convincing evidence that the intercept differs from 0.","Accept H0; the slope is 0, so fertilizer has no effect on plant height.","Reject H0; there is convincing evidence of a linear relationship between fertilizer amount and tomato plant height."],"answer":3,"explain":"The p-value is approximately 0, which is less than alpha = 0.05, so we reject H0: beta = 0. The conclusion must be about the slope (a linear relationship) and stated in context. We never \"accept\" H0, and this p-value tests the slope, not the intercept."},{"q":"To construct a 95% confidence interval for the slope with these data (n = 24), which degrees of freedom and critical value should be used?","options":["df = 24, t* = 2.064","df = 22, t* = 2.074","df = 23, t* = 2.069","df = 22, t* = 1.717"],"answer":1,"explain":"For slope inference, df = n - 2 = 22, because two parameters (the slope and the intercept) were estimated from the data. The critical value t* for 95% confidence with 22 degrees of freedom is 2.074. Option d uses the 90% critical value."},{"q":"Which calculation gives the 95% confidence interval for the population slope beta?","options":["0.916 +/- 2.074(1.521)","0.916 +/- 1.96(0.0509)","0.916 +/- 2.074(0.0509)","19.528 +/- 2.074(0.0509)"],"answer":2,"explain":"The confidence interval for the slope is b +/- t* x SE_b = 0.916 +/- 2.074(0.0509) = (0.810, 1.022). Option a uses the intercept's standard error, option b uses the large-sample z* instead of t*, and option d centers the interval on the intercept estimate."},{"q":"The slope is statistically significant and positive. Which statement is correct?","options":["The significant slope proves that fertilizer causes tomato plants to grow taller.","Because p < 0.05, we know that increasing fertilizer will always increase height for any plant.","A significant slope means the linear model will predict heights perfectly for new plants.","The test shows an association, but because the plants were only observed (not randomly assigned fertilizer amounts), a cause-and-effect conclusion is not justified."],"answer":3,"explain":"A significant slope establishes association, not causation. Because fertilizer amounts were observed rather than randomly assigned, confounding variables (such as sunlight, soil quality, or watering) could explain the relationship. Options a and b overstate what the test shows, and option c confuses statistical significance with perfect prediction."},{"q":"The estimated slope is 0.916. Which is the best interpretation?","options":["For each additional gram of fertilizer, the predicted tomato plant height increases by 0.916 cm, on average.","A plant given no fertilizer is predicted to be 0.916 cm tall.","For each additional centimeter of height, 0.916 more grams of fertilizer were applied.","91.6% of the variation in plant height is explained by fertilizer amount."],"answer":0,"explain":"The slope is the predicted change in y per one-unit change in x. Option b describes the intercept (19.528 cm), option c reverses the roles of x and y, and option d describes R-squared (93.6%), not the slope."}],"shortBank":[{"q":"State the hypotheses for testing whether there is a linear relationship between fertilizer amount and plant height. Using the computer output (slope 0.916, SE of slope 0.0509, n = 24), carry out the test at the 0.05 significance level: give the test statistic and p-value, and state your conclusion in context.","marks":3,"answer":"H0: beta = 0 versus Ha: beta != 0, where beta is the slope of the population regression line relating fertilizer amount (grams) to tomato plant height (cm). The test statistic is t = (0.916 - 0)/0.0509 = 18.0 with df = 24 - 2 = 22, and the p-value is approximately 0. Because the p-value is less than alpha = 0.05, reject H0. There is convincing evidence of a linear relationship between the amount of fertilizer applied and tomato plant height. [Marking: 1 mark for correct hypotheses with beta defined in context; 1 mark for the test statistic and p-value; 1 mark for the conclusion in context.]"},{"q":"Construct a 95% confidence interval for the population slope beta. Show your work, interpret the interval in context, and explain how the interval is consistent with the result of the significance test for the slope.","marks":4,"answer":"The interval is b +/- t* x SE_b = 0.916 +/- 2.074(0.0509) = 0.916 +/- 0.106 = (0.810, 1.022), using t* = 2.074 with df = 24 - 2 = 22. We are 95% confident that the true mean increase in tomato plant height per additional gram of fertilizer is between 0.810 cm and 1.022 cm. The interval does not contain 0, which is consistent with rejecting H0: beta = 0 at the 5% level - both the test and the interval point to a positive linear relationship between fertilizer and height. [Marking: 1 mark for correct setup and critical value; 1 mark for the correct interval; 1 mark for interpretation in context; 1 mark for linking the interval to the test conclusion.]"}],"notes":"<h3>The Big Idea</h3>\n<p>The sample slope <em>b</em> is just one estimate — a different sample of plants would give a different <em>b</em>. Inference for slopes asks two questions: is there convincing evidence that the true population slope <em>β</em> differs from 0 (that x and y really have a linear relationship), and what is a plausible range of values for <em>β</em>?</p>\n\n<h3>The Hypotheses</h3>\n<p>Tests about \"a linear relationship\" use hypotheses about the population slope <em>β</em>, never about the sample statistic <em>b</em>:</p>\n<ul>\n<li><strong>H0: β = 0</strong> — there is no linear relationship between x and y</li>\n<li><strong>Ha: β ≠ 0</strong> — there is a linear relationship between x and y</li>\n</ul>\n<p>Use a one-sided alternative only when the question claims a direction <em>before</em> the data are seen.</p>\n\n<h3>The t-Test for the Slope</h3>\n<p>The test statistic is <strong>t = (b − 0) / SE_b</strong>, with degrees of freedom <strong>df = n − 2</strong>. We lose two degrees of freedom because both the slope and the intercept were estimated.</p>\n<p><strong>SE_b</strong>, the standard error of the slope, estimates how much the slope statistic <em>b</em> would vary from sample to sample. A smaller SE_b — from a larger sample, more spread in x, or less scatter — gives a larger t and stronger evidence against H0.</p>\n<p>The p-value is the probability of getting a slope at least as far from 0 as the one observed, assuming H0 is true. If the p-value is below α, reject H0 and conclude there is convincing evidence of a linear relationship — always restated in context using the actual variable names.</p>\n\n<h3>Confidence Interval for the Slope</h3>\n<p>A C% confidence interval for <em>β</em> is <strong>b ± t* × SE_b</strong>, where t* is the critical value with df = n − 2.</p>\n<p>Interpretation template: \"We are C% confident that the true mean change in [y-variable, with units] per one-unit increase in [x-variable, with units] is between [low] and [high].\" For example: we are 95% confident that the true mean increase in plant height per additional gram of fertilizer is between 0.810 cm and 1.022 cm.</p>\n<p>The interval and the two-sided test always agree: if the C% interval excludes 0, you would reject H0: β = 0 at α = 1 − C.</p>\n\n<h3>Conditions: LINER</h3>\n<p>Check before doing slope inference:</p>\n<ul>\n<li><strong>L — Linear:</strong> the scatterplot shows a linear pattern; the residual plot shows random scatter with no curve.</li>\n<li><strong>I — Independent:</strong> individual observations are independent (check the 10% condition when sampling without replacement).</li>\n<li><strong>N — Normal:</strong> the <em>residuals</em> are approximately normal — check a normal probability plot or histogram of residuals, not of x or y.</li>\n<li><strong>E — Equal SD:</strong> the standard deviation of the residuals is roughly constant — the residual plot should show even vertical spread across x-values, with no fan shape.</li>\n<li><strong>R — Random:</strong> the data come from a random sample or a randomized experiment.</li>\n</ul>\n\n<h3>Reading Computer Output</h3>\n<table>\n<tr><th>Predictor</th><th>Coef</th><th>SE Coef</th><th>T</th><th>P</th></tr>\n<tr><td>Constant</td><td>19.528</td><td>1.521</td><td>12.83</td><td>0.000</td></tr>\n<tr><td>Fertilizer</td><td>0.916</td><td>0.0509</td><td>18.0</td><td>0.000</td></tr>\n</table>\n<p>The slope row gives <em>b</em>, SE_b, the t statistic, and the p-value for H0: β = 0. The intercept row is rarely the focus. Also reported: <strong>S</strong>, the standard deviation of the residuals (typical prediction error), and <strong>R-sq</strong>, the proportion of variation in y explained by the linear model.</p>\n\n<h3>Significant Does Not Mean Causal</h3>\n<p>A significant slope means x and y are <em>associated</em>, not that x <em>causes</em> y. In an observational study, confounding variables — things like sunlight or soil quality that relate to both fertilizer use and growth — could explain the pattern. Cause-and-effect conclusions require a well-designed randomized experiment.</p>\n\n<h3>Common Traps</h3>\n<ul>\n<li>Writing hypotheses about <em>b</em> instead of <em>β</em>.</li>\n<li>Using df = n − 1 instead of df = n − 2.</li>\n<li>Interpreting the slope as the interc
