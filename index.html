<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erica's Practice Quiz Generator</title>
<style>
  :root{
    --ink:#1f2937; --muted:#6b7280; --accent:#0d9488; --accent-dark:#0f766e;
    --bg:#f3f4f6; --card:#ffffff; --line:#e5e7eb; --warn:#b45309; --warn-bg:#fef3c7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55;}
  .wrap{max-width:880px;margin:0 auto;padding:20px 16px 60px;}
  header.site{margin:8px 0 20px;}
  header.site h1{margin:0 0 4px;font-size:1.7rem;}
  header.site p{margin:0;color:var(--muted);}
  .steps{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 22px;}
  .step{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;font-size:.92rem;color:var(--muted);}
  .step b{display:block;color:var(--ink);margin-bottom:2px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .card h2{margin:0 0 6px;font-size:1.15rem;}
  .card p{margin:0 0 12px;color:var(--muted);font-size:.92rem;}
  .unit-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:10px;}
  .unit-row .meta small{color:var(--muted);display:block;}
  .btn{display:inline-block;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;
    font-size:1rem;font-weight:600;background:var(--accent);color:#fff;text-decoration:none;}
  .btn:hover{background:var(--accent-dark);}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;}
  .btn.ghost:hover{background:#f9fafb;}
  .btn.danger{background:#fff;color:#b91c1c;border:1px solid #fecaca;font-weight:500;padding:6px 12px;font-size:.85rem;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px;}
  .backlink{display:inline-block;margin-bottom:10px;color:var(--accent-dark);text-decoration:none;font-weight:600;}
  .tabs{display:flex;gap:8px;margin:16px 0 20px;flex-wrap:wrap;}
  .tab{padding:9px 20px;border-radius:999px;background:#fff;color:var(--ink);text-decoration:none;
    font-weight:600;border:1px solid var(--line);}
  .tab:hover{border-color:var(--accent);color:var(--accent-dark);}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .notes{line-height:1.65;}
  .notes h3{margin:1.3em 0 .45em;font-size:1.12rem;}
  .notes h3:first-child{margin-top:0;}
  .notes h4{margin:1em 0 .3em;font-size:1rem;}
  .notes ul{margin:.3em 0 .8em;padding-left:1.4em;}
  .notes li{margin:.25em 0;}
  .notes table{border-collapse:collapse;margin:.7em 0;width:100%;}
  .notes th,.notes td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top;}
  .notes th{background:#f3f4f6;}
  .genbox{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-bottom:18px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;}
  .genbox label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px;}
  .genbox input[type=number]{width:90px;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:1rem;}
  /* quiz paper */
  .paper{background:#fff;border:1px solid var(--line);border-radius:6px;
    padding:34px 36px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .paper h2{margin:0 0 2px;font-size:1.35rem;}
  .paper .unitline{color:var(--muted);margin:0 0 14px;}
  .nameline{display:flex;gap:24px;margin:10px 0 16px;flex-wrap:wrap;}
  .nameline span{flex:1;min-width:200px;border-bottom:1px solid #9ca3af;padding-bottom:4px;color:var(--muted);}
  .instructions{background:#f9fafb;border:1px solid var(--line);border-radius:8px;
    padding:10px 14px;margin-bottom:20px;font-size:.95rem;}
  .parthead{font-weight:700;font-size:1.1rem;margin:22px 0 10px;
    border-bottom:2px solid var(--ink);padding-bottom:4px;}
  .q{margin:0 0 16px;}
  .q .qtext{font-weight:600;}
  .marks{font-weight:400;color:var(--muted);font-size:.9em;}
  .opts{list-style:none;margin:8px 0 0;padding:0;}
  .opts li{margin:4px 0;padding-left:4px;}
  .opts .letter{display:inline-block;min-width:22px;font-weight:700;}
  .writelines{margin-top:8px;}
  .writelines .line{border-bottom:1px solid #9ca3af;height:1.9em;}
  .goodluck{text-align:center;font-weight:700;margin-top:26px;font-size:1.05rem;}
  .warn{background:var(--warn-bg);border:1px solid #fcd34d;color:var(--warn);
    border-radius:10px;padding:10px 14px;margin-bottom:16px;font-weight:600;}
  .keyitem{margin:0 0 14px;}
  .keyitem .knum{font-weight:700;}
  .keyitem .kanswer{margin:2px 0;}
  .keyitem .kexplain{color:var(--muted);font-size:.93rem;}
  .scoring{background:#f9fafb;border:1px solid var(--line);border-radius:8px;
    padding:12px 16px;margin-top:20px;font-size:.95rem;}
  /* manage */
  .form{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-bottom:16px;}
  .form h3{margin:0 0 10px;}
  .form label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px;}
  .form input[type=text],.form input[type=number],.form textarea,.form select{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:1rem;font-family:inherit;}
  .form textarea{min-height:70px;resize:vertical;}
  .optgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .customitem{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;
    align-items:center;gap:10px;font-size:.95rem;}
  .customitem small{color:var(--muted);}
  footer.site{margin-top:40px;color:var(--muted);font-size:.85rem;text-align:center;}
  @media print{
    .noprint{display:none !important;}
    body{background:#fff;}
    .wrap{max-width:none;padding:0;}
    .paper{border:0;box-shadow:none;border-radius:0;padding:0;}
    .card,.form,.unit-row,.genbox,.steps,.step{box-shadow:none;}
    @page{margin:1.6cm;}
  }
</style>
</head>

{"courses":[
{"id":"eng2d","name":"Grade 10 English (ENG2D1)","semester":2,"units":[{"id":"eng-short-stories","name":"Short Stories","instructions":"No notes.","quizFormat":{"mc":10,"short":0},"mcBank":[],"shortBank":[],"notes":"<h3>Plot Structure</h3>\n<ul>\n<li><strong>Exposition</strong>: the opening — characters, setting, and the situation are introduced.</li>\n<li><strong>Rising action</strong>: a series of events that build tension as the main conflict develops.</li>\n<li><strong>Climax</strong>: the turning point — the moment of greatest tension, when the outcome of the conflict is decided.</li>\n<li><strong>Falling action</strong>: events after the climax that lead toward the ending.</li>\n<li><strong>Resolution</strong> (denouement): the conflict is resolved and loose ends are tied up.</li>\n</ul>\n\n<h3>Character</h3>\n<ul>\n<li><strong>Protagonist</strong>: the main character (not necessarily \"good\"). <strong>Antagonist</strong>: whoever or whatever opposes the protagonist (not necessarily a villain — it can be society, nature, or the character's own doubts).</li>\n<li><strong>Dynamic</strong> character: changes in a meaningful way by the end. <strong>Static</strong> character: stays essentially the same.</li>\n<li><strong>Direct characterization</strong>: the narrator tells you what a character is like (\"She was impatient\"). <strong>Indirect characterization</strong>: you infer it from the character's speech, thoughts, actions, appearance, and effect on others (the STEAL method: <strong>S</strong>peech, <strong>T</strong>houghts, <strong>E</strong>ffects on others, <strong>A</strong>ctions, <strong>L</strong>ooks).</li>\n</ul>\n\n<h3>Setting</h3>\n<ul>\n<li>The <strong>time and place</strong> of the story — but it also includes the social, cultural, and historical context.</li>\n<li>Setting can <strong>create mood</strong> (a dark forest feels threatening), <strong>reveal character</strong> (a messy room suggests a chaotic life), <strong>symbolize ideas</strong> (a storm during an argument), or even <strong>drive the plot</strong> (a snowstorm trapping people together).</li>\n</ul>\n\n<h3>Conflict</h3>\n<ul>\n<li><strong>Internal conflict</strong> (character vs. self): a struggle inside a character — guilt, fear, a difficult decision.</li>\n<li><strong>External conflict</strong>: a struggle against an outside force.</li>\n</ul>\n<table>\n<tr><th>Type</th><th>Example</th></tr>\n<tr><td>Character vs. character</td><td>Two rivals competing for the same prize</td></tr>\n<tr><td>Character vs. society</td><td>Standing up to an unjust rule or tradition</td></tr>\n<tr><td>Character vs. nature</td><td>Surviving a blizzard or a storm at sea</td></tr>\n<tr><td>Character vs. technology/supernatural</td><td>A malfunctioning machine; a ghost</td></tr>\n<tr><td>Character vs. self</td><td>Deciding whether to tell the truth</td></tr>\n</table>\n\n<h3>Point of View</h3>\n<ul>\n<li><strong>First person</strong> (\"I\"): the narrator is a character in the story. Intimate, but limited to what that character knows — and possibly biased.</li>\n<li><strong>Second person</strong> (\"you\"): rare in stories; puts the reader in the narrator's place.</li>\n<li><strong>Third person limited</strong> (\"he/she/they\"): an outside narrator follows one character's thoughts and feelings.</li>\n<li><strong>Third person omniscient</strong>: an all-knowing narrator who can enter any character's mind and knows past, present, and future.</li>\n<li>Ask yourself: what does this point of view <strong>hide</strong> from me, and why?</li>\n</ul>\n\n<h3>Theme vs. Topic</h3>\n<ul>\n<li><strong>Topic</strong> is the subject: one or two words (\"friendship\", \"war\", \"growing up\").</li>\n<li><strong>Theme</strong> is the <strong>message or insight about that topic</strong> — a full sentence: \"True friendship requires honesty, even when it is difficult.\"</li>\n<li>A story can have more than one theme.</li>\n</ul>\n\n<h3>Literary Devices</h3>\n<h4>Imagery</h4>\n<ul>\n<li>Language that appeals to the <strong>senses</strong> (sight, sound, smell, taste, touch) to create a vivid picture. <em>\"The metallic smell of rain hung over the parking lot.\"</em></li>\n</ul>\n<h4>Symbolism</h4>\n<ul>\n<li>When an object, character, or colour <strong>stands for a larger idea</strong>. A dove = peace; a broken mirror = a shattered identity. Look for things the author mentions repeatedly.</li>\n</ul>\n<h4>Irony</h4>\n<table>\n<tr><th>Type</th><th>Meaning</th><th>Example</th></tr>\n<tr><td><strong>Verbal irony</strong></td><td>Saying the opposite of what is meant</td><td>\"Great weather we're having\" — during a downpour</td></tr>\n<tr><td><strong>Situational irony</strong></td><td>The opposite of what is expected happens</td><td>A fire station burns down</td></tr>\n<tr><td><strong>Dramatic irony</strong></td><td>The audience knows something a character doesn't</td><td>We know the letter was never sent; she keeps waiting for a reply</td></tr>\n</table>\n<h4>Foreshadowing</h4>\n<ul>\n<li><strong>Hints or clues</strong> about what will happen later — a strange comment, an ominous detail. Creates suspense and makes the ending feel earned.</li>\n</ul>\n<h4>Simile, Metaphor, Personification</h4>\n<ul>\n<li><strong>Simile</strong>: a comparison using <em>like</em> or <em>as</em> (\"brave as a lion\").</li>\n<li><strong>Metaphor</strong>: a direct comparison without <em>like/as</em> (\"He is a rock\").</li>\n<li><strong>Personification</strong>: giving human qualities to non-human things (\"The wind whispered through the trees\").</li>\n</ul>\n\n<h3>How to Write a Paragraph Answer About a Story</h3>\n<ul>\n<li><strong>Thesis (topic sentence)</strong>: state your answer as a clear claim. <em>\"In the story, the storm symbolizes the protagonist's anger.\"</em></li>\n<li><strong>Evidence</strong>: quote or describe a specific moment from the story. <em>\"When he slams the door, the author writes that 'thunder cracked at the same instant.'\"</em></li>\n<li><strong>Explanation</strong>: connect the evidence back to your thesis — explain <strong>how</strong> the evidence proves your point. This is where the marks are: don't just summarize, <strong>analyze</strong>.</li>\n<li>Finish with a <strong>concluding sentence</strong> that restates your idea in new words. Formula to remember: <strong>claim → quote → explain</strong>.</li>\n</ul>\n"},{"id":"eng-novel","name":"Novel Study","instructions":"No notes.","quizFormat":{"mc":10,"short":0},"mcBank":[],"shortBank":[],"notes":"<h3>Theme: How Novels Build Meaning</h3>\n<p>A <strong>theme</strong> is the big idea underneath the plot (e.g. \"power corrupts\"). Authors build it gradually — spot it by watching for patterns:</p>\n<ul>\n<li><strong>Motifs</strong> — a repeated image, phrase, or situation. A bird that keeps appearing, a colour linked to one character, the same argument happening twice. Ask: <em>why does this keep coming back?</em></li>\n<li><strong>Recurring symbols</strong> — objects or places that gain meaning over time (a house that stands for the past, a key that stands for freedom). Symbols often <strong>change meaning</strong> as the story progresses — note the shift.</li>\n<li><strong>Contrasts</strong> — two characters, places, or outcomes placed side by side (rich/poor, freedom/control). The contrast usually points straight at the theme.</li>\n</ul>\n\n\n<h3>Characters: Arcs and Foils</h3>\n<ul>\n<li>A <strong>character arc</strong> is how a character changes from start to finish. Ask: <em>what did they believe at the beginning, what do they believe now, and which event forced the change?</em> Flat characters (no real change) usually exist to highlight the ones who do change.</li>\n<li>A <strong>foil</strong> is a character designed to contrast with another — bravery next to cowardice, honesty next to deceit — so the main character's traits stand out. Name the foil and say <em>what it reveals</em>.</li>\n<li><strong>Motivation</strong> drives every action. Name the want, fear, or loyalty behind what a character does, and the action makes sense.</li>\n</ul>\n\n<h3>Narrative Structure in Longer Works</h3>\n<p>Novels use the same building blocks as short stories, stretched out:</p>\n<table>\n<tr><th>Part</th><th>What happens</th></tr>\n<tr><td><strong>Exposition</strong></td><td>World, characters, and the opening situation are established.</td></tr>\n<tr><td><strong>Rising action</strong></td><td>Complications pile up; in a novel this includes <strong>subplots</strong> (secondary storylines that echo or contrast the main plot).</td></tr>\n<tr><td><strong>Climax</strong></td><td>The turning point — after this, the outcome is decided.</td></tr>\n<tr><td><strong>Falling action &amp; resolution</strong></td><td>Consequences play out; loose ends tie up (or deliberately don't).</td></tr>\n</table>\n<p>Also watch <strong>pacing</strong>: fast scenes signal crisis; slow passages signal that a moment matters.</p>\n\n<h3>Setting: More Than Background</h3>\n<ul>\n<li>Setting shapes what characters <strong>can</strong> do — a small town limits options, a war zone forces choices.</li>\n<li>Setting often <strong>mirrors mood or theme</strong>: a decaying house during a family's collapse is not a coincidence.</li>\n<li>Ask: <em>could this story happen anywhere else?</em> If not, the setting is doing real work — explain what work.</li>\n</ul>\n\n<h3>Tracking Ideas While You Read</h3>\n<ul>\n<li><strong>Annotate with a purpose.</strong> Mark only: possible themes, character changes, striking images, and passages you might quote.</li>\n<li><strong>Use a simple code</strong> in the margin: T = theme, C = character change, S = symbol, ? = confusing. After each chapter, write one sentence: <em>what changed?</em></li>\n<li><strong>Keep a running list</strong> of motifs and where they appear (chapter + page). This becomes your evidence bank for essays.</li>\n</ul>\n\n<h3>Writing About a Novel: The Quote Sandwich</h3>\n<p>A strong body paragraph follows the <strong>quote sandwich</strong>:</p>\n<ol>\n<li><strong>Top bun — your point.</strong> State the idea in your own words (this connects to your thesis).</li>\n<li><strong>The filling — the evidence.</strong> Introduce the quotation with context, then quote briefly. Choose quotations that <strong>show</strong> something (an image, a revealing line of dialogue), not ones that just retell plot.</li>\n<li><strong>Bottom bun — your explanation.</strong> This is the part students skip. Explain <em>how</em> the quotation proves your point: unpack the word choice, the image, the contrast. Two sentences of explanation per quotation is a good rule.</li>\n</ol>\n<h4>Forming a Thesis</h4>\n<ul>\n<li>A thesis is an <strong>arguable claim</strong>, not a fact. \"The novel is about friendship\" is a fact; \"the novel shows that friendship requires honesty, because every lie between the two friends nearly destroys them\" is a thesis.</li>\n<li>Formula: <strong>theme + how the author shows it</strong> (through character, symbol, structure).</li>\n</ul>\n\n<h3>Common Essay Pitfalls</h3>\n<ul>\n<li><strong>Plot summary instead of analysis.</strong> Every paragraph should answer <em>why does this matter</em>, not just <em>what happened</em>.</li>\n<li><strong>Dropped quotations.</strong> Never leave a quote sitting alone — always introduce it and always explain it.</li>\n<li><strong>Vague thesis.</strong> If your thesis could fit any novel, it's too vague. Name the specific theme and the specific techniques.</li>\n<li><strong>Ignoring the \"how.\"</strong> Saying <em>what</em> the theme is earns half marks; explaining <em>how</em> the author builds it (motif, foil, structure) earns the rest.</li>\n<li><strong>One piece of evidence per idea.</strong> A claim with a single quotation looks thin — aim for two or three connected pieces of evidence.</li>\n</ul>\n"},{"id":"eng-poetry","name":"Poetry","instructions":"No notes.","quizFormat":{"mc":10,"short":0},"mcBank":[],"shortBank":[],"notes":"<h3>Sound Devices</h3>\n<p>Poets choose words for how they <strong>sound</strong>, not just what they mean. These devices create music and emphasis.</p>\n<ul>\n<li><strong>Rhyme</strong> — matching end sounds. <strong>End rhyme</strong> falls at the ends of lines; <strong>internal rhyme</strong> happens inside a single line. The pattern of end rhymes in a stanza is the <strong>rhyme scheme</strong>, labelled with letters: lines that rhyme share a letter (e.g. ABAB means lines 1 and 3 rhyme, lines 2 and 4 rhyme).</li>\n<li><strong>Rhythm and meter</strong> — <strong>rhythm</strong> is the pattern of stressed and unstressed syllables when a line is read aloud. <strong>Meter</strong> is rhythm measured into a regular, repeating pattern (for example, five pairs of unstressed–stressed syllables per line is called iambic pentameter).</li>\n<li><strong>Alliteration</strong> — repetition of the same <strong>consonant sound</strong> at the start of nearby words. <em>Example: \"Silent snow settled softly.\"</em></li>\n<li><strong>Assonance</strong> — repetition of the same <strong>vowel sound</strong> inside nearby words. <em>Example: \"The fleet sheep sleep deep.\"</em></li>\n<li><strong>Onomatopoeia</strong> — words that <strong>imitate the sound</strong> they describe: <em>buzz, crack, hiss, murmur</em>.</li>\n</ul>\n\n<h3>Figurative Language</h3>\n<p>Poets say one thing and mean more. Test each device by asking what is being compared to what.</p>\n<table>\n<tr><th>Device</th><th>Quick test</th><th>Example</th></tr>\n<tr><td><strong>Simile</strong></td><td>Comparison using <em>like</em> or <em>as</em></td><td><em>\"Her laugh was like wind chimes.\"</em></td></tr>\n<tr><td><strong>Metaphor</strong></td><td>Direct comparison, no <em>like/as</em> — says X <em>is</em> Y</td><td><em>\"The classroom was a beehive.\"</em></td></tr>\n<tr><td><strong>Extended metaphor</strong></td><td>One metaphor developed across several lines or the whole poem</td><td>A poem that keeps calling life a road, with detours and dead ends</td></tr>\n<tr><td><strong>Personification</strong></td><td>Non-human thing given <strong>human qualities</strong></td><td><em>\"The wind whispered through the pines.\"</em></td></tr>\n<tr><td><strong>Hyperbole</strong></td><td>Deliberate <strong>exaggeration</strong> for effect — not meant literally</td><td><em>\"I've told you a million times.\"</em></td></tr>\n<tr><td><strong>Symbol</strong></td><td>An object or image that <strong>stands for a bigger idea</strong></td><td>A dove standing for peace; a storm standing for conflict</td></tr>\n</table>\n<p>Watch for <strong>mixed metaphors</strong> in your own writing — combining two clashing comparisons (\"we'll burn that bridge when we get to it\") confuses the reader.</p>\n\n<h3>Structure</h3>\n<ul>\n<li><strong>Stanza forms</strong> — stanzas are the \"paragraphs\" of a poem. Common lengths: <strong>couplet</strong> (2 lines), <strong>tercet</strong> (3), <strong>quatrain</strong> (4), <strong>sestet</strong> (6), <strong>octave</strong> (8).</li>\n<li><strong>Line breaks</strong> — where a poet ends a line controls pacing and emphasis; the last word of a line gets extra weight.</li>\n<li><strong>Enjambment</strong> — a sentence or phrase runs <strong>past the line break</strong> without a pause, pulling the reader forward. The opposite is an <strong>end-stopped</strong> line, which ends with punctuation and a full stop in thought.</li>\n</ul>\n\n<h3>How to Analyze a Poem — Step by Step</h3>\n<ol>\n<li><strong>Read it aloud twice.</strong> First for the overall feeling, second listening for sound devices and natural pauses.</li>\n<li><strong>Paraphrase it.</strong> Put each stanza into plain prose in your own words. If you can't say what it literally describes, you aren't ready to interpret it.</li>\n<li><strong>Identify the devices.</strong> Mark sound devices, figurative language, and structural choices. Ask <em>why this device here</em> — what work does it do?</li>\n<li><strong>Connect to theme.</strong> Look for repeated words, images, or contrasts. The <strong>theme</strong> is the poem's central idea or message about life — stated as a full sentence, not one word (\"grief fades but leaves its shape\" beats just \"grief\").</li>\n</ol>\n\n<h3>Tone and Mood</h3>\n<ul>\n<li><strong>Tone</strong> is the <strong>poet's attitude</strong> toward the subject — playful, bitter, reverent, ironic. Find it in word choice: are the adjectives warm or cutting?</li>\n<li><strong>Mood</strong> is the <strong>feeling the reader gets</strong> — calm, uneasy, joyful. Find it in imagery and sound: soft sounds and gentle images usually build a calm mood.</li>\n<li>They often match but don't have to: a poem can have a <strong>mocking tone</strong> describing something sad, which creates an <strong>uneasy mood</strong>.</li>\n</ul>\n"},{"id":"eng-drama","name":"Drama","instructions":"No notes.","quizFormat":{"mc":10,"short":0},"mcBank":[],"shortBank":[],"notes":"<h3>The Elements of Drama</h3>\n<ul>\n<li><strong>Acts</strong> are the major divisions of a play (like chapters in a novel). <strong>Scenes</strong> are smaller divisions within an act — the scene usually changes when the location changes or key characters enter or exit.</li>\n<li><strong>Dialogue</strong> is conversation between two or more characters. In drama, dialogue does the heavy lifting: it reveals character, advances the plot, and delivers theme — there is no narrator to explain things.</li>\n<li><strong>Stage directions</strong> are the playwright's instructions, usually printed in italics or brackets. They describe entrances, exits, movement, tone of voice, and the setting (e.g. <em>[Thunder. Enter the three Witches]</em>). Actors and directors follow them, but directors may also interpret them.</li>\n</ul>\n<h4>Monologue vs Soliloquy vs Aside</h4>\n<table>\n<tr><th>Term</th><th>Who hears it</th><th>Purpose</th></tr>\n<tr><td><strong>Monologue</strong></td><td>Other characters on stage</td><td>One character speaks at length to others — to persuade, explain, or confess.</td></tr>\n<tr><td><strong>Soliloquy</strong></td><td>Only the audience</td><td>The character is alone (or thinks they are) and speaks their inner thoughts aloud. The audience learns what the character really feels.</td></tr>\n<tr><td><strong>Aside</strong></td><td>Only the audience (or one character)</td><td>A brief remark the other characters on stage supposedly cannot hear — often witty or revealing.</td></tr>\n</table>\n<h3>Drama vs Fiction</h3>\n<ul>\n<li>A play is written to be <strong>performed</strong>, not just read. The audience experiences it live, in real time, through actors' voices, bodies, and the staging.</li>\n<li>There is <strong>no narrator</strong>: everything must come through dialogue, action, and visual choices. That is why stage directions and asides matter — they replace narration.</li>\n<li>Because it is performed, drama depends on the <strong>audience</strong>: reactions, shared knowledge, and even the physical space shape the meaning.</li>\n</ul>\n<h3>Tragedy and Comedy</h3>\n<ul>\n<li><strong>Tragedy</strong> is a serious drama that ends in disaster or death. It often centres on a <strong>tragic hero</strong> — a noble or admirable figure whose <strong>fatal flaw</strong> (hamartia), such as pride or indecision, brings about their downfall.</li>\n<li><strong>Comedy</strong> is lighter in tone and usually ends happily (often with marriages or reconciliations). It frequently relies on <strong>misunderstandings, mistaken identity, and clever wordplay</strong>.</li>\n<li>Shakespeare wrote both — and sometimes mixed them: comic scenes inside tragedies (the gravediggers in <em>Hamlet</em>) give the audience relief and sharpen the tragic effect.</li>\n</ul>\n<h3>Shakespeare Basics</h3>\n<ul>\n<li><strong>Blank verse</strong> is unrhymed <strong>iambic pentameter</strong> — Shakespeare's default verse form for noble or serious speech. Lower-status characters often speak in <strong>prose</strong> instead, which signals their social rank.</li>\n<li><strong>Iambic pentameter</strong> = five iambs per line. An <strong>iamb</strong> is one unstressed syllable followed by one stressed syllable (da-DUM). Five of them make ten syllables: <em>\"Shall I comPARE thee TO a SUMmer's DAY?\"</em></li>\n<li><strong>Dramatic irony</strong> is when the audience knows something the characters do not (e.g. we know Juliet is only sleeping; Romeo does not). It builds tension because we watch characters act on incomplete information.</li>\n<li>Common Shakespearean features to watch for: <strong>asides</strong>, <strong>soliloquies</strong> revealing motive, <strong>puns and wordplay</strong>, and <strong>contrasts</strong> (light/dark, appearance/reality).</li>\n</ul>\n<h3>How to Analyze a Scene</h3>\n<p>Work through these three questions in order:</p>\n<ol>\n<li><strong>What is said?</strong> Look at the dialogue: word choice, imagery, verse vs prose, who speaks most. What do the words reveal about each character's goals?</li>\n<li><strong>What is done?</strong> Track the action and stage directions: entrances, exits, gestures, blocking. What changes by the end of the scene — and who has the power now?</li>\n<li><strong>What does the audience know?</strong> Identify any dramatic irony. How does what we know (but the characters don't) change the scene's tension or meaning?</li>\n</ol>\n<h3>Stagecraft Terms</h3>\n<ul>\n<li><strong>Blocking</strong> — the planned movement of actors on stage (where they stand, cross, sit, exit). Directors block scenes to show relationships: characters who face each other are in conflict or intimacy; one who turns away is withdrawing.</li>\n<li><strong>Props</strong> — movable objects the actors handle (a letter, a sword, a skull). Props often carry symbolic weight.</li>\n<li><strong>Set</strong> — the scenery and physical environment of the stage (backdrops, furniture, platforms). A minimal set forces the audience to focus on language and acting.</li>\n</ul>\n"},{"id":"eng-media","name":"Media Studies","instructions":"No notes.","quizFormat":{"mc":10,"short":0},"mcBank":[],"shortBank":[],"notes":"<h3>Core Concepts of Media Literacy</h3>\n<ul>\n<li><strong>Audience</strong> — who the media text is made for (age, interests, values). Media creators shape their message to appeal to a specific audience.</li>\n<li><strong>Purpose</strong> — why the text was made: to inform, persuade, entertain, or sell. Most media texts have more than one purpose.</li>\n<li><strong>Point of view</strong> — whose perspective is shown, and just as importantly, whose is left out. Ask: who created this, and what do they gain?</li>\n<li><strong>Representation</strong> — how groups of people are portrayed. Media often relies on stereotypes; notice who is shown in powerful roles and who is missing entirely.</li>\n</ul>\n\n<h3>Advertising Techniques</h3>\n<ul>\n<li><strong>Bandwagon</strong> — \"everyone is buying it, so you should too.\" Plays on the desire to fit in.</li>\n<li><strong>Testimonial / celebrity endorsement</strong> — a famous or trusted person says the product works. Fame is not expertise.</li>\n<li><strong>Emotional appeal</strong> — happiness, fear, nostalgia, or love used to bypass rational thinking.</li>\n<li><strong>Statistics and \"science\"</strong> — impressive-sounding numbers (\"9 out of 10 dentists\") that may come from biased or tiny samples.</li>\n<li><strong>Humour</strong> — makes you like the ad and remember it, even if the product is forgettable.</li>\n<li><strong>Repetition</strong> — slogans, jingles, and logos repeated until they feel familiar and trustworthy.</li>\n</ul>\n\n<h3>Bias: How to Spot It</h3>\n<ul>\n<li><strong>Word choice</strong> — loaded language (\"freedom fighter\" vs \"terrorist\") steers your reaction to the same event.</li>\n<li><strong>Selection and omission</strong> — which facts are included, and which inconvenient ones are left out.</li>\n<li><strong>Placement and emphasis</strong> — the headline, the first paragraph, and the largest photo carry the most weight.</li>\n<li><strong>Sources</strong> — unnamed \"experts\" or one-sided interviews signal bias. Credible texts cite named, checkable sources.</li>\n</ul>\n\n<h3>Misinformation vs Disinformation</h3>\n<table>\n<tr><th></th><th>Misinformation</th><th>Disinformation</th></tr>\n<tr><td><strong>What it is</strong></td><td>False information shared by mistake</td><td>False information spread on purpose to deceive</td></tr>\n<tr><td><strong>Intent</strong></td><td>No intent to harm — the sharer believes it</td><td>Deliberate — the sharer knows it is false</td></tr>\n<tr><td><strong>Example</strong></td><td>Sharing an outdated health tip you trust</td><td>A fake news site invented for clicks or influence</td></tr>\n</table>\n\n<h3>Visual Techniques in Film and Ads</h3>\n<ul>\n<li><strong>Camera angle</strong> — low angles make subjects look powerful; high angles make them look small or vulnerable.</li>\n<li><strong>Lighting</strong> — bright, warm light feels safe and happy; dark, harsh light feels threatening or serious.</li>\n<li><strong>Music and sound</strong> — set the mood and tell you how to feel before anything happens on screen.</li>\n<li><strong>Editing pace</strong> — fast cuts create excitement or anxiety; long takes feel calm and realistic.</li>\n</ul>\n\n<h3>Analyzing a Media Text: Step by Step</h3>\n<ul>\n<li><strong>1. Identify</strong> — what kind of text is it, and who made it?</li>\n<li><strong>2. Audience and purpose</strong> — who is it for, and what does it want them to think, feel, or do?</li>\n<li><strong>3. Techniques</strong> — name the specific techniques used (from the lists above) and explain their effect.</li>\n<li><strong>4. Point of view</strong> — whose perspective is shown? What is missing or misrepresented?</li>\n<li><strong>5. Evaluate</strong> — is it credible, fair, and effective? Back your judgment with evidence from the text.</li>\n</ul>\n\n<h3>Creating Media Responsibly</h3>\n<ul>\n<li><strong>Respect copyright</strong> — give credit for images, music, and clips you did not make yourself.</li>\n<li><strong>Represent fairly</strong> — avoid stereotypes and consider how your choices affect the people you portray.</li>\n<li><strong>Check before you share</strong> — verify facts and sources so you do not spread misinformation.</li>\n<li><strong>Know your digital footprint</strong> — anything you post can be copied, screenshotted, and found later.</li>\n</ul>\n"}]},
{"id":"mcr3u","name":"Functions (MCR3U1)","semester":2,"units":[{"id":"mcr-func-char","name":"Characteristics of Functions","instructions":"No notes.","quizFormat":{"mc":10,"short":0},"mcBank":[],"shortBank":[],"notes":"<h3>Function Notation</h3>\n<ul>\n<li><strong>f(x)</strong> is read \"f of x\" — it means the output of function f when the input is x. It does <strong>not</strong> mean f times x.</li>\n<li>To <strong>evaluate</strong>, substitute the value for x and simplify. Example: if f(x) = 2x^2 - 3x + 1, then f(-2) = 2(4) - 3(-2) + 1 = 8 + 6 + 1 = <strong>15</strong>.</li>\n<li>A <strong>relation</strong> is any set of ordered pairs; a <strong>function</strong> is a relation where each input has exactly one output. Use the <strong>vertical line test</strong>: a graph is a function if no vertical line hits it more than once.</li>\n</ul>\n<h3>Domain and Range</h3>\n<ul>\n<li><strong>Domain</strong>: all allowed x-values (inputs). <strong>Range</strong>: all possible y-values (outputs).</li>\n<li>Watch for <strong>restrictions</strong>: you cannot divide by zero (denominator ≠ 0) or take the square root of a negative number (radicand ≥ 0).</li>\n<li>Write them in <strong>set notation</strong> {x ∈ R | x ≥ 2} or <strong>interval notation</strong> [2, ∞). Square brackets [ ] mean the endpoint is included; round brackets ( ) mean it is not. Infinity always gets a round bracket.</li>\n<li>Example: for y = √(x - 2), the domain is x ≥ 2, or [2, ∞) in interval notation; the range is y ≥ 0, or [0, ∞).</li>\n</ul>\n<h3>Parent Functions</h3>\n<table>\n<tr><th>Parent function</th><th>Shape / key features</th></tr>\n<tr><td><strong>y = x</strong> (linear)</td><td>Straight line through the origin, slope 1</td></tr>\n<tr><td><strong>y = x^2</strong> (quadratic)</td><td>Parabola, vertex at (0, 0), opens up</td></tr>\n<tr><td><strong>y = x^3</strong> (cubic)</td><td>S-shape through the origin, rises left-to-right</td></tr>\n<tr><td><strong>y = √x</strong> (square root)</td><td>Starts at (0, 0), curves rightward; domain x ≥ 0</td></tr>\n<tr><td><strong>y = |x|</strong> (absolute value)</td><td>V-shape with vertex at (0, 0); range y ≥ 0</td></tr>\n<tr><td><strong>y = 1/x</strong> (reciprocal)</td><td>Hyperbola in quadrants I and III; asymptotes x = 0 and y = 0</td></tr>\n</table>\n<h3>Transformations</h3>\n<p>Start from y = f(x). Each change to the equation moves, flips, or resizes the graph:</p>\n<table>\n<tr><th>Change</th><th>Effect on the graph</th></tr>\n<tr><td>y = f(x) + k</td><td>Shift <strong>up</strong> k units (k &gt; 0) or down (k &lt; 0)</td></tr>\n<tr><td>y = f(x - h)</td><td>Shift <strong>right</strong> h units (h &gt; 0) or left (h &lt; 0) — opposite of what you expect</td></tr>\n<tr><td>y = -f(x)</td><td><strong>Reflect</strong> across the x-axis</td></tr>\n<tr><td>y = f(-x)</td><td><strong>Reflect</strong> across the y-axis</td></tr>\n<tr><td>y = a·f(x), |a| &gt; 1</td><td><strong>Vertical stretch</strong> by factor a</td></tr>\n<tr><td>y = a·f(x), 0 &lt; |a| &lt; 1</td><td><strong>Vertical compression</strong> by factor a</td></tr>\n<tr><td>y = f(bx), |b| &gt; 1</td><td><strong>Horizontal compression</strong> by factor 1/b</td></tr>\n<tr><td>y = f(bx), 0 &lt; |b| &lt; 1</td><td><strong>Horizontal stretch</strong> by factor 1/b</td></tr>\n</table>\n<ul>\n<li><strong>Mapping notation</strong> summarizes it all: (x, y) → (x/b + h, a·y + k) for y = a·f(b(x - h)) + k. Apply transformations to key points of the parent to sketch quickly.</li>\n<li>Order matters for stretches vs translations on the <strong>same</strong> axis; reflections and stretches on different axes can be done in any order.</li>\n</ul>\n<h3>Inverses</h3>\n<ul>\n<li>The <strong>inverse</strong> f⁻¹ swaps inputs and outputs: if f(a) = b, then f⁻¹(b) = a. Its graph is the <strong>reflection of f across the line y = x</strong>.</li>\n<li>To find it <strong>algebraically</strong>: write y = f(x), swap x and y, then solve for y. Example: f(x) = 2x + 3 → x = 2y + 3 → y = (x - 3)/2, so f⁻¹(x) = (x - 3)/2. Check: f(4) = 11 and f⁻¹(11) = 4. ✓</li>\n<li>The inverse is only a <strong>function</strong> if the original passes the <strong>horizontal line test</strong> (no horizontal line hits the graph twice). If it fails, restrict the domain first — e.g. y = x^2 has an inverse function only on x ≥ 0, giving y = √x.</li>\n<li>f(f⁻¹(x)) = x and f⁻¹(f(x)) = x — composing a function with its inverse undoes it.</li>\n</ul>\n<h3>Even and Odd Functions</h3>\n<ul>\n<li><strong>Even</strong>: f(-x) = f(x) for all x. The graph is <strong>symmetric about the y-axis</strong>. Example: h(x) = x^2 + 5, since h(-3) = 14 = h(3).</li>\n<li><strong>Odd</strong>: f(-x) = -f(x) for all x. The graph has <strong>rotational symmetry about the origin</strong> (180°). Example: g(x) = x^3 - 4x, since g(-2) = 0 = -g(2).</li>\n<li>Test: substitute -x and simplify. If you get back the original → even; the negative of the original → odd; anything else → <strong>neither</strong>.</li>\n<li>Quick tip: a polynomial with <strong>only even powers</strong> is even; with <strong>only odd powers</strong> is odd — but a constant term counts as an even power (x^0), so x^3 + 2 is neither.</li>\n</ul>\n"},{"id":"mcr-equiv-expr","name":"Equivalent Algebraic Expressions","instructions":"No notes.","quizFormat":{"mc":10,"short":0},"mcBank":[],"shortBank":[],"notes":"<h3>Non-Permissible Values Come First</h3>\n<ul>\n<li>A <strong>rational expression</strong> is a fraction with polynomials on the top and/or bottom, like (x^2 - 4)/(x + 3).</li>\n<li>A denominator can never equal zero. Any x-value that makes <strong>any</strong> denominator zero is <strong>non-permissible</strong> (a restriction) — the expression is undefined there.</li>\n<li>Always state restrictions <strong>before</strong> simplifying, from the <strong>original</strong> denominators. A factor you cancel still counts: if (x + 2) was in a denominator, x = -2 stays excluded even after it cancels.</li>\n</ul>\n<h3>Simplifying</h3>\n<ul>\n<li><strong>Factor everything first</strong> (common factors, difference of squares, trinomials), then cancel common factors — that means dividing the top and bottom by the same factor.</li>\n<li>You can only cancel <strong>factors</strong>, never terms: (x + 2)/(x + 5) does not simplify.</li>\n<li>Worked example: (x^2 - 4)/(x^2 - 3x - 10) = (x - 2)(x + 2)/((x - 5)(x + 2)) = <strong>(x - 2)/(x - 5)</strong>, with x ≠ 5 and x ≠ -2 (from the original denominator).</li>\n</ul>\n<h3>Multiplying and Dividing</h3>\n<ul>\n<li><strong>Multiplying:</strong> factor every numerator and denominator, cancel common factors, then multiply what's left. Leave the answer factored — don't expand.</li>\n<li>Worked example: (x^2 - 9)/(x + 4) × (x^2 + 8x + 16)/(x - 3) = (x - 3)(x + 3)/(x + 4) × (x + 4)^2/(x - 3) = <strong>(x + 3)(x + 4)</strong>, with x ≠ -4 and x ≠ 3.</li>\n<li><strong>Dividing:</strong> flip the second fraction (multiply by its reciprocal), then follow the multiplying steps. One extra restriction: the divisor's numerator can't be zero either.</li>\n<li>Worked example: (x^2 + 5x + 6)/(x^2 - 1) ÷ (x + 2)/(x + 1) = (x + 2)(x + 3)/((x - 1)(x + 1)) × (x + 1)/(x + 2) = <strong>(x + 3)/(x - 1)</strong>, with x ≠ 1, x ≠ -1, and x ≠ -2.</li>\n</ul>\n<h3>Adding and Subtracting</h3>\n<ul>\n<li>You need a common denominator. <strong>Factor the denominators first</strong>, then build the LCD: each distinct factor raised to its highest power.</li>\n<li>Rewrite each fraction over the LCD (multiply top and bottom by what's missing), combine the numerators, keep the denominator factored, and simplify if possible.</li>\n<li>Worked example: 3/(x + 1) + 2/(x - 2). LCD = (x + 1)(x - 2). This gives (3(x - 2) + 2(x + 1))/((x + 1)(x - 2)) = <strong>(5x - 4)/((x + 1)(x - 2))</strong>, with x ≠ -1 and x ≠ 2.</li>\n<li>Worked example: x/(x^2 - 4) - 1/(x - 2). Factor: x/((x - 2)(x + 2)) - (x + 2)/((x - 2)(x + 2)) = (x - x - 2)/((x - 2)(x + 2)) = <strong>-2/(x^2 - 4)</strong>, with x ≠ 2 and x ≠ -2. Watch the minus sign distributing over the whole second numerator.</li>\n</ul>\n<h3>Complex Fractions</h3>\n<ul>\n<li>A <strong>complex fraction</strong> has fractions inside the top and/or bottom. The fastest method: multiply the big numerator and big denominator by the <strong>LCD of all the little denominators</strong>.</li>\n<li>Worked example: (1/x + 1/y)/(1/x - 1/y). The little denominators are x and y, so multiply top and bottom by xy: ((xy)(1/x) + (xy)(1/y))/((xy)(1/x) - (xy)(1/y)) = <strong>(y + x)/(y - x)</strong>, with x ≠ 0, y ≠ 0, and y ≠ x.</li>\n</ul>\n<h3>Solving Rational Equations</h3>\n<ul>\n<li>Steps: (1) state the restrictions from every denominator; (2) multiply <strong>every term</strong> by the LCD to clear the denominators; (3) solve the resulting (usually linear or quadratic) equation; (4) <strong>check every answer</strong> in the original denominators — any answer that makes one zero is <strong>extraneous</strong> and must be rejected.</li>\n<li>Worked example: solve 3/(x - 3) = x/(x - 3) - 2, with x ≠ 3. Multiply by (x - 3): 3 = x - 2(x - 3), so 3 = -x + 6 and x = 3. But x = 3 was restricted — it is extraneous, so this equation has <strong>no solution</strong>.</li>\n<li>Worked example: solve (x + 2)/(x - 1) = 4/3, with x ≠ 1. Cross-multiply: 3(x + 2) = 4(x - 1), so 3x + 6 = 4x - 4 and <strong>x = 10</strong>. Checking: the denominator at x = 10 is 9, not zero, so x = 10 is valid.</li>\n</ul>\n"},{"id":"mcr-quadratic","name":"Quadratic Functions","instructions":"No notes.","quizFormat":{"mc":10,"short":0},"mcBank":[],"shortBank":[],"notes":"<h3>The Three Forms of a Quadratic</h3>\n<p>Every quadratic f(x) = ax^2 + bx + c can be written three ways. Each form makes a different feature easy to read off:</p>\n<table>\n<tr><th>Form</th><th>Looks like</th><th>What it tells you directly</th></tr>\n<tr><td><strong>Vertex form</strong></td><td>y = a(x - h)^2 + k</td><td>Vertex (h, k), axis of symmetry x = h</td></tr>\n<tr><td><strong>Factored form</strong></td><td>y = a(x - r)(x - s)</td><td>x-intercepts r and s</td></tr>\n<tr><td><strong>Standard form</strong></td><td>y = ax^2 + bx + c</td><td>y-intercept c, axis x = -b / (2a)</td></tr>\n</table>\n<p>In all three forms, <strong>a</strong> controls the opening: a &gt; 0 opens upward (vertex is a minimum), a &lt; 0 opens downward (vertex is a maximum), and |a| &gt; 1 means a vertical stretch while |a| &lt; 1 means a vertical compression.</p>\n\n<h3>Converting Between Forms: Completing the Square</h3>\n<p>To turn standard form into vertex form, complete the square:</p>\n<ul>\n<li><strong>Worked example:</strong> y = 2x^2 + 12x + 7. Factor the 2 out of the x-terms: y = 2(x^2 + 6x) + 7.</li>\n<li>Take half of 6 (the x-coefficient) and square it: (6/2)^2 = 9. Add and subtract 9 <em>inside</em> the brackets: y = 2(x^2 + 6x + 9 - 9) + 7.</li>\n<li>Collapse the perfect square and distribute: y = 2(x + 3)^2 - 18 + 7 = <strong>2(x + 3)^2 - 11</strong>. The vertex is (-3, -11).</li>\n</ul>\n\n<h3>Key Features of the Graph</h3>\n<ul>\n<li><strong>Vertex:</strong> the turning point (h, k); a minimum if a &gt; 0, a maximum if a &lt; 0.</li>\n<li><strong>Axis of symmetry:</strong> the vertical line x = h through the vertex.</li>\n<li><strong>Intercepts:</strong> y-intercept from c; x-intercepts by setting y = 0 and solving (also called zeros or roots).</li>\n<li><strong>Domain:</strong> for any quadratic, {x ∈ ℝ} — x can be anything.</li>\n<li><strong>Range:</strong> if a &gt; 0, {y ∈ ℝ | y ≥ k}; if a &lt; 0, {y ∈ ℝ | y ≤ k}.</li>\n<li><strong>Increasing/decreasing:</strong> the function decreases until the vertex, then increases (a &gt; 0) — e.g. decreasing on x &lt; h, increasing on x &gt; h. Flipped for a &lt; 0.</li>\n</ul>\n\n<h3>Solving Quadratic Equations</h3>\n<ul>\n<li><strong>Factoring:</strong> fastest when it works — e.g. x^2 - 5x + 6 = 0 factors to (x - 2)(x - 3) = 0, so x = 2 or x = 3.</li>\n<li><strong>Quadratic formula:</strong> works every time. For ax^2 + bx + c = 0: <strong>x = (-b ± √(b^2 - 4ac)) / (2a)</strong>. Example: 2x^2 + 3x - 4 = 0 gives x = (-3 ± √41) / 4, so x ≈ 0.85 or x ≈ -2.35.</li>\n<li><strong>The discriminant</strong> (b^2 - 4ac) predicts the roots without solving: &gt; 0 means two real roots, = 0 means exactly one real root (a double root — the vertex touches the x-axis), &lt; 0 means no real roots (the parabola never crosses the x-axis).</li>\n</ul>\n\n<h3>Applications: Maximum and Minimum Problems</h3>\n<p>Optimization problems are quadratic in disguise: find the vertex.</p>\n<ul>\n<li><strong>Revenue:</strong> R(p) = p(200 - 5p) = -5p^2 + 200p. Opens downward, so the vertex is the maximum: p = -200 / (2 × -5) = 20. Maximum revenue is R(20) = $2,000 at a $20 ticket price.</li>\n<li><strong>Area:</strong> 60 m of fencing for a rectangle: A = x(30 - x). Opens downward; maximum at x = 30/2 = 15, giving A = 15 × 15 = 225 m^2 — a square.</li>\n<li><strong>Projectile:</strong> h(t) = -5t^2 + 20t + 1.5. Maximum height at t = -20 / (2 × -5) = 2 s: h(2) = -5(4) + 20(2) + 1.5 = 21.5 m.</li>\n</ul>\n\n<h3>Solving Quadratic Inequalities Graphically</h3>\n<ul>\n<li>First find the <strong>zeros</strong> — they split the x-axis into intervals. Then ask: where is the parabola above (positive) or below (negative) the x-axis?</li>\n<li><strong>Worked example:</strong> x^2 - 5x + 6 &gt; 0. Zeros at x = 2 and x = 3; the parabola opens upward, so it is above the axis <em>outside</em> the zeros: x &lt; 2 or x &gt; 3.</li>\n<li>Remember the endpoints: use &gt; / &lt; (not ≥) means the zeros themselves are <strong>excluded</strong>. If the inequality were ≥, they'd be included.</li>\n<li><strong>Common trap:</strong> if the parabola opens upward and you want where it is <em>negative</em>, the answer is the interval <em>between</em> the zeros — double-check the sign of a before choosing inside vs outside.</li>\n</ul>\n"},{"id":"mcr-exponential","name":"Exponential Functions","instructions":"No notes.","quizFormat":{"mc":10,"short":0},"mcBank":[],"shortBank":[],"notes":"<h3>Exponent Laws</h3>\n<ul>\n<li><strong>Product:</strong> multiply powers with the same base by <strong>adding</strong> exponents: b^m × b^n = b^(m+n). Example: 2^3 × 2^4 = 2^7 = 128.</li>\n<li><strong>Quotient:</strong> divide powers with the same base by <strong>subtracting</strong> exponents: b^m ÷ b^n = b^(m−n). Example: 3^5 ÷ 3^2 = 3^3 = 27.</li>\n<li><strong>Power of a power:</strong> multiply the exponents: (b^m)^n = b^(m×n). Example: (2^2)^3 = 2^6 = 64.</li>\n<li><strong>Zero exponent:</strong> any non-zero base to the power 0 is <strong>1</strong>: b^0 = 1.</li>\n<li><strong>Negative exponent:</strong> flip to the reciprocal: b^(−n) = 1 / b^n. Example: 2^(−3) = 1/8.</li>\n<li><strong>Rational exponents:</strong> a fractional exponent means a root: b^(m/n) = the n-th root of b^m. Example: 8^(1/3) = 2, 4^(3/2) = 8, 9^(−1/2) = 1/3.</li>\n</ul>\n\n<h3>The Exponential Function: f(x) = a × b^x</h3>\n<p>An exponential function has the <strong>variable in the exponent</strong>. Here <strong>a</strong> is the initial value (the y-intercept), and <strong>b</strong> is the growth factor (b &gt; 0, b ≠ 1).</p>\n<table>\n<tr><th></th><th>Growth (b &gt; 1)</th><th>Decay (0 &lt; b &lt; 1)</th></tr>\n<tr><td><strong>Shape</strong></td><td>Rises left to right</td><td>Falls left to right</td></tr>\n<tr><td><strong>y-intercept</strong></td><td>(0, a)</td><td>(0, a)</td></tr>\n<tr><td><strong>Asymptote</strong></td><td>y = 0 (the x-axis)</td><td>y = 0 (the x-axis)</td></tr>\n<tr><td><strong>Domain</strong></td><td>{x ∈ R}</td><td>{x ∈ R}</td></tr>\n<tr><td><strong>Range</strong></td><td>{y ∈ R | y &gt; 0}</td><td>{y ∈ R | y &gt; 0}</td></tr>\n</table>\n<ul>\n<li>The graph <strong>never touches the x-axis</strong> — the horizontal asymptote is y = 0, so the curve approaches it but never reaches it.</li>\n<li>The y-intercept is easy: f(0) = a × b^0 = a, so the graph always passes through (0, a).</li>\n<li>If <strong>a is negative</strong>, the whole graph reflects across the x-axis (range becomes y &lt; 0).</li>\n</ul>\n\n<h3>Transformations of Exponentials</h3>\n<ul>\n<li>In g(x) = a × b^(x − h) + k: the graph shifts <strong>right h</strong> units and <strong>up k</strong> units.</li>\n<li>Changing <strong>k moves the asymptote</strong>: the asymptote becomes y = k, and the range becomes y &gt; k (or y &lt; k if a is negative).</li>\n<li>Multiplying by <strong>a stretches</strong> the graph vertically (|a| &gt; 1) or <strong>compresses</strong> it (0 &lt; |a| &lt; 1).</li>\n</ul>\n\n<h3>Solving Exponential Equations</h3>\n<p>The <strong>common-base method</strong>: rewrite both sides as powers of the same base, then set the exponents equal.</p>\n<ul>\n<li>Example: 2^(x+1) = 32. Since 32 = 2^5, we get 2^(x+1) = 2^5, so x + 1 = 5 and <strong>x = 4</strong>.</li>\n<li>Example: 3^(2x) = 81. Since 81 = 3^4, we get 2x = 4 and <strong>x = 2</strong>. (Check: 3^4 = 81. ✓)</li>\n<li>Use exponent laws first when needed: 4^x = 8 becomes (2^2)^x = 2^3, i.e. 2^(2x) = 2^3, so x = 3/2.</li>\n</ul>\n\n<h3>Applications</h3>\n<h4>Compound interest: A = P(1 + i)^n</h4>\n<ul>\n<li><strong>P</strong> = principal (starting amount), <strong>i</strong> = interest rate per period (as a decimal), <strong>n</strong> = number of periods, <strong>A</strong> = final amount.</li>\n<li>Example: $1000 invested at 4% compounded annually for 5 years: A = 1000(1.04)^5 = <strong>$1216.65</strong>.</li>\n</ul>\n<h4>Half-life and decay</h4>\n<ul>\n<li>Write the function as A(t) = A₀ × (1/2)^(t / half-life), where t and the half-life use the same units.</li>\n<li>Example: an 80 g sample with a half-life of 10 years. After 30 years (3 half-lives): A = 80 × (1/2)^3 = <strong>10 g</strong>.</li>\n</ul>\n<h4>Population growth</h4>\n<ul>\n<li>Example: 500 bacteria doubling every 2 hours. After 8 hours (4 doublings): 500 × 2^4 = <strong>8000</strong>.</li>\n<li>Example: 200 cells tripling every hour. After 3 hours: 200 × 3^3 = <strong>5400</strong>.</li>\n</ul>\n<h4>Doubling time</h4>\n<ul>\n<li><strong>Doubling time</strong> is how long it takes a growing quantity to double. If a population doubles every 2 hours, the hourly growth factor is 2^(1/2) ≈ 1.414 — a ~41.4% increase per hour.</li>\n<li>For decay, the mirror idea is <strong>half-life</strong>: the time for a quantity to halve.</li>\n</ul>\n"},{"id":"mcr-trig","name":"Trigonometric Ratios","instructions":"No notes.","quizFormat":{"mc":10,"short":0},"mcBank":[],"shortBank":[],"notes":"<h3>SOHCAHTOA — Quick Review</h3>\n<p>In a <strong>right</strong> triangle, for an acute angle θ:</p>\n<ul>\n<li><strong>sin θ = opposite / hypotenuse</strong>, <strong>cos θ = adjacent / hypotenuse</strong>, <strong>tan θ = opposite / adjacent</strong>. Use inverse trig to find an angle, with your calculator in <strong>degree mode</strong>.</li>\n<li>SOHCAHTOA only works for right triangles. For everything else, use the sine law and cosine law below.</li>\n</ul>\n\n<h3>The Sine Law</h3>\n<p>For any triangle with sides a, b, c opposite angles A, B, C:</p>\n<p><strong>a / sin A = b / sin B = c / sin C</strong></p>\n<h4>When to use it</h4>\n<ul>\n<li>You know <strong>two angles and a side</strong> (AAS or ASA) — the angles give you everything.</li>\n<li>You know <strong>two sides and a non-included angle</strong> (SSA) — watch out: this can give the <strong>ambiguous case</strong> (see below).</li>\n</ul>\n<h4>Worked example (AAS)</h4>\n<p>In triangle ABC, A = 40°, B = 60°, and a = 12 cm. Find b. (First, C = 180° − 40° − 60° = 80°.)</p>\n<ul>\n<li>b / sin 60° = 12 / sin 40°, so b = 12 × sin 60° / sin 40° ≈ <strong>16.2 cm</strong>.</li>\n</ul>\n\n<h3>The Cosine Law</h3>\n<p>For any triangle:</p>\n<p><strong>c² = a² + b² − 2ab·cos C</strong> (any side can be the \"c\")</p>\n<h4>When to use it</h4>\n<ul>\n<li>You know <strong>two sides and the included angle</strong> (SAS) — solve for the third side.</li>\n<li>You know <strong>all three sides</strong> (SSS) — rearrange to solve for an angle: <strong>cos C = (a² + b² − c²) / (2ab)</strong>.</li>\n</ul>\n<h4>Worked example (SAS)</h4>\n<p>b = 8 cm, c = 10 cm, with included angle A = 55°. Find a.</p>\n<ul>\n<li>a² = 8² + 10² − 2(8)(10)·cos 55° ≈ 72.2, so a ≈ <strong>8.5 cm</strong>.</li>\n</ul>\n<h4>Worked example (SSS)</h4>\n<p>Sides are 7 cm, 9 cm, 12 cm. Find the largest angle (opposite the longest side).</p>\n<ul>\n<li>cos C = (7² + 9² − 12²) / (2 × 7 × 9) = −14/126 ≈ −0.1111, so C = cos⁻¹(−0.1111) ≈ <strong>96.4°</strong>. The negative cosine means the angle is obtuse — always check the sign.</li>\n</ul>\n\n<h3>Sine Law vs Cosine Law — When to Use Each</h3>\n<table>\n<tr><th>You know</th><th>Use</th></tr>\n<tr><td>2 angles + 1 side (AAS, ASA)</td><td>Sine law</td></tr>\n<tr><td>2 sides + included angle (SAS)</td><td>Cosine law (find the side)</td></tr>\n<tr><td>3 sides (SSS)</td><td>Cosine law (find the angle)</td></tr>\n<tr><td>2 sides + non-included angle (SSA)</td><td>Sine law — but check the ambiguous case</td></tr>\n</table>\n\n<h3>The Ambiguous Case (SSA)</h3>\n<p>Given angle A, adjacent side b, and opposite side a, let <strong>h = b·sin A</strong>. Then there can be <strong>0, 1, or 2</strong> valid triangles:</p>\n<ul>\n<li><strong>a &lt; h</strong> → 0 solutions (the side can't reach the base).</li>\n<li><strong>h &lt; a &lt; b</strong> → 2 solutions (the side can swing to two positions).</li>\n<li><strong>a = h</strong>, or <strong>a ≥ b</strong> → 1 solution (with a ≥ b, the second angle option would push A + B past 180°).</li>\n</ul>\n<h4>Worked example (two solutions)</h4>\n<p>A = 30°, a = 10 cm, b = 16 cm. h = 16·sin 30° = 8, and 8 &lt; 10 &lt; 16, so expect two solutions.</p>\n<ul>\n<li>sin B = 16·sin 30° / 10 = 0.8 → B ≈ 53.1° <strong>or</strong> B ≈ 180° − 53.1° = 126.9°. Both are valid (30° + 126.9° &lt; 180°).</li>\n</ul>\n\n<h3>Applications</h3>\n<h4>Bearings</h4>\n<p>A <strong>bearing</strong> is measured clockwise from north (three digits, e.g. 050°). Draw the diagram: sketch the two legs, then find the interior angle of the triangle from the direction change.</p>\n<p><strong>Worked example:</strong> A ship sails from A on a bearing of 050° for 12 km to B, then on a bearing of 150° for 8 km to C. Find AC.</p>\n<ul>\n<li>The direction changes by 150° − 50° = 100°, so the interior angle at B is 180° − 100° = 80°.</li>\n<li>AC² = 12² + 8² − 2(12)(8)·cos 80° ≈ 174.7, so AC ≈ <strong>13.2 km</strong>.</li>\n</ul>\n<h4>Word-problem tips</h4>\n<ul>\n<li>Always <strong>draw and label the triangle</strong> first, then pick the law from the table above.</li>\n<li>Solving for an angle with the sine law? Remember sin θ = sin(180° − θ) — check whether the second option fits.</li>\n<li>Don't round mid-calculation; round sides to the nearest tenth and angles to the nearest degree at the end.</li>\n</ul>\n"},{"id":"mcr-sinusoidal","name":"Sinusoidal Functions","instructions":"No notes.","quizFormat":{"mc":10,"short":0},"mcBank":[],"shortBank":[],"notes":"<h3>Radian Measure</h3>\n<p>A <strong>radian</strong> is the angle you get when the arc length equals the radius. Since a full circle has circumference 2πr, a full rotation is <strong>2π radians = 360°</strong>.</p>\n<ul>\n<li><strong>Degrees to radians:</strong> multiply by π/180</li>\n<li><strong>Radians to degrees:</strong> multiply by 180/π</li>\n</ul>\n<p><strong>Worked examples:</strong> 60° = 60 × π/180 = <strong>π/3</strong>. 3π/4 = 3π/4 × 180/π = <strong>135°</strong>. 240° = 240 × π/180 = <strong>4π/3</strong>. −5π/6 = <strong>−150°</strong>.</p>\n<h4>Common angles</h4>\n<table>\n<tr><th>Degrees</th><td>0°</td><td>30°</td><td>45°</td><td>60°</td><td>90°</td><td>180°</td><td>270°</td><td>360°</td></tr>\n<tr><th>Radians</th><td>0</td><td>π/6</td><td>π/4</td><td>π/3</td><td>π/2</td><td>π</td><td>3π/2</td><td>2π</td></tr>\n</table>\n\n<h3>The Sine and Cosine Graphs</h3>\n<p>Both have <strong>domain</strong> all real numbers and <strong>range</strong> −1 ≤ y ≤ 1. Key points over one cycle [0, 2π]:</p>\n<ul>\n<li><strong>y = sin x:</strong> (0, 0), (π/2, 1), (π, 0), (3π/2, −1), (2π, 0)</li>\n<li><strong>y = cos x:</strong> (0, 1), (π/2, 0), (π, −1), (3π/2, 0), (2π, 1) — the same wave as sine, shifted left by π/2</li>\n</ul>\n\n<h3>The Transformed Equation: y = a·sin(k(x − d)) + c</h3>\n<p>(The same rules apply to cosine.) Each parameter changes the graph in a predictable way:</p>\n<table>\n<tr><th>Parameter</th><th>Effect</th><th>Formula</th></tr>\n<tr><td><strong>a</strong></td><td><strong>Amplitude</strong> — half the height of the wave; max = c + |a|, min = c − |a|. If a is negative, the graph is reflected across the midline.</td><td>|a|</td></tr>\n<tr><td><strong>k</strong></td><td>Controls the <strong>period</strong> — how long one cycle takes. Larger k means more cycles squeezed in.</td><td>period = 2π/|k|</td></tr>\n<tr><td><strong>d</strong></td><td><strong>Phase shift</strong> — the whole graph slides horizontally. Positive d shifts <strong>right</strong>; negative d shifts <strong>left</strong>. (Watch the sign: (x − π/4) means right π/4.)</td><td>d</td></tr>\n<tr><td><strong>c</strong></td><td><strong>Vertical shift</strong> — the midline y = c moves up (positive) or down (negative).</td><td>y = c</td></tr>\n</table>\n<p><strong>Worked example:</strong> y = 3sin(2(x − π/4)) + 1. Amplitude = <strong>3</strong>; period = 2π/2 = <strong>π</strong>; phase shift <strong>π/4 right</strong>; midline y = <strong>1</strong>, so max = 4, min = −2.</p>\n\n<h3>Sketching from the Equation</h3>\n<ol>\n<li>Read off amplitude, period, phase shift, and midline from the equation.</li>\n<li>Mark the midline (y = c) and the max/min lines (c + |a|, c − |a|).</li>\n<li>Plot the five key points of one cycle starting at x = d, spaced period/4 apart.</li>\n<li>Join them with a smooth wave, then repeat for more cycles if needed.</li>\n</ol>\n<p><strong>Check with y = 3sin(2(x − π/4)) + 1</strong> (period π, so points are π/4 apart starting at π/4): (π/4, 1), (π/2, 4), (3π/4, 1), (π, −2), (5π/4, 1).</p>\n\n<h3>Applications</h3>\n<h4>Ferris wheel</h4>\n<p>A wheel has <strong>radius 10 m</strong>, its centre <strong>12 m</strong> above the ground, turns once every <strong>60 s</strong>, and the rider starts at the lowest point. Height after t seconds:</p>\n<p><strong>h(t) = −10cos(2πt/60) + 12</strong></p>\n<ul>\n<li>Amplitude 10 = the radius; midline 12 = axle height; period 60 s = one revolution.</li>\n<li>h(0) = −10 + 12 = <strong>2 m</strong> (boarding point); h(30) = 10 + 12 = <strong>22 m</strong> (top).</li>\n</ul>\n<h4>Tides</h4>\n<p>Water depth varies between <strong>6 m</strong> and <strong>14 m</strong> with a period of <strong>12.4 h</strong>; high tide at t = 3 h:</p>\n<p><strong>h(t) = 4cos(2π(t − 3)/12.4) + 10</strong></p>\n<ul>\n<li>Amplitude (14 − 6)/2 = 4; midline (14 + 6)/2 = 10; phase shift 3 h right puts the peak at high tide.</li>\n<li>Low tide (6 m) arrives half a period later, at t = 3 + 6.2 = <strong>9.2 h</strong>.</li>\n</ul>\n<h4>Daylight hours</h4>\n<p>Daylight ranges from about <strong>8 h</strong> in winter to <strong>16 h</strong> in summer over a 365-day year; day 80 (spring equinox) has 12 h:</p>\n<p><strong>L(d) = 4sin(2π(d − 80)/365) + 12</strong></p>\n<ul>\n<li>Amplitude (16 − 8)/2 = 4; midline 12; period 365 days; phase shift 80 days puts the spring equinox at 12 h.</li>\n<li>Longest day ≈ day 80 + 365/4 ≈ day 171 (mid-June); shortest day ≈ day 354 (mid-December).</li>\n</ul>\n"},{"id":"mcr-sequences","name":"Sequences and Series","instructions":"No notes.","quizFormat":{"mc":10,"short":0},"mcBank":[],"shortBank":[],"notes":"<h3>Arithmetic vs Geometric at a Glance</h3>\n<table>\n<tr><th></th><th>Arithmetic</th><th>Geometric</th></tr>\n<tr><td>How terms change</td><td>Add a constant <strong>difference</strong> d each time</td><td>Multiply by a constant <strong>ratio</strong> r each time</td></tr>\n<tr><td>Example</td><td>5, 9, 13, 17, ... (d = 4)</td><td>3, 6, 12, 24, ... (r = 2)</td></tr>\n<tr><td>General term t_n</td><td>t_n = a + (n - 1)d</td><td>t_n = a * r^(n-1)</td></tr>\n<tr><td>Sum of first n terms</td><td>S_n = n/2 * (2a + (n-1)d) or n/2 * (a + t_n)</td><td>S_n = a(r^n - 1)/(r - 1)</td></tr>\n</table>\n\n<h3>Arithmetic Sequences</h3>\n<ul>\n<li>A <strong>sequence</strong> is an ordered list of terms. An <strong>arithmetic sequence</strong> adds the same number <strong>d</strong> (the common difference) each time.</li>\n<li>Find d by subtracting any term from the next one: d = t_2 - t_1.</li>\n<li>The <strong>general term</strong> t_n = a + (n-1)d gives any term directly, where a is the first term.</li>\n<li><strong>Example:</strong> 5, 9, 13, 17, ... has a = 5 and d = 4. Then t_20 = 5 + (20-1)(4) = 5 + 76 = <strong>81</strong>.</li>\n</ul>\n\n<h3>Arithmetic Series</h3>\n<ul>\n<li>A <strong>series</strong> is the <strong>sum</strong> of the terms of a sequence. S_n means the sum of the first n terms.</li>\n<li>Use S_n = n/2 * (2a + (n-1)d), or the shortcut S_n = n/2 * (a + t_n) if you already know the last term.</li>\n<li><strong>Example:</strong> for 5, 9, 13, ..., t_20 = 81, so S_20 = 20/2 * (5 + 81) = 10 * 86 = <strong>860</strong>.</li>\n</ul>\n\n<h3>Geometric Sequences</h3>\n<ul>\n<li>A <strong>geometric sequence</strong> multiplies by the same number <strong>r</strong> (the common ratio) each time.</li>\n<li>Find r by dividing any term by the previous one: r = t_2 / t_1.</li>\n<li>The <strong>general term</strong> t_n = a * r^(n-1).</li>\n<li><strong>Example:</strong> 3, 6, 12, 24, ... has a = 3 and r = 2. Then t_10 = 3 * 2^9 = 3 * 512 = <strong>1536</strong>.</li>\n</ul>\n\n<h3>Geometric Series</h3>\n<ul>\n<li>The <strong>finite</strong> sum is S_n = a(r^n - 1)/(r - 1).</li>\n<li><strong>Example:</strong> for 3, 6, 12, ..., S_10 = 3(2^10 - 1)/(2 - 1) = 3 * 1023 = <strong>3069</strong>.</li>\n</ul>\n<h4>Infinite Geometric Series</h4>\n<ul>\n<li>An infinite geometric series only has a finite sum when the terms shrink fast enough: it <strong>converges</strong> when <strong>|r| &lt; 1</strong>, and <strong>diverges</strong> (no finite sum) when |r| &gt;= 1.</li>\n<li>When it converges, S_inf = a / (1 - r).</li>\n<li><strong>Example:</strong> 8 + 4 + 2 + 1 + ... has r = 0.5, so S_inf = 8/(1 - 0.5) = <strong>16</strong>.</li>\n<li><strong>Counter-example:</strong> 2 + 4 + 8 + 16 + ... has r = 2, so it diverges — the sum is infinite.</li>\n</ul>\n\n<h3>Sigma Notation</h3>\n<ul>\n<li><strong>Sigma notation</strong> is shorthand for a sum: the Greek letter Σ with a lower and upper bound.</li>\n<li>In Σ (from i = 1 to 5) of (2i + 1): substitute i = 1, 2, 3, 4, 5 and add: 3 + 5 + 7 + 9 + 11 = <strong>35</strong>.</li>\n<li>The letter under Σ (here i) is the <strong>index</strong>; the expression after it is the <strong>general term</strong> of the series.</li>\n</ul>\n\n<h3>Applications</h3>\n<ul>\n<li><strong>Savings plans:</strong> money growing at a fixed interest rate is geometric. $2,000 at 4% per year compounded annually for 5 years: 2000 * 1.04^5 ≈ <strong>$2,433.31</strong>.</li>\n<li><strong>Bouncing ball:</strong> a ball dropped from 10 m that rebounds to 3/4 of its previous height travels 10 + 2(7.5 + 5.625 + ...). The bounce heights form an infinite geometric series summing to 7.5/(1 - 0.75) = 30, so the total distance is 10 + 2(30) = <strong>70 m</strong>.</li>\n<li><strong>Population growth:</strong> a town of 20,000 growing 3% per year is geometric with r = 1.03. After 8 years: 20000 * 1.03^8 ≈ <strong>25,335</strong> people.</li>\n</ul>\n"}]},
{"id":"snc2d","name":"Grade 10 Science (SNC2D1)","semester":1,"units":[{"id":"snc-bio","name":"Biology: Tissues, Organs, and Systems","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":3,"explain":"Specialization means a cell develops structures for one job — e.g., red blood cells lose their nucleus to carry more hemoglobin, and muscle cells pack in fibres for contraction.","options":["Specialized cells can change into any other cell type at any time","All cells in the human body are identical in structure and function","Cell specialization only happens in plants, not animals","Specialized cells have structures suited to their specific jobs"],"q":"Which statement about specialized cells is TRUE?","topic":"Cell specialization"},{"answer":2,"explain":"Cells group into tissues, tissues form organs, organs work together in organ systems, and all of the systems together make up the organism.","options":["organ → tissue → cell → organ system → organism","cell → organ → tissue → organ system → organism","cell → tissue → organ → organ system → organism","tissue → cell → organ → organism → organ system"],"q":"Which sequence shows the levels of biological organization in the correct order, from simplest to most complex?","topic":"Levels of organization"},{"answer":0,"explain":"Epithelial tissue forms protective linings and coverings — e.g., the skin's surface and the lining of the stomach — with cells packed tightly together and little space between them.","options":["epithelial tissue","muscle tissue","connective tissue","nervous tissue"],"q":"Which tissue type lines body cavities and covers the surfaces of organs?","topic":"Tissue types"},{"answer":0,"explain":"Blood is a connective tissue: its cells (red and white blood cells, platelets) are suspended in a fluid matrix (plasma), and it connects the body by transporting materials everywhere.","options":["connective tissue","epithelial tissue","muscle tissue","nervous tissue"],"q":"Blood is classified as which type of tissue?","topic":"Tissue types"},{"answer":1,"explain":"Skeletal muscle moves bones voluntarily (like the biceps); cardiac muscle is found only in the heart; smooth muscle works involuntarily in organs like the stomach and bladder.","options":["walls of the stomach — cardiac muscle","biceps — skeletal muscle","bladder — skeletal muscle","heart wall — smooth muscle"],"q":"A student looks at three muscle samples under a microscope. Which pairing is correct?","topic":"Muscle tissue"},{"answer":3,"explain":"Nervous tissue is made of neurons — cells specialized to carry electrical impulses quickly between the brain, spinal cord, and body parts.","options":["to store energy as fat","to secrete hormones into the blood","to contract and produce movement","to transmit electrical signals rapidly"],"q":"What is the main function of nervous tissue?","topic":"Nervous tissue"},{"answer":2,"explain":"Food travels mouth → esophagus → stomach → small intestine (where most digestion and absorption happen) → large intestine (where water is absorbed).","options":["mouth → esophagus → small intestine → stomach → large intestine","esophagus → mouth → small intestine → stomach → large intestine","mouth → esophagus → stomach → small intestine → large intestine","mouth → stomach → esophagus → small intestine → large intestine"],"q":"In which order does food pass through the main organs of the digestive system?","topic":"Digestive system"},{"answer":1,"explain":"The small intestine's folded walls and millions of villi give it a huge surface area for absorbing nutrients into the blood; the stomach mainly churns food and starts protein digestion.","options":["stomach","small intestine","large intestine","esophagus"],"q":"Most chemical digestion and nutrient absorption occur in the:","topic":"Digestive system"},{"answer":3,"explain":"The right side receives oxygen-poor blood and sends it to the lungs to pick up oxygen; the left side receives that oxygen-rich blood and pumps it out to the whole body.","options":["The right side of the heart pumps oxygen-rich blood to the body","Both sides of the heart pump blood directly to the lungs","The left side of the heart pumps oxygen-poor blood to the lungs","The left side of the heart pumps oxygen-rich blood to the body"],"q":"Which statement about the heart is TRUE?","topic":"Circulatory system"},{"answer":2,"explain":"Millions of alveoli create an enormous total surface area, and their one-cell-thick walls let oxygen and carbon dioxide diffuse quickly between the air and the blood.","options":["muscles that pump air into the blood","thick walls that slow down air flow","a huge total surface area and very thin walls","tiny hairs that trap all oxygen molecules"],"q":"Gas exchange in the lungs happens in the alveoli. Which feature of alveoli makes this efficient?","topic":"Respiratory system"},{"answer":1,"explain":"Working muscles need extra oxygen, so the respiratory system takes in more air while the circulatory system pumps blood faster to deliver that oxygen to the muscles.","options":["nervous and excretory — to remove sweat","respiratory and circulatory — to deliver more oxygen to muscles","musculoskeletal and digestive — to strengthen bones","nervous and digestive — to digest energy faster"],"q":"During a race, Erica's breathing and heart rate both increase. Which systems are working together here, and why?","topic":"System interactions"},{"answer":3,"explain":"Stem cells are unspecialized and self-renewing: they can make copies of themselves and differentiate into specialized cells such as blood, muscle, or nerve cells.","options":["they cannot divide at all","they are only found in plants","they are already specialized for one job","they can divide to produce more stem cells and also develop into specialized cell types"],"q":"What makes stem cells different from other human body cells?","topic":"Stem cells"}],"shortBank":[{"answer":"The digestive system breaks food down into small nutrient molecules, which are absorbed through the walls of the small intestine into the blood. The circulatory system then carries those nutrients in the blood to every cell in the body, where they are used for energy and growth. Material that cannot be digested continues to the large intestine.","marks":3,"q":"Explain how the digestive system and the circulatory system work together after you eat a meal. Name what each system contributes.","topic":"System interactions"},{"answer":"Epithelial tissue has cells packed tightly together with almost no space between them (e.g., the skin's surface or the lining of the stomach). Connective tissue has cells spread out within a matrix that may be solid, flexible, or fluid (e.g., bone, cartilage, or blood).","marks":2,"q":"Compare epithelial tissue and connective tissue: state one structural difference between them and give one example of each in the human body.","topic":"Tissue types"},{"answer":"Stem cells are unspecialized cells that can divide to make more stem cells and can develop (differentiate) into specialized cell types. In medicine they could be used to grow replacement skin for burn victims, or to produce healthy blood cells for patients with blood diseases such as leukemia. Researchers also hope to use them to repair damaged heart or nerve tissue.","marks":3,"q":"What are stem cells? Describe two ways stem cells could be used in medicine.","topic":"Stem cells"},{"answer":"The oxygen molecule is inhaled through the nose or mouth, travels down the trachea, into the bronchi, and reaches the alveoli in the lungs (respiratory system). It diffuses across the thin alveolar walls into the blood in the surrounding capillaries. The circulatory system carries it — via the heart — through arteries to capillaries in the leg muscle, where it diffuses out of the blood and into the muscle cell, which uses it for cellular respiration.","marks":4,"q":"Trace the path of an oxygen molecule from the air outside the body to a muscle cell in the leg. Name the structures it passes through and the body systems involved.","topic":"Respiratory and circulatory systems"}],"notes":"<h3>Cell Specialization</h3>\n<p>All cells start out the same, but as an organism develops, cells <strong>differentiate</strong> — they take on specific structures and jobs. This is <strong>cell specialization</strong>: a cell's structure always matches its function.</p>\n<ul>\n<li><strong>Red blood cells</strong> are biconcave discs with no nucleus, leaving maximum room for hemoglobin to carry oxygen.</li>\n<li><strong>Neurons</strong> are long and branched so they can carry messages over distances.</li>\n<li><strong>Muscle cells</strong> are packed with protein fibres that contract.</li>\n</ul>\n\n<h3>Levels of Organization</h3>\n<p>From smallest to largest:</p>\n<ul>\n<li><strong>Cell</strong> — the basic unit of life.</li>\n<li><strong>Tissue</strong> — a group of similar cells working together.</li>\n<li><strong>Organ</strong> — two or more tissues working together (e.g., the stomach).</li>\n<li><strong>System</strong> — a group of organs working together (e.g., the digestive system).</li>\n<li><strong>Organism</strong> — all systems working together — you.</li>\n</ul>\n\n<h3>The Four Tissue Types</h3>\n<table>\n<tr><th>Tissue</th><th>Job</th><th>Examples</th></tr>\n<tr><td><strong>Epithelial</strong></td><td>Covers and protects surfaces; absorbs and secretes substances</td><td>Skin, lining of the mouth and intestines</td></tr>\n<tr><td><strong>Muscle</strong></td><td>Contracts to create movement</td><td>Biceps, heart, stomach wall</td></tr>\n<tr><td><strong>Nervous</strong></td><td>Carries messages around the body</td><td>Brain, spinal cord, nerves</td></tr>\n<tr><td><strong>Connective</strong></td><td>Supports, connects, and protects</td><td>Bone, cartilage, blood, tendons, fat</td></tr>\n</table>\n\n<h4>Muscle tissue types</h4>\n<table>\n<tr><th>Type</th><th>Appearance</th><th>Control</th><th>Location</th></tr>\n<tr><td><strong>Skeletal</strong></td><td>Striated (striped)</td><td>Voluntary</td><td>Attached to bones</td></tr>\n<tr><td><strong>Smooth</strong></td><td>Not striated</td><td>Involuntary</td><td>Walls of the stomach, intestines, and blood vessels</td></tr>\n<tr><td><strong>Cardiac</strong></td><td>Striated and branched</td><td>Involuntary</td><td>Heart only</td></tr>\n</table>\n\n<h4>Nervous tissue</h4>\n<p>Made of <strong>neurons</strong>. Each neuron has <strong>dendrites</strong> (receive incoming signals), a <strong>cell body</strong>, and an <strong>axon</strong> (sends the signal onward). Messages pass from neuron to neuron across tiny gaps called <strong>synapses</strong>.</p>\n\n<h3>The Digestive System</h3>\n<p>Breaks food into small molecules the body can absorb and use.</p>\n<ul>\n<li><strong>Mouth</strong> — teeth chop food; saliva begins digesting starch.</li>\n<li><strong>Esophagus</strong> — wave-like muscular squeezes (<strong>peristalsis</strong>) push food down.</li>\n<li><strong>Stomach</strong> — acid and enzymes digest protein; muscles churn the food.</li>\n<li><strong>Small intestine</strong> — most digestion and absorption happen here; <strong>villi</strong> give it a huge surface area.</li>\n<li><strong>Large intestine</strong> — absorbs water; forms solid waste.</li>\n<li><strong>Rectum and anus</strong> — waste leaves the body.</li>\n</ul>\n<p>Helper organs: the <strong>liver</strong> makes bile (breaks down fat), the <strong>gallbladder</strong> stores bile, and the <strong>pancreas</strong> releases digestive enzymes.</p>\n\n<h3>The Circulatory System</h3>\n<p>Transports oxygen, nutrients, wastes, and hormones around the body.</p>\n<ul>\n<li><strong>Heart</strong> — a double pump with four chambers. The right side (right atrium, right ventricle) pumps blood to the lungs; the left side (left atrium, left ventricle) pumps it to the body.</li>\n<li><strong>Arteries</strong> — carry blood <strong>away</strong> from the heart; thick, elastic walls.</li>\n<li><strong>Veins</strong> — carry blood <strong>to</strong> the heart; contain valves that stop backflow.</li>\n<li><strong>Capillaries</strong> — tiny, thin-walled vessels where exchange with cells happens.</li>\n</ul>\n<p>Blood has four parts: <strong>red blood cells</strong> (hemoglobin carries oxygen), <strong>white blood cells</strong> (fight infection), <strong>platelets</strong> (clot the blood), and <strong>plasma</strong> (the liquid that carries nutrients, wastes, and hormones).</p>\n\n<h3>The Respiratory System</h3>\n<p>Brings oxygen in and removes carbon dioxide.</p>\n<p><strong>Air pathway:</strong> nasal cavity → pharynx → larynx → trachea → bronchi → bronchioles → <strong>alveoli</strong>. The <strong>diaphragm</strong> contracts to pull air into the lungs.</p>\n<p><strong>Gas exchange</strong> happens in the alveoli by <strong>diffusion</strong>: oxygen moves into the blood while carbon dioxide moves out. Alveoli are built for this job — enormous surface area, walls only one cell thick, moist surfaces, and each one wrapped in capillaries.</p>\n\n<h3>How the Systems Interact</h3>\n<ul>\n<li>The <strong>digestive</strong> system absorbs nutrients; the <strong>circulatory</strong> system delivers them — along with oxygen from the <strong>respiratory</strong> system — to cells for <strong>cellular respiration</strong>, which releases energy.</li>\n<li>The <strong>muscular</strong> system depends on that energy and oxygen, including the diaphragm for breathing and the heart muscle for pumping.</li>\n<li>The <strong>nervous</strong> system coordinates it all, for example speeding up the heart rate during exercise.</li>\n</ul>\n\n<h3>Stem Cells</h3>\n<p><strong>Stem cells</strong> are unspecialized cells that can divide and <strong>differentiate</strong> into specialized cell types.</p>\n<ul>\n<li><strong>Embryonic stem cells</strong> — <strong>pluripotent</strong>: can become almost any cell type. Using them raises ethical concerns because obtain
