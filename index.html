organizations.","options":["Ontario Liberal Party","Halton Regional Party","New Democratic Party","Toronto City Party"],"q":"Which of the following is a federal political party in Canada?","topic":"Political parties"},{"answer":3,"explain":"After a bill passes both the House of Commons and the Senate, the Governor General grants Royal Assent and it becomes an Act of Parliament.","options":["A national referendum","Approval by the Prime Minister","A second general election","Royal Assent by the Governor General"],"q":"What is the final step before a bill passed by Parliament becomes law?","topic":"How a bill becomes law"}],"shortBank":[{"answer":"Federal — e.g., national defence, foreign policy, criminal law, immigration, currency. Provincial — e.g., education, health care, highways, driver's licences. Municipal — e.g., water, garbage collection, local roads, public transit, zoning.","marks":3,"q":"Name the three levels of government in Canada and give one responsibility for each.","topic":"Levels of government"},{"answer":"Legislative (Parliament, or the provincial legislature) — debates and passes laws. Executive (Prime Minister and Cabinet, or Premier and Cabinet) — carries out and enforces laws and runs the government day to day. Judicial (the courts) — interprets laws, settles disputes, and reviews whether laws follow the Constitution.","marks":3,"q":"Name the three branches of government and briefly state what each one does.","topic":"Branches of government"},{"answer":"Parliamentary democracy: citizens elect representatives to Parliament, and the government is drawn from and accountable to the elected House of Commons. Constitutional monarchy: the King is the formal head of state, but his powers are limited by the Constitution and exercised on the advice of elected officials.","marks":2,"q":"Canada is described as both a parliamentary democracy and a constitutional monarchy. Explain what each term means in one sentence.","topic":"Democracy"},{"answer":"1) A bill is introduced in the House of Commons (or the Senate). 2) It passes through readings with debate and a vote at each stage, including committee study where experts and the public can give input. 3) If passed, it goes to the other chamber, which repeats the process. 4) Once both chambers pass it in identical form, the Governor General grants Royal Assent and it becomes law.","marks":4,"q":"Describe the main steps a bill goes through to become a law in Canada's Parliament.","topic":"How a bill becomes law"}],"notes":"<h3>The Three Levels of Government</h3>\n<p>Canada divides power between three levels. Each level handles different responsibilities, set out in the <strong>Constitution Act, 1867</strong>.</p>\n<table>\n<tr><th>Level</th><th>Leader (Ontario example)</th><th>Key responsibilities</th></tr>\n<tr><td><strong>Federal</strong></td><td>Prime Minister</td><td>National defence, criminal law, immigration, money and banking, trade, Indigenous affairs, employment insurance</td></tr>\n<tr><td><strong>Provincial</strong></td><td>Premier of Ontario</td><td>Education, health care, highways, natural resources, driver's licences</td></tr>\n<tr><td><strong>Municipal</strong></td><td>Mayor (e.g. of Oakville)</td><td>Water and sewers, garbage collection, local roads, public transit, parks, libraries, fire services</td></tr>\n</table>\n<p>Areas like the <strong>environment</strong> and <strong>agriculture</strong> are shared — both federal and provincial governments make laws about them.</p>\n\n<h3>The Three Branches of Government</h3>\n<ul>\n<li><strong>Legislative</strong> — makes the laws (Parliament federally; the Legislative Assembly in Ontario).</li>\n<li><strong>Executive</strong> — carries out the laws. Includes the <strong>Prime Minister and Cabinet</strong>, plus the <strong>Crown</strong> (the King, represented in Canada by the <strong>Governor General</strong>).</li>\n<li><strong>Judicial</strong> — interprets the laws through the courts, from provincial courts up to the <strong>Supreme Court of Canada</strong>. Judges are <strong>independent</strong> — politicians cannot tell them how to rule.</li>\n</ul>\n\n<h3>Parliament</h3>\n<p>Canada's federal legislature has three parts:</p>\n<ul>\n<li><strong>House of Commons</strong> — 338 <strong>Members of Parliament (MPs)</strong>, each <strong>elected</strong> by voters in one <strong>riding</strong> (electoral district). This is where most bills start and where the government is held to account (e.g. Question Period).</li>\n<li><strong>Senate</strong> — 105 <strong>senators</strong>, <strong>appointed</strong> by the Governor General on the Prime Minister's advice. They give bills a \"sober second thought\" — reviewing and suggesting changes.</li>\n<li><strong>The Crown</strong> — the monarch (currently <strong>King Charles III</strong>), represented by the <strong>Governor General</strong>. A bill only becomes law after the Governor General grants <strong>Royal Assent</strong>.</li>\n</ul>\n\n<h3>How a Bill Becomes a Law</h3>\n<ol>\n<li><strong>First reading</strong> — the bill is introduced; no debate.</li>\n<li><strong>Second reading</strong> — MPs debate the bill's main idea and vote.</li>\n<li><strong>Committee stage</strong> — a small group studies the bill in detail, hears witnesses, and can propose amendments.</li>\n<li><strong>Report stage</strong> — the committee reports back to the House.</li>\n<li><strong>Third reading</strong> — final debate and vote.</li>\n<li><strong>The other house</strong> — the bill goes through the same stages in the Senate.</li>\n<li><strong>Royal Assent</strong> — the Governor General signs it, and it becomes law (an <strong>Act</strong>).</li>\n</ol>\n<p>A bill about spending or taxes (<strong>money bills</strong>) must start in the House of Commons, not the Senate.</p>\n\n<h3>Elections</h3>\n<ul>\n<li>Canada uses <strong>first-past-the-post</strong>: in each riding, the candidate with the <strong>most votes wins</strong> — they do not need more than half.</li>\n<li>The party that wins the <strong>most seats</strong> usually forms the government. Win more than half the seats and it's a <strong>majority government</strong>; win the most but fewer than half and it's a <strong>minority government</strong> (it must get support from other parties to pass laws).</li>\n<li>Federal elections are held at least every <strong>four years</strong>. Canada is divided into <strong>338 federal ridings</strong>.</li>\n<li>To vote you must be a <strong>Canadian citizen</strong>, <strong>18 or older</strong> on election day, and registered to vote.</li>\n</ul>\n\n<h3>Why Voting Matters</h3>\n<ul>\n<li>Voting is how citizens choose who represents them and hold governments <strong>accountable</strong>.</li>\n<li>Many ridings are decided by <strong>small margins</strong> — a few hundred votes can change the outcome.</li>\n<li>Young people vote at <strong>lower rates</strong> than older Canadians, so issues that matter to youth get less attention from politicians.</li>\n<li>Voting is both a <strong>right</strong> (protected by the Charter of Rights and Freedoms) and a <strong>responsibility</strong> of citizenship.</li>\n</ul>\n\n<h3>Political Parties and Platforms</h3>\n<ul>\n<li>A <strong>political party</strong> is a group of people with shared ideas about how the country should be run.</li>\n<li>A <strong>platform</strong> is the party's plan — its promises on taxes, health care, the environment, education, and more. Voters compare platforms before choosing.</li>\n<li>Major federal parties include the <strong>Liberals</strong>, <strong>Conservatives</strong>, <strong>NDP</strong>, <strong>Bloc Québécois</strong>, and <strong>Green Party</strong>. In Ontario provincial politics the main parties are the <strong>Progressive Conservatives</strong>, <strong>Liberals</strong>, <strong>NDP</strong>, and <strong>Greens</strong>.</li>\n<li>The party with the second-most seats forms the <strong>Official Opposition</strong> — its job is to question and challenge the government.</li>\n</ul>\n"},{"id":"chv-rights","name":"Rights and Responsibilities","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":0,"explain":"The Charter is entrenched in the Constitution Act, 1982 — that constitutional status is what lets courts strike down any law that violates it.","options":["The Constitution Act, 1982","The British North America Act, 1867","The Indian Act","The Official Languages Act"],"q":"The Canadian Charter of Rights and Freedoms is part of which document?","topic":"The Charter"},{"answer":2,"explain":"Fundamental freedoms protect expression, religion, thought, belief, peaceful assembly, and association — the basic liberties of a free society.","options":["The right to free housing","The right to a driver's licence","Freedom of expression","The right to skip jury duty"],"q":"Which of the following is a fundamental freedom protected by the Charter?","topic":"Fundamental freedoms"},{"answer":1,"explain":"Democratic rights include the right to vote, the right to run for office, and the rule that no federal or provincial parliament can last longer than five years.","options":["Mobility rights","Democratic rights","Legal rights","Equality rights"],"q":"Which Charter right guarantees that federal elections must be held at least every five years?","topic":"Democratic rights"},{"answer":3,"explain":"Mobility rights guarantee that every citizen can enter, remain in, and leave Canada, and can move to any province to live and work.","options":["Drive without a licence","Travel without a passport","Vote in a provincial election while living abroad","Move freely between provinces and live or work anywhere in Canada"],"q":"Mobility rights under the Charter allow Canadians to:","topic":"Mobility rights"},{"answer":0,"explain":"Legal rights protect people dealing with the justice system — including being told the reason for an arrest and the right to contact a lawyer without delay.","options":["The right to be told why you are arrested and to contact a lawyer","Immediate release from custody","A trial within 24 hours","The right to choose your judge"],"q":"If you are arrested in Canada, which legal right does the Charter guarantee?","topic":"Legal rights"},{"answer":3,"explain":"Section 15 bans discrimination on listed grounds — race, sex, age, disability, religion and others — and courts have recognized additional analogous grounds since.","options":["Only race and religion","Only citizenship status","Political popularity","Grounds such as race, sex, age, and disability"],"q":"Section 15 equality rights protect Canadians from discrimination based on:","topic":"Equality rights"},{"answer":2,"explain":"Sections 16 to 23 make English and French the official languages of Canada, including the right to minority-language education where numbers warrant.","options":["Everyone must speak French","Only English may be used in federal institutions","English and French as the official languages of Canada","No language guarantees at all"],"q":"The Charter guarantees which language rights?","topic":"Language rights"},{"answer":1,"explain":"Section 1 allows limits on rights, but the government must prove each limit is reasonable and justified — the test courts use is called the Oakes test.","options":["No limits at all","Such reasonable limits prescribed by law as can be demonstrably justified in a free and democratic society","Whatever the police decide in the moment","Limits set by municipal councils only"],"q":"Section 1 of the Charter says rights are subject to:","topic":"Reasonable limits"},{"answer":2,"explain":"Freedom of expression is protected, but courts have upheld hate-speech laws as reasonable, justified limits under Section 1.","options":["Free expression is not in the Charter","The Charter only protects religious speech","Limits on expression can be justified under Section 1","The government can ignore the Charter whenever it wants"],"q":"Laws against hate speech are allowed in Canada mainly because:","topic":"Reasonable limits"},{"answer":3,"explain":"Rights come with responsibilities: obeying the law, serving on a jury when called, respecting the rights of others, and participating in democracy.","options":["Freedom of religion","The right to vote","Equality before the law","Obeying the law and serving on a jury when called"],"q":"Which of the following is a responsibility of citizenship rather than a Charter right?","topic":"Responsibilities"},{"answer":0,"explain":"The Charter limits government action at every level — federal, provincial, and municipal. It does not directly govern purely private disputes between individuals.","options":["Actions of federal, provincial, and municipal governments","Only federal government actions","Private arguments between neighbours","Only criminal trials"],"q":"The Charter applies to:","topic":"The Charter"},{"answer":3,"explain":"Section 33 lets Parliament or a legislature override certain Charter sections temporarily — the override expires after five years unless it is renewed.","options":["Ignore the entire Constitution permanently","Remove the Prime Minister from office","Ban all public protests","Override certain Charter rights for up to five years at a time"],"q":"The notwithstanding clause (Section 33) allows governments to:","topic":"Notwithstanding clause"}],"shortBank":[{"answer":"Any three categories with an example, e.g.: Fundamental freedoms — freedom of expression or religion. Democratic rights — the right to vote. Mobility rights — the right to move between provinces to live and work. Legal rights — the right to a lawyer when arrested. Equality rights — equal treatment regardless of race, sex, or disability. Language rights — minority-language education.","marks":3,"q":"Name three categories of rights protected by the Charter and give one example of each.","topic":"Categories of rights"},{"answer":"Rights are not absolute — a government can limit them, but only through a law that is reasonable and can be proven justified in a free and democratic society. Courts apply the Oakes test to decide.","marks":2,"q":"Explain in your own words what Section 1 of the Charter means by “reasonable limits” on rights.","topic":"Reasonable limits"},{"answer":"Every right implies a responsibility toward others. For example, freedom of expression comes with the responsibility not to spread hate propaganda or defamation; the right to vote comes with the responsibility to make an informed choice and respect the outcome.","marks":3,"q":"Explain the connection between rights and responsibilities, using one concrete example.","topic":"Rights vs responsibilities"},{"answer":"1) It would violate freedom of peaceful assembly and freedom of expression — both fundamental freedoms. 2) Under Section 1, the government would have to prove the ban is a reasonable, justified limit — a total ban is likely too broad when narrower rules (such as noise or time limits) would achieve the goal.","marks":4,"q":"A new provincial law bans all public protests near government buildings. Using what you know about the Charter, explain two arguments someone could make against this law.","topic":"The Charter in action"}],"notes":"<h3>What the Charter Is</h3>\n<ul>\n<li>The <strong>Canadian Charter of Rights and Freedoms</strong> is Part I of the <strong>Constitution Act, 1982</strong>. It took effect on April 17, 1982.</li>\n<li>It protects the rights of <strong>everyone in Canada</strong> — citizens and non-citizens alike (a few rights, like voting, belong to citizens only).</li>\n<li>It applies to <strong>government action</strong>: federal and provincial governments, legislatures, municipalities, police, and courts. It does <strong>not</strong> apply to private disputes between individuals or businesses — those are covered by human rights codes instead.</li>\n<li>Before 1982, Canada had only the <strong>Canadian Bill of Rights (1960)</strong>, an ordinary federal law Parliament could change or override. The Charter is part of the Constitution, so it sits <strong>above</strong> ordinary laws.</li>\n</ul>\n\n<h3>The Rights, Section by Section</h3>\n<table>\n<tr><th>Sections</th><th>Rights</th><th>Key points</th></tr>\n<tr><td><strong>2</strong></td><td><strong>Fundamental freedoms</strong></td><td>Freedom of (a) conscience and religion; (b) thought, belief, opinion and expression, including freedom of the press and other media; (c) peaceful assembly; (d) association.</td></tr>\n<tr><td><strong>3–5</strong></td><td><strong>Democratic rights</strong></td><td>Every <strong>citizen</strong> can vote and run as a candidate (s. 3). No more than <strong>5 years</strong> between elections (s. 4). Parliament and legislatures must sit at least once every <strong>12 months</strong> (s. 5).</td></tr>\n<tr><td><strong>6</strong></td><td><strong>Mobility rights</strong></td><td>Every citizen may enter, remain in, and leave Canada; move to and live in any province; and earn a living in any province.</td></tr>\n<tr><td><strong>7–14</strong></td><td><strong>Legal rights</strong></td><td>Life, liberty and security of the person (s. 7); protection against unreasonable search or seizure (s. 8) and arbitrary detention (s. 9); rights on arrest — to be told why, to get a lawyer, and to challenge the detention (s. 10); rights of the accused, including <strong>presumption of innocence</strong> and a fair, reasonably speedy trial (s. 11); no cruel and unusual punishment (s. 12); protection against self-incrimination (s. 13); right to an interpreter (s. 14).</td></tr>\n<tr><td><strong>15</strong></td><td><strong>Equality rights</strong></td><td>Everyone is equal before and under the law, with equal protection and benefit of the law <strong>without discrimination</strong> based on race, national or ethnic origin, colour, religion, sex, age, or mental or physical disability (courts have added grounds such as sexual orientation). Affirmative-action-style programs that help disadvantaged groups are allowed (s. 15(2)). Took effect in <strong>1985</strong>, three years after the rest of the Charter.</td></tr>\n<tr><td><strong>16–23</strong></td><td><strong>Language rights</strong></td><td>English and French are the official languages of Canada (s. 16). Minority-language communities have the right to education in their language <strong>where numbers warrant</strong> (s. 23).</td></tr>\n</table>\n\n<h3>Reasonable Limits — Section 1</h3>\n<p>Charter rights are <strong>not absolute</strong>. Section 1 says they are subject to \"such reasonable limits prescribed by law as can be demonstrably justified in a free and democratic society.\" A classic example: freedom of expression does not protect hate speech or yelling \"fire\" in a crowded theatre.</p>\n<p>When a court decides whether a limit is reasonable, it uses the <strong>Oakes test</strong> (from <em>R v Oakes</em>, 1986):</p>\n<ol>\n<li><strong>Important goal</strong> — the limit must pursue a pressing and substantial objective (e.g. public safety).</li>\n<li><strong>Rational connection</strong> — the limit must actually help achieve that goal.</li>\n<li><strong>Minimal impairment</strong> — the government must restrict the right as little as possible; there should be no less rights-harming way to reach the goal.</li>\n<li><strong>Overall balance</strong> — the benefit of the limit must outweigh the harm done to the right.</li>\n</ol>\n<p>If the government's limit fails any step, the court can strike the law down.</p>\n\n<h3>The Notwithstanding Clause — Section 33</h3>\n<ul>\n<li>Section 33 lets <strong>Parliament or a provincial legislature</strong> pass or keep a law <strong>even if it violates</strong> certain Charter rights — specifically fundamental freedoms (s. 2) and legal and equality rights (ss. 7–15).</li>\n<li>It <strong>cannot</strong> override democratic rights (ss. 3–5), mobility rights (s. 6), or language rights (ss. 16–23).</li>\n<li>The legislature must <strong>state expressly</strong> that the law operates notwithstanding the Charter, and the override <strong>expires after 5 years</strong> unless renewed — so voters get a say at the next election.</li>\n<li>It is used rarely and is politically controversial. Quebec has invoked it for French-language laws; Ontario invoked it over Toronto's council ward boundaries (2018).</li>\n</ul>\n\n<h3>Rights Come With Responsibilities</h3>\n<ul>\n<li><strong>Respect others' rights</strong> — your freedoms end where someone else's begin (this is the everyday version of Section 1).</li>\n<li><strong>Obey the law</strong> and <strong>pay taxes</strong>, which fund the services and institutions that protect everyone's rights.</li>\n<li><strong>Vote</strong> in elections — democratic rights only work if citizens use them.</li>\n<li><strong>Participate</strong>: serve on a jury if summoned, help your community, stay informed, and stand up against discrimination.</li>\n<li><strong>Protect Canada's shared goods</strong>: the environment, public property, and the democratic process itself.</li>\n</ul>\n"},{"id":"chv-action","name":"Civic Engagement and Action","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":0,"explain":"Voting is the most direct way citizens shape government — and voter turnout itself is treated as a measure of a democracy's health.","options":["Voting in an election","Watching a hockey game","Shopping online","Sleeping in"],"q":"Which of the following is a form of civic participation?","topic":"Participation"},{"answer":2,"explain":"Petitions collect signatures to demonstrate public support for a cause and pressure elected officials or organizations to act.","options":["Sue the government in court","Avoid paying municipal taxes","Show collective support for a cause and pressure decision-makers","Get out of jury duty"],"q":"A petition is a tool citizens use to:","topic":"Participation"},{"answer":1,"explain":"Advocacy means speaking up to influence decisions — contacting your MP, MPP, or councillor about an issue is one of the most direct forms.","options":["Voting in an election","Writing a letter to your Member of Parliament about an issue","Lobbying illegally","Civil disobedience"],"q":"Writing a letter to your Member of Parliament about an issue is an example of:","topic":"Advocacy"},{"answer":2,"explain":"Volunteering — food banks, park cleanups, coaching — is civic engagement in action, and Ontario requires 40 volunteer hours to graduate high school.","options":["It only counts if you are paid","It is required by law for every teenager","It is a form of civic engagement that strengthens communities","It has no measurable effect on the community"],"q":"Which statement about volunteering is TRUE?","topic":"Volunteering"},{"answer":1,"explain":"NGOs are independent non-profit groups — like the Red Cross or Greenpeace — that work on social, humanitarian, or environmental causes.","options":["National Government Office","Non-Governmental Organization","New Green Order","Northern Grants Organization"],"q":"NGO stands for:","topic":"NGOs"},{"answer":3,"explain":"NGOs amplify citizen voices, provide expertise to lawmakers, and deliver services — from disaster relief to environmental monitoring — that governments may not.","options":["They replace elected governments","They write all federal laws","They run elections","They give citizens a collective voice and deliver services governments may not"],"q":"Which of the following best describes the role of NGOs in a democracy?","topic":"NGOs"},{"answer":1,"explain":"Journalism gives voters the facts they need to make informed choices and investigates wrongdoing by those in power — which is why press freedom is protected.","options":["Entertaining voters","Informing citizens and holding those in power accountable","Running political campaigns","Replacing Parliament"],"q":"A free press supports democracy mainly by:","topic":"Media"},{"answer":3,"explain":"Media literacy means checking the source, looking for corroboration from reliable outlets, and spotting misinformation before amplifying it.","options":["Share it immediately to be first","Only share it if your friends already did","Delete it without reading","Check the source and verify it with reliable outlets"],"q":"Before sharing a surprising news story online, a responsible citizen should:","topic":"Media literacy"},{"answer":1,"explain":"Civil disobedience — such as sit-ins — breaks a law non-violently and openly, accepting the legal consequences in order to highlight injustice.","options":["Voting twice","Deliberately breaking a law, openly and peacefully, to challenge its injustice","Writing letters to the editor","Donating money to a charity"],"q":"Civil disobedience differs from ordinary protest because it involves:","topic":"Civil disobedience"},{"answer":3,"explain":"Effective action starts with research: understand the issue, then target the person or body that actually has the power to change it.","options":["Printing posters","Raising money","Choosing a hashtag","Researching the issue and identifying the decision-maker who can act"],"q":"What is the first step in planning an effective civic action project?","topic":"Civic action plan"},{"answer":0,"explain":"Traffic calming is a municipal matter — city councillors control local roads — so starting locally gets the fastest result.","options":["Municipal government (city council)","Federal Parliament","The United Nations","The Senate"],"q":"A student concerned about speeding near her school would most effectively start at which level of government?","topic":"Levels of action"},{"answer":3,"explain":"When a group does not vote, its concerns — tuition, housing, climate — carry less weight with decision-makers, so policies skew toward those who do show up.","options":["Elections get cancelled","Voting becomes illegal","Political parties are banned","Governments may ignore the priorities of underrepresented groups"],"q":"Low voter turnout among young people is a concern because:","topic":"Democratic participation"}],"shortBank":[{"answer":"Any three, e.g.: volunteering (helps the community directly and builds skills); signing or starting a petition (shows decision-makers public support); writing to a councillor, MPP, or MP (direct advocacy); joining a youth council or school club (collective voice); raising awareness responsibly on social media (informs others).","marks":3,"q":"List three different ways a 15-year-old who cannot yet vote can still participate civically, and briefly say what each accomplishes.","topic":"Forms of participation"},{"answer":"NGOs strengthen democracy by giving citizens a collective voice and delivering services and expertise (e.g., environmental monitoring, refugee support). The media strengthens democracy by informing voters and holding governments accountable through investigation and reporting.","marks":2,"q":"Explain one way NGOs and one way the media each strengthen Canadian democracy.","topic":"NGOs and media"},{"answer":"1) Research: gather facts about the cut and identify who decides (the school trustees). 2) Build support: start a petition and talk to students, parents, and teachers. 3) Act: delegate (speak) at a board meeting, write to trustees, contact local media — then follow up to see what happened.","marks":3,"q":"Your school board is considering cutting a program you care about. Outline three steps of a civic action plan to respond.","topic":"Civic action plan"},{"answer":"The councillor meeting is likely more effective because it targets the actual decision-maker and arrives with demonstrated public support (500 signatures). Angry posts alone rarely reach decision-makers. The online approach becomes more effective if it is factual and respectful, directly addresses the decision-maker, and is paired with offline action like the petition or meeting.","marks":4,"q":"Two students want change: one shares angry posts online, the other meets with her city councillor carrying a petition of 500 signatures. Which approach is likely more effective, and why? What could make the first approach more effective?","topic":"Evaluating action"}],"notes":"<h3>Ways to Participate in Democracy</h3>\n<p>Being a citizen isn't just about voting every few years. Democracy works when people take part between elections too.</p>\n<ul>\n<li><strong>Voting</strong> — the most direct way to have a say. Canadians can vote at 18 in federal, provincial/territorial, and municipal elections (youth can pre-register with Elections Canada from age 14).</li>\n<li><strong>Contacting representatives</strong> — email, call, or write to your <strong>MPP</strong> (provincial), <strong>MP</strong> (federal), or <strong>city councillor</strong> about an issue. Short, respectful, specific messages work best — say what you want them to do.</li>\n<li><strong>Petitions</strong> — collect signatures to show public support. The federal government has an <strong>official e-petition system</strong>: a petition sponsored by an MP that reaches <strong>500 signatures</strong> gets a formal government response.</li>\n<li><strong>Peaceful protest</strong> — marches, rallies, and sit-ins are protected by the <strong>Canadian Charter of Rights and Freedoms</strong> (freedom of expression and peaceful assembly, Section 2). Violence and property damage are not protected.</li>\n</ul>\n\n<h3>Advocacy: Speaking Up Effectively</h3>\n<p><strong>Advocacy</strong> means publicly supporting a cause or policy change. Effective advocacy is:</p>\n<ul>\n<li><strong>Informed</strong> — know the facts and the other side's arguments.</li>\n<li><strong>Specific</strong> — have a clear ask (a new law, a budget change, a policy fix), not just \"raise awareness.\"</li>\n<li><strong>Persistent</strong> — change usually takes repeated pressure over time.</li>\n<li><strong>Coalition-building</strong> — teaming up with others (groups, schools, community organizations) multiplies your voice.</li>\n</ul>\n\n<h3>Volunteering</h3>\n<p>Volunteering is unpaid work for the community — food banks, park cleanups, tutoring, coaching. The community gets help it couldn't otherwise afford, and volunteers build skills and connections (Ontario students need <strong>40 community-involvement hours</strong> to graduate).</p>\n\n<h3>NGOs: Change Beyond Government</h3>\n<p><strong>Non-governmental organizations (NGOs)</strong> are independent non-profit groups that work on issues governments can't or won't address alone — human rights, the environment, disaster relief, health. Canadian examples:</p>\n<ul>\n<li><strong>Amnesty International Canada</strong> — human rights research and campaigns.</li>\n<li><strong>Canadian Red Cross</strong> — disaster relief and emergency response.</li>\n<li><strong>David Suzuki Foundation</strong> — environmental protection and climate action.</li>\n<li><strong>UNICEF Canada</strong> — children's rights and welfare worldwide.</li>\n</ul>\n<p>NGOs <strong>research issues, lobby governments, deliver services, and give people ways to act</strong> — donating, volunteering, campaigning — beyond voting.</p>\n\n<h3>The Media's Role in Democracy</h3>\n<p>A free press keeps democracy healthy by <strong>informing voters, investigating power, and giving different viewpoints a platform</strong>. <strong>Media literacy</strong> means judging information before you share or act on it.</p>\n<h4>Spotting bias and misinformation</h4>\n<ul>\n<li><strong>Check the source</strong> — who published this, and what do they gain from it?</li>\n<li><strong>Watch the language</strong> — loaded or emotional words (\"corrupt,\" \"disaster,\" \"miracle\") signal opinion, not reporting.</li>\n<li><strong>Corroborate</strong> — can you find the same claim from an independent, reputable source?</li>\n<li><strong>Check the date</strong> — old stories resurface as if they're new.</li>\n<li><strong>Verify images</strong> — photos can be cropped, staged, or from a different event entirely (try a reverse image search).</li>\n</ul>\n<p><strong>Bias</strong> is slanted but possibly factual coverage; <strong>misinformation</strong> is false information spread without intent to deceive; <strong>disinformation</strong> is false information spread <strong>deliberately</strong> to mislead.</p>\n\n<h3>Civil Disobedience</h3>\n<p><strong>Civil disobedience</strong> is the deliberate, public, non-violent breaking of a law to protest injustice — with protesters <strong>accepting the legal consequences</strong> to highlight the injustice.</p>\n<ul>\n<li><strong>Historical examples</strong> — Gandhi's Salt March (1930) against British colonial rule; Martin Luther King Jr. and the U.S. civil rights movement's sit-ins and marches; the women's suffrage movement's protests for the vote.</li>\n<li><strong>The debate</strong> — supporters say it's justified when legal channels have failed; critics say it undermines the rule of law.</li>\n</ul>\n\n<h3>Levels of Civic Action</h3>\n<table>\n<tr><th>Level</th><th>Example issue</th><th>Example action</th></tr>\n<tr><td><strong>Local</strong></td><td>Unsafe crosswalk near your school</td><td>Petition city council; speak at a council meeting</td></tr>\n<tr><td><strong>National</strong></td><td>Lowering the voting age</td><td>Write your MP; start a federal e-petition</td></tr>\n<tr><td><strong>Global</strong></td><td>Plastic pollution in oceans</td><td>Join an NGO campaign; raise funds for cleanup programs</td></tr>\n</table>\n\n<h3>Building a Civic Action Plan</h3>\n<p>Turn concern into a plan with five steps:</p>\n<ol>\n<li><strong>Issue</strong> — pick one specific problem you care about.</li>\n<li><strong>Research</strong> — learn the facts, who is affected, who has the power to change it.</li>\n<li><strong>Goal</strong> — set a clear, achievable target (what does success look like?).</li>\n<li><strong>Action</strong> — choose tactics that fit: petition, letter-writing, awareness campaign, fundraiser, meeting with a representative.</li>\n<li><strong>Evaluate</strong> — did it work? What would you do differently next time?</li>\n</ol>\n"}]},
{"id":"glc2o","name":"Career Studies (GLC2O1)","semester":1,"units":[{"id":"glc-self","name":"Self-Assessment and Career Exploration","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":1,"explain":"Transferable skills like communication, teamwork, and time management carry across many different jobs; the other options are technical skills tied to specific work.","options":["Welding a pipe joint","Communicating clearly in a team","Programming in Python","Operating a forklift"],"q":"Which of these is a transferable skill?","topic":"Skills"},{"answer":0,"explain":"Social types enjoy helping and working with people, so teaching and counselling are classic fits; the other options lean Investigative, Realistic, or Conventional.","options":["Teacher or counsellor","Accountant","Electrician","Lab technician"],"q":"A Holland Code (RIASEC) assessment sorts your interests into six types. If your top type is Social, which career cluster fits best?","topic":"Interests"},{"answer":2,"explain":"Values are what matter most to you in a job, like security, independence, or helping others. Skills are what you can do; interests are what you enjoy doing.","options":["Being good at math","Liking outdoor work","Wanting job security and a steady income","Knowing how to use a spreadsheet"],"q":"Which of the following is a work value rather than a skill or an interest?","topic":"Values"},{"answer":3,"explain":"The NOC is Canada's catalogue of occupations. Each entry lists typical duties, required skills, and education, making it a solid starting point for research.","options":["Ranks every job by salary","Lists each employer's phone number","Predicts exactly which jobs will disappear","Describes the duties, skills, and education for hundreds of occupations"],"q":"The National Occupation Classification (NOC) is useful for career research because it…","topic":"Researching Occupations"},{"answer":0,"explain":"Apprenticeships mix paid work under a skilled mentor with in-school training, and high school students can get a head start through OYAP, the Ontario Youth Apprenticeship Program.","options":["Apprenticeship","University degree","College diploma","Workplace entry with no training"],"q":"In Ontario, which pathway combines paid on-the-job training with classroom learning?","topic":"Education Pathways"},{"answer":2,"explain":"Ontario colleges are hands-on and career-focused, and many now offer applied degrees, graduate certificates, and transfer pathways to university.","options":["College programs never lead to further education","University is the only path to a well-paying career","Ontario colleges focus on hands-on, career-oriented programs, and many also offer degrees and graduate certificates","You need a university degree to enter any skilled trade"],"q":"Erica is deciding between college and university in Ontario. Which statement is TRUE?","topic":"Education Pathways"},{"answer":1,"explain":"Labour-market trends, like growth in health care or demand for skilled trades, help you choose a field with real opportunities instead of just following the crowd.","options":["What their friends plan to study","Which industries are growing or shrinking in Ontario","The price of textbooks this year","How many universities are in Toronto"],"q":"Which of these is a labour-market trend a student should pay attention to?","topic":"Labour Market"},{"answer":3,"explain":"Self-assessment matches careers to your own strengths and values. A high-paying job you dislike is a bad fit no matter what it pays.","options":["To assign you one permanent career for life","Because the results are sent to universities","To replace ever talking to a guidance counsellor","So your career choices fit who you are, not just what is popular or high-paying"],"q":"Why do career courses begin with self-assessment of your interests, skills, values, and personality?","topic":"Self-Assessment"},{"answer":1,"explain":"Talking to or shadowing someone who actually does the job reveals the real duties, pros, and cons that advertisements and job titles hide.","options":["Reading the company's social media posts","Asking a stranger online","An informational interview or job-shadowing someone in the role","Guessing from the job title"],"q":"What is the most reliable way to learn what a day in a job is really like?","topic":"Researching Occupations"},{"answer":2,"explain":"Personality is about fit, not better or worse. People who recharge alone often thrive in focused, independent roles, while others thrive in people-heavy ones.","options":["A busy retail sales floor","Planning events for large crowds","Solo research or writing-focused work","Cold-calling customers all day"],"q":"A student who recharges with quiet, independent work would likely prefer…","topic":"Personality"},{"answer":0,"explain":"myBlueprint is the education-planning tool used in many Ontario schools. It links your interests to careers, courses, and post-secondary pathways in one place.","options":["Track volunteer hours, explore careers, and plan courses toward graduation and post-secondary goals","Apply for a driver's licence","Register for American standardized tests","File their income taxes"],"q":"Ontario high school students often use myBlueprint to…","topic":"Education Pathways"},{"answer":3,"explain":"Job Bank publishes government labour-market data, including outlooks, wages, and regional demand. Ads and anecdotes have a motive or a sample size of one.","options":["A viral video about jobs that pay well","An older sibling's friend's opinion","An advertisement from a private career college","Job Bank Canada's labour-market outlooks"],"q":"Which source gives the most trustworthy outlook on whether an occupation is in demand in Ontario?","topic":"Researching Occupations"}],"shortBank":[{"answer":"The four parts are interests (what you enjoy, e.g., working with animals), skills (what you do well, e.g., explaining ideas clearly), values (what matters to you, e.g., job security), and personality (how you work best, e.g., independently or in teams). Any reasonable personal examples are accepted.","marks":3,"q":"Name the four parts of self-assessment covered in career studies, and give one example of each for yourself.","topic":"Self-Assessment"},{"answer":"A career cluster groups occupations that share similar skills, interests, or industries, such as health, skilled trades, or business. It narrows thousands of possible jobs into a manageable set that fits you, so exploration feels focused instead of overwhelming.","marks":2,"q":"What is a career cluster, and why is it useful when you are exploring careers?","topic":"Career Clusters"},{"answer":"Apprenticeship: paid on-the-job training with a skilled mentor plus classroom learning; best for skilled trades like electrician or plumber, and can start in high school through OYAP. College: hands-on, career-oriented diplomas and certificates (usually 2-3 years); best for applied careers like paramedic, graphic designer, or police officer; many colleges also offer degrees. University: academic degrees (3-4 years); best for professions built on deep theory and research, like engineering, medicine, law, or teaching.","marks":4,"q":"Describe Ontario's three main post-secondary pathways: apprenticeship, college, and university. Include what each one is best suited for.","topic":"Education Pathways"},{"answer":"Any two valid reasons, for example: to choose fields with growing demand and strong job prospects; to learn typical wages so your expectations are realistic; to avoid years of training for an occupation that is shrinking; to find out where in Ontario the jobs actually are.","marks":2,"q":"Give two reasons why checking labour-market information matters before you choose a career path.","topic":"Labour Market"}],"notes":"<h3>Self-Assessment: Know Yourself</h3>\n<p>Career courses start with self-assessment for one reason: the best career fit is a match between <strong>who you are</strong> and <strong>what the job actually requires</strong>. Choosing by salary or prestige alone is how people end up in jobs they dislike.</p>\n<h4>The four parts of self-assessment</h4>\n<ul>\n<li><strong>Interests</strong> — what you enjoy doing (e.g. working outdoors, building things, helping people). The <strong>Holland Code (RIASEC)</strong> sorts interests into six types: Realistic, Investigative, Artistic, Social, Enterprising, Conventional.</li>\n<li><strong>Skills</strong> — what you do well (e.g. explaining ideas clearly, fixing bikes, mental math).</li>\n<li><strong>Values</strong> — what matters to you at work (e.g. helping others, high income, job security, creativity, work-life balance, independence). A value is not a skill or an interest.</li>\n<li><strong>Personality</strong> — how you naturally operate (e.g. someone who recharges with quiet, independent work will likely prefer solo tasks over constant teamwork).</li>\n</ul>\n<h4>Transferable vs job-specific skills</h4>\n<table>\n<tr><th>Transferable skills</th><th>Job-specific skills</th></tr>\n<tr><td>Useful in <strong>almost any job</strong>: communication, teamwork, problem-solving, time management, leadership</td><td>Tied to <strong>one occupation</strong>: welding, coding in Python, operating a cash register, giving a flu shot</td></tr>\n</table>\n<p>Employers hire for both, but transferable skills are what let you change careers later.</p>\n\n<h3>Researching Occupations</h3>\n<p>Never pick a career from the job title alone. Dig into what the work is really like:</p>\n<ul>\n<li><strong>NOC profiles</strong> — the <strong>National Occupational Classification (NOC)</strong> is Canada's catalogue of occupations; each entry lists typical duties, required skills, and education.</li>\n<li><strong>Job Bank</strong> (jobbank.gc.ca) — the federal site for wages, outlooks, and regional demand.</li>\n<li><strong>Informational interviews and job shadowing</strong> — talking to or shadowing someone who actually does the job is the most reliable way to learn what a day in it is really like. Ads and titles hide the boring and hard parts.</li>\n<li><strong>myBlueprint</strong> — the planning tool used in many Ontario schools to track volunteer hours, explore careers, and plan courses toward graduation and post-secondary goals.</li>\n</ul>\n<p><strong>Career clusters</strong> group occupations that share skills, interests, or industries (e.g. health, skilled trades, business). They narrow thousands of job titles down to a few directions worth exploring.</p>\n\n<h3>Education Pathways in Ontario</h3>\n<table>\n<tr><th>Pathway</th><th>What it is</th><th>Best for</th></tr>\n<tr><td><strong>Apprenticeship</strong></td><td><strong>Paid</strong> on-the-job training with a skilled mentor, plus classroom (in-school) sessions</td><td>Skilled trades such as electrician or plumber; <strong>OYAP</strong> lets high school students start early</td></tr>\n<tr><td><strong>College</strong></td><td>Hands-on, applied programs — diplomas and certificates, usually 1–3 years (e.g. Sheridan, Humber, Mohawk); apply through ontariocolleges.ca</td><td>Practical careers like paramedic, graphic designer, or early childhood educator</td></tr>\n<tr><td><strong>University</strong></td><td>Academic degrees focused on theory and research, usually 4 years (e.g. U of T, McMaster); apply through OUAC</td><td>Professions like engineer, teacher, or doctor — often plus further schooling</td></tr>\n<tr><td><strong>Workplace</strong></td><td>Straight into a job with on-the-job training, no post-secondary required</td><td>Entering the workforce right after high school</td></tr>\n</table>\n<p><strong>College vs university:</strong> college is hands-on and applied; university is academic and theoretical. Neither is \"better\" — the right one depends on the career.</p>\n\n<h3>Reading Labour-Market Information</h3>\n<p>Before committing years of training, check the numbers:</p>\n<ul>\n<li><strong>Demand and outlook</strong> — Job Bank publishes outlooks (good, fair, or limited) for each occupation, by region.</li>\n<li><strong>Wages</strong> — look at the <strong>median wage</strong>, not the top earners, so your expectations are realistic.</li>\n<li><strong>Growth and unemployment</strong> — growing fields mean more openings; high unemployment in a field means stiff competition.</li>\n</ul>\n<p><strong>Why it matters:</strong> labour-market information helps you train for fields with growing demand instead of shrinking ones, and keeps your salary expectations grounded in reality.</p>\n"},{"id":"glc-planning","name":"Education and Career Planning","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":1,"explain":"SMART stands for Specific, Measurable, Achievable, Relevant, and Time-bound. Only the chemistry goal names a clear target, a way to measure it, a deadline, and a concrete action.","options":["I will study more","I will raise my chemistry mark from 75% to 82% by December by reviewing 20 minutes each night","I will be successful one day","I will try harder in school"],"q":"Which of these is a SMART goal?","topic":"SMART Goals"},{"answer":0,"explain":"Measurable means you can track progress with numbers, like a mark, a date, or an amount saved, so you know exactly when you have succeeded.","options":["Measurable","Motivational","Major","Monthly"],"q":"In a SMART goal, the M stands for…","topic":"SMART Goals"},{"answer":2,"explain":"Strong decisions compare real options against your own goals and values instead of copying others, deciding on salary alone, or avoiding the choice.","options":["Picking whatever your friends pick","Choosing the option with the highest starting salary, no other factors","Listing your options, weighing pros and cons against your goals and values, then deciding","Putting off the decision until someone decides for you"],"q":"Which of these is a good decision-making strategy for choosing courses or careers?","topic":"Decision-Making"},{"answer":3,"explain":"OSAP is Ontario's student financial aid program. It offers grants, which you do not repay, and loans for college, university, and other approved programs.","options":["A scholarship only for athletes","A loan you must repay with interest while still in school","Funding only for university students","Ontario's student financial aid program, offering grants and loans for post-secondary study"],"q":"What is OSAP (Ontario Student Assistance Program)?","topic":"Post-Secondary Costs"},{"answer":0,"explain":"A good plan works backward from your goal: the courses you take now must cover OSSD graduation requirements plus the prerequisites for your chosen college, university, apprenticeship, or workplace pathway.","options":["The courses you take now to your graduation requirements and the post-secondary path you want","Your favourite teachers to your timetable","Your part-time job to your weekends","Your electives to your friends' schedules"],"q":"A high-school education plan should connect…","topic":"Education Plans"},{"answer":2,"explain":"The real cost of school goes well beyond tuition. Housing, food, and transportation often rival tuition itself, especially if you move away from home.","options":["Tuition only","Tuition and textbooks","Tuition, housing, food, transportation, and personal expenses","Tuition and entertainment"],"q":"When planning for post-secondary costs, which list is the most complete budget?","topic":"Post-Secondary Costs"},{"answer":1,"explain":"The OSSD requires 40 hours of community involvement. Volunteering also builds experience and references you can put on a resume.","options":["100 volunteer hours","40 hours of community involvement","A paid part-time job","A full co-op placement"],"q":"To earn an Ontario Secondary School Diploma (OSSD), students must complete…","topic":"Education Plans"},{"answer":3,"explain":"Plans meet reality: programs fill up, interests shift, and costs change. A backup path means one setback does not stall your whole future.","options":["Because a first plan never works out","To impress the guidance counsellor","Because the government requires two plans","Because interests, marks, costs, or admission cutoffs can change, and a second path keeps you moving forward"],"q":"Why should a career plan include a backup (Plan B)?","topic":"Decision-Making"},{"answer":0,"explain":"SHSM programs bundle sector-focused courses, industry certifications such as First Aid, and co-op experience, giving students a head start on a career path.","options":["Bundle related courses, certifications, and co-op experience around a career sector like health or business","Skip all math requirements","Graduate a year early automatically","Guarantee a university scholarship"],"q":"A Specialist High Skills Major (SHSM) lets Ontario high school students…","topic":"Education Plans"},{"answer":2,"explain":"Good short-term goals are stepping stones. Signing up for OYAP and keeping math marks up feeds directly into the long-term goal of an electrical apprenticeship.","options":["Long-term: win the lottery / Short-term: buy a ticket","Long-term: become a nurse / Short-term: finish this week's homework","Long-term: become an electrician / Short-term: sign up for OYAP and keep my math marks up this semester","Long-term: travel the world / Short-term: skip class"],"q":"Which pair correctly shows a short-term goal supporting a long-term goal?","topic":"SMART Goals"},{"answer":1,"explain":"Prerequisites chain together: the courses you pick in Grade 10 unlock, or block, the Grade 11 and 12 courses that college and university programs require.","options":["The week applications are due","Now, because Grade 10 course choices affect prerequisites for the Grade 11 and 12 courses that programs require","After graduation","Only if their marks drop"],"q":"When should a Grade 10 student start seriously researching post-secondary programs?","topic":"Education Plans"},{"answer":3,"explain":"Salary alone ignores fit. Hours, work environment, training costs, and whether the work suits you all determine whether a well-paying job is actually good for you.","options":["Talking to a guidance counsellor","Researching two or three options first","Writing down pros and cons","Deciding based only on starting salary, without considering fit, costs, or lifestyle"],"q":"Which decision-making mistake should students avoid?","topic":"Decision-Making"}],"shortBank":[{"answer":"A SMART version covers all five elements, for example: I will raise my French mark from 70% to 78% by the end of the semester by practising vocabulary 15 minutes each night and completing all homework. (Specific: French mark. Measurable: 70 to 78%. Achievable: with nightly practice. Relevant: it lifts my average. Time-bound: end of semester.)","marks":3,"q":"Rewrite this vague goal as a SMART goal: I want to do better in French.","topic":"SMART Goals"},{"answer":"Engineering programs require specific Grade 12 courses such as advanced functions, calculus, physics, chemistry, and English, and each of those requires its Grade 11 prerequisite, which requires the right Grade 10 courses. Waiting until Grade 12 can leave you missing a link in the chain and delay your plans by a full year.","marks":2,"q":"Explain why a Grade 10 student who wants to study engineering should check university prerequisites now, not in Grade 12.","topic":"Education Plans"},{"answer":"Costs beyond tuition: housing or rent, food and groceries, transportation, textbooks and supplies, personal expenses (any four). Help paying: OSAP grants and loans, scholarships and bursaries, RESP savings, part-time or co-op earnings (any two).","marks":4,"q":"List four kinds of costs beyond tuition that a student should budget for when planning for college or university, and name two ways Ontario students can get help paying for school.","topic":"Post-Secondary Costs"},{"answer":"Any two valid strategies, for example: list the pros and cons of each option; compare each option against your interests, values, and skills; talk to a guidance counsellor or someone working in the field; research labour-market outlooks and the education each option needs; test an option first through a related course, volunteer role, or co-op.","marks":2,"q":"Describe two decision-making strategies you could use when choosing between two career options.","topic":"Decision-Making"}],"notes":"<h3>SMART Goals</h3>\n<p>A vague goal like \"do better in school\" is easy to ignore. A <strong>SMART goal</strong> is built so you can actually follow through:</p>\n<table>\n<tr><th>Letter</th><th>Stands for</th><th>Example</th></tr>\n<tr><td><strong>S</strong></td><td><strong>Specific</strong> — says exactly what you will do</td><td>Raise my chemistry mark — not \"do better in science\"</td></tr>\n<tr><td><strong>M</strong></td><td><strong>Measurable</strong> — trackable with numbers</td><td>From 75% to 82%, so you know when you've succeeded</td></tr>\n<tr><td><strong>A</strong></td><td><strong>Achievable</strong> — realistic with real effort</td><td>Reviewing 20 minutes each night, not 3 hours</td></tr>\n<tr><td><strong>R</strong></td><td><strong>Relevant</strong> — connects to your bigger plans</td><td>Chemistry matters for the health-science programs I'm considering</td></tr>\n<tr><td><strong>T</strong></td><td><strong>Time-bound</strong> — has a deadline</td><td>By December</td></tr>\n</table>\n<p>Put together: <strong>\"I will raise my chemistry mark from 75% to 82% by December by reviewing 20 minutes each night.\"</strong></p>\n<p>Use <strong>short-term goals as stepping stones</strong> to long-term ones. Long-term: become an electrician. Short-term: sign up for OYAP and keep my math marks up this semester.</p>\n<h3>Making Good Decisions</h3>\n<p>Big choices — courses, programs, careers — deserve a process, not a gut feeling. The <strong>DECIDE</strong> model:</p>\n<ol>\n<li><strong>D — Define</strong> the decision. (\"Which Grade 11 science courses should I take?\")</li>\n<li><strong>E — Establish</strong> your criteria: interests, values, skills, costs, lifestyle.</li>\n<li><strong>C — Consider</strong> the alternatives. List every real option.</li>\n<li><strong>I — Identify</strong> the best option by weighing pros and cons against your criteria.</li>\n<li><strong>D — Develop</strong> an action plan with steps and deadlines.</li>\n<li><strong>E — Evaluate</strong> the result and adjust if needed.</li>\n</ol>\n<p><strong>Mistakes to avoid:</strong> deciding on starting salary alone (fit, hours, work environment, training costs and lifestyle all matter); copying what friends choose; putting the decision off until options disappear.</p>\n<h3>Building Your Education and Career Plan</h3>\n<p>Work <strong>backward from your goal</strong>. If you want engineering, check university prerequisites <strong>now</strong>: they require specific Grade 12 courses (advanced functions, calculus, physics, chemistry, English), each needing its Grade 11 prerequisite — the choices you make in Grade 10 open or close those doors.</p>\n<h4>Know your graduation requirements</h4>\n<ul>\n<li><strong>OSSD</strong>: 30 credits, <strong>40 hours of community involvement</strong>, and the literacy requirement (the OSSLT test or the literacy course).</li>\n<li>Map your courses each year against both the OSSD and your post-secondary prerequisites.</li>\n</ul>\n<h4>Build experience while you're in school</h4>\n<ul>\n<li><strong>SHSM (Specialist High Skills Major)</strong>: bundle sector-focused courses, certifications (e.g. First Aid) and co-op experience around a field like health or business.</li>\n<li><strong>OYAP</strong>: start an apprenticeship (e.g. electrician) while still in high school.</li>\n<li><strong>Co-op, volunteering and part-time jobs</strong>: build skills and references you can put on a resume.</li>\n</ul>\n<h4>Always have a Plan B</h4>\n<p>Interests change, marks fluctuate, programs fill up and admission cutoffs move. A <strong>backup path</strong> means one setback doesn't stall your whole future.</p>\n<h3>Paying for Post-Secondary School</h3>\n<p>The real cost goes well beyond tuition. A complete budget covers:</p>\n<table>\n<tr><th>Cost</th><th>Rough Ontario range per year</th></tr>\n<tr><td>Tuition</td><td>College roughly $3,000–$5,000; university roughly $6,000–$11,000+ depending on the program</td></tr>\n<tr><td>Housing</td><td>Residence with a meal plan roughly $12,000–$17,000 — living at home saves the most</td></tr>\n<tr><td>Food and transportation</td><td>Several thousand per year if you live away from home</td></tr>\n<tr><td>Books and supplies</td><td>Roughly $1,000–$2,000</td></tr>\n<tr><td>Personal expenses</td><td>Set a monthly amount and track it</td></tr>\n</table>\n<h4>Ways to pay</h4>\n<ul>\n<li><strong>OSAP</strong> (Ontario Student Assistance Program): the province's financial aid — <strong>grants you don't repay</strong> plus loans, based on financial need. You apply for each year you're in school.</li>\n<li><strong>Scholarships</strong> (awarded for marks, athletics, community involvement) and <strong>bursaries</strong> (awarded for financial need) — free money, so apply to many.</li>\n<li><strong>RESP</strong>: an education savings account — the government adds 20% on the first $2,500 saved each year.</li>\n<li><strong>Part-time and summer work</strong>: covers personal costs and builds your resume at the same time.</li>\n</ul>\n<p><strong>Budgeting rule:</strong> list every cost before you commit, compare total costs across schools (living at home vs. away changes everything), and re-check your plan each year.</p>\n"},{"id":"finlit-basics","name":"Financial Literacy","instructions":"No notes. Aim for about 15 minutes.","quizFormat":{"mc":10,"short":0},"scoringGuide":"<strong>9–10:</strong> Ready. Walk in confident. <strong>7–8:</strong> Passing range — review the ones you missed and make sure you can explain why. <strong>Below 7:</strong> Redo the missed questions until you can explain each answer in your own words.","mcBank":[{"topic":"Budgeting","q":"Erica earns $240 a month from a part-time job. She spends $80 on bus fare and lunches, $60 on clothes, and puts the rest into savings. What percentage of her income is she saving?","options":["25%","About 42%","50%","60%"],"answer":1,"explain":"Savings = 240 − 80 − 60 = $100. 100 ÷ 240 ≈ 42%."},{"topic":"Earning","q":"Erica's first paycheque shows gross pay of $500, but only $435 lands in her account. What is the most likely reason?","options":["Her employer kept a fee","CPP, EI, and income tax were deducted","The bank charged her a fee","She was paid for fewer hours than she worked"],"answer":1,"explain":"CPP, EI, and income tax come off your gross pay before the money reaches you. Gross pay is never what you take home."},{"topic":"Taxes","q":"In Ontario, HST is 13%. A pair of headphones is priced at $80 before tax. About how much will Erica pay at the checkout?","options":["$80","$86","$90","$93"],"answer":2,"explain":"$80 × 1.13 = $90.40, so about $90. In Ontario, always add 13% HST to the sticker price."},{"topic":"Interest","q":"Erica puts $1,000 in a savings account earning 5% per year, compounded annually, and doesn't touch it. Roughly how much is in the account after 2 years?","options":["$1,050","$1,100","$1,103","$1,200"],"answer":2,"explain":"Year 1: $1,050. Year 2: $1,050 × 1.05 = $1,102.50 ≈ $1,103. That's compounding: you earn interest on last year's interest."},{"topic":"Credit","q":"Erica gets a credit card charging 19.99% annual interest. She charges $600 and then makes only the minimum payment each month. What is the main danger?","options":["Her credit limit drops immediately","Interest piles up and the $600 ends up costing far more over time","The card gets cancelled","Nothing — minimum payments are always fine"],"answer":1,"explain":"At 19.99%, unpaid balances grow fast. Minimum payments mostly cover interest, so the debt shrinks very slowly while the total cost balloons."},{"topic":"Credit score","q":"Which habit helps build a good credit score?","options":["Paying the full balance on time every month","Applying for five credit cards at once","Regularly using 95% of your credit limit","Ignoring the monthly statement"],"answer":0,"explain":"On-time full payments build your score. Multiple applications, maxed-out limits, and missed payments all hurt it."},{"topic":"Consumer awareness","q":"Two cereal boxes: 400 g for $3.20, or 600 g for $4.50. Which is the better deal per gram?","options":["The 400 g box","The 600 g box","They cost the same per gram","Impossible to tell"],"answer":1,"explain":"400 g box: $3.20 ÷ 400 = $0.008/g. 600 g box: $4.50 ÷ 600 = $0.0075/g. Always compare unit prices, not sticker prices."},{"topic":"Fraud","q":"Erica gets a text: “TD Bank: your account is locked. Verify now: td-secure-login.xyz”. What is the safest move?","options":["Click the link and log in quickly before the account closes","Reply with her password to prove it's her","Delete the text and log in through the bank's official app","Forward it to friends so they can check it too"],"answer":2,"explain":"Banks never ask you to log in through a texted link, and “td-secure-login.xyz” is not the bank's real site. When in doubt, go to the official app yourself."},{"topic":"Interest","q":"Erica borrows $300 and agrees to pay 10% simple interest for one year. How much does she repay after the year?","options":["$300","$310","$330","$360"],"answer":2,"explain":"$300 × 10% = $30 interest. $300 + $30 = $330."},{"topic":"Saving","q":"Why do financial planners suggest keeping an emergency fund of a few months' expenses in a savings account?","options":["To earn the highest possible returns","So unexpected costs don't force you into high-interest debt","To avoid paying income tax","Because savings accounts are fun to watch grow"],"answer":1,"explain":"The emergency fund exists so a surprise expense (phone repair, car trouble) doesn't land on a 19.99% credit card."},{"topic":"Budgeting","q":"Which of these is a need rather than a want?","options":["Courtside-style sneakers everyone at school has","A monthly bus pass to get to school and work","Concert tickets for your favourite artist","The newest phone case"],"answer":1,"explain":"A need is something you require to live, work, or get to school. Everything else on the list is a want — nice to have, but optional."},{"topic":"Interest","q":"A handy shortcut: divide 72 by your yearly interest rate to estimate how long money takes to double. If Erica's savings earn 6% per year, roughly how long until her money doubles?","options":["6 years","12 years","18 years","72 years"],"answer":1,"explain":"72 ÷ 6 = 12 years. The Rule of 72 is a quick estimate, not exact, but it shows why even small rate differences matter over time."},{"topic":"Earning","q":"Erica earns $17.50 an hour and works a 12-hour week. What is her gross pay for the week?","options":["$180","$192.50","$210","$227.50"],"answer":2,"explain":"$17.50 × 12 = $210. That's gross pay — before CPP, EI, and income tax come off."},{"topic":"Taxes","q":"Canada's income tax system is progressive. What does that mean?","options":["Everyone pays the same flat rate","Higher earners pay a higher tax rate on their additional income","Students never pay income tax","Tax rates go down as you earn more"],"answer":1,"explain":"Progressive means the rate steps up as income rises. A common myth is that earning more can leave you with less — it can't; only the dollars above each threshold are taxed at the higher rate."},{"topic":"Credit","q":"A store offers headphones for “4 payments of $25 — 0% interest!” What is the main catch to watch for?","options":["There is none; it's always free money","Miss a payment and you can face late fees, and the debt is still real money you owe","The headphones cost more than $100 this way","You can't return them"],"answer":1,"explain":"“0% interest” is real only if every payment lands on time. Miss one and late fees kick in — and $100 of headphones is still $100 of debt either way."},{"topic":"Credit","q":"Erica has a credit card with a $1,000 limit and currently owes $800 on it. She pays on time every month — so why might her credit score still drop?","options":["It won't; on-time payments are all that matter","Using 80% of her limit makes her look risky to lenders","Her limit is too high","Credit scores ignore balances"],"answer":1,"explain":"This is called utilization. Using most of your available credit signals risk, even with perfect payments. Staying under ~30% of your limit is the usual guideline."},{"topic":"Consumer awareness","q":"A video game is priced at $60, then marked “40% OFF”. What does Erica actually pay (before tax)?","options":["$20","$24","$36","$40"],"answer":2,"explain":"40% off $60 = $24 discount. $60 − $24 = $36. (Quick check: 10% of $60 is $6, so 40% is $24.)"},{"topic":"Fraud","q":"Erica sees an Instagram ad: “Earn $500/week reposting ads! No interview needed — just send us your bank login so we can set up direct deposit.” What should she do?","options":["Send the login — $500/week is worth it","Send it but change her password after","Walk away — it's a scam; real employers never ask for your bank login","Ask for $600/week first"],"answer":2,"explain":"No legitimate employer hires through DMs with no interview, and nobody legitimate ever needs your bank login — direct deposit uses an account number and transit number, which is very different from login access."},{"topic":"Saving","q":"Erica has $200 saved. She can spend it on concert tickets or keep saving it. If she buys the tickets, what is the opportunity cost?","options":["The price of the tickets","The $200 in savings — and any interest it would have earned — that she gives up","Zero, because concerts are priceless","The cost of getting to the concert"],"answer":1,"explain":"Opportunity cost is what you give up when you choose. It's not just the $200 — it's also whatever that $200 could have grown into."},{"topic":"Banking","q":"Why do people keep everyday spending money in a chequing account and savings goals in a separate savings account?","options":["It's required by law","Savings accounts earn interest, and separating the money makes it harder to accidentally spend your savings","Chequing accounts charge you for saving","There's no real reason"],"answer":1,"explain":"Two jobs, two accounts: chequing for money in motion, savings for money with a mission. Mixing them is how savings quietly become spending."}],"shortBank":[],"notes":"<h3>Budgeting</h3>\n<ul>\n<li>A <strong>budget</strong> is a plan for your money: what comes in, what goes out, and what you keep.</li>\n<li><strong>Needs</strong> are things you must have to live and function (food, housing, transportation, phone plan). <strong>Wants</strong> are things you'd like but can live without (new sneakers, streaming subscriptions, eating out).</li>\n<li>The <strong>50/30/20 rule</strong> is a simple starting budget: about <strong>50%</strong> of income for needs, <strong>30%</strong> for wants, and <strong>20%</strong> for savings. Track spending for a month first — most people are surprised where it goes.</li>\n</ul>\n<h3>Earning Income</h3>\n<ul>\n<li><strong>Gross pay</strong> is what you earn before anything is taken off. <strong>Net pay</strong> (take-home pay) is what you actually receive after deductions.</li>\n<li>A <strong>pay stub</strong> shows your gross pay, hours worked, and each deduction: income tax, CPP (Canada Pension Plan), and EI (Employment Insurance).</li>\n<li>Ontario's <strong>minimum wage</strong> is about <strong>$17.60/hour</strong> (adjusted regularly — check the current rate).</li>\n</ul>\n<h3>Taxes</h3>\n<ul>\n<li><strong>Income tax</strong> is a percentage of your earnings collected by the federal and Ontario governments to pay for services like health care, schools, and roads.</li>\n<li>Canada uses <strong>tax brackets</strong>: higher income is taxed at higher rates, but only the income <em>within</em> each bracket.</li>\n<li>The <strong>basic personal amount</strong> (roughly $16,000 federally) is tax-free — which is why many students get a tax refund.</li>\n<li><strong>HST</strong> (Harmonized Sales Tax) in Ontario is <strong>13%</strong> — 5% federal + 8% provincial — added to most purchases. A $20 item costs $22.60 after HST.</li>\n</ul>\n<h3>Interest: Simple vs Compound</h3>\n<ul>\n<li><strong>Interest</strong> is the price of borrowing money — or the reward for lending/saving it.</li>\n<li><strong>Simple interest</strong> is calculated only on the original amount: <strong>I = P × r × t</strong>.</li>\n<li><strong>Compound interest</strong> is calculated on the original amount <em>plus</em> previously earned interest — \"interest on interest\" — so money grows faster over time.</li>\n</ul>\n<h4>Worked example</h4>\n<p>You save $1,000 at 5% annual interest for 3 years:</p>\n<ul>\n<li>Simple: $1,000 + ($1,000 × 0.05 × 3) = <strong>$1,150.00</strong></li>\n<li>Compound: $1,000 × 1.05<sup>3</sup> = <strong>$1,157.63</strong></li>\n</ul>\n<p>The gap is small after 3 years but enormous over decades — which is why starting to save early matters.</p>\n<h3>Saving and Banking</h3>\n<ul>\n<li>A <strong>chequing account</strong> is for everyday money: debit purchases, e-transfers, bill payments. It earns little or no interest.</li>\n<li>A <strong>savings account</strong> earns interest and is meant for money you don't need right away — but rates at big banks are low, so shop around.</li>\n<li>An <strong>emergency fund</strong> is savings for surprises (phone repair, car trouble). Aim for a few hundred dollars as a student; adults aim for 3–6 months of expenses.</li>\n<li><strong>Pay yourself first</strong>: move savings out on payday, before you spend.</li>\n</ul>\n<h3>Credit and Borrowing</h3>\n<ul>\n<li>A <strong>credit card</strong> lets you borrow up to a limit and pay later. Used well it builds credit history; used badly it creates expensive debt.</li>\n<li>Interest on unpaid balances is high — often around <strong>20%</strong> per year. But there is a <strong>grace period</strong> (~21 days): pay the full balance by the due date and you pay no interest.</li>\n<li>The <strong>minimum payment</strong> (often ~$10 or a small percent) keeps the account in good standing but barely shrinks the debt.</li>\n</ul>\n<h4>Worked example</h4>\n<p>A $1,000 balance at 20% interest, paying only $25/month: it takes about <strong>5½ years</strong> to clear and costs roughly <strong>$660 in interest</strong> — you pay back $1,660 for $1,000 of purchases.</p>\n<h3>Credit Scores</h3>\n<ul>\n<li>A <strong>credit score</strong> (300–900 in Canada) sums up how reliably you handle borrowed money. Lenders check it before approving loans, credit cards, phone plans, or rentals.</li>\n<li>Scores around <strong>660+</strong> are considered fair, <strong>700+</strong> good, <strong>760+</strong> excellent.</li>\n</ul>\n<table>\n<tr><th>Builds your score</th><th>Hurts your score</th></tr>\n<tr><td>Paying every bill on time</td><td>Missed or late payments</td></tr>\n<tr><td>Keeping balances low (well under your limit)</td><td>Maxing out cards (high utilization)</td></tr>\n<tr><td>Keeping older accounts open</td><td>Applying for lots of credit at once</td></tr>\n</table>\n<h3>Consumer Awareness</h3>\n<ul>\n<li><strong>Comparison shop</strong>: check the <strong>unit price</strong> (price per 100 g, per litre) rather than the package price — bigger isn't always cheaper.</li>\n<li><strong>Read contracts before signing</strong>: know the total cost, the cancellation terms, and any fees. Never sign something you don't understand.</li>\n<li>A <strong>warranty</strong> promises repair or replacement if a product fails — check what it covers, for how long, and what voids it before paying extra for extended coverage.</li>\n<li>In Ontario, some contracts (like door-to-door sales) have a <strong>cooling-off period</strong> — days when you can cancel for a full refund.</li>\n</ul>\n<h3>Fraud and Scams</h3>\n<ul>\n<li><strong>Phishing</strong>: fake emails, texts, or calls pretending to be your bank, a delivery company, or the CRA to steal passwords or banking details.</li>\n<li><strong>Identity theft</strong>: someone uses your personal info (like your SIN) to open accounts or borrow money in your name.</li>\n</ul>\n<h4>Red flags</h4>\n<ul>\n<li>Urgent threats (\"your account will be closed today!\") or pressure to act immediately.</li>\n<li>Requests for payment by gift cards, cryptocurrency, or wire transfer.</li>\n<li>Deals that seem too good to be true, or links from senders you don't recognize.</li>\n</ul>\n<h4>Protect yourself</h4>\n<ul>\n<li>Never share your <strong>SIN, passwords, or banking codes</strong> — real banks and the CRA never ask by text or email.</li>\n<li>Use <strong>strong, unique passwords</strong> plus <strong>two-factor authentication</strong>; check statements regularly and shred documents with personal info.</li>\n<li>If scammed, tell your bank immediately and report it to the <strong>Canadian Anti-Fraud Centre</strong>.</li>\n</ul>\n"},{"id":"glc-job","name":"Job Search and Employability Skills","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":1,"explain":"Employers need to reach you, so your name, phone number, and email go first. Photos, references' private numbers, and elementary school grades do not belong on a resume.","options":["Your photo","Your name and contact information","Your references' phone numbers","Your elementary school grades"],"q":"What belongs at the top of a high-school resume?","topic":"Resumes"},{"answer":0,"explain":"A cover letter connects your skills to this specific employer's needs. It is tailored, concise, and shows you researched the company.","options":["Explain why you fit this specific job and employer, beyond what the resume lists","Repeat your resume word for word","List every course you have ever taken","Ask what the salary is"],"q":"What is the main job of a cover letter?","topic":"Cover Letters"},{"answer":2,"explain":"STAR turns rambling stories into clear evidence: describe the Situation and Task, explain the Action you took, and finish with the Result.","options":["Dress more formally","Answer questions in single words","Structure answers about past experiences as Situation, Task, Action, Result","Eliminate all nervousness"],"q":"In a job interview, the STAR method helps you…","topic":"Interviews"},{"answer":3,"explain":"Asking about success signals genuine interest and gives you real insight into the job. The other questions suggest you are already checked out.","options":["How soon can I take a vacation?","What is the least I would have to do?","Can I leave early on Fridays?","What does success look like in this role in the first few months?"],"q":"Which is a strong question to ask the employer at the end of an interview?","topic":"Interviews"},{"answer":0,"explain":"Most teen jobs come through people who already know you. Networking simply means letting teachers, coaches, family friends, and coworkers know you are looking and what you are good at.","options":["Building relationships through teachers, coaches, family friends, volunteering, and part-time work","Collecting hundreds of online connections","Handing out business cards at conferences","Only talking to company executives"],"q":"For a high-school student, networking most realistically means…","topic":"Networking"},{"answer":2,"explain":"Employers can train job-specific tasks, but they cannot train attitude. Showing up on time, communicating clearly, and cooperating are the real day-one requirements.","options":["Owning a car and a suit","Perfect grades in every subject","Reliability, communication, teamwork, and willingness to learn","Knowing the company's stock price"],"q":"Which set lists the employability skills an employer expects on day one?","
