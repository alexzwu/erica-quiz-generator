{"id":"fsf2d","name":"Core French (FSF2D1)","semester":1,"units":[{"id":"fsf-listening","name":"Listening and Speaking","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":1,"explain":"En écoute, on utilise le contexte et les mots-clés pour deviner le sens au lieu de s'arrêter sur chaque mot inconnu.","options":["Arrêter d'écouter complètement","Deviner le sens avec le contexte","Traduire chaque mot en anglais","Demander la définition en anglais"],"q":"Quand tu n'entends pas bien un mot en français, que dois-tu faire en premier ?","topic":"Stratégies d'écoute"},{"answer":2,"explain":"Les mots apparentés (cognates) se ressemblent en français et en anglais, ce qui aide beaucoup la compréhension orale.","options":["C'est un mot inventé","C'est toujours expliqué en anglais","C'est un mot apparenté (cognate) à l'anglais « television »","C'est un mot très rare"],"q":"Dans une conversation, tu entends « la télévision ». Pourquoi comprends-tu ce mot facilement ?","topic":"Mots apparentés"},{"answer":0,"explain":"Il y a une liaison entre « les » et « amis » : le s final se prononce /z/.","options":["On le prononce /z/","On ne le prononce pas","On le prononce /s/","On le prononce /ʃ/ (ch)"],"q":"Comment prononce-t-on le « s » dans « les amis » ?","topic":"Liaison"},{"answer":3,"explain":"On ne fait jamais de liaison après « et » : on dit « et aussi » en détachant les deux mots.","options":["les enfants","nous avons","vous êtes","et aussi"],"q":"Dans quelle expression n'y a-t-il PAS de liaison ?","topic":"Liaison"},{"answer":1,"explain":"« Ça va bien, merci ! Et toi ? » est la réponse naturelle et polie à « Ça va ? ».","options":["Je suis aller bien.","Ça va bien, merci ! Et toi ?","Ça va mal toujours.","Bien, je suis."],"q":"Ton ami te demande : « Ça va ? » Que réponds-tu ?","topic":"Expressions courantes"},{"answer":2,"explain":"« Répétez, s'il vous plaît » est la façon polie de demander une répétition en classe.","options":["Quoi ?","Parlez anglais !","Répétez, s'il vous plaît.","Je ne sais pas."],"q":"Tu n'as pas compris la question du professeur. Que dis-tu poliment ?","topic":"Demander de répéter"},{"answer":0,"explain":"L'intonation montante à la fin de la phrase indique souvent une question en français oral.","options":["La voix monte à la fin","La voix descend à la fin","On parle plus vite","On parle plus fort"],"q":"En français parlé, qu'est-ce qui montre souvent que c'est une question ?","topic":"Intonation"},{"answer":3,"explain":"On répond « De rien ! » après « Merci ! ». (« À tes souhaits » s'utilise après un éternuement.)","options":["S'il vous plaît","Pardon ?","À tes souhaits !","De rien !"],"q":"Quelqu'un te dit « Merci ! ». Que réponds-tu ?","topic":"Expressions courantes"},{"answer":1,"explain":"En écoute, on cherche les mots-clés et l'idée générale plutôt que de vouloir comprendre chaque mot.","options":["Sur chaque mot, sans exception","Sur les mots-clés et l'idée générale","Sur la grammaire seulement","Sur l'accent du locuteur"],"q":"Pour bien comprendre un dialogue, sur quoi dois-tu te concentrer ?","topic":"Stratégies d'écoute"},{"answer":2,"explain":"Il y a une liaison entre « nous » et « avons » : le s final se prononce /z/.","options":["nou-a-von (sans liaison)","nou-sa-von (liaison en /s/)","nou-za-von (liaison en /z/)","nou-avons (pause entre les mots)"],"q":"Comment prononce-t-on « nous avons » ?","topic":"Liaison"},{"answer":0,"explain":"On utilise « vous » avec un professeur ou une personne qu'on connaît peu, par politesse.","options":["Vous, par politesse","Tu, toujours","On, c'est plus facile","Aucune, on ne parle pas"],"q":"Tu parles à ton professeur pour la première fois. Quelle forme utilises-tu ?","topic":"Tu ou vous"},{"answer":3,"explain":"« Oui, avec plaisir ! » accepte l'invitation de façon naturelle et enthousiaste.","options":["Non, je ne veux pas du tout.","Peut-être, je déteste le cinéma.","Je ne sais pas parler.","Oui, avec plaisir !"],"q":"Ton amie demande : « Tu viens au cinéma ce soir ? » Que réponds-tu pour accepter ?","topic":"Expressions courantes"}],"shortBank":[{"answer":"Exemple : — Salut ! Comment tu t'appelles ? — Je m'appelle Léo. Et toi ? — Moi, c'est Maya. Tu viens d'où ? — Je viens de Montréal. Bienvenue à notre école !","marks":3,"q":"Écris un mini-dialogue de 4 répliques : tu rencontres un nouvel élève et tu lui poses des questions pour faire connaissance.","topic":"Conversation"},{"answer":"Écouter les mots-clés et deviner le sens avec le contexte ; demander poliment à la personne de répéter ou de parler moins vite.","marks":2,"q":"Nomme deux stratégies pour mieux comprendre quand quelqu'un parle vite en français.","topic":"Stratégies d'écoute"},{"answer":"On prononce la consonne finale quand le mot suivant commence par une voyelle. Exemple : « les‿amis », où le s se prononce /z/.","marks":2,"q":"Explique la liaison avec un exemple : quand prononce-t-on la consonne finale d'un mot ?","topic":"Prononciation"},{"answer":"a) « Pardon ! » ou « Excusez-moi, s'il vous plaît. » b) « Excusez-moi pour le retard. » ou « Désolé(e), je suis en retard. »","marks":2,"q":"Écris ce que tu dis dans ces deux situations : a) tu veux passer devant quelqu'un dans l'autobus ; b) tu arrives en classe en retard.","topic":"Expressions courantes"}],"notes":"<h3>Stratégies d'écoute</h3>\n<ul>\n<li><strong>Écoute d'abord l'idée principale</strong> : cherche à comprendre le sujet général (de quoi parle-t-on ? qui ? où ?) avant de te concentrer sur chaque mot.</li>\n<li><strong>Repère les mots-clés</strong> : les noms, les verbes et les nombres donnent le sens. Les petits mots (le, la, de, est) sont moins importants.</li>\n<li><strong>Ne bloque pas sur un mot inconnu</strong> : continue d'écouter — la suite t'aidera souvent à deviner son sens.</li>\n<li><strong>Devine grâce au contexte</strong> : le ton de voix, la situation et les sons autour d'un mot donnent des indices.</li>\n</ul>\n\n<h3>Les mots apparentés (vrais amis)</h3>\n<p>Certains mots français ressemblent beaucoup à l'anglais. Utilise-les pour comprendre plus vite.</p>\n<ul>\n<li><strong>Exemples</strong> : important, musique, possible, national, télévision, restaurant, film, différent.</li>\n<li><strong>Attention aux faux amis</strong> : <strong>information</strong> ne veut pas dire « information » en anglais (cela signifie « les nouvelles ») ; <strong>journée</strong> ne veut pas dire « journey » (cela signifie « toute la journée »).</li>\n</ul>\n\n<h3>La liaison</h3>\n<p>La liaison, c'est quand on prononce la dernière consonne d'un mot avec la première voyelle du mot suivant : on « lie » les deux mots ensemble.</p>\n<h4>Quand on fait la liaison</h4>\n<ul>\n<li>Après les déterminants : les_amis, des_amis, un_enfant.</li>\n<li>Après les pronoms sujets : nous_avons, vous_avez, ils_arrivent.</li>\n<li>Après certains adjectifs : mon_ami, un bon_ami.</li>\n</ul>\n<h4>Quand on ne fait pas la liaison</h4>\n<ul>\n<li>Après <strong>et</strong> : « Pierre et Anne » (jamais de liaison après « et »).</li>\n<li>Devant un <strong>h aspiré</strong> : les héros, les haricots.</li>\n</ul>\n\n<h3>Expressions courantes de conversation</h3>\n<p>Ces petites phrases montrent que tu écoutes et que tu réagis comme un vrai francophone.</p>\n<ul>\n<li><strong>Réagir positivement</strong> : C'est super ! Tant mieux ! Génial !</li>\n<li><strong>Montrer de l'intérêt</strong> : C'est vrai ? Vraiment ? Ah bon ?</li>\n<li><strong>Exprimer de la sympathie</strong> : Dommage... Quel dommage ! C'est triste.</li>\n<li><strong>Donner ton avis</strong> : À mon avis... Je pense que... D'accord.</li>\n</ul>\n\n<h3>Demander de répéter poliment</h3>\n<ul>\n<li><strong>Pardon ?</strong> — la façon la plus simple et la plus polie.</li>\n<li><strong>Répétez, s'il vous plaît.</strong></li>\n<li><strong>Je n'ai pas bien compris.</strong> — montre que tu essaies.</li>\n<li><strong>Pouvez-vous parler plus lentement, s'il vous plaît ?</strong></li>\n<li><strong>Qu'est-ce que ça veut dire, « ... » ?</strong> — pour demander le sens d'un mot.</li>\n</ul>\n\n<h3>L'intonation</h3>\n<ul>\n<li><strong>Question</strong> : la voix <strong>monte</strong> à la fin de la phrase — « Tu viens ? »</li>\n<li><strong>Affirmation</strong> : la voix <strong>descend</strong> à la fin de la phrase — « Tu viens. »</li>\n<li><strong>Écoute bien la fin de la phrase</strong> : c'est souvent l'intonation qui te dit s'il s'agit d'une question ou d'une affirmation.</li>\n</ul>\n\n<h3>Tu ou vous ?</h3>\n<p>En français, on choisit <strong>tu</strong> ou <strong>vous</strong> selon la personne à qui on parle.</p>\n<table>\n<tr><th></th><th>Tu</th><th>Vous</th></tr>\n<tr><th>Avec qui ?</th><td>Les amis, la famille, les camarades de classe, les jeunes</td><td>Les adultes, les professeurs, les inconnus, les personnes âgées</td></tr>\n<tr><th>Quand ?</th><td>Situations informelles, entre proches</td><td>Situations formelles, avec des inconnus</td></tr>\n<tr><th>Exemples</th><td>Tu viens ? Comment tu t'appelles ?</td><td>Vous venez ? Comment vous appelez-vous ?</td></tr>\n</table>\n<ul>\n<li><strong>En cas de doute, utilise « vous »</strong> : c'est toujours plus poli. La personne te dira « tu peux me tutoyer » si elle préfère le « tu ».</li>\n<li><strong>Attention à la conjugaison</strong> : avec « vous », le verbe est au pluriel même pour une seule personne — « Vous êtes » (et non « vous es »).</li>\n</ul>\n"},{"id":"fsf-reading","name":"Reading","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":1,"explain":"« Important » est un mot apparenté (cognate) : il a le même sens en français et en anglais.","options":["Impossible (faux ami)","La même chose qu'en anglais : important","Malade","En retard"],"q":"Dans un texte, tu lis le mot « important ». Que signifie-t-il ?","topic":"Mots apparentés"},{"answer":2,"explain":"Le contexte (le froid, le manteau, les gants) indique un vêtement d'hiver : un foulard (scarf).","options":["Un chapeau","Un pantalon","Un foulard (scarf)","Un manteau d'hiver"],"q":"« Il faisait très froid, alors il a mis son manteau, son foulard et ses gants. » Que veut dire « foulard » ?","topic":"Indices du contexte"},{"answer":0,"explain":"On utilise l'imparfait (« faisait ») pour décrire le temps qu'il faisait, une description dans le passé.","options":["faisait","a fait","fait","fera"],"q":"Choisis la bonne forme : « Hier, il ___ très beau. »","topic":"Imparfait"},{"answer":3,"explain":"« Soudain » introduit une action ponctuelle et terminée : on utilise le passé composé (« a sonné »).","options":["sonnait","sonne","sonnera","a sonné"],"q":"Choisis la bonne forme : « Soudain, le téléphone ___. »","topic":"Passé composé"},{"answer":1,"explain":"« Que » remplace un complément d'objet direct : j'ai vu le film (j'ai vu quoi ? le film).","options":["qui","que","dont","où"],"q":"Complète : « Le film ___ j'ai vu était excellent. »","topic":"Pronoms relatifs"},{"answer":2,"explain":"« Qui » remplace le sujet du verbe : mon amie habite (qui habite ? mon amie).","options":["que","dont","qui","où"],"q":"Complète : « C'est mon amie ___ habite à Québec. »","topic":"Pronoms relatifs"},{"answer":3,"explain":"« Fleurs » est féminin pluriel, donc « blanc » devient « blanches ».","options":["blancs","blanche","blance","blanches"],"q":"Choisis la forme correcte : « des fleurs ___ » (blanc)","topic":"Accord des adjectifs"},{"answer":0,"explain":"« Garçon » est masculin singulier : « heureux » ne change pas, car il finit déjà par x.","options":["heureux","heureuse","heureuxes","heureuses"],"q":"Choisis la forme correcte : « un garçon ___ » (heureux)","topic":"Accord des adjectifs"},{"answer":2,"explain":"« Elles » est féminin pluriel : « content » devient « contentes ».","options":["content","contente","contentes","contents"],"q":"Choisis la forme correcte : « Elles sont ___ . » (content)","topic":"Accord des adjectifs"},{"answer":1,"explain":"« Actuellement » est un faux ami : il veut dire « en ce moment », pas « actually ».","options":["En réalité (actually)","En ce moment (currently)","Autrefois","Jamais"],"q":"Dans un texte : « Actuellement, j'habite à Ottawa. » Que veut dire « actuellement » ?","topic":"Faux amis"},{"answer":3,"explain":"« Chaque jour » indique une habitude dans le passé : on utilise l'imparfait (« jouais »).","options":["ai joué","joue","jouerai","jouais"],"q":"Choisis la bonne forme : « Quand j'étais petit, je ___ au parc chaque jour. »","topic":"Imparfait"},{"answer":0,"explain":"« Que » remplace le complément d'objet direct : tu m'as prêté le livre (prêté quoi ? le livre).","options":["que","qui","dont","où"],"q":"Complète : « Voici le livre ___ tu m'as prêté. »","topic":"Pronoms relatifs"}],"shortBank":[{"answer":"« Hier soir, il pleuvait (imparfait : description et continuité) quand je suis rentré(e) (passé composé : action ponctuelle et terminée) à la maison. »","marks":2,"q":"Complète avec le passé composé ou l'imparfait : « Hier soir, il ___ (pleuvoir) quand je ___ (rentrer) à la maison. »","topic":"Passé composé et imparfait"},{"answer":"« J'ai un chat qui dort sur mon lit. » (« Qui » remplace le sujet : le chat dort.)","marks":2,"q":"Relie les deux phrases avec « qui » ou « que » : « J'ai un chat. Le chat dort sur mon lit. »","topic":"Pronoms relatifs"},{"answer":"« Les maisons sont grandes et les jardins sont verts. » (« Maisons » est féminin pluriel ; « jardins » est masculin pluriel.)","marks":2,"q":"Accorde l'adjectif entre parenthèses : « Les maisons sont ___ (grand) et les jardins sont ___ (vert). »","topic":"Accord des adjectifs"},{"answer":"Ils sont restés dehors parce qu'ils voulaient finir le match, malgré la pluie.","marks":3,"q":"Lis la phrase et réponds : « Malgré la pluie, les élèves sont restés dehors parce qu'ils voulaient finir le match. » Pourquoi les élèves sont-ils restés dehors ?","topic":"Compréhension"}],"notes":"<h3>Les mots apparentés</h3>\n<p>Beaucoup de mots français ressemblent à des mots anglais : ce sont des <strong>mots apparentés</strong>. Ils aident à deviner le sens d'un texte : table, animal, important, centre, musique, différent, impossible.</p>\n<p><strong>Attention</strong> aux <strong>faux amis</strong> (dernière section) !</p>\n<h3>Les indices du contexte</h3>\n<p>Quand un mot est inconnu, cherchez des <strong>indices</strong> autour de lui :</p>\n<ul>\n<li>une <strong>définition</strong> donnée dans la phrase ;</li>\n<li>un <strong>exemple</strong> qui suit (« comme », « par exemple ») ;</li>\n<li>un <strong>synonyme ou un contraire</strong> dans la même phrase ;</li>\n<li>le <strong>ton général</strong> du paragraphe (positif ou négatif).</li>\n</ul>\n<h3>L'imparfait</h3>\n<p>L'imparfait décrit le <strong>passé</strong> : ce qui durait, se répétait ou servait de décor.</p>\n<h4>Formation</h4>\n<ul>\n<li>Prenez la forme <strong>nous</strong> au présent, enlevez <strong>-ons</strong>, ajoutez <strong>-ais, -ais, -ait, -ions, -iez, -aient</strong>.</li>\n<li>Exemple : nous parl<em>ons</em> → je parl<strong>ais</strong>, nous parl<strong>ions</strong>, ils parl<strong>aient</strong>.</li>\n<li><strong>Seule exception</strong> : être → ét- (j'étais, tu étais...).</li>\n</ul>\n<h4>Usages</h4>\n<ul>\n<li><strong>Description</strong> : « Il faisait beau et les oiseaux chantaient. »</li>\n<li><strong>Habitude</strong> : « Chaque été, nous allions à la plage. » (souvent avec <em>toujours, souvent, chaque jour</em>)</li>\n<li><strong>Action en cours</strong> interrompue par une autre : « Je lisais quand le téléphone a sonné. »</li>\n</ul>\n<h3>Le passé composé</h3>\n<p>Le passé composé raconte une <strong>action terminée</strong> : « Hier, j'ai fini mes devoirs. »</p>\n<h4>Formation</h4>\n<ul>\n<li><strong>Auxiliaire</strong> (avoir ou être) au présent + <strong>participe passé</strong>.</li>\n<li>La plupart prennent <strong>avoir</strong> : j'ai mangé.</li>\n<li>17 verbes de mouvement prennent <strong>être</strong> : je suis allé(e), elle est venue.</li>\n<li>Participe passé : -er → <strong>-é</strong>, -ir → <strong>-i</strong>, -re → <strong>-u</strong>. Irréguliers : eu, été, fait, pris, dit, écrit, vu.</li>\n<li><strong>Accord</strong> : avec être, accord avec le sujet (elle est allée). Avec avoir, accord avec le complément d'objet direct placé <strong>avant</strong> (« les pommes que j'ai mangées »).</li>\n</ul>\n<h3>Imparfait ou passé composé ?</h3>\n<table>\n<tr><th>Imparfait</th><th>Passé composé</th></tr>\n<tr><td>Décor, description</td><td>Action principale, événement</td></tr>\n<tr><td>Habitude, répétition</td><td>Action unique et terminée</td></tr>\n<tr><td>Action longue, en cours</td><td>Action brève qui interrompt</td></tr>\n</table>\n<p>« Il <strong>pleuvait</strong> (décor) quand nous <strong>sommes sortis</strong> (événement). »</p>\n<h3>Les pronoms relatifs</h3>\n<ul>\n<li><strong>Qui</strong> = le sujet : « C'est l'élève <strong>qui</strong> a gagné. »</li>\n<li><strong>Que</strong> = le complément d'objet direct : « Voici le livre <strong>que</strong> je lis. »</li>\n<li><strong>Où</strong> = le lieu ou le temps : « la ville <strong>où</strong> je suis né » / « le jour <strong>où</strong> tout a changé »</li>\n<li><strong>Dont</strong> = de + nom (verbes avec « de » : parler <em>de</em>, avoir besoin <em>de</em>) : « le film <strong>dont</strong> tout le monde parle ».</li>\n</ul>\n<p><strong>Astuce</strong> : verbe construit avec « de » → <strong>dont</strong> ; sinon <strong>qui</strong> (sujet) ou <strong>que</strong> (objet).</p>\n<h3>L'accord des adjectifs</h3>\n<ul>\n<li>L'adjectif s'accorde en <strong>genre</strong> et en <strong>nombre</strong> avec le nom : féminin + <strong>e</strong> (petit → petite), pluriel + <strong>s</strong>.</li>\n<li>Adjectifs déjà en <strong>-e</strong> : pas de changement au féminin (jeune → jeune).</li>\n<li><strong>Cas spéciaux</strong> devant un nom masculin singulier qui commence par une voyelle ou un h muet :\n<ul>\n<li>beau → <strong>bel</strong> : un bel ami (un beau garçon ; une belle fille)</li>\n<li>nouveau → <strong>nouvel</strong> : un nouvel élève (un nouveau livre)</li>\n<li>vieux → <strong>vieil</strong> : un vieil homme</li>\n</ul>\n</li>\n</ul>\n<h3>Les faux amis</h3>\n<p>Des mots qui <strong>ressemblent</strong> à des mots anglais mais ont un <strong>sens différent</strong> :</p>\n<ul>\n<li><strong>actually</strong> = <em>en fait</em> (≠ <strong>actuellement</strong> = en ce moment)</li>\n<li><strong>library</strong> = <strong>bibliothèque</strong> (≠ <strong>librairie</strong> = magasin de livres)</li>\n<li><strong>eventually</strong> = <strong>finalement</strong> (≠ <strong>éventuellement</strong> = peut-être)</li>\n<li><strong>sensible</strong> (anglais) = <strong>raisonnable</strong> (≠ <strong>sensible</strong> = qui ressent facilement)</li>\n<li><strong>to attend</strong> = <strong>assister à</strong> (≠ <strong>attendre</strong> = to wait)</li>\n</ul>\n<p><strong>Conseil</strong> : vérifiez toujours le sens avec le contexte !</p>\n"},{"id":"fsf-writing","name":"Writing","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":2,"explain":"Le futur proche = aller conjugué + infinitif. Avec « je » : « je vais visiter ».","options":["vas","va","vais","vont"],"q":"Complète : « Demain, je ___ visiter le musée. »","topic":"Futur proche"},{"answer":0,"explain":"« Partir » se conjugue avec l'auxiliaire être au passé composé : « elles sont parties ».","options":["sont","ont","est","a"],"q":"Complète : « Elles ___ parties à 8 h. »","topic":"Passé composé"},{"answer":1,"explain":"« Mais » marque l'opposition entre aimer le hockey et préférer le soccer.","options":["et","mais","parce que","donc"],"q":"Choisis le bon mot de liaison : « J'aime le hockey, ___ je préfère le soccer. »","topic":"Mots de liaison"},{"answer":3,"explain":"« Grand » se place avant le nom et « blanc » après : « une grande maison blanche ».","options":["Une maison grande et blanche.","Une maison blanche grande.","Grande une maison blanche.","Une grande maison blanche."],"q":"Choisis la phrase correcte.","topic":"Place de l'adjectif"},{"answer":0,"explain":"Au présent, « finir » donne « nous finissons » (base finiss- + terminaison -ons).","options":["finissons","finissez","finissent","finirons"],"q":"Complète : « Nous ___ nos devoirs. » (finir)","topic":"Présent"},{"answer":1,"explain":"Avec l'auxiliaire être, le participe passé s'accorde avec le sujet féminin : « elle s'est levée ».","options":["levé","levée","levés","lever"],"q":"Complète : « Elle s'est ___ tôt. » (lever)","topic":"Accord du participe"},{"answer":2,"explain":"« Parce que » explique la cause : je reste à la maison parce que je suis malade.","options":["mais","et","parce que","ou"],"q":"Choisis le bon mot de liaison : « Je reste à la maison ___ je suis malade. »","topic":"Mots de liaison"},{"answer":1,"explain":"Après « vont » (futur proche), le verbe reste à l'infinitif : « ils vont jouer ».","options":["jouent","jouer","joué","jouant"],"q":"Complète : « Ils vont ___ au parc. »","topic":"Futur proche"},{"answer":3,"explain":"L'adverbe « toujours » se place après le verbe conjugué.","options":["Je toujours mange à midi.","Toujours je mange à midi.","Je mange à midi toujours.","Je mange toujours à midi."],"q":"Choisis la phrase avec le bon ordre des mots.","topic":"Structure de phrase"},{"answer":3,"explain":"Le participe passé de « prendre » est irrégulier : « pris ».","options":["prendu","prené","prisent","pris"],"q":"Complète : « Nous avons ___ nos clés. » (prendre)","topic":"Passé composé"},{"answer":2,"explain":"« Finalement » introduit la dernière étape ou la conclusion d'un texte.","options":["D'abord","Ensuite","Finalement","Puis"],"q":"Quel mot de liaison annonce la conclusion d'un paragraphe ?","topic":"Mots de liaison"},{"answer":0,"explain":"Avec « vous », le verbe être se conjugue « vous êtes ».","options":["êtes","est","sont","es"],"q":"Complète : « Vous ___ prêts ? » (être)","topic":"Présent"}],"shortBank":[{"answer":"Exemple : Samedi, je vais jouer au tennis avec mon frère. Dimanche, nous allons visiter ma grand-mère.","marks":2,"q":"Écris deux phrases au futur proche pour décrire tes projets de la fin de semaine.","topic":"Futur proche"},{"answer":"« Elle est venue hier et nous avons mangé ensemble. » (« Venir » prend l'auxiliaire être et s'accorde avec le sujet ; « manger » prend avoir.)","marks":3,"q":"Conjugue au passé composé : « Elle (venir) ___ hier et nous (manger) ___ ensemble. »","topic":"Passé composé"},{"answer":"Exemple : D'abord, je me lève à 7 h. Ensuite, je prends mon petit-déjeuner. Finalement, je marche jusqu'à l'arrêt d'autobus.","marks":4,"q":"Écris trois phrases pour décrire ta routine du matin. Utilise au moins un mot de liaison (d'abord, ensuite, finalement).","topic":"Rédaction"},{"answer":"« Je vais toujours à l'école en autobus. » L'adverbe « toujours » se place après le verbe conjugué.","marks":2,"q":"Corrige la phrase : « Je vais à l'école en autobus toujours. » Explique ton choix.","topic":"Structure de phrase"}],"notes":"<h3>Le futur proche</h3>\n<p>Le <strong>futur proche</strong> exprime une action qui va se passer bientôt ou une intention. Formation : <strong>le verbe « aller » au présent + l'infinitif</strong>.</p>\n<ul>\n<li>Je <strong>vais</strong> étudier. / Tu <strong>vas</strong> manger. / Il <strong>va</strong> partir.</li>\n<li>Nous <strong>allons</strong> regarder un film. / Vous <strong>allez</strong> dormir. / Elles <strong>vont</strong> sortir.</li>\n</ul>\n<p>Seul « aller » se conjugue ; l'infinitif ne change jamais : « ils vont <strong>finir</strong> » (et non « finissent »).</p>\n\n<h3>Le passé composé (rappel)</h3>\n<p>Le <strong>passé composé</strong> exprime une action terminée dans le passé. Formation : <strong>auxiliaire (avoir ou être) au présent + participe passé</strong>.</p>\n<ul>\n<li>Participes réguliers : parler → parl<strong>é</strong> ; finir → fin<strong>i</strong> ; vendre → vend<strong>u</strong>.</li>\n<li>Avec <strong>avoir</strong> : j'ai mangé, tu as fini, ils ont vendu.</li>\n<li>Avec <strong>être</strong> (verbes de mouvement et verbes pronominaux) : elle est allée, nous sommes partis.</li>\n</ul>\n\n<h3>L'accord du participe passé avec « être »</h3>\n<p>Avec l'auxiliaire <strong>être</strong>, le participe passé s'accorde en <strong>genre et en nombre avec le sujet</strong> :</p>\n<ul>\n<li>Il est all<strong>é</strong>. / Elle est all<strong>ée</strong>. / Ils sont all<strong>és</strong>. / Elles sont all<strong>ées</strong>.</li>\n<li>Nous (un groupe de filles) sommes parti<strong>es</strong>.</li>\n</ul>\n<p>Avec <strong>avoir</strong>, il n'y a pas d'accord avec le sujet : « elles ont mangé » (sans <em>e</em>).</p>\n\n<h3>Le présent</h3>\n<h4>Verbes réguliers</h4>\n<table>\n<tr><th></th><th>parler (-er)</th><th>finir (-ir)</th><th>vendre (-re)</th></tr>\n<tr><td>je</td><td>parle</td><td>finis</td><td>vends</td></tr>\n<tr><td>tu</td><td>parles</td><td>finis</td><td>vends</td></tr>\n<tr><td>il / elle / on</td><td>parle</td><td>finit</td><td>vend</td></tr>\n<tr><td>nous</td><td>parlons</td><td>finissons</td><td>vendons</td></tr>\n<tr><td>vous</td><td>parlez</td><td>finissez</td><td>vendez</td></tr>\n<tr><td>ils / elles</td><td>parlent</td><td>finissent</td><td>vendent</td></tr>\n</table>\n<h4>Verbes irréguliers courants</h4>\n<table>\n<tr><th></th><th>être</th><th>avoir</th><th>aller</th><th>faire</th></tr>\n<tr><td>je / j'</td><td>suis</td><td>ai</td><td>vais</td><td>fais</td></tr>\n<tr><td>tu</td><td>es</td><td>as</td><td>vas</td><td>fais</td></tr>\n<tr><td>il / elle / on</td><td>est</td><td>a</td><td>va</td><td>fait</td></tr>\n<tr><td>nous</td><td>sommes</td><td>avons</td><td>allons</td><td>faisons</td></tr>\n<tr><td>vous</td><td>êtes</td><td>avez</td><td>allez</td><td>faites</td></tr>\n<tr><td>ils / elles</td><td>sont</td><td>ont</td><td>vont</td><td>font</td></tr>\n</table>\n\n<h3>La place de l'adjectif</h3>\n<p>La plupart des adjectifs se placent <strong>après</strong> le nom : <em>une maison blanche, un film intéressant, une réponse correcte</em>.</p>\n<p>Quelques adjectifs courts et fréquents se placent <strong>avant</strong> le nom (beauté, âge, bonté, taille) : <em>beau, joli, jeune, vieux, nouveau, petit, grand, bon, mauvais, long</em> → <em>une belle histoire, un petit chien, une grande école</em>.</p>\n<h4>Adjectifs irréguliers</h4>\n<table>\n<tr><th>Masculin</th><th>Devant voyelle</th><th>Féminin</th><th>Masculin pluriel</th><th>Féminin pluriel</th></tr>\n<tr><td>beau</td><td>bel</td><td>belle</td><td>beaux</td><td>belles</td></tr>\n<tr><td>nouveau</td><td>nouvel</td><td>nouvelle</td><td>nouveaux</td><td>nouvelles</td></tr>\n<tr><td>vieux</td><td>vieil</td><td>vieille</td><td>vieux</td><td>vieilles</td></tr>\n</table>\n<p>Exemples : <em>un bel arbre, un nouvel ami, un vieil homme</em>.</p>\n<p>Attention au <strong>changement de sens</strong> selon la place : <em>un grand homme</em> (un homme important) ≠ <em>un homme grand</em> (un homme de grande taille) ; <em>un pauvre homme</em> (un homme à plaindre) ≠ <em>un homme pauvre</em> (un homme sans argent).</p>\n\n<h3>Les mots de liaison</h3>\n<p>Ils organisent tes idées et rendent ton texte plus fluide :</p>\n<ul>\n<li><strong>Ordre</strong> : d'abord, ensuite, puis, enfin, en conclusion.</li>\n<li><strong>Opposition</strong> : mais, cependant, pourtant, néanmoins, par contre.</li>\n<li><strong>Conséquence</strong> : donc, alors, par conséquent, c'est pourquoi.</li>\n<li><strong>Ajout</strong> : aussi, en plus, de plus.</li>\n<li><strong>Exemple et explication</strong> : par exemple, en effet.</li>\n</ul>\n\n<h3>La structure de phrase</h3>\n<p>L'ordre de base est <strong>sujet + verbe + complément</strong> : <em>Marie mange une pomme.</em> / <em>Les élèves font leurs devoirs.</em></p>\n<h4>La négation</h4>\n<ul>\n<li>Au présent : <strong>ne + verbe + pas</strong> → <em>Je ne parle pas.</em></li>\n<li>Devant une voyelle, « ne » devient « n' » : <em>Je n'aime pas les épinards.</em></li>\n<li>Au passé composé, la négation entoure <strong>l'auxiliaire</strong> : <em>Je n'ai pas mangé.</em> / <em>Elle n'est pas venue.</em></li>\n</ul>\n"},{"id":"fsf-culture","name":"Francophone Culture","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":1,"explain":"Le français est la seule langue officielle du Québec depuis la Charte de la langue française.","options":["L'anglais","Le français","Le français et l'anglais","L'espagnol"],"q":"Quelle est la seule langue officielle du Québec ?","topic":"Québec"},{"answer":3,"explain":"Le drapeau franco-ontarien est vert et blanc, avec une fleur de lys et un trillium.","options":["Le bleu, le blanc et le rouge","Le jaune et le noir","Le rouge et le blanc","Le vert et le blanc"],"q":"Quelles sont les couleurs du drapeau franco-ontarien ?","topic":"Franco-Ontariens"},{"answer":0,"explain":"Le Canada a deux langues officielles : l'anglais et le français.","options":["L'anglais et le français","Le français et l'espagnol","L'anglais et le mandarin","Le français et l'italien"],"q":"Quelles sont les deux langues officielles du Canada ?","topic":"Bilinguisme"},{"answer":2,"explain":"Le français est très parlé en Afrique, par exemple au Sénégal, en Côte d'Ivoire et au Maroc.","options":["L'Asie","L'Océanie","L'Afrique","L'Antarctique"],"q":"En plus de l'Europe et de l'Amérique, sur quel continent le français est-il beaucoup parlé ?","topic":"Francophonie mondiale"},{"answer":1,"explain":"Le 24 juin, c'est la Saint-Jean-Baptiste, la fête nationale du Québec.","options":["La fête du Canada","La Saint-Jean-Baptiste (fête nationale du Québec)","L'Action de grâce","La fête du Travail"],"q":"Quelle fête célèbre-t-on le 24 juin au Québec ?","topic":"Québec"},{"answer":0,"explain":"Le 25 septembre, on célèbre la communauté franco-ontarienne en Ontario.","options":["Le 25 septembre","Le 1er juillet","Le 24 juin","Le 15 août"],"q":"Quand célèbre-t-on le Jour des Franco-Ontariens et des Franco-Ontariennes ?","topic":"Franco-Ontariens"},{"answer":2,"explain":"« Bilingue » veut dire parler deux langues, par exemple le français et l'anglais.","options":["Parler très vite","Habiter dans deux pays","Parler deux langues","Aimer deux cultures"],"q":"Que veut dire « être bilingue » ?","topic":"Bilinguisme"},{"answer":3,"explain":"Le Cirque du Soleil a été fondé au Québec et est devenu un symbole culturel québécois dans le monde entier.","options":["L'Ontario","La Colombie-Britannique","L'Alberta","Le Québec"],"q":"Le Cirque du Soleil, célèbre dans le monde entier, vient de quelle province ?","topic":"Culture"},{"answer":1,"explain":"Les francophones de l'Ontario vivent surtout dans l'Est, autour d'Ottawa, et dans le Nord, comme à Sudbury.","options":["Seulement à Toronto","Dans l'Est (Ottawa) et le Nord (Sudbury)","Dans le Sud-Ouest seulement","Il n'y a pas de francophones en Ontario"],"q":"Dans quelles régions de l'Ontario trouve-t-on le plus de francophones ?","topic":"Franco-Ontariens"},{"answer":0,"explain":"La poutine (frites, fromage en grains et sauce) est née au Québec.","options":["La poutine","Le hamburger","Les sushis","La pizza"],"q":"Quel plat est un symbole de la culture québécoise ?","topic":"Culture"},{"answer":2,"explain":"La Francophonie regroupe les pays et les communautés francophones du monde entier.","options":["Seulement les Français de France","Une fête à Paris","L'ensemble des pays et communautés où l'on parle français","Un fromage français"],"q":"Que désigne « la Francophonie » ?","topic":"Francophonie mondiale"},{"answer":3,"explain":"Le Canada étant officiellement bilingue, les produits affichent les deux langues officielles.","options":["Parce que c'est moins cher","Parce que tout le monde parle français","Par hasard","Parce que le Canada est officiellement bilingue"],"q":"Pourquoi les étiquettes des produits au Canada sont-elles en anglais et en français ?","topic":"Bilinguisme"}],"shortBank":[{"answer":"Le Québec, où le français est la seule langue officielle, et l'Ontario, qui a une grande communauté franco-ontarienne, surtout dans l'Est et le Nord.","marks":3,"q":"Nomme deux provinces canadiennes où le français est très présent et explique pourquoi.","topic":"Communautés francophones"},{"answer":"Exemple : les étiquettes des produits sont en anglais et en français ; les services du gouvernement fédéral sont offerts dans les deux langues officielles.","marks":2,"q":"Donne deux exemples du bilinguisme dans la vie quotidienne au Canada.","topic":"Bilinguisme"},{"answer":"C'est la fête nationale du Québec, célébrée le 24 juin avec des spectacles, des feux d'artifice et des rassemblements.","marks":2,"q":"Qu'est-ce que la Saint-Jean-Baptiste et quand la célèbre-t-on ?","topic":"Culture québécoise"},{"answer":"Exemple : la France (en Europe) et le Sénégal (en Afrique). On accepte aussi : la Belgique, la Suisse, la Côte d'Ivoire, le Maroc, etc.","marks":3,"q":"Nomme deux pays francophones hors du Canada et dis sur quel continent chacun se trouve.","topic":"Francophonie mondiale"}],"notes":"<h3>Le Québec : le cœur francophone du Canada</h3>\n<ul>\n<li>Le <strong>français est la seule langue officielle du Québec</strong>, protégée par la <strong>Charte de la langue française</strong> (la « loi 101 », adoptée en 1977). C'est la seule province canadienne où le français est la langue officielle unique.</li>\n<li>La <strong>Saint-Jean-Baptiste</strong>, célébrée le <strong>24 juin</strong>, est la <strong>fête nationale du Québec</strong> : spectacles, feux d'artifice et rassemblements partout dans la province.</li>\n<li>L'hiver fait partie de l'identité québécoise : le <strong>Carnaval de Québec</strong>, avec son ambassadeur le <strong>Bonhomme Carnaval</strong>, est le plus grand carnaval d'hiver au monde.</li>\n<li>Symboles culturels connus dans le monde entier : la <strong>poutine</strong> (plat emblématique né au Québec dans les années 1950) et le <strong>Cirque du Soleil</strong>, fondé à Baie-Saint-Paul, au Québec.</li>\n</ul>\n<h3>Les Franco-Ontariens : le français chez nous</h3>\n<ul>\n<li>Les <strong>Franco-Ontariens</strong> forment la plus grande communauté francophone hors Québec : plus de 600 000 personnes.</li>\n<li>On les trouve surtout dans <strong>l'Est</strong> (Ottawa, Prescott-Russell) et le <strong>Nord</strong> (Sudbury, Timmins, Hearst) de l'Ontario.</li>\n<li>Le <strong>drapeau franco-ontarien</strong> est <strong>vert et blanc</strong> : la fleur de lys blanche rappelle l'héritage français, et le trille vert est l'emblème floral de l'Ontario. Il a été hissé pour la première fois à Sudbury en 1975.</li>\n<li>Le <strong>25 septembre</strong>, on célèbre le <strong>Jour des Franco-Ontariens et des Franco-Ontariennes</strong> — la date anniversaire du drapeau.</li>\n<li>Défis de la communauté : <strong>l'assimilation</strong> (le passage vers l'anglais au fil des générations) et l'accès aux <strong>services en français</strong> (écoles, hôpitaux, médias).</li>\n</ul>\n<h3>Le bilinguisme au Canada</h3>\n<ul>\n<li>Le Canada a <strong>deux langues officielles : le français et l'anglais</strong>, reconnues par la <strong>Loi sur les langues officielles</strong> (1969).</li>\n<li>Être <strong>bilingue</strong>, c'est pouvoir communiquer dans les deux langues officielles.</li>\n<li>Le bilinguisme se voit au quotidien : les <strong>étiquettes des produits</strong> sont en anglais et en français (c'est obligatoire), les <strong>services du gouvernement fédéral</strong> sont offerts dans les deux langues, et l'<strong>hymne national</strong> existe dans les deux langues.</li>\n<li>Le bilinguisme est un <strong>atout pour l'emploi</strong>, surtout dans la fonction publique fédérale et au Québec.</li>\n</ul>\n<h3>La francophonie mondiale</h3>\n<ul>\n<li>« <strong>La Francophonie</strong> » désigne l'ensemble des <strong>peuples et des pays qui utilisent le français</strong> : plus de 300 millions de francophones dans le monde.</li>\n<li>Le français se parle sur <strong>plusieurs continents</strong> : l'Europe (France, Belgique, Suisse), l'Amérique (Canada, Haïti), et surtout <strong>l'Afrique</strong>, le continent qui compte le plus de francophones (Sénégal, Côte d'Ivoire, Maroc, République démocratique du Congo, etc.).</li>\n<li>L'<strong>OIF</strong> (Organisation internationale de la Francophonie) regroupe plus de 80 États et gouvernements qui coopèrent pour promouvoir la langue française et la diversité culturelle.</li>\n</ul>\n<h3>La culture francophone : à retenir</h3>\n<table>\n<tr><th>Domaine</th><th>Exemples</th></tr>\n<tr><td><strong>Musique</strong></td><td>Des artistes québécois et francophones connus dans le monde entier (chanson, pop, rap).</td></tr>\n<tr><td><strong>Cinéma</strong></td><td>Le cinéma québécois et français rayonne dans les festivals internationaux.</td></tr>\n<tr><td><strong>Festivals</strong></td><td>Saint-Jean-Baptiste (24 juin), Carnaval de Québec (hiver), festivals de musique francophone.</td></tr>\n<tr><td><strong>Gastronomie</strong></td><td>La poutine, symbole de la culture québécoise.</td></tr>\n</table>\n<p><strong>Idée clé pour l'examen :</strong> la culture francophone n'est pas seulement québécoise — elle vit aussi en Ontario, dans tout le Canada et sur plusieurs continents. Savoir expliquer <strong>où</strong> le français se parle et <strong>pourquoi</strong> il est protégé (lois, drapeaux, fêtes) montre une vraie compréhension du sujet.</p>\n"}]},

{"id":"mpm2d","name":"Principles of Mathematics (MPM2D1)","semester":0,"units":[{"id":"mpm2d-quadratics","name":"Quadratic Relations","instructions":"Answer all questions. Show your work for full marks.","quizFormat":{"mc":12,"short":4},"mcBank":[{"answer":0,"explain":"In y = a(x - h)^2 + k the vertex is (h, k). Here h = 3 and k = 5. Watch the sign: (x - 3) means h is positive 3, not negative.","options":["(3, 5)","(-3, 5)","(3, -5)","(-3, -5)"],"q":"What is the vertex of the parabola y = 2(x - 3)^2 + 5?","topic":"Vertex form"},{"answer":1,"explain":"Since a = -1 is negative, the parabola opens downward, so the vertex is a maximum point. The vertex is (-1, -4), so the greatest y-value the graph reaches is -4.","options":["4","-4","-1","1"],"q":"What is the maximum value of y = -(x + 1)^2 - 4?","topic":"Maximum value"},{"answer":2,"explain":"The axis of symmetry is the vertical line through the vertex. The vertex is (2, 7), so the axis is x = 2. Note it is a vertical line, so it is written as x = a constant, not y = a constant.","options":["x = -2","x = 3","x = 2","y = 2"],"q":"What is the equation of the axis of symmetry of y = 3(x - 2)^2 + 7?","topic":"Axis of symmetry"},{"answer":0,"explain":"A vertical stretch multiplies every y-value, which happens when |a| > 1. In y = 2x^2, a = 2, so the graph is narrower (stretched). y = (1/2)x^2 is a compression, and the other two are translations, not stretches.","options":["y = 2x^2","y = (1/2)x^2","y = x^2 + 2","y = (x - 2)^2"],"q":"Which equation represents a vertical stretch of the parabola y = x^2?","topic":"Transformations"},{"answer":3,"explain":"The x-intercepts occur where y = 0, so set each factor to zero: x - 4 = 0 gives x = 4, and x + 2 = 0 gives x = -2.","options":["4 and 2","-4 and 2","-4 and -2","4 and -2"],"q":"What are the x-intercepts of y = (x - 4)(x + 2)?","topic":"Factored form"},{"answer":1,"explain":"A parabola is symmetric, so its axis lies exactly halfway between its x-intercepts. The intercepts are 1 and 7, and (1 + 7) / 2 = 4, so the axis is x = 4.","options":["x = 8","x = 4","x = 3","x = -4"],"q":"For y = (x - 1)(x - 7), what is the axis of symmetry?","topic":"Axis from factored form"},{"answer":2,"explain":"The y-intercept is where the graph crosses the y-axis, i.e. x = 0. Substituting gives y = 2. In standard form y = ax^2 + bx + c, the y-intercept is always the constant term c.","options":["3","-5","2","0"],"q":"What is the y-intercept of y = 3x^2 - 5x + 2?","topic":"Standard form"},{"answer":3,"explain":"For y = ax^2 + bx + c the axis of symmetry is x = -b / (2a). Here a = 2 and b = 8, so x = -8 / (2 x 2) = -8 / 4 = -2.","options":["x = 2","x = 4","x = -4","x = -2"],"q":"What is the axis of symmetry of y = 2x^2 + 8x - 3?","topic":"Axis from standard form"},{"answer":1,"explain":"Factor the trinomial: x^2 - 5x + 6 = (x - 2)(x - 3). Setting each factor to zero gives x = 2 or x = 3. (Check: 2 + 3 = 5 and 2 x 3 = 6.)","options":["x = -2 or x = -3","x = 2 or x = 3","x = 2 or x = -3","x = 1 or x = 6"],"q":"Solve x^2 - 5x + 6 = 0.","topic":"Solving by factoring"},{"answer":2,"explain":"The discriminant is b^2 - 4ac = (-7)^2 - 4(2)(3) = 49 - 24 = 25. Then x = (7 +/- 5) / 4, giving x = 12/4 = 3 or x = 2/4 = 1/2.","options":["x = 3 or x = -1/2","x = -3 or x = 1/2","x = 3 or x = 1/2","x = 1 or x = 3"],"q":"Solve 2x^2 - 7x + 3 = 0 using the quadratic formula.","topic":"Quadratic formula"},{"answer":0,"explain":"The discriminant is b^2 - 4ac = (-3)^2 - 4(2)(4) = 9 - 32 = -23. A negative discriminant means the equation has no real solutions (the parabola never touches the x-axis).","options":["none","one","two","infinitely many"],"q":"How many real solutions does 2x^2 - 3x + 4 = 0 have?","topic":"Discriminant"},{"answer":1,"explain":"If the width is w metres, the length is 20 - w metres (since 2w + 2L = 40). Area A = w(20 - w) is a downward-opening parabola with its maximum at w = 10, giving an area of 10 x 10 = 100 m^2.","options":["200 m^2","100 m^2","400 m^2","80 m^2"],"q":"A farmer has 40 m of fencing to enclose a rectangular pen. What is the maximum possible area of the pen?","topic":"Application: maximum area"}],"shortBank":[{"answer":"x^2 + 6x + 5 = (x^2 + 6x + 9) - 9 + 5 = (x + 3)^2 - 4. This is vertex form y = a(x - h)^2 + k with h = -3 and k = -4, so the vertex is (-3, -4).","marks":3,"q":"Find the vertex of y = x^2 + 6x + 5 by completing the square. Show your steps.","topic":"Completing the square"},{"answer":"The discriminant is b^2 - 4ac = (-5)^2 - 4(3)(-2) = 25 + 24 = 49. Then x = (5 +/- 7) / 6, so x = 12/6 = 2 or x = -2/6 = -1/3.","marks":3,"q":"Solve 3x^2 - 5x - 2 = 0 using the quadratic formula. Show your steps.","topic":"Quadratic formula"},{"answer":"The maximum height occurs at the vertex, where t = -b / (2a) = -30 / (2 x -5) = 3 seconds. Substituting: h(3) = -5(9) + 30(3) + 2 = -45 + 90 + 2 = 47. The ball reaches a maximum height of 47 m after 3 seconds.","marks":4,"q":"A ball is thrown upward. Its height in metres after t seconds is h(t) = -5t^2 + 30t + 2. What is the maximum height of the ball, and when does it reach it?","topic":"Application: projectile"},{"q":"A rectangle's length is 4 cm more than its width, and its area is 60 cm^2. Find the width of the rectangle.","marks":3,"answer":"Let the width be w cm; then the length is (w + 4) cm. So w(w + 4) = 60, i.e. w^2 + 4w - 60 = 0. Factoring: (w + 10)(w - 6) = 0, so w = 6 or w = -10. A width cannot be negative, so reject -10. The width is 6 cm (check: 6 x 10 = 60).","topic":"Application: solving"}],"notes":"<h3>The Three Forms of a Quadratic</h3>\n<p>Each form makes different features easy to read:</p>\n<table>\n<tr><th>Form</th><th>Looks like</th><th>Read straight off</th></tr>\n<tr><td><strong>Vertex form</strong></td><td>y = a(x - h)^2 + k</td><td>Vertex (h, k); max/min value k</td></tr>\n<tr><td><strong>Factored form</strong></td><td>y = a(x - r)(x - s)</td><td>x-intercepts r and s</td></tr>\n<tr><td><strong>Standard form</strong></td><td>y = ax^2 + bx + c</td><td>y-intercept c</td></tr>\n</table>\n\n<h3>Vertex Form: y = a(x - h)^2 + k</h3>\n<ul>\n<li>The <strong>vertex</strong> is (h, k) — watch the sign: y = 2(x - 3)^2 + 5 has vertex (3, 5).</li>\n<li>The <strong>axis of symmetry</strong> is the vertical line x = h.</li>\n<li><strong>a &gt; 0</strong>: opens upward, vertex is a <strong>minimum</strong>. <strong>a &lt; 0</strong>: opens downward, vertex is a <strong>maximum</strong>.</li>\n<li><strong>Transformations:</strong> |a| &gt; 1 stretches (narrower), 0 &lt; |a| &lt; 1 compresses (wider), negative a reflects across the x-axis. h shifts left/right, k shifts up/down.</li>\n</ul>\n\n<h3>Factored Form: y = a(x - r)(x - s)</h3>\n<ul>\n<li>The <strong>x-intercepts</strong> are r and s. For y = (x - 4)(x + 2), they are 4 and -2.</li>\n<li>The <strong>axis of symmetry is the midpoint of the intercepts</strong>: x = (r + s) / 2. Above, x = (4 + (-2)) / 2 = 1.</li>\n<li>Substitute to find the vertex: y = (1 - 4)(1 + 2) = -9, so the vertex is (1, -9).</li>\n</ul>\n\n<h3>Standard Form: y = ax^2 + bx + c</h3>\n<ul>\n<li>The <strong>y-intercept</strong> is c. For y = 3x^2 - 5x + 2, it is 2.</li>\n<li>The <strong>axis of symmetry</strong> is x = -b / (2a). Above: x = 5 / 6.</li>\n<li><strong>Completing the square</strong> converts to vertex form: x^2 + 6x + 5 = (x + 3)^2 - 4, so the vertex is (-3, -4).</li>\n</ul>\n\n<h3>Expanding and Factoring</h3>\n<ul>\n<li><strong>Expanding</strong>: (x + 3)(x - 5) = x^2 - 2x - 15.</li>\n<li><strong>Factoring</strong>: for x^2 - 5x + 6, find two numbers with product 6 and sum -5 → (x - 2)(x - 3).</li>\n<li>When a ≠ 1: 2x^2 + 7x + 3 = (2x + 1)(x + 3). Always check by expanding.</li>\n<li>Special cases: <strong>difference of squares</strong> x^2 - 9 = (x - 3)(x + 3); <strong>perfect square</strong> x^2 + 6x + 9 = (x + 3)^2.</li>\n</ul>\n\n<h3>Solving Quadratic Equations</h3>\n<ul>\n<li><strong>By factoring:</strong> move everything to one side, factor, set each factor to zero. x^2 - 5x + 6 = 0 → x = 2 or x = 3.</li>\n<li><strong>By the quadratic formula</strong> (use when it won't factor). For ax^2 + bx + c = 0:<br><strong>x = (-b ± √(b^2 - 4ac)) / (2a)</strong></li>\n<li>Example: 2x^2 - 7x + 3 = 0 gives x = (7 ± √(49 - 24)) / 4 = (7 ± 5) / 4, so x = 3 or x = 1/2. Keep the ± until the last step.</li>\n</ul>\n\n<h3>The Discriminant</h3>\n<p><strong>D = b^2 - 4ac</strong> reveals the <strong>nature of the roots</strong> without solving:</p>\n<ul>\n<li><strong>D &gt; 0:</strong> two distinct real roots.</li>\n<li><strong>D = 0:</strong> one repeated root (vertex touches the x-axis). x^2 + 6x + 9 = 0 → D = 0, root x = -3.</li>\n<li><strong>D &lt; 0:</strong> no real roots. 2x^2 - 3x + 4 = 0 → D = 9 - 32 = -23.</li>\n</ul>\n\n<h3>Applications</h3>\n<ul>\n<li><strong>Maximum area, fixed perimeter:</strong> the optimum is a <strong>square</strong>. With 40 m of fencing, A = w(20 - w) = -w^2 + 20w; the vertex is at w = -20 / (2 × -1) = 10 m, so a 10 m × 10 m square gives 100 m^2.</li>\n<li><strong>Projectile max height:</strong> h(t) = -5t^2 + 30t + 2 opens downward, so the vertex is the peak. t = -30 / (2 × -5) = 3 s; h(3) = -45 + 90 + 2 = 47 m. Max height 47 m at 3 s.</li>\n</ul>\n"},{"id":"mpm2d-geometry","name":"Analytic Geometry","instructions":"Answer all questions. Show your work for full marks.","quizFormat":{"mc":12,"short":4},"mcBank":[{"answer":0,"explain":"Average the x-coordinates and average the y-coordinates: ((-3 + 5)/2, (7 + (-1))/2) = (2/2, 6/2) = (1, 3).","options":["(1, 3)","(1, 4)","(4, 3)","(2, 6)"],"q":"Find the midpoint of the line segment with endpoints A(-3, 7) and B(5, -1).","topic":"Midpoint"},{"answer":0,"explain":"d = sqrt((4 - 1)^2 + (6 - 2)^2) = sqrt(9 + 16) = sqrt(25) = 5. Remember to take the square root at the end.","options":["5","7","25","sqrt(7)"],"q":"Find the length of the line segment joining P(1, 2) and Q(4, 6).","topic":"Distance"},{"answer":0,"explain":"m = (11 - 3)/(6 - 2) = 8/4 = 2. Slope is rise over run: change in y divided by change in x.","options":["2","1/2","-2","4"],"q":"Find the slope of the line passing through (2, 3) and (6, 11).","topic":"Slope"},{"answer":0,"explain":"Rewrite L as y = (-2/3)x + 2, so L has slope -2/3. Parallel lines have equal slopes.","options":["-2/3","3/2","-3/2","2/3"],"q":"Line L has equation 2x + 3y = 6. What is the slope of any line parallel to L?","topic":"Parallel lines"},{"answer":0,"explain":"Flip the fraction and change the sign: the opposite reciprocal of 2/5 is -5/2. Check: (2/5)(-5/2) = -1.","options":["-5/2","5/2","2/5","-2/5"],"q":"A line has slope 2/5. What is the slope of a line perpendicular to it?","topic":"Perpendicular lines"},{"answer":0,"explain":"Substitute into y = mx + b: 10 = 2(3) + b, so b = 4. The equation is y = 2x + 4.","options":["y = 2x + 4","y = 2x - 4","y = 2x + 16","y = -2x + 4"],"q":"Write the equation of the line with slope 2 that passes through (3, 10).","topic":"Equation from slope and point"},{"answer":0,"explain":"Move every term to the left side: 2x + y - 5 = 0. In standard form the x-term is usually kept positive.","options":["2x + y - 5 = 0","-2x + y - 5 = 0","2x + y + 5 = 0","2x - y + 5 = 0"],"q":"Write y = -2x + 5 in the form Ax + By + C = 0.","topic":"Standard form"},{"answer":0,"explain":"Set y = 0: 3x = 12, so x = 4. (The y-intercept is -3; do not mix the two up.)","options":["4","-3","3","-4"],"q":"What is the x-intercept of the line 3x - 4y = 12?","topic":"Intercepts"},{"answer":0,"explain":"m = (9 - 5)/(3 - 1) = 4/2 = 2. Then 5 = 2(1) + b gives b = 3, so y = 2x + 3.","options":["y = 2x + 3","y = 2x + 7","y = 4x + 1","y = x + 4"],"q":"Find the equation of the line passing through (1, 5) and (3, 9).","topic":"Equation from two points"},{"answer":1,"explain":"Slope of AB = (6 - 2)/(4 - 1) = 4/3 and slope of BC = (3 - 6)/(8 - 4) = -3/4. Their product is -1, so AB is perpendicular to BC and the right angle is at B.","options":["Vertex A","Vertex B","Vertex C","There is no right angle"],"topic":"Right triangles and slope","q":"The triangle has vertices A(1, 2), B(4, 6), C(8, 3). At which vertex is the right angle?"},{"answer":0,"explain":"The midpoint of BC is ((8 + 4)/2, (3 + 9)/2) = (6, 6). The slope from A(2, 1) to (6, 6) is 5/4, so y - 1 = (5/4)(x - 2), which rearranges to 5x - 4y - 6 = 0.","options":["5x - 4y - 6 = 0","5x + 4y - 6 = 0","4x - y - 7 = 0","5x - 4y + 6 = 0"],"q":"Triangle ABC has vertices A(2, 1), B(8, 3), C(4, 9). Find the equation of the median from vertex A to side BC, in Ax + By + C = 0 form.","topic":"Median of a triangle"},{"answer":0,"explain":"Intercept form: x/5 + y/(-2) = 1. Multiply by 10 to clear denominators: 2x - 5y = 10. Check: x = 5 when y = 0, and y = -2 when x = 0.","options":["2x - 5y = 10","2x + 5y = 10","5x - 2y = 10","-2x + 5y = 10"],"q":"Which equation represents the line with x-intercept 5 and y-intercept -2?","topic":"Intercepts and equations"}],"shortBank":[{"answer":"Midpoint M = ((-2 + 6)/2, (5 + (-3))/2) = (2, 1). Length AB = sqrt((6 - (-2))^2 + (-3 - 5)^2) = sqrt(64 + 64) = sqrt(128) = 8sqrt(2) units.","marks":3,"q":"A(-2, 5) and B(6, -3) are endpoints of a line segment. Find the midpoint M and the exact length AB (simplest radical form).","topic":"Midpoint and distance"},{"answer":"Substitute into y = mx + b: -4 = -2(3) + b, so b = 2 and y = -2x + 2. Moving all terms left gives standard form 2x + y - 2 = 0.","marks":3,"q":"Write the equation of the line with slope -2 passing through (3, -4) in y = mx + b form and in Ax + By + C = 0 form.","topic":"Line equations"},{"answer":"DE = sqrt((4-1)^2 + (6-2)^2) = 5, EF = sqrt((7-4)^2 + (2-6)^2) = 5, DF = 6. Two equal sides, so the triangle is isosceles. Slopes: DE = 4/3, EF = -4/3; their product is -16/9, not -1 (and 5^2 + 5^2 != 6^2), so it is not right-angled.","marks":4,"q":"Triangle DEF has vertices D(1, 2), E(4, 6), F(7, 2). Classify it as scalene, isosceles, or equilateral, and state whether it is right-angled. Justify with slopes or side lengths.","topic":"Classifying triangles"},{"answer":"Midpoint of AC = ((-1 + 3)/2, (4 + 8)/2) = (1, 6). Slope from B(5, 2) to (1, 6) is (6 - 2)/(1 - 5) = -1. Point-slope form: y - 2 = -1(x - 5), so y = -x + 7.","marks":3,"q":"Triangle ABC has vertices A(-1, 4), B(5, 2), C(3, 8). Find the equation of the median from vertex B to side AC, in y = mx + b form.","topic":"Median of a triangle"}],"notes":"<h3>Midpoint of a Line Segment</h3>\n<ul>\n<li>The <strong>midpoint</strong> is the point exactly halfway between the two endpoints of a segment. Average the x-coordinates and average the y-coordinates:</li>\n</ul>\n<p><strong>Midpoint formula:</strong> for A(x1, y1) and B(x2, y2), the midpoint M is ((x1 + x2)/2, (y1 + y2)/2).</p>\n<ul>\n<li><strong>Example:</strong> A(-3, 7) and B(5, -1). M = ((-3 + 5)/2, (7 + (-1))/2) = (1, 3).</li>\n<li>Watch the signs — a common error is forgetting the negative when averaging, e.g. (7 + (-1))/2 = 3, not 4.</li>\n</ul>\n\n<h3>Length of a Line Segment (Distance)</h3>\n<ul>\n<li>The segment is the <strong>hypotenuse of a right triangle</strong> whose legs are the horizontal and vertical gaps between the endpoints. So the distance formula is just Pythagoras:</li>\n</ul>\n<p><strong>Distance formula:</strong> AB = sqrt((x2 - x1)^2 + (y2 - y1)^2).</p>\n<ul>\n<li><strong>Example:</strong> P(1, 2) and Q(4, 6). AB = sqrt((4 - 1)^2 + (6 - 2)^2) = sqrt(9 + 16) = sqrt(25) = 5.</li>\n<li>Give exact answers in simplest radical form unless a decimal is asked for (e.g. sqrt(128) = 8sqrt(2)).</li>\n</ul>\n\n<h3>Slope</h3>\n<ul>\n<li><strong>Slope</strong> measures steepness: rise over run.</li>\n</ul>\n<p><strong>Slope formula:</strong> m = (y2 - y1)/(x2 - x1).</p>\n<ul>\n<li><strong>Example:</strong> (2, 3) and (6, 11). m = (11 - 3)/(6 - 2) = 8/4 = 2.</li>\n<li>A positive slope rises left-to-right; a negative slope falls; a zero slope is <strong>horizontal</strong>; an undefined slope (zero denominator) is <strong>vertical</strong>.</li>\n<li>Keep point order consistent: use the same point as \"2\" on top and bottom.</li>\n</ul>\n\n<h3>Parallel and Perpendicular Lines</h3>\n<table>\n<tr><th>Relationship</th><th>Slopes</th><th>Example</th></tr>\n<tr><td><strong>Parallel</strong> lines</td><td>Slopes are <strong>equal</strong></td><td>2x + 3y = 6 has slope -2/3, so a parallel line does too</td></tr>\n<tr><td><strong>Perpendicular</strong> lines</td><td>Slopes are <strong>negative reciprocals</strong> (multiply to -1)</td><td>slope 2/5 is perpendicular to slope -5/2</td></tr>\n</table>\n<ul>\n<li>To get a perpendicular slope: <strong>flip the fraction and change the sign</strong>. Slope 3 becomes -1/3; slope -4/7 becomes 7/4.</li>\n<li>A horizontal line (slope 0) is perpendicular to a vertical line (undefined slope) — the reciprocal rule doesn't apply there.</li>\n</ul>\n\n<h3>Equations of Lines</h3>\n<h4>Slope–y-intercept form: y = mx + b</h4>\n<ul>\n<li><strong>Given slope and a point:</strong> substitute into y = mx + b and solve for b. <strong>Example:</strong> slope 2 through (3, 10): 10 = 2(3) + b, so b = 4 and the equation is y = 2x + 4.</li>\n<li><strong>Given two points:</strong> find the slope first, then use one point as above. <strong>Example:</strong> (1, 5) and (3, 9): m = (9 - 5)/(3 - 1) = 2, then 5 = 2(1) + b gives b = 3, so y = 2x + 3.</li>\n</ul>\n<h4>Standard form: Ax + By + C = 0</h4>\n<ul>\n<li><strong>Converting:</strong> move everything to one side. <strong>Example:</strong> y = -2x + 5 becomes 2x + y - 5 = 0.</li>\n<li><strong>Intercepts:</strong> the x-intercept is where y = 0; the y-intercept is where x = 0. <strong>Example:</strong> 3x - 4y = 12 has x-intercept 4 (since 3x = 12) and y-intercept -3 (since -4y = 12).</li>\n<li>A line with x-intercept 5 and y-intercept -2 has slope 2/5 and equation 2x - 5y = 10.</li>\n</ul>\n\n<h3>Right Angles and Classifying Triangles</h3>\n<ul>\n<li>Two segments form a <strong>right angle</strong> when their slopes are negative reciprocals (product = -1).</li>\n<li><strong>Example:</strong> triangle with vertices A(1, 2), B(4, 6), C(8, 3). Slope of AB = (6 - 2)/(4 - 1) = 4/3. Slope of BC = (3 - 6)/(8 - 4) = -3/4. Since (4/3) x (-3/4) = -1, the right angle is at <strong>vertex B</strong>.</li>\n<li>Combine slopes with side lengths to classify: equal slopes mean parallel sides; equal lengths (from the distance formula) mean an isosceles triangle.</li>\n</ul>\n\n<h3>Medians of a Triangle</h3>\n<ul>\n<li>A <strong>median</strong> joins a vertex to the <strong>midpoint of the opposite side</strong>.</li>\n<li>Steps: (1) find the midpoint of the opposite side, (2) find the slope from the vertex to that midpoint, (3) write the equation.</li>\n<li><strong>Example:</strong> triangle ABC with A(2, 1), B(8, 3), C(4, 9). Median from A: midpoint of BC = ((8 + 4)/2, (3 + 9)/2) = (6, 6). Slope from A(2, 1) to (6, 6) is (6 - 1)/(6 - 2) = 5/4. Using point-slope form: y - 1 = (5/4)(x - 2), which simplifies to 5x - 4y - 6 = 0.</li>\n</ul>\n"},{"id":"mpm2d-trig","name":"Trigonometry","instructions":"A calculator is allowed. Round as directed in each question.","quizFormat":{"mc":12,"short":4},"mcBank":[{"q":"In right triangle ABC, the right angle is at C. For acute angle A, which side is opposite angle A?","options":["BC","AB","AC","It cannot be determined from this information"],"answer":0,"explain":"The side opposite an angle is the one that does not touch that angle's vertex. Angle A touches sides AB and AC, so the side opposite angle A is BC.","topic":"Naming triangle sides"},{"q":"Right triangle DEF has its right angle at E, with DE = 3, EF = 4 and DF = 5. What is sin(D)?","options":["4/5","3/5","3/4","4/3"],"answer":0,"explain":"Sine is opposite over hypotenuse. For angle D, the opposite side is EF = 4 and the hypotenuse is DF = 5, so sin(D) = 4/5.","topic":"Writing trig ratios"},{"q":"In a right triangle, one acute angle is 35° and the side adjacent to it measures 12 cm. What is the length of the hypotenuse, to the nearest tenth of a centimetre?","options":["14.6 cm","9.8 cm","6.9 cm","20.9 cm"],"answer":0,"explain":"Cosine relates the adjacent side and the hypotenuse: cos(35°) = 12/h, so h = 12/cos(35°) ≈ 14.6 cm.","topic":"Solving for a side"},{"q":"In a right triangle, the hypotenuse is 20 cm and one acute angle is 52°. What is the length of the side opposite the 52° angle, to the nearest tenth of a centimetre?","options":["15.8 cm","12.3 cm","32.5 cm","25.6 cm"],"answer":0,"explain":"Sine relates the opposite side and the hypotenuse: sin(52°) = opposite/20, so opposite = 20 × sin(52°) ≈ 15.8 cm.","topic":"Solving for a side"},{"q":"In a right triangle, the side opposite an acute angle measures 9 cm and the hypotenuse measures 20 cm. What is the angle, to the nearest degree?","options":["27°","63°","24°","45°"],"answer":0,"explain":"sin(x) = opposite/hypotenuse = 9/20 = 0.45, so x = sin⁻¹(0.45) ≈ 27°.","topic":"Solving for an angle"},{"q":"In a right triangle, the legs measure 11 cm (opposite an acute angle) and 5 cm (adjacent to it). What is the acute angle, to the nearest degree?","options":["66°","24°","63°","65°"],"answer":0,"explain":"Tangent relates opposite and adjacent: tan(x) = 11/5 = 2.2, so x = tan⁻¹(2.2) ≈ 66°.","topic":"Solving for an angle"},{"q":"A kite string is 50 m long and makes an angle of elevation of 60° with the ground. How high is the kite, to the nearest tenth of a metre? (Ignore any sag in the string.)","options":["43.3 m","25.0 m","57.7 m","86.6 m"],"answer":0,"explain":"The height is opposite the 60° angle and the string is the hypotenuse, so height = 50 × sin(60°) ≈ 43.3 m.","topic":"Angle of elevation"},{"q":"From the top of a 30 m cliff, the angle of depression to a boat is 25°. How far is the boat from the base of the cliff horizontally, to the nearest tenth of a metre?","options":["64.3 m","14.0 m","71.0 m","12.7 m"],"answer":0,"explain":"The angle of depression equals the angle of elevation from the boat (alternate angles). Then tan(25°) = 30/distance, so distance = 30/tan(25°) ≈ 64.3 m.","topic":"Angle of depression"},{"q":"A 6 m ladder leans against a wall, making a 70° angle with the ground. How far up the wall does the ladder reach, to the nearest tenth of a metre?","options":["5.6 m","2.1 m","16.5 m","17.5 m"],"answer":0,"explain":"The height is opposite the 70° angle and the ladder is the hypotenuse, so height = 6 × sin(70°) ≈ 5.6 m.","topic":"Applications: ladder"},{"q":"A building casts an 18 m shadow when the sun's angle of elevation is 48°. How tall is the building, to the nearest tenth of a metre?","options":["20.0 m","13.4 m","26.9 m","12.0 m"],"answer":0,"explain":"Tangent relates the height and the shadow: tan(48°) = height/18, so height = 18 × tan(48°) ≈ 20.0 m.","topic":"Applications: shadows"},{"q":"A right triangle has a 40° angle, and the side adjacent to the 40° angle is 9 cm long. Which equation correctly solves for the hypotenuse h?","options":["cos(40°) = 9/h","sin(40°) = 9/h","tan(40°) = 9/h","cos(40°) = h/9"],"answer":0,"explain":"Cosine relates the adjacent side and the hypotenuse: cos(angle) = adjacent/hypotenuse, so cos(40°) = 9/h.","topic":"Setting up trig equations"},{"q":"An observer on the ground looks up at a drone flying overhead. The angle between the observer's horizontal line of sight and the line to the drone is called the angle of ___.","options":["elevation","depression","incidence","reflection"],"answer":0,"explain":"An angle measured upward from the horizontal is an angle of elevation; measured downward from the horizontal it would be an angle of depression.","topic":"Elevation vs depression"}],"shortBank":[{"q":"In right triangle PQR, the right angle is at Q, angle P = 28°, and the hypotenuse PR = 15 cm. Find the length of QR, to the nearest tenth of a centimetre. Show your setup.","marks":3,"answer":"QR is opposite the 28° angle, so sin(28°) = QR/15. QR = 15 × sin(28°) ≈ 15 × 0.4695 ≈ 7.0 cm.","topic":"Solving for a side"},{"q":"In right triangle ABC, the right angle is at B, AB = 8 cm and AC = 17 cm. Find the measure of angle A, to the nearest degree. Show your setup.","marks":3,"answer":"AC is the hypotenuse and AB is adjacent to angle A, so cos(A) = 8/17 ≈ 0.4706. A = cos⁻¹(0.4706) ≈ 61.9° ≈ 62°.","topic":"Solving for an angle"},{"q":"A student whose eyes are 1.7 m above the ground stands 25 m from the base of a flagpole. The angle of elevation from the student's eyes to the top of the flagpole is 32°. How tall is the flagpole, to the nearest tenth of a metre? Show your work.","marks":4,"answer":"Let h be the height above eye level: tan(32°) = h/25, so h = 25 × tan(32°) ≈ 25 × 0.6249 ≈ 15.6 m. Add the eye height: 15.6 + 1.7 = 17.3 m. The flagpole is about 17.3 m tall.","topic":"Angle of elevation"},{"q":"An airplane flying 1200 m above the ground spots an airport runway at an angle of depression of 18°. What is the horizontal distance from the plane to the runway, to the nearest metre? Show your work.","marks":4,"answer":"The angle of depression from the plane equals the angle of elevation from the runway (alternate interior angles), so tan(18°) = 1200/d, where d is the horizontal distance. d = 1200/tan(18°) ≈ 1200/0.3249 ≈ 3693 m.","topic":"Angle of depression"}],"notes":"<h3>Naming the Sides of a Right Triangle</h3>\n<p>The three sides get their names <strong>relative to the acute angle you are working with</strong> (not the right angle). If you switch to the other acute angle, opposite and adjacent swap.</p>\n<ul>\n<li><strong>Hypotenuse:</strong> always the side opposite the right angle — the longest side. It never changes name.</li>\n<li><strong>Opposite:</strong> the side across from your angle (it does not touch the angle's vertex).</li>\n<li><strong>Adjacent:</strong> the side next to your angle that is <strong>not</strong> the hypotenuse.</li>\n</ul>\n\n<h3>The Three Primary Ratios — SOHCAHTOA</h3>\n<p>Each ratio pairs two sides. Memorize them with <strong>SOHCAHTOA</strong>:</p>\n<table>\n<tr><th>Ratio</th><th>Stands for</th><th>Equals</th></tr>\n<tr><td><strong>sin</strong> (sine)</td><td>SOH</td><td>opposite / hypotenuse</td></tr>\n<tr><td><strong>cos</strong> (cosine)</td><td>CAH</td><td>adjacent / hypotenuse</td></tr>\n<tr><td><strong>tan</strong> (tangent)</td><td>TOA</td><td>opposite / adjacent</td></tr>\n</table>\n<p><strong>Choosing the ratio:</strong> label the sides (O, A, H) for your angle, then pick the ratio that uses the two sides you know or want. Know H and want O? Use sine. Know A and want H? Use cosine. No H involved? Use tangent.</p>\n\n<h3>Solving for a Missing Side</h3>\n<ol>\n<li>Label the sides O, A, H relative to the given angle.</li>\n<li>Choose the ratio with the known side and the unknown side.</li>\n<li>Substitute the numbers and solve the equation.</li>\n</ol>\n<p><strong>Example:</strong> a right triangle has an acute angle of 35° and the adjacent side is 12 cm. Find the hypotenuse.</p>\n<p>We know A and want H → cosine: cos(35°) = 12 / h. Rearranging: h = 12 / cos(35°) ≈ <strong>14.6 cm</strong> (to the nearest tenth).</p>\n\n<h3>Solving for a Missing Angle</h3>\n<p>When the <strong>angle</strong> is the unknown, use the <strong>inverse</strong> trig functions: sin⁻¹, cos⁻¹, tan⁻¹ (the \"2nd\" button on your calculator). Set up the ratio with the two known sides, then take the inverse.</p>\n<p><strong>Example:</strong> the side opposite an acute angle is 9 cm and the hypotenuse is 20 cm. Find the angle.</p>\n<p>sin(angle) = 9 / 20 = 0.45, so angle = sin⁻¹(0.45) ≈ <strong>27°</strong> (to the nearest degree).</p>\n<p><strong>Rounding:</strong> follow what the question asks — sides are usually to the <strong>nearest tenth</strong>, angles to the <strong>nearest degree</strong>. Keep extra digits in your calculator until the final step.</p>\n\n<h3>Angles of Elevation and Depression</h3>\n<ul>\n<li><strong>Angle of elevation:</strong> the angle <strong>up</strong> from a horizontal line of sight to an object above you (e.g. looking up at a kite).</li>\n<li><strong>Angle of depression:</strong> the angle <strong>down</strong> from a horizontal line of sight to an object below you (e.g. looking down at a boat from a cliff).</li>\n</ul>\n<p><strong>Drawing the diagram:</strong> always start with a horizontal line from the observer's eye, then draw the line of sight to the object. The angle between them is your elevation/depression angle — and it goes <strong>inside a right triangle</strong> you can solve. A key fact: the angle of depression from above equals the angle of elevation from below (alternate interior angles), so you can work from whichever triangle is easier.</p>\n\n<h3>Word Problems</h3>\n<p>The setup is always the same: draw the right triangle, label the angle, label O/A/H, pick the ratio, solve.</p>\n<ul>\n<li><strong>Kite:</strong> a 50 m string makes a 60° angle of elevation with the ground. Height = 50 × sin(60°) ≈ <strong>43.3 m</strong>. (The string is the hypotenuse.)</li>\n<li><strong>Ladder:</strong> a 6 m ladder makes 70° with the ground. Height reached = 6 × sin(70°) ≈ <strong>5.6 m</strong>.</li>\n<li><strong>Shadow:</strong> a building casts an 18 m shadow when the sun's angle of elevation is 48°. Height = 18 × tan(48°) ≈ <strong>20.0 m</strong>. (The shadow is the adjacent side.)</li>\n<li><strong>Cliff and boat:</strong> from a 30 m cliff, the angle of depression to a boat is 25°. The horizontal distance = 30 / tan(25°) ≈ <strong>64.3 m</strong>. (Depression from the top = elevation from the boat, so tan(25°) = 30 / distance.)</li>\n</ul>\n<p><strong>Common mistakes to avoid:</strong> using the wrong ratio (re-label O/A/H every time), forgetting degree mode on your calculator, and rounding mid-calculation instead of at the end.</p>\n"}]},
