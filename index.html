/* ---------- app logic ---------- */
const CUSTOM_KEY = 'erica-quiz-custom-v1';
const app = document.getElementById('app');
let quiz = null; // current generated quiz

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function loadCustom(){
  try{ const d = JSON.parse(localStorage.getItem(CUSTOM_KEY)); if(d && Array.isArray(d.courses)) return d; }catch(e){}
  return {courses:[]};
}
function saveCustom(d){ localStorage.setItem(CUSTOM_KEY, JSON.stringify(d)); }
function allCourses(){ return SEED.courses.concat(loadCustom().courses); }
function findCourse(id){ return allCourses().find(c=>c.id===id) || null; }
function findUnit(uid){
  for(const c of allCourses()){
    const u = (c.units||[]).find(u=>u.id===uid);
    if(u) return {course:c, unit:u};
  }
  return null;
}
function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function sample(a,n){ return shuffle(a).slice(0, Math.max(0, Math.min(n, a.length))); }
function unitCounts(u){
  const mc=(u.mcBank||[]).length, sh=(u.shortBank||[]).length;
  const parts=[];
  if(mc) parts.push(mc+' multiple-choice');
  if(sh) parts.push(sh+' short-answer');
  return parts.length? parts.join(' + ')+' questions' : 'no questions yet';
}

/* ---------- quiz generation ---------- */
function generateQuiz(uid, mcCount, shortCount){
  const found = findUnit(uid); if(!found) return null;
  const {course, unit} = found;
  const mcPicked = sample(unit.mcBank||[], mcCount).map(q=>{
    const order = shuffle([0,1,2,3]);
    return { q:q.q, topic:q.topic, explain:q.explain,
             options: order.map(i=>q.options[i]),
             answer: order.indexOf(q.answer) };
  });
  const shortPicked = sample(unit.shortBank||[], shortCount).map(q=>({q:q.q, topic:q.topic, marks:q.marks, answer:q.answer}));
  const total = mcPicked.length + shortPicked.reduce((s,q)=>s+(q.marks||0),0);
  quiz = { uid, courseName:course.name, unitName:unit.name,
           instructions:unit.instructions||'No notes.',
           mc:shuffle(mcPicked), short:shuffle(shortPicked), total,
           mcCount:mcPicked.length, shortCount:shortPicked.length,
           fmtMc:(unit.quizFormat||{}).mc||0, fmtShort:(unit.quizFormat||{}).short||0 };
  return quiz;
}

/* ---------- views ---------- */
function gradeOfCourse(c){
  const s = c.semester;
  return s===0?'9':(s===11?'11':(s===12?'12':'10'));
}
function viewGrade(g){
  if(!['9','10','11','12'].includes(g)) g = '10';
  const courses = allCourses();
  const card = c=>'<div class="card"><h2>'+esc(c.name)+'</h2>'
      + '<p>'+(c.units||[]).length+' unit'+((c.units||[]).length===1?'':'s')+'</p>'
      + '<a class="btn" href="#/course/'+esc(c.id)+'">Open</a></div>';
  const list = courses.filter(c=>gradeOfCourse(c)===g);
  const tabs = [['9','Grade 9'],['10','Grade 10'],['11','Grade 11'],['12','Grade 12']];
  let h = '<header class="site"><h1>Erica\'s Practice Quiz Generator</h1>'
    + '<p>Pick a course, pick a unit, generate a quiz, print it. No more asking Dad.</p></header>';
  h += '<div class="tabs">'+tabs.map(t=>'<a class="tab'+(t[0]===g?' active':'')+'" href="#/grade/'+t[0]+'">'+t[1]+'</a>').join('')+'</div>';
  h += '<div class="steps">'
    + '<div class="step"><b>1. Pick a course</b>Choose one of your school courses below.</div>'
    + '<div class="step"><b>2. Pick a unit</b>Each course lists the units you\'ve covered.</div>'
    + '<div class="step"><b>3. Generate &amp; print</b>A fresh mix of questions every time, with a separate answer key.</div>'
    + '</div>';
  if(g==='10'){
    const s1 = list.filter(c=>c.semester===1), s2 = list.filter(c=>c.semester===2);
    if(s1.length) h += '<h2 style="margin:4px 0 10px">This semester</h2><div class="cards">'+s1.map(card).join('')+'</div>';
    if(s2.length) h += '<h2 style="margin:20px 0 10px">Next semester</h2><div class="cards">'+s2.map(card).join('')+'</div>';
  } else {
    const label = g==='9' ? 'Grade 9 courses' : 'Grade '+g+' (planned)';
    h += '<h2 style="margin:4px 0 10px">'+label+'</h2><div class="cards">'+list.map(card).join('')+'</div>';
  }
  h += '<div class="toolbar"><a class="btn ghost" href="#/manage">Manage courses &amp; questions</a></div>';
  h += '<footer class="site">Stage 1: quiz generation. Review notes coming later.</footer>';
  app.innerHTML = h;
  window.scrollTo(0,0);
}

function viewCourse(id){
  const c = findCourse(id);
  if(!c){ app.innerHTML = '<p>Course not found. <a href="#/">Home</a></p>'; return; }
  let h = '<a class="backlink" href="#/grade/'+gradeOfCourse(c)+'">&larr; All courses</a>';
  h += '<header class="site"><h1>'+esc(c.name)+'</h1><p>Pick a unit to generate a practice quiz.</p></header>';
  for(const u of (c.units||[])){
    const nq = (u.mcBank||[]).length + (u.shortBank||[]).length;
    const quizBtn = nq? '<a class="btn" href="#/unit/'+esc(u.id)+'">Generate quiz</a>'
            : '<span class="btn ghost" style="opacity:.55;pointer-events:none">No questions yet</span>';
    const notesBtn = u.notes? '<a class="btn ghost" href="#/notes/'+esc(u.id)+'">Review notes</a>'
            : '<span class="btn ghost" style="opacity:.55;pointer-events:none">Notes soon</span>';
    h += '<div class="unit-row"><div class="meta"><strong>'+esc(u.name)+'</strong>'
      + '<small>'+esc(unitCounts(u))+'</small></div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap">'+quizBtn+notesBtn+'</div></div>';
  }
  if(!(c.units||[]).length) h += '<p>No units yet — add one in <a href="#/manage">Manage</a>.</p>';
  app.innerHTML = h;
}

function viewNotes(uid){
  const found = findUnit(uid);
  if(!found || !found.unit.notes){ app.innerHTML = '<p>Notes not found. <a href="#/grade/10">Back</a></p>'; return; }
  const course = found.course, unit = found.unit;
  let h = '<a class="backlink noprint" href="#/course/'+esc(course.id)+'">&larr; '+esc(course.name)+'</a>';
  h += '<header class="site"><h1>'+esc(unit.name)+'</h1><p>Review notes</p></header>';
  h += '<div class="paper notes">'+unit.notes+'</div>';
  h += '<div class="toolbar noprint"><a class="btn" href="#/unit/'+esc(unit.id)+'">Practice quiz</a> '
     + '<button class="btn ghost" onclick="window.print()">Print notes</button></div>';
  app.innerHTML = h;
  window.scrollTo(0,0);
}

function viewUnit(uid){
  const found = findUnit(uid);
  if(!found){ app.innerHTML = '<p>Unit not found. <a href="#/">Home</a></p>'; return; }
  const {course, unit} = found;
  const mcMax=(unit.mcBank||[]).length, shMax=(unit.shortBank||[]).length;
  const existing = (quiz && quiz.uid===uid) ? quiz : null;
  const dMc = existing ? existing.mcCount : Math.min((unit.quizFormat||{}).mc||mcMax, mcMax);
  const dSh = existing ? existing.shortCount : Math.min((unit.quizFormat||{}).short||shMax, shMax);
  let h = '<a class="backlink" href="#/course/'+esc(course.id)+'">&larr; '+esc(course.name)+'</a>';
  h += '<header class="site"><h1>'+esc(unit.name)+'</h1><p>'+esc(unitCounts(unit))+' in the bank. Every quiz is a fresh random mix.</p></header>';
  h += '<div class="genbox noprint">'
    + '<div><label>Multiple-choice questions</label><input type="number" id="nMc" min="0" max="'+mcMax+'" value="'+dMc+'"></div>'
    + (shMax? '<div><label>Short-answer questions</label><input type="number" id="nSh" min="0" max="'+shMax+'" value="'+dSh+'"></div>':'')
    + '<div><button class="btn" id="genBtn">Generate quiz</button></div>'
    + '</div><div id="quizOut"></div>';
  app.innerHTML = h;
  const go = ()=>{
    const nMc = Math.max(0, Math.min(mcMax, parseInt(document.getElementById('nMc').value||'0',10)));
    const nShEl = document.getElementById('nSh');
    const nSh = nShEl? Math.max(0, Math.min(shMax, parseInt(nShEl.value||'0',10))) : 0;
    generateQuiz(uid, nMc, nSh);
    renderQuiz();
  };
  document.getElementById('genBtn').onclick = go;
  if(existing){ renderQuiz(); } else { go(); } // redisplay the current quiz, or generate one
}

function mcLetter(i){ return 'abcd'[i]; }

function renderQuiz(){
  if(!quiz) return;
  const out = document.getElementById('quizOut');
  let h = '<div class="toolbar noprint">'
    + '<button class="btn" id="newBtn">New quiz</button>'
    + '<button class="btn ghost" id="printBtn">Print quiz</button>'
    + '<button class="btn ghost" id="keyBtn">Show answer key</button>'
    + '</div>';
  h += '<div class="paper"><h2>'+esc(quiz.courseName)+' — '+esc(quiz.unitName)+' Practice Quiz</h2>'
    + '<p class="unitline">Total: <strong>'+quiz.total+' marks</strong></p>'
    + '<div class="nameline"><span>Name: ______________________________</span><span>Date: ______________</span></div>'
    + '<div class="instructions"><strong>Instructions:</strong> '+esc(quiz.instructions)+'</div>';
  if(quiz.mc.length){
    h += '<div class="parthead">Part A — Multiple Choice ('+quiz.mc.length+' mark'+(quiz.mc.length===1?'':'s')+')</div>'
      + '<p><em>Circle the <strong>best</strong> answer for each question.</em></p>';
    quiz.mc.forEach((q,i)=>{
      h += '<div class="q"><div class="qtext">'+(i+1)+'. '+esc(q.q)+'</div><ul class="opts">';
      q.options.forEach((o,j)=>{ h += '<li><span class="letter">'+mcLetter(j)+')</span> '+esc(o)+'</li>'; });
      h += '</ul></div>';
    });
  }
  if(quiz.short.length){
    const sm = quiz.short.reduce((s,q)=>s+(q.marks||0),0);
    h += '<div class="parthead">Part B — Short Answer ('+sm+' marks)</div>';
    quiz.short.forEach((q,i)=>{
      const n = quiz.mc.length + i + 1;
      h += '<div class="q"><div class="qtext">'+n+'. <span class="marks">('+(q.marks||0)+' marks)</span> '+esc(q.q)+'</div>'
        + '<div class="writelines">';
      const lines = Math.min(6, Math.max(2, q.marks||2));
      for(let l=0;l<lines;l++) h += '<div class="line"></div>';
      h += '</div></div>';
    });
  }
  h += '<div class="goodluck">Good luck, Erica!</div></div>';
  out.innerHTML = h;
  document.getElementById('newBtn').onclick = ()=>{
    const nMc = parseInt(document.getElementById('nMc').value||'0',10);
    const nShEl = document.getElementById('nSh');
    const nSh = nShEl? parseInt(nShEl.value||'0',10) : 0;
    generateQuiz(quiz.uid, nMc, nSh); renderQuiz();
  };
  document.getElementById('printBtn').onclick = ()=>window.print();
  document.getElementById('keyBtn').onclick = ()=>{ location.hash = '#/key'; };
  out.scrollIntoView();
}

function renderKey(){
  if(!quiz) return;
  const found = findUnit(quiz.uid);
  const unitGuide = found && found.unit.scoringGuide;
  const showGuide = unitGuide && quiz.mcCount===quiz.fmtMc && quiz.shortCount===quiz.fmtShort;
  let guide = showGuide ? unitGuide : '';
  let h = '<div class="toolbar noprint"><button class="btn ghost" id="backBtn">&larr; Back to quiz</button>'
    + '<button class="btn" id="printKeyBtn">Print answer key</button></div>';
  h += '<div class="warn">STOP — no peeking until you finish the quiz! For every question you missed, write one sentence explaining the mistake — that\'s where the real learning happens.</div>';
  h += '<div class="paper"><h2>Answer Key — '+esc(quiz.unitName)+'</h2><p class="unitline">'+esc(quiz.courseName)+'</p>';
  quiz.mc.forEach((q,i)=>{
    h += '<div class="keyitem"><div class="knum">'+(i+1)+'. '+mcLetter(q.answer)+' — '+esc(q.options[q.answer])+'</div>'
      + '<div class="kexplain">'+esc(q.explain)+'</div></div>';
  });
  quiz.short.forEach((q,i)=>{
    const n = quiz.mc.length + i + 1;
    h += '<div class="keyitem"><div class="knum">'+n+'.</div>'
      + '<div class="kanswer">'+esc(q.answer)+'</div></div>';
  });
  if(guide) h += '<div class="scoring"><strong>Scoring guide</strong><br>'+guide+'</div>';
  h += '</div>';
  app.innerHTML = h;
  document.getElementById('backBtn').onclick = ()=>{ location.hash = '#/unit/'+quiz.uid; };
  document.getElementById('printKeyBtn').onclick = ()=>window.print();
  window.scrollTo(0,0);
}

/* ---------- manage view ---------- */
function viewManage(){
  const custom = loadCustom();
  const courses = allCourses();
  let h = '<a class="backlink" href="#/">&larr; Home</a>';
  h += '<header class="site"><h1>Manage courses &amp; questions</h1><p>Add your own courses, units, and questions here. They\'re saved in this browser.</p></header>';

  h += '<div class="form"><h3>Add a course</h3>'
    + '<label>Course name</label><input type="text" id="ncName" placeholder="e.g. Grade 10 Math">'
    + '<div class="toolbar"><button class="btn" id="addCourse">Add course</button></div></div>';

  h += '<div class="form"><h3>Add a unit</h3><label>Course</label><select id="nuCourse">'
    + courses.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('') + '</select>'
    + '<label>Unit name</label><input type="text" id="nuName" placeholder="e.g. Linear Systems">'
    + '<div class="toolbar"><button class="btn" id="addUnit">Add unit</button></div></div>';

  let unitOpts = '';
  for(const c of courses) for(const u of (c.units||[]))
    unitOpts += '<option value="'+esc(u.id)+'">'+esc(c.name)+' — '+esc(u.name)+'</option>';
  h += '<div class="form"><h3>Add a question</h3><label>Unit</label><select id="nqUnit">'+unitOpts+'</select>'
    + '<label>Type</label><select id="nqType"><option value="mc">Multiple choice</option><option value="short">Short answer</option></select>'
    + '<label>Question</label><textarea id="nqQ"></textarea>'
    + '<div id="mcFields"><label>Options (one per box)</label><div class="optgrid">'
    + [0,1,2,3].map(i=>'<input type="text" id="nqO'+i+'" placeholder="Option '+mcLetter(i)+')">').join('')
    + '</div><label>Correct option</label><select id="nqAns">'
    + [0,1,2,3].map(i=>'<option value="'+i+'">'+mcLetter(i)+'</option>').join('') + '</select>'
    + '<label>Explanation (shown in the answer key)</label><textarea id="nqExplain"></textarea></div>'
    + '<div id="shortFields" style="display:none"><label>Marks</label><input type="number" id="nqMarks" value="2" min="1">'
    + '<label>Model answer (shown in the answer key)</label><textarea id="nqAnswer"></textarea></div>'
    + '<div class="toolbar"><button class="btn" id="addQ">Add question</button></div></div>';

  h += '<h3>Your custom courses</h3>';
  if(!custom.courses.length) h += '<p style="color:var(--muted)">None yet — the built-in courses above can\'t be edited or deleted.</p>';
  for(const c of custom.courses){
    h += '<div class="customitem"><div><strong>'+esc(c.name)+'</strong><br><small>'
      + (c.units||[]).map(u=>esc(u.name)+' ('+unitCounts(u)+')').join('; ') + '</small></div>'
      + '<button class="btn danger" data-delcourse="'+esc(c.id)+'">Delete</button></div>';
  }
  app.innerHTML = h;

  document.getElementById('nqType').onchange = (e)=>{
    const mc = e.target.value==='mc';
    document.getElementById('mcFields').style.display = mc?'':'none';
    document.getElementById('shortFields').style.display = mc?'none':'';
  };
  document.getElementById('addCourse').onclick = ()=>{
    const name = document.getElementById('ncName').value.trim();
    if(!name){ alert('Give the course a name first.'); return; }
    const d = loadCustom();
    d.courses.push({id:'c'+Date.now(), name, units:[]});
    saveCustom(d); viewManage();
  };
  document.getElementById('addUnit').onclick = ()=>{
    const cid = document.getElementById('nuCourse').value;
    const name = document.getElementById('nuName').value.trim();
    if(!name){ alert('Give the unit a name first.'); return; }
    const d = loadCustom();
    const c = d.courses.find(c=>c.id===cid);
    if(!c){ alert('Units can only be added to your own custom courses.'); return; }
    c.units.push({id:'u'+Date.now(), name, instructions:'No notes.', quizFormat:{mc:10,short:0}, mcBank:[], shortBank:[]});
    saveCustom(d); viewManage();
  };
  document.getElementById('addQ').onclick = ()=>{
    const uid = document.getElementById('nqUnit').value;
    const type = document.getElementById('nqType').value;
    const q = document.getElementById('nqQ').value.trim();
    if(!q){ alert('Write the question first.'); return; }
    const d = loadCustom();
    let target = null;
    for(const c of d.courses){ const u=(c.units||[]).find(u=>u.id===uid); if(u){ target=u; break; } }
    if(!target){ alert('Questions can only be added to units in your own custom courses.'); return; }
    if(type==='mc'){
      const options = [0,1,2,3].map(i=>document.getElementById('nqO'+i).value.trim());
      if(options.some(o=>!o)){ alert('Fill in all four options.'); return; }
      target.mcBank.push({topic:'Custom', q, options,
        answer:parseInt(document.getElementById('nqAns').value,10),
        explain:document.getElementById('nqExplain').value.trim()});
      if(!target.quizFormat.mc) target.quizFormat.mc = 10;
    }else{
      target.shortBank.push({topic:'Custom', q,
        marks:Math.max(1, parseInt(document.getElementById('nqMarks').value||'2',10)),
        answer:document.getElementById('nqAnswer').value.trim()});
    }
    saveCustom(d); viewManage();
  };
  app.querySelectorAll('[data-delcourse]').forEach(b=>{
    b.onclick = ()=>{
      if(!confirm('Delete this course and all its units and questions?')) return;
      const d = loadCustom();
      d.courses = d.courses.filter(c=>c.id!==b.getAttribute('data-delcourse'));
      saveCustom(d); viewManage();
    };
  });
  window.scrollTo(0,0);
}

/* ---------- router ---------- */
function route(){
  const hsh = location.hash || '#/';
  const parts = hsh.replace(/^#\//,'').split('/');
  if(parts[0]==='' ){ location.hash = '#/grade/10'; return; }
  else if(parts[0]==='grade') viewGrade(decodeURIComponent(parts[1]||'10'));
  else if(parts[0]==='course') viewCourse(decodeURIComponent(parts[1]||''));
  else if(parts[0]==='unit') viewUnit(decodeURIComponent(parts[1]||''));
  else if(parts[0]==='notes') viewNotes(decodeURIComponent(parts[1]||''));
  else if(parts[0]==='manage') viewManage();
  else if(parts[0]==='key'){ if(quiz){ renderKey(); } else { location.hash = '#/grade/10'; } }
  else { location.hash = '#/grade/10'; return; }
  if(parts[0]!=='unit' && parts[0]!=='key') quiz = null;
}
window.addEventListener('hashchange', route);
route();
</script>

</html>
