<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erica's Practice Quiz Generator</title>
<style>
  :root{
    --ink:#1f2937; --muted:#6b7280; --accent:#0d9488; --accent-dark:#0f766e;
    --bg:#f3f4f6; --card:#ffffff; --line:#e5e7eb; --warn:#b45309; --warn-bg:#fef3c7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55;}
  .wrap{max-width:880px;margin:0 auto;padding:20px 16px 60px;}
  header.site{margin:8px 0 20px;}
  header.site h1{margin:0 0 4px;font-size:1.7rem;}
  header.site p{margin:0;color:var(--muted);}
  .steps{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 22px;}
  .step{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;font-size:.92rem;color:var(--muted);}
  .step b{display:block;color:var(--ink);margin-bottom:2px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .card h2{margin:0 0 6px;font-size:1.15rem;}
  .card p{margin:0 0 12px;color:var(--muted);font-size:.92rem;}
  .unit-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:10px;}
  .unit-row .meta small{color:var(--muted);display:block;}
  .btn{display:inline-block;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;
    font-size:1rem;font-weight:600;background:var(--accent);color:#fff;text-decoration:none;}
  .btn:hover{background:var(--accent-dark);}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;}
  .btn.ghost:hover{background:#f9fafb;}
  .btn.danger{background:#fff;color:#b91c1c;border:1px solid #fecaca;font-weight:500;padding:6px 12px;font-size:.85rem;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px;}
  .backlink{display:inline-block;margin-bottom:10px;color:var(--accent-dark);text-decoration:none;font-weight:600;}
  .tabs{display:flex;gap:8px;margin:16px 0 20px;flex-wrap:wrap;}
  .tab{padding:9px 20px;border-radius:999px;background:#fff;color:var(--ink);text-decoration:none;
    font-weight:600;border:1px solid var(--line);}
  .tab:hover{border-color:var(--accent);color:var(--accent-dark);}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .notes{line-height:1.65;}
  .notes h3{margin:1.3em 0 .45em;font-size:1.12rem;}
  .notes h3:first-child{margin-top:0;}
  .notes h4{margin:1em 0 .3em;font-size:1rem;}
  .notes ul{margin:.3em 0 .8em;padding-left:1.4em;}
  .notes li{margin:.25em 0;}
  .notes table{border-collapse:collapse;margin:.7em 0;width:100%;}
  .notes th,.notes td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top;}
  .notes th{background:#f3f4f6;}
  .genbox{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-bottom:18px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;}
  .genbox label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px;}
  .genbox input[type=number]{width:90px;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:1rem;}
  /* quiz paper */
  .paper{background:#fff;border:1px solid var(--line);border-radius:6px;
    padding:34px 36px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .paper h2{margin:0 0 2px;font-size:1.35rem;}
  .paper .unitline{color:var(--muted);margin:0 0 14px;}
  .nameline{display:flex;gap:24px;margin:10px 0 16px;flex-wrap:wrap;}
  .nameline span{flex:1;min-width:200px;border-bottom:1px solid #9ca3af;padding-bottom:4px;color:var(--muted);}
  .instructions{background:#f9fafb;border:1px solid var(--line);border-radius:8px;
    padding:10px 14px;margin-bottom:20px;font-size:.95rem;}
  .parthead{font-weight:700;font-size:1.1rem;margin:22px 0 10px;
    border-bottom:2px solid var(--ink);padding-bottom:4px;}
  .q{margin:0 0 16px;}
  .q .qtext{font-weight:600;}
  .marks{font-weight:400;color:var(--muted);font-size:.9em;}
  .opts{list-style:none;margin:8px 0 0;padding:0;}
  .opts li{margin:4px 0;padding-left:4px;}
  .opts .letter{display:inline-block;min-width:22px;font-weight:700;}
  .writelines{margin-top:8px;}
  .writelines .line{border-bottom:1px solid #9ca3af;height:1.9em;}
  .goodluck{text-align:center;font-weight:700;margin-top:26px;font-size:1.05rem;}
  .warn{background:var(--warn-bg);border:1px solid #fcd34d;color:var(--warn);
    border-radius:10px;padding:10px 14px;margin-bottom:16px;font-weight:600;}
  .keyitem{margin:0 0 14px;}
  .keyitem .knum{font-weight:700;}
  .keyitem .kanswer{margin:2px 0;}
  .keyitem .kexplain{color:var(--muted);font-size:.93rem;}
  .scoring{background:#f9fafb;border:1px solid var(--line);border-radius:8px;
    padding:12px 16px;margin-top:20px;font-size:.95rem;}
  /* manage */
  .form{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-bottom:16px;}
  .form h3{margin:0 0 10px;}
  .form label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px;}
  .form input[type=text],.form input[type=number],.form textarea,.form select{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:1rem;font-family:inherit;}
  .form textarea{min-height:70px;resize:vertical;}
  .optgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .customitem{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;
    align-items:center;gap:10px;font-size:.95rem;}
  .customitem small{color:var(--muted);}
  footer.site{margin-top:40px;color:var(--muted);font-size:.85rem;text-align:center;}
  @media print{
    .noprint{display:none !important;}
    body{background:#fff;}
    .wrap{max-width:none;padding:0;}
    .paper{border:0;box-shadow:none;border-radius:0;padding:0;}
    .card,.form,.unit-row,.genbox,.steps,.step{box-shadow:none;}
    @page{margin:1.6cm;}
  }
</style>
</head>

{"id":"snc2d","name":"Grade 10 Science (SNC2D1)","semester":1,"units":[{"id":"snc-bio","name":"Biology: Tissues, Organs, and Systems","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":3,"explain":"Specialization means a cell develops structures for one job — e.g., red blood cells lose their nucleus to carry more hemoglobin, and muscle cells pack in fibres for contraction.","options":["Specialized cells can change into any other cell type at any time","All cells in the human body are identical in structure and function","Cell specialization only happens in plants, not animals","Specialized cells have structures suited to their specific jobs"],"q":"Which statement about specialized cells is TRUE?","topic":"Cell specialization"},{"answer":2,"explain":"Cells group into tissues, tissues form organs, organs work together in organ systems, and all of the systems together make up the organism.","options":["organ → tissue → cell → organ system → organism","cell → organ → tissue → organ system → organism","cell → tissue → organ → organ system → organism","tissue → cell → organ → organism → organ system"],"q":"Which sequence shows the levels of biological organization in the correct order, from simplest to most complex?","topic":"Levels of organization"},{"answer":0,"explain":"Epithelial tissue forms protective linings and coverings — e.g., the skin's surface and the lining of the stomach — with cells packed tightly together and little space between them.","options":["epithelial tissue","muscle tissue","connective tissue","nervous tissue"],"q":"Which tissue type lines body cavities and covers the surfaces of organs?","topic":"Tissue types"},{"answer":0,"explain":"Blood is a connective tissue: its cells (red and white blood cells, platelets) are suspended in a fluid matrix (plasma), and it connects the body by transporting materials everywhere.","options":["connective tissue","epithelial tissue","muscle tissue","nervous tissue"],"q":"Blood is classified as which type of tissue?","topic":"Tissue types"},{"answer":1,"explain":"Skeletal muscle moves bones voluntarily (like the biceps); cardiac muscle is found only in the heart; smooth muscle works involuntarily in organs like the stomach and bladder.","options":["walls of the stomach — cardiac muscle","biceps — skeletal muscle","bladder — skeletal muscle","heart wall — smooth muscle"],"q":"A student looks at three muscle samples under a microscope. Which pairing is correct?","topic":"Muscle tissue"},{"answer":3,"explain":"Nervous tissue is made of neurons — cells specialized to carry electrical impulses quickly between the brain, spinal cord, and body parts.","options":["to store energy as fat","to secrete hormones into the blood","to contract and produce movement","to transmit electrical signals rapidly"],"q":"What is the main function of nervous tissue?","topic":"Nervous tissue"},{"answer":2,"explain":"Food travels mouth → esophagus → stomach → small intestine (where most digestion and absorption happen) → large intestine (where water is absorbed).","options":["mouth → esophagus → small intestine → stomach → large intestine","esophagus → mouth → small intestine → stomach → large intestine","mouth → esophagus → stomach → small intestine → large intestine","mouth → stomach → esophagus → small intestine → large intestine"],"q":"In which order does food pass through the main organs of the digestive system?","topic":"Digestive system"},{"answer":1,"explain":"The small intestine's folded walls and millions of villi give it a huge surface area for absorbing nutrients into the blood; the stomach mainly churns food and starts protein digestion.","options":["stomach","small intestine","large intestine","esophagus"],"q":"Most chemical digestion and nutrient absorption occur in the:","topic":"Digestive system"},{"answer":3,"explain":"The right side receives oxygen-poor blood and sends it to the lungs to pick up oxygen; the left side receives that oxygen-rich blood and pumps it out to the whole body.","options":["The right side of the heart pumps oxygen-rich blood to the body","Both sides of the heart pump blood directly to the lungs","The left side of the heart pumps oxygen-poor blood to the lungs","The left side of the heart pumps oxygen-rich blood to the body"],"q":"Which statement about the heart is TRUE?","topic":"Circulatory system"},{"answer":2,"explain":"Millions of alveoli create an enormous total surface area, and their one-cell-thick walls let oxygen and carbon dioxide diffuse quickly between the air and the blood.","options":["muscles that pump air into the blood","thick walls that slow down air flow","a huge total surface area and very thin walls","tiny hairs that trap all oxygen molecules"],"q":"Gas exchange in the lungs happens in the alveoli. Which feature of alveoli makes this efficient?","topic":"Respiratory system"},{"answer":1,"explain":"Working muscles need extra oxygen, so the respiratory system takes in more air while the circulatory system pumps blood faster to deliver that oxygen to the muscles.","options":["nervous and excretory — to remove sweat","respiratory and circulatory — to deliver more oxygen to muscles","musculoskeletal and digestive — to strengthen bones","nervous and digestive — to digest energy faster"],"q":"During a race, Erica's breathing and heart rate both increase. Which systems are working together here, and why?","topic":"System interactions"},{"answer":3,"explain":"Stem cells are unspecialized and self-renewing: they can make copies of themselves and differentiate into specialized cells such as blood, muscle, or nerve cells.","options":["they cannot divide at all","they are only found in plants","they are already specialized for one job","they can divide to produce more stem cells and also develop into specialized cell types"],"q":"What makes stem cells different from other human body cells?","topic":"Stem cells"}],"shortBank":[{"answer":"The digestive system breaks food down into small nutrient molecules, which are absorbed through the walls of the small intestine into the blood. The circulatory system then carries those nutrients in the blood to every cell in the body, where they are used for energy and growth. Material that cannot be digested continues to the large intestine.","marks":3,"q":"Explain how the digestive system and the circulatory system work together after you eat a meal. Name what each system contributes.","topic":"System interactions"},{"answer":"Epithelial tissue has cells packed tightly together with almost no space between them (e.g., the skin's surface or the lining of the stomach). Connective tissue has cells spread out within a matrix that may be solid, flexible, or fluid (e.g., bone, cartilage, or blood).","marks":2,"q":"Compare epithelial tissue and connective tissue: state one structural difference between them and give one example of each in the human body.","topic":"Tissue types"},{"answer":"Stem cells are unspecialized cells that can divide to make more stem cells and can develop (differentiate) into specialized cell types. In medicine they could be used to grow replacement skin for burn victims, or to produce healthy blood cells for patients with blood diseases such as leukemia. Researchers also hope to use them to repair damaged heart or nerve tissue.","marks":3,"q":"What are stem cells? Describe two ways stem cells could be used in medicine.","topic":"Stem cells"},{"answer":"The oxygen molecule is inhaled through the nose or mouth, travels down the trachea, into the bronchi, and reaches the alveoli in the lungs (respiratory system). It diffuses across the thin alveolar walls into the blood in the surrounding capillaries. The circulatory system carries it — via the heart — through arteries to capillaries in the leg muscle, where it diffuses out of the blood and into the muscle cell, which uses it for cellular respiration.","marks":4,"q":"Trace the path of an oxygen molecule from the air outside the body to a muscle cell in the leg. Name the structures it passes through and the body systems involved.","topic":"Respiratory and circulatory systems"}],"notes":"<h3>Cell Specialization</h3>\n<p>All cells start out the same, but as an organism develops, cells <strong>differentiate</strong> — they take on specific structures and jobs. This is <strong>cell specialization</strong>: a cell's structure always matches its function.</p>\n<ul>\n<li><strong>Red blood cells</strong> are biconcave discs with no nucleus, leaving maximum room for hemoglobin to carry oxygen.</li>\n<li><strong>Neurons</strong> are long and branched so they can carry messages over distances.</li>\n<li><strong>Muscle cells</strong> are packed with protein fibres that contract.</li>\n</ul>\n\n<h3>Levels of Organization</h3>\n<p>From smallest to largest:</p>\n<ul>\n<li><strong>Cell</strong> — the basic unit of life.</li>\n<li><strong>Tissue</strong> — a group of similar cells working together.</li>\n<li><strong>Organ</strong> — two or more tissues working together (e.g., the stomach).</li>\n<li><strong>System</strong> — a group of organs working together (e.g., the digestive system).</li>\n<li><strong>Organism</strong> — all systems working together — you.</li>\n</ul>\n\n<h3>The Four Tissue Types</h3>\n<table>\n<tr><th>Tissue</th><th>Job</th><th>Examples</th></tr>\n<tr><td><strong>Epithelial</strong></td><td>Covers and protects surfaces; absorbs and secretes substances</td><td>Skin, lining of the mouth and intestines</td></tr>\n<tr><td><strong>Muscle</strong></td><td>Contracts to create movement</td><td>Biceps, heart, stomach wall</td></tr>\n<tr><td><strong>Nervous</strong></td><td>Carries messages around the body</td><td>Brain, spinal cord, nerves</td></tr>\n<tr><td><strong>Connective</strong></td><td>Supports, connects, and protects</td><td>Bone, cartilage, blood, tendons, fat</td></tr>\n</table>\n\n<h4>Muscle tissue types</h4>\n<table>\n<tr><th>Type</th><th>Appearance</th><th>Control</th><th>Location</th></tr>\n<tr><td><strong>Skeletal</strong></td><td>Striated (striped)</td><td>Voluntary</td><td>Attached to bones</td></tr>\n<tr><td><strong>Smooth</strong></td><td>Not striated</td><td>Involuntary</td><td>Walls of the stomach, intestines, and blood vessels</td></tr>\n<tr><td><strong>Cardiac</strong></td><td>Striated and branched</td><td>Involuntary</td><td>Heart only</td></tr>\n</table>\n\n<h4>Nervous tissue</h4>\n<p>Made of <strong>neurons</strong>. Each neuron has <strong>dendrites</strong> (receive incoming signals), a <strong>cell body</strong>, and an <strong>axon</strong> (sends the signal onward). Messages pass from neuron to neuron across tiny gaps called <strong>synapses</strong>.</p>\n\n<h3>The Digestive System</h3>\n<p>Breaks food into small molecules the body can absorb and use.</p>\n<ul>\n<li><strong>Mouth</strong> — teeth chop food; saliva begins digesting starch.</li>\n<li><strong>Esophagus</strong> — wave-like muscular squeezes (<strong>peristalsis</strong>) push food down.</li>\n<li><strong>Stomach</strong> — acid and enzymes digest protein; muscles churn the food.</li>\n<li><strong>Small intestine</strong> — most digestion and absorption happen here; <strong>villi</strong> give it a huge surface area.</li>\n<li><strong>Large intestine</strong> — absorbs water; forms solid waste.</li>\n<li><strong>Rectum and anus</strong> — waste leaves the body.</li>\n</ul>\n<p>Helper organs: the <strong>liver</strong> makes bile (breaks down fat), the <strong>gallbladder</strong> stores bile, and the <strong>pancreas</strong> releases digestive enzymes.</p>\n\n<h3>The Circulatory System</h3>\n<p>Transports oxygen, nutrients, wastes, and hormones around the body.</p>\n<ul>\n<li><strong>Heart</strong> — a double pump with four chambers. The right side (right atrium, right ventricle) pumps blood to the lungs; the left side (left atrium, left ventricle) pumps it to the body.</li>\n<li><strong>Arteries</strong> — carry blood <strong>away</strong> from the heart; thick, elastic walls.</li>\n<li><strong>Veins</strong> — carry blood <strong>to</strong> the heart; contain valves that stop backflow.</li>\n<li><strong>Capillaries</strong> — tiny, thin-walled vessels where exchange with cells happens.</li>\n</ul>\n<p>Blood has four parts: <strong>red blood cells</strong> (hemoglobin carries oxygen), <strong>white blood cells</strong> (fight infection), <strong>platelets</strong> (clot the blood), and <strong>plasma</strong> (the liquid that carries nutrients, wastes, and hormones).</p>\n\n<h3>The Respiratory System</h3>\n<p>Brings oxygen in and removes carbon dioxide.</p>\n<p><strong>Air pathway:</strong> nasal cavity → pharynx → larynx → trachea → bronchi → bronchioles → <strong>alveoli</strong>. The <strong>diaphragm</strong> contracts to pull air into the lungs.</p>\n<p><strong>Gas exchange</strong> happens in the alveoli by <strong>diffusion</strong>: oxygen moves into the blood while carbon dioxide moves out. Alveoli are built for this job — enormous surface area, walls only one cell thick, moist surfaces, and each one wrapped in capillaries.</p>\n\n<h3>How the Systems Interact</h3>\n<ul>\n<li>The <strong>digestive</strong> system absorbs nutrients; the <strong>circulatory</strong> system delivers them — along with oxygen from the <strong>respiratory</strong> system — to cells for <strong>cellular respiration</strong>, which releases energy.</li>\n<li>The <strong>muscular</strong> system depends on that energy and oxygen, including the diaphragm for breathing and the heart muscle for pumping.</li>\n<li>The <strong>nervous</strong> system coordinates it all, for example speeding up the heart rate during exercise.</li>\n</ul>\n\n<h3>Stem Cells</h3>\n<p><strong>Stem cells</strong> are unspecialized cells that can divide and <strong>differentiate</strong> into specialized cell types.</p>\n<ul>\n<li><strong>Embryonic stem cells</strong> — <strong>pluripotent</strong>: can become almost any cell type. Using them raises ethical concerns because obtaining them destroys an embryo.</li>\n<li><strong>Adult (tissue) stem cells</strong> — <strong>multipotent</strong>: can become only a limited range of cell types (e.g., bone marrow stem cells make blood cells). Already used in treatments such as bone marrow transplants.</li>\n</ul>\n<p>Scientists are researching stem cells as potential treatments for conditions such as spinal cord injuries, Parkinson's disease, and diabetes.</p>\n"},{"id":"chem-reactions","name":"Chemical Reactions","instructions":"No notes. Aim for about 35 minutes.","quizFormat":{"mc":8,"short":8},"scoringGuide":"<strong>25–29:</strong> Test-ready — just review any missed questions. <strong>20–24:</strong> Solid — redo the questions you missed and re-check those topics. <strong>Below 20:</strong> Go back through the unit notes (or TVO Learn) on the missed topics, then try the quiz again.","mcBank":[{"topic":"Periodic table","q":"Which pair of elements are in the same group (column) of the periodic table?","options":["lithium (Li) and beryllium (Be)","magnesium (Mg) and calcium (Ca)","sodium (Na) and magnesium (Mg)","potassium (K) and calcium (Ca)"],"answer":1,"explain":"Mg and Ca are both in Group 2 (alkaline earth metals). Same column = same group."},{"topic":"Bonding","q":"When sodium transfers one electron to chlorine, sodium chloride (NaCl) forms. What type of compound is NaCl?","options":["molecular compound","ionic compound","diatomic element","acid"],"answer":1,"explain":"Electron transfer from a metal to a non-metal forms an ionic compound."},{"topic":"Formulas","q":"What is the correct chemical formula for calcium oxide? (calcium ion: Ca²⁺, oxide ion: O²⁻)","options":["CaO","Ca₂O","CaO₂","Ca₂O₂"],"answer":0,"explain":"Ca²⁺ and O²⁻ combine in a 1:1 ratio: CaO."},{"topic":"Naming","q":"What is the correct name for the compound CuO?","options":["copper oxide","copper(I) oxide","copper(II) oxide","copper dioxide"],"answer":2,"explain":"Oxygen is 2−, so copper must be 2+. Multivalent metals need Roman numerals: copper(II) oxide."},{"topic":"Naming","q":"What is the correct name for the molecular compound N₂O₄?","options":["nitrogen oxide","dinitrogen tetroxide","nitrogen tetroxide","dinitrogen oxide"],"answer":1,"explain":"Two nitrogens, four oxygens: dinitrogen tetroxide."},{"topic":"Reaction types","q":"Which of the following is a decomposition reaction?","options":["2Mg + O₂ → 2MgO","CaCO₃ → CaO + CO₂","Zn + 2HCl → ZnCl₂ + H₂","AgNO₃ + NaCl → AgCl + NaNO₃"],"answer":1,"explain":"One reactant breaks into two products: CaCO₃ → CaO + CO₂ (decomposition)."},{"topic":"Acids & bases","q":"A colourless solution turns blue litmus paper red. Its pH is most likely:","options":["13","7","3","9"],"answer":2,"explain":"Turns blue litmus red = acidic; acids have pH below 7."},{"topic":"Balancing","q":"Which of these equations for forming water is correctly balanced?","options":["H₂ + O₂ → H₂O","H₂ + 2O₂ → 2H₂O","2H₂ + O₂ → 2H₂O","2H₂ + 2O₂ → 2H₂O"],"answer":2,"explain":"2H₂ + O₂ → 2H₂O has 4 H and 2 O on each side."},{"topic":"Periodic table","q":"Which of the following elements is a metalloid?","options":["sodium (Na)","silicon (Si)","chlorine (Cl)","calcium (Ca)"],"answer":1,"explain":"Silicon (Si) is a metalloid: it sits on the staircase between metals and non-metals."},{"topic":"Bonding","q":"Which statement about ionic compounds is TRUE?","options":["They are usually gases at room temperature.","They conduct electricity when dissolved in water.","They have very low melting points.","They form when atoms share electrons."],"answer":1,"explain":"Ionic compounds conduct electricity when dissolved (or molten) because their ions are free to move. They are solids with high melting points, and they form by electron transfer."},{"topic":"Formulas","q":"What is the correct chemical formula for aluminum sulfide? (aluminum ion: Al³⁺, sulfide ion: S²⁻)","options":["AlS","Al₂S₃","Al₃S₂","Al₂S"],"answer":1,"explain":"Al³⁺ and S²⁻ need a 2:3 ratio to balance charges: Al₂S₃."},{"topic":"Naming","q":"What is the correct name for the compound FeCl₃?","options":["iron chloride","iron(III) chloride","iron(II) chloride","iron trichloride"],"answer":1,"explain":"Each Cl is 1− (total 3−), so iron must be 3+: iron(III) chloride."},{"topic":"Formulas","q":"What is the correct chemical formula for dinitrogen pentoxide?","options":["NO₅","N₂O₅","N₅O₂","2NO₅"],"answer":1,"explain":"\"di\" = 2 nitrogens, \"pent\" = 5 oxygens: N₂O₅."},{"topic":"Reaction types","q":"Which of the following is a single displacement reaction?","options":["2H₂ + O₂ → 2H₂O","2KClO₃ → 2KCl + 3O₂","Cl₂ + 2NaBr → 2NaCl + Br₂","HCl + NaOH → NaCl + H₂O"],"answer":2,"explain":"Cl₂ + 2NaBr → 2NaCl + Br₂: one element replaces another in a compound (single displacement)."},{"topic":"Acids & bases","q":"Which pH value represents the strongest acid?","options":["6","4","2","7"],"answer":2,"explain":"The lower the pH, the stronger the acid: pH 2 is the strongest acid listed."},{"topic":"Reaction types","q":"In the reaction 2C₂H₆ + 7O₂ → 4CO₂ + 6H₂O, what type of reaction is this?","options":["synthesis","decomposition","combustion","single displacement"],"answer":2,"explain":"A hydrocarbon reacting with oxygen to make CO₂ + H₂O is combustion."},{"topic":"Periodic table","q":"Which pair of elements are in the same period (row) of the periodic table?","options":["lithium (Li) and sodium (Na)","carbon (C) and oxygen (O)","magnesium (Mg) and calcium (Ca)","fluorine (F) and chlorine (Cl)"],"answer":1,"explain":"Carbon and oxygen are both in Period 2 (same row). The other pairs are in the same group (column)."},{"topic":"Periodic table","q":"Which of the following elements is diatomic (exists as a two-atom molecule)?","options":["helium (He)","neon (Ne)","chlorine (Cl)","argon (Ar)"],"answer":2,"explain":"Chlorine exists as Cl₂. The diatomic elements are H₂, N₂, O₂, F₂, Cl₂, Br₂, I₂."},{"topic":"Ions","q":"A magnesium atom (atomic number 12) forms an ion. Which statement is TRUE?","options":["It gains 2 electrons to form Mg²⁻","It loses 2 electrons to form Mg²⁺","It gains 1 electron to form Mg⁻","It loses 1 electron to form Mg⁺"],"answer":1,"explain":"Magnesium is a metal in Group 2, so it loses its 2 valence electrons to form Mg²⁺ (a stable octet)."},{"topic":"Formulas","q":"What is the correct chemical formula for magnesium chloride? (magnesium ion: Mg²⁺, chloride ion: Cl⁻)","options":["MgCl","MgCl₂","Mg₂Cl","Mg₂Cl₂"],"answer":1,"explain":"Mg²⁺ and Cl⁻ need a 1:2 ratio to balance charges: MgCl₂."},{"topic":"Naming","q":"What is the correct name for the compound PbO₂?","options":["lead oxide","lead(II) oxide","lead(IV) oxide","lead dioxide"],"answer":2,"explain":"Each oxygen is 2− (total 4−), so lead must be 4+. Multivalent metals need Roman numerals: lead(IV) oxide."},{"topic":"Naming","q":"What is the correct name for the molecular compound CO?","options":["carbon oxide","carbon monoxide","carbon dioxide","monocarbon monoxide"],"answer":1,"explain":"One carbon, one oxygen, and \"mono-\" on the second element: carbon monoxide."},{"topic":"Reaction types","q":"Which of the following is evidence that a chemical reaction occurred?","options":["Ice melting into water","Gas bubbles forming when vinegar is added to baking soda","Salt dissolving in water","Water boiling in a kettle"],"answer":1,"explain":"Gas bubbles forming is evidence of a new substance being produced. Melting, dissolving, and boiling are physical changes — no new substance forms."},{"topic":"Balancing","q":"Which of these equations for forming sodium chloride is correctly balanced?","options":["Na + Cl₂ → NaCl","2Na + Cl₂ → 2NaCl","Na + Cl₂ → 2NaCl","2Na + 2Cl₂ → 2NaCl"],"answer":1,"explain":"2Na + Cl₂ → 2NaCl has 2 Na and 2 Cl on each side."},{"topic":"Periodic table","q":"Which of the following elements is a noble gas?","options":["oxygen (O)","argon (Ar)","chlorine (Cl)","nitrogen (N)"],"answer":1,"explain":"Argon (Ar) is in Group 18, the noble gases. They have full outer shells and are very unreactive."},{"topic":"Ions","q":"A chlorine atom (atomic number 17) forms an ion. Which statement is TRUE?","options":["It loses 1 electron to form Cl⁺","It gains 1 electron to form Cl⁻","It loses 7 electrons to form Cl⁷⁺","It gains 7 electrons to form Cl⁷⁻"],"answer":1,"explain":"Chlorine is in Group 17 with 7 valence electrons, so it gains 1 electron to complete its octet and form Cl⁻."},{"topic":"Formulas","q":"What is the correct chemical formula for sodium oxide? (sodium ion: Na⁺, oxide ion: O²⁻)","options":["NaO","Na₂O","NaO₂","Na₂O₂"],"answer":1,"explain":"Na⁺ and O²⁻ need a 2:1 ratio to balance charges: Na₂O."},{"topic":"Naming","q":"What is the correct name for the compound FeO?","options":["iron oxide","iron(II) oxide","iron(III) oxide","iron monoxide"],"answer":1,"explain":"Oxygen is 2−, so iron must be 2+. Multivalent metals need Roman numerals: iron(II) oxide."},{"topic":"Formulas","q":"What is the correct chemical formula for diphosphorus pentoxide?","options":["P₂O₅","2P₅O","P₅O₂","PO₅"],"answer":0,"explain":"\"di\" = 2 phosphorus, \"pent\" = 5 oxygens: P₂O₅."},{"topic":"Acids & bases","q":"Which of the following is a base?","options":["vinegar","lemon juice","baking soda solution","stomach acid"],"answer":2,"explain":"Baking soda solution is basic. Vinegar, lemon juice, and stomach acid are all acids."},{"topic":"Acids & bases","q":"A solution turns blue litmus paper red. What colour does red litmus paper turn in the same solution?","options":["blue","stays red","green","white"],"answer":1,"explain":"Red litmus only changes colour (to blue) in a base. In an acid it stays red. (Blue litmus turned red, so the solution is acidic.)"},{"topic":"Balancing","q":"Which of these equations for the decomposition of water is correctly balanced?","options":["2H₂O → 2H₂ + O₂","H₂O → H₂ + O₂","2H₂O → H₂ + O₂","H₂O → 2H₂ + O₂"],"answer":0,"explain":"2H₂O → 2H₂ + O₂ has 4 H and 2 O on each side."}],"shortBank":[{"topic":"Balancing","q":"Balance the following equation. Write the coefficients in the blanks: _____Al + _____O₂ → _____Al₂O₃","marks":2,"answer":"4Al + 3O₂ → 2Al₂O₃ (Al: 4 = 4; O: 6 = 6)"},{"topic":"Reaction types","q":"Identify the type of each chemical reaction (synthesis, decomposition, single displacement, double displacement, or combustion): (a) 2Na + Cl₂ → 2NaCl   (b) 2H₂O₂ → 2H₂O + O₂   (c) Mg + 2AgNO₃ → Mg(NO₃)₂ + 2Ag   (d) C₃H₈ + 5O₂ → 3CO₂ + 4H₂O","marks":4,"answer":"(a) synthesis   (b) decomposition   (c) single displacement   (d) combustion"},{"topic":"Acids & bases","q":"Complete and balance the neutralization reaction below, then name the reaction type: _____HCl + _____NaOH → __________ + __________      Reaction type: __________","marks":3,"answer":"HCl + NaOH → NaCl + H₂O — double displacement (neutralization)."},{"topic":"Bonding","q":"Give two properties that distinguish ionic compounds from molecular compounds.","marks":2,"answer":"Any two valid differences, e.g.: ionic compounds have high melting/boiling points and conduct electricity when molten or dissolved; molecular compounds have low melting/boiling points and do not conduct electricity."},{"topic":"Acids & bases","q":"A household cleaner has a pH of 11. Is it acidic or basic? What colour does red litmus paper turn in it?","marks":2,"answer":"Basic; red litmus paper turns blue (pH above 7 = basic)."},{"topic":"Atomic structure","q":"Draw a Bohr–Rutherford diagram for a neutral atom of oxygen (atomic number 8, mass number 16). Show the protons and neutrons in the nucleus and the electrons in each shell.","marks":2,"answer":"Nucleus: 8 protons + 8 neutrons; first shell: 2 electrons; second shell: 6 electrons."},{"topic":"Conservation of mass","q":"When 20.0 g of calcium carbonate is heated, it decomposes completely into 11.2 g of calcium oxide and carbon dioxide gas. What mass of carbon dioxide is produced? Show your work and name the law you used.","marks":3,"answer":"20.0 g − 11.2 g = 8.8 g of CO₂. Law of conservation of mass: total mass of the products equals total mass of the reactants."},{"topic":"Activity series","q":"A strip of magnesium metal is placed in a solution of copper(II) sulfate. Using the activity series, predict whether a reaction will occur. If it does, write the balanced chemical equation and name the reaction type.","marks":3,"answer":"Yes — magnesium is higher than copper on the activity series, so it displaces copper. Mg + CuSO₄ → MgSO₄ + Cu — single displacement."},{"topic":"Balancing","q":"Balance the following equation. Write the coefficients in the blanks: _____Fe + _____Cl₂ → _____FeCl₃","marks":2,"answer":"2Fe + 3Cl₂ → 2FeCl₃ (Fe: 2 = 2; Cl: 6 = 6)"},{"topic":"Reaction types","q":"Write the balanced chemical equation for each description, then name the reaction type: (a) Magnesium burns in oxygen to form magnesium oxide. (b) Hydrogen peroxide decomposes into water and oxygen gas. (c) Aluminum metal is placed in copper(II) chloride solution. (d) Methane burns in oxygen.","marks":4,"answer":"(a) 2Mg + O₂ → 2MgO — synthesis; (b) 2H₂O₂ → 2H₂O + O₂ — decomposition; (c) 2Al + 3CuCl₂ → 2AlCl₃ + 3Cu — single displacement; (d) CH₄ + 2O₂ → CO₂ + 2H₂O — combustion"},{"topic":"Acids & bases","q":"An acid rain sample has a pH of 4.2. (a) Is the sample acidic, basic, or neutral? (b) Name one human-caused source of acid rain. (c) Name one harmful effect of acid rain on the environment.","marks":3,"answer":"(a) Acidic (pH below 7). (b) Any one: burning fossil fuels / vehicle exhaust / factory emissions releasing SO₂ or nitrogen oxides. (c) Any one: harms lakes and aquatic life, damages forests/soil, corrodes buildings and statues."},{"topic":"Bonding","q":"Explain, in terms of electrons, how an ionic bond differs from a covalent bond.","marks":2,"answer":"In an ionic bond, electrons are transferred (usually from a metal to a non-metal). In a covalent bond, electrons are shared between non-metal atoms."},{"topic":"Atomic structure","q":"Draw a Bohr–Rutherford diagram for a neutral atom of sodium (atomic number 11, mass number 23). Show the protons and neutrons in the nucleus and the electrons in each shell.","marks":2,"answer":"Nucleus: 11 protons + 12 neutrons (23 − 11); shells: 2, 8, 1 electrons."},{"topic":"Conservation of mass","q":"8.0 g of methane burns completely in oxygen, producing 22.0 g of carbon dioxide and 18.0 g of water. What mass of oxygen reacted? Show your work and name the law you used.","marks":3,"answer":"(22.0 + 18.0) − 8.0 = 32.0 g of oxygen. Law of conservation of mass: total mass of products equals total mass of reactants."},{"topic":"Activity series","q":"A strip of zinc metal is placed in hydrochloric acid (HCl). Using the activity series, predict whether a reaction will occur. If it does, write the balanced chemical equation and name the reaction type.","marks":3,"answer":"Yes — zinc is above hydrogen on the activity series, so it displaces hydrogen from the acid. Zn + 2HCl → ZnCl₂ + H₂ — single displacement."},{"topic":"Conservation of mass","q":"A student says: “mass is lost when wood burns, because the ash weighs less than the wood did.” Explain the error in this reasoning.","marks":2,"answer":"Mass is not lost. The “missing” mass escaped as gases (CO₂ and water vapour). If all products were captured, their total mass would equal the mass of the wood plus the oxygen used."},{"topic":"Balancing","q":"Balance the following equation. Write the coefficients in the blanks: _____KClO₃ → _____KCl + _____O₂","marks":2,"answer":"2KClO₃ → 2KCl + 3O₂ (K: 2 = 2; Cl: 2 = 2; O: 6 = 6)"},{"topic":"Reaction types","q":"Identify the type of each chemical reaction (synthesis, decomposition, single displacement, double displacement, or combustion): (a) N₂ + 3H₂ → 2NH₃   (b) 2HgO → 2Hg + O₂   (c) Pb(NO₃)₂ + 2KI → PbI₂ + 2KNO₃   (d) C₂H₅OH + 3O₂ → 2CO₂ + 3H₂O","marks":4,"answer":"(a) synthesis   (b) decomposition   (c) double displacement   (d) combustion"},{"topic":"Acids & bases","q":"Complete and balance the neutralization reaction below, then name the reaction type: _____H₂SO₄ + _____KOH → __________ + __________      Reaction type: __________","marks":3,"answer":"H₂SO₄ + 2KOH → K₂SO₄ + 2H₂O — double displacement (neutralization). Note: sulfuric acid has 2 hydrogens, so it needs 2 KOH."},{"topic":"Acids & bases","q":"A student dips blue litmus paper into a solution, and it stays blue. (a) What does this tell you about the solution? (b) Give one possible pH value for this solution.","marks":2,"answer":"(a) The solution is not acidic — it is basic or neutral. Blue litmus only changes colour (to red) in an acid. (b) Any pH of 7 or higher (e.g., 7, 9, 12)."},{"topic":"Atomic structure","q":"Draw a Bohr–Rutherford diagram for a neutral atom of fluorine (atomic number 9, mass number 19). Show the protons and neutrons in the nucleus and the electrons in each shell.","marks":2,"answer":"Nucleus: 9 protons + 10 neutrons (19 − 9); first shell: 2 electrons; second shell: 7 electrons."},{"topic":"Conservation of mass","q":"When 10.0 g of magnesium burns in oxygen, it forms 16.6 g of magnesium oxide. What mass of oxygen reacted? Show your work and name the law you used.","marks":3,"answer":"16.6 g − 10.0 g = 6.6 g of oxygen. Law of conservation of mass: total mass of the products equals total mass of the reactants."},{"topic":"Activity series","q":"A strip of copper metal is placed in a solution of silver nitrate (AgNO₃). Using the activity series, predict whether a reaction will occur. If it does, write the balanced chemical equation and name the reaction type.","marks":3,"answer":"Yes — copper is higher than silver on the activity series, so it displaces silver. Cu + 2AgNO₃ → Cu(NO₃)₂ + 2Ag — single displacement."},{"topic":"Energy","q":"A campfire burns wood and gives off heat and light. Is this reaction exothermic or endothermic? Explain your answer in terms of energy.","marks":2,"answer":"Exothermic — energy is released to the surroundings as heat and light. (Endothermic reactions absorb energy instead.)"},{"topic":"Balancing","q":"Balance the following equation. Write the coefficients in the blanks: _____Zn + _____HCl → _____ZnCl₂ + _____H₂","marks":2,"answer":"1Zn + 2HCl → 1ZnCl₂ + 1H₂ (Zn: 1 = 1; H: 2 = 2; Cl: 2 = 2)"},{"topic":"Reaction types","q":"Identify the type of each chemical reaction (synthesis, decomposition, single displacement, double displacement, or combustion): (a) 2Ca + O₂ → 2CaO   (b) 2H₂O → 2H₂ + O₂   (c) Fe + CuSO₄ → FeSO₄ + Cu   (d) BaCl₂ + Na₂SO₄ → BaSO₄ + 2NaCl","marks":4,"answer":"(a) synthesis   (b) decomposition   (c) single displacement   (d) double displacement"},{"topic":"Reaction types","q":"Write the balanced chemical equation for the word equation below, then name the reaction type: iron + oxygen → iron(III) oxide.      Reaction type: __________","marks":3,"answer":"4Fe + 3O₂ → 2Fe₂O₃ — synthesis. (Iron(III) means Fe³⁺, and oxide is O²⁻, so the compound is Fe₂O₃.)"},{"topic":"Bonding","q":"Solid sodium chloride does not conduct electricity, but molten sodium chloride does. Explain why.","marks":2,"answer":"In solid NaCl, the ions are locked in a fixed lattice and cannot move, so no charge flows. When molten, the ions are free to move and carry electric charge."},{"topic":"Atomic structure","q":"Draw a Bohr–Rutherford diagram for a neutral atom of chlorine (atomic number 17, mass number 35). Show the protons and neutrons in the nucleus and the electrons in each shell.","marks":2,"answer":"Nucleus: 17 protons + 18 neutrons (35 − 17); shells: 2, 8, 7 electrons."},{"topic":"Conservation of mass","q":"When 3.2 g of sulfur burns in oxygen, it forms 6.4 g of sulfur dioxide. What mass of oxygen reacted? Show your work and name the law you used.","marks":3,"answer":"6.4 g − 3.2 g = 3.2 g of oxygen. Law of conservation of mass: total mass of the products equals total mass of the reactants."},{"topic":"Activity series","q":"A strip of gold metal is placed in dilute hydrochloric acid (HCl). Using the activity series, predict whether a reaction will occur. Explain your answer.","marks":3,"answer":"No reaction — gold is below hydrogen on the activity series (very unreactive), so it cannot displace hydrogen from the acid."},{"topic":"Energy","q":"Photosynthesis absorbs energy from sunlight to build glucose from carbon dioxide and water. Is photosynthesis exothermic or endothermic? Explain your answer in terms of energy.","marks":2,"answer":"Endothermic — energy is absorbed from the surroundings (sunlight). (Exothermic reactions release energy instead.)"}],"notes":"<h3>The Periodic Table</h3>\n<ul>\n<li><strong>Periods</strong> (the 7 horizontal rows): the period number tells you how many electron shells an atom has.</li>\n<li><strong>Groups</strong> (the vertical columns): elements in the same group have the same number of valence electrons, so they behave similarly.</li>\n<li><strong>Metals</strong> (left and centre): shiny, conduct heat and electricity, malleable and ductile. They <strong>lose</strong> electrons to form positive ions.</li>\n<li><strong>Non-metals</strong> (upper right): dull, poor conductors, brittle as solids. They <strong>gain</strong> electrons to form negative ions.</li>\n<li><strong>Metalloids</strong> (along the staircase: B, Si, Ge, As, Sb, Te): a mix of metal and non-metal properties.</li>\n<li><strong>Reactivity trends:</strong> metals get <em>more</em> reactive going down a group; non-metals get <em>more</em> reactive going up a group. Group 18 (noble gases) is essentially inert.</li>\n</ul>\n\n<h3>Ions and Ionic Compounds</h3>\n<p>An <strong>ion</strong> is an atom with an electric charge. A <strong>cation</strong> is positive (a metal that lost electrons); an <strong>anion</strong> is negative (a non-metal that gained electrons). Atoms do this to get a full outer shell — usually 8 valence electrons, like a noble gas.</p>\n<p><strong>Ionic bonding</strong> is the transfer of electrons from a metal to a non-metal. The oppositely charged ions attract and lock into a crystal lattice (e.g. table salt). Ionic compounds conduct electricity only when melted or dissolved, not as solids.</p>\n\n<h3>Covalent Bonding</h3>\n<p><strong>Covalent bonding</strong> is the <strong>sharing</strong> of electrons between two non-metals, so each atom gets a full outer shell. Example: in H2O, oxygen shares one electron pair with each hydrogen. Covalent compounds usually have low melting points and do not conduct electricity.</p>\n\n<h3>Writing Chemical Formulas</h3>\n<ul>\n<li><strong>Ionic:</strong> the total positive charge must cancel the total negative charge. Mg (2+) with Cl (1-) needs two chlorides: <strong>MgCl2</strong>.</li>\n<li><strong>Crossover shortcut:</strong> swap the charge numbers (drop the signs). Al (3+) with O (2-) gives <strong>Al2O3</strong>; Ca (2+) with N (3-) gives <strong>Ca3N2</strong>. Reduce to the simplest ratio.</li>\n<li><strong>Covalent:</strong> no charges involved — subscripts just count the atoms sharing electrons (H2O, CO2).</li>\n</ul>\n\n<h3>Naming Compounds</h3>\n<h4>Ionic compounds</h4>\n<p>Metal name first, then the non-metal with an <strong>-ide</strong> ending: NaCl = sodium chloride, MgBr2 = magnesium bromide.</p>\n<h4>Multivalent metals</h4>\n<p>Transition metals (Fe, Cu, Pb, Sn) can form more than one ion, so a <strong>Roman numeral</strong> shows the charge: FeCl2 = iron(II) chloride, FeCl3 = iron(III) chloride.</p>\n<h4>Polyatomic ions</h4>\n<p>Keep the ion's name (sulfate = SO4 with a 2- charge, nitrate = NO3 with a 1- charge, hydroxide = OH with a 1- charge, ammonium = NH4 with a 1+ charge, carbonate = CO3 with a 2- charge): Na2SO4 = sodium sulfate, Ca(OH)2 = calcium hydroxide. Use brackets when you need more than one polyatomic ion.</p>\n<h4>Covalent compounds</h4>\n<p>Use Greek prefixes (mono-, di-, tri-, tetra-): CO = carbon monoxide, CO2 = carbon dioxide, N2O4 = dinitrogen tetroxide. Never put mono- on the first element.</p>\n\n<h3>Types of Chemical Reactions</h3>\n<table>\n<tr><th>Type</th><th>General form</th><th>Example (balanced)</th></tr>\n<tr><td><strong>Synthesis</strong></td><td>A + B → AB</td><td>2Mg + O2 → 2MgO</td></tr>\n<tr><td><strong>Decomposition</strong></td><td>AB → A + B</td><td>2H2O2 → 2H2O + O2</td></tr>\n<tr><td><strong>Single displacement</strong></td><td>A + BC → AC + B</td><td>Zn + 2HCl → ZnCl2 + H2</td></tr>\n<tr><td><strong>Double displacement</strong></td><td>AB + CD → AD + CB</td><td>AgNO3 + NaCl → AgCl + NaNO3</td></tr>\n<tr><td><strong>Combustion</strong></td><td>CxHy + O2 → CO2 + H2O</td><td>CH4 + 2O2 → CO2 + 2H2O</td></tr>\n</table>\n<p>Tip: single displacement only happens if the lone element is <strong>more reactive</strong> than the one it replaces (check the activity series).</p>\n\n<h3>Balancing Chemical Equations</h3>\n<p>Worked example — balance H2 + O2 → H2O:</p>\n<ol>\n<li>Count atoms on each side. H: 2 | 2. O: 2 | 1 — oxygen is unbalanced.</li>\n<li>Add <strong>coefficients</strong> (big numbers in front), never change subscripts: H2 + O2 → 2H2O.</li>\n<li>Recount. H: 2 | 4 — now hydrogen is off, so: 2H2 + O2 → 2H2O.</li>\n<li>Final check: H: 4 | 4, O: 2 | 2. Balanced.</li>\n</ol>\n<p>Strategy: balance metals first, then non-metals, and save hydrogen and oxygen for last. If a polyatomic ion appears unchanged on both sides, balance it as one unit.</p>\n\n<h3>Acids and Bases</h3>\n<ul>\n<li><strong>Acids</strong> (e.g. HCl, H2SO4): taste sour, pH <strong>below 7</strong>, turn blue litmus paper red, react with metals to release hydrogen gas.</li>\n<li><strong>Bases</strong> (e.g. NaOH, NH3): taste bitter, feel slippery, pH <strong>above 7</strong>, turn red litmus paper blue.</li>\n<li><strong>pH scale</strong> runs 0–14. Below 7 is acidic, 7 is neutral (pure water), above 7 is basic. Each step is 10× stronger.</li>\n<li><strong>Neutralization:</strong> acid + base → salt + water. Example: HCl + NaOH → NaCl + H2O.</li>\n</ul>\n"},{"id":"snc-physics","name":"Physics: Light and Geometric Optics","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":1,"explain":"Light travels in straight lines (rectilinear propagation) until it strikes a new material, where it may reflect, refract, or be absorbed. Shadows form precisely because light does not curve around objects.","options":["Light needs air to travel through","Light travels in straight lines until it meets a new material","Light always travels in curved paths","Light travels slowest in a vacuum"],"q":"Which statement about light is TRUE?","topic":"Properties of light"},{"answer":1,"explain":"The law of reflection states the angle of incidence equals the angle of reflection, and both angles are measured from the normal (the line perpendicular to the surface).","options":["55°","35°","70°","145°"],"q":"A ray of light hits a flat mirror with an angle of incidence of 35°. What is the angle of reflection?","topic":"Reflection"},{"answer":0,"explain":"S = same size as the object, A = upright, L = lateral inversion (left and right appear reversed), T = virtual (the image forms behind the mirror and cannot be caught on a screen).","options":["Same size, Upright, Lateral inversion, Virtual","Smaller, Upright, Lateral inversion, Real","Larger, Inverted, No inversion, Virtual","Same size, Inverted, Lateral inversion, Real"],"q":"Which set of SALT characteristics correctly describes the image in a plane mirror?","topic":"Plane mirrors"},{"answer":2,"explain":"A concave mirror brings reflected rays together. With the object inside the focal point, the rays diverge after reflecting and appear to come from a larger, upright, virtual image behind the mirror — ideal for close-up dental work.","options":["concave mirror, teeth beyond the centre of curvature","plane mirror, teeth at any distance","concave mirror, teeth between the focal point and the mirror","convex mirror, teeth beyond the focal point"],"q":"A dentist uses a small curved mirror to look at the back of a patient's teeth. The mirror makes the teeth look larger and upright. Which mirror is it, and where are the teeth relative to the mirror?","topic":"Concave mirrors"},{"answer":2,"explain":"A convex mirror spreads reflected rays outward, always giving a smaller, upright, virtual image — but it captures a much wider field of view, which is exactly what a security mirror needs.","options":["concave mirror — smaller, inverted, real","plane mirror — same size, inverted, virtual","convex mirror — smaller, upright, virtual","concave mirror — larger, upright, real"],"q":"Stores mount wide curved mirrors in corners to watch the aisles. Which mirror type is used, and what is the image like?","topic":"Convex mirrors"},{"answer":3,"explain":"With the object beyond C, the reflected rays converge between F and C to form a real image that is smaller than the object and inverted. Real images form where rays actually meet, so they can be projected on a screen.","options":["larger, upright, virtual — behind the mirror","same size, upright, real — at C","smaller, upright, virtual — behind the mirror","smaller, inverted, real — between F and C"],"q":"An object is placed beyond the centre of curvature (C) of a concave mirror. Describe the image.","topic":"Concave mirrors"},{"answer":1,"explain":"Water is optically denser than air, so light slows down on entering and bends toward the normal. Bending toward the normal when entering a denser medium (and away when leaving) is the key refraction rule.","options":["it speeds up and bends away from the normal","it slows down and bends toward the normal","it slows down and bends away from the normal","its speed and direction do not change"],"q":"A ray of light travels from air into water. What happens to its speed and direction?","topic":"Refraction"},{"answer":3,"explain":"A converging lens is thicker in the middle and bends rays toward each other (to a focal point). Magnifying glasses, cameras, and the human eye all use converging lenses; side-view mirrors and security mirrors are convex mirrors, not lenses.","options":["a car's side-view mirror","a store security mirror","a peephole in a door","a magnifying glass"],"q":"Which of the following uses a converging lens?","topic":"Lenses"},{"answer":2,"explain":"A diverging lens spreads rays outward, so the rays never actually meet — they only appear to come from a smaller, upright, virtual image on the same side as the object.","options":["larger, inverted, real","same size, upright, real","smaller, upright, virtual","larger, upright, virtual"],"q":"An object is viewed through a diverging lens. What are the SALT characteristics of the image?","topic":"Lenses"},{"answer":3,"explain":"Total internal reflection needs light going from a denser to a rarer medium (e.g., water to air, glass to air) striking the boundary at an angle steeper than the critical angle, so no light escapes by refraction.","options":["light travels from a less dense to a more dense medium","light hits any surface at exactly 90°","light travels through a vacuum","light travels from a more dense to a less dense medium at an angle greater than the critical angle"],"q":"Total internal reflection can occur only when:","topic":"Total internal reflection"},{"answer":0,"explain":"In a fibre optic cable, light pulses strike the inside walls at angles beyond the critical angle and undergo total internal reflection thousands of times, staying trapped inside the fibre all the way to the other end.","options":["total internal reflection","dispersion through a prism","lateral inversion in mirrors","diffuse reflection off rough surfaces"],"q":"Fibre optic cables carry internet signals as pulses of light. Which property of light makes this possible?","topic":"Applications"},{"answer":3,"explain":"This spreading of white light is called dispersion. Violet light slows down more inside glass than red light does, so it refracts (bends) more — which is why violet ends up on the inside edge of the rainbow spectrum.","options":["the prism absorbs red light and re-emits violet","violet light reflects off the inside of the prism","violet light travels faster in glass than red light","violet light slows down more in glass, so it refracts more"],"q":"White light passes through a glass prism and spreads into a rainbow of colours. Why does violet light bend more than red light?","topic":"Refraction"}],"shortBank":[{"answer":"S: same size as the object; A: upright (attitude); L: lateral inversion (left and right appear reversed); T: virtual (the image forms behind the mirror and cannot be projected onto a screen). Everyday use: a bathroom mirror or a car's rear-view mirror.","marks":2,"q":"State the SALT characteristics of the image formed by a plane mirror, and give one everyday use of a plane mirror.","topic":"Plane mirrors"},{"answer":"The ray that starts parallel to the principal axis reflects off the mirror and passes back through the focal point (F). The ray that starts by heading toward F strikes the mirror and reflects back parallel to the principal axis. After reflecting, the two rays diverge, so their extensions must be traced backward behind the mirror, where they meet to form the image. SALT: Larger than the object, Upright, Lateral inversion, Virtual (the image appears behind the mirror and cannot be projected on a screen).","marks":4,"q":"An object is placed between the focal point (F) and a concave mirror. Describe, in words, the path of two reflected rays — one that starts parallel to the principal axis and one that starts by heading toward the focal point — and then state the SALT characteristics of the resulting image.","topic":"Concave mirrors"},{"answer":"Total internal reflection happens when light travelling inside an optically denser medium hits the boundary with a less dense medium and is reflected entirely back inside, with no refraction out. The two conditions are: (1) light travels from a more optically dense medium to a less dense one, and (2) the angle of incidence is greater than the critical angle. One application: fibre optic cables that carry phone and internet signals (or the sparkle of a cut diamond).","marks":2,"q":"What is total internal reflection? State the two conditions needed for it to happen and give one application.","topic":"Total internal reflection"},{"answer":"Light rays coming from the submerged part of the straw travel through water (denser) into air (less dense), so they speed up and bend away from the normal at the surface. Your eye assumes light travels in straight lines, so it traces the bent rays backward to a position that is shallower and shifted from the straw's true location — making the straw look bent or broken at the waterline.","marks":3,"q":"A straw in a glass of water looks bent at the water's surface. Explain what happens to the light rays coming from the submerged part of the straw to cause this.","topic":"Refraction"}],"notes":"<h3>Properties of Light</h3>\n<ul>\n<li><strong>Rectilinear propagation:</strong> light travels in straight lines. Evidence: sharp shadows, pinhole cameras.</li>\n<li><strong>Speed of light:</strong> 3.00 × 10<sup>8</sup> m/s in a vacuum (essentially the same in air). Light slows down in water and glass — this slowing is what causes refraction.</li>\n<li>Light is a form of <strong>electromagnetic radiation</strong>; it does not need a medium to travel.</li>\n</ul>\n\n<h3>Reflection</h3>\n<h4>Laws of Reflection</h4>\n<ul>\n<li>The <strong>angle of incidence</strong> equals the <strong>angle of reflection</strong> (both measured from the <strong>normal</strong>, the line perpendicular to the surface).</li>\n<li>The incident ray, the reflected ray, and the normal all lie in the <strong>same plane</strong>.</li>\n</ul>\n<h4>Plane Mirrors</h4>\n<p>Describe any image with <strong>SALT</strong> — <strong>S</strong>ize, <strong>A</strong>ttitude (upright or inverted), <strong>L</strong>ocation, <strong>T</strong>ype (real or virtual). A plane mirror image is always: <strong>S</strong>ame size as the object, <strong>A</strong>ttitude upright, <strong>L</strong>ocated as far behind the mirror as the object is in front, <strong>T</strong>ype virtual (light only <em>appears</em> to come from behind the mirror).</p>\n<h4>Concave Mirrors</h4>\n<p>Curve inward like the inside of a spoon. <strong>Ray diagram rules:</strong> a ray parallel to the principal axis reflects through the <strong>focal point (F)</strong>; a ray through F reflects parallel to the axis; a ray through the <strong>centre of curvature (C)</strong> reflects back along itself.</p>\n<table>\n<tr><th>Object position</th><th>Size</th><th>Attitude</th><th>Location</th><th>Type</th></tr>\n<tr><td>Beyond C</td><td>Smaller</td><td>Inverted</td><td>Between F and C</td><td>Real</td></tr>\n<tr><td>At C</td><td>Same size</td><td>Inverted</td><td>At C</td><td>Real</td></tr>\n<tr><td>Between C and F</td><td>Larger</td><td>Inverted</td><td>Beyond C</td><td>Real</td></tr>\n<tr><td>At F</td><td colspan=\"4\">No image — reflected rays are parallel</td></tr>\n<tr><td>Between F and mirror</td><td>Larger</td><td>Upright</td><td>Behind mirror</td><td>Virtual</td></tr>\n</table>\n<p><strong>Uses:</strong> shaving/makeup mirrors (object between F and mirror gives an enlarged upright image), car headlights and flashlights (bulb at F sends out a parallel beam), reflecting telescopes, solar furnaces.</p>\n<h4>Convex Mirrors</h4>\n<p>Curve outward. The image is <strong>always</strong> smaller, upright, behind the mirror, and virtual — no matter where the object is. <strong>Uses:</strong> passenger-side car mirrors and store security mirrors, because they give a <strong>wide field of view</strong> (\"objects are closer than they appear\").</p>\n\n<h3>Refraction</h3>\n<ul>\n<li><strong>Refraction</strong> is the bending of light when it passes from one medium into another at an angle.</li>\n<li>Entering a <strong>slower</strong> medium (air → water or glass): light bends <strong>toward</strong> the normal.</li>\n<li>Entering a <strong>faster</strong> medium (water → air): light bends <strong>away</strong> from the normal.</li>\n<li>Qualitative <strong>Snell's law</strong> idea: the bigger the change in speed, the more the light bends. (A ray hitting straight-on, along the normal, does not bend.)</li>\n</ul>\n\n<h3>Lenses</h3>\n<h4>Converging (Convex) Lenses</h4>\n<p>Thicker in the middle; they <strong>converge</strong> parallel light to the focal point. Image summary (2F plays the role C played for mirrors):</p>\n<table>\n<tr><th>Object position</th><th>Size</th><th>Attitude</th><th>Location</th><th>Type</th></tr>\n<tr><td>Beyond 2F</td><td>Smaller</td><td>Inverted</td><td>Between F and 2F (other side)</td><td>Real</td></tr>\n<tr><td>At 2F</td><td>Same size</td><td>Inverted</td><td>At 2F</td><td>Real</td></tr>\n<tr><td>Between 2F and F</td><td>Larger</td><td>Inverted</td><td>Beyond 2F</td><td>Real</td></tr>\n<tr><td>At F</td><td colspan=\"4\">No image — refracted rays are parallel</td></tr>\n<tr><td>Between F and lens</td><td>Larger</td><td>Upright</td><td>Same side as object</td><td>Virtual</td></tr>\n</table>\n<p><strong>Uses:</strong> cameras and projectors (real image on film/screen), magnifying glasses (object within F gives enlarged virtual image), eyeglasses for <strong>farsightedness</strong>.</p>\n<h4>Diverging (Concave) Lenses</h4>\n<p>Thinner in the middle; they <strong>spread light out</strong>. The image is <strong>always</strong> smaller, upright, on the same side as the object, and virtual. <strong>Uses:</strong> eyeglasses for <strong>nearsightedness</strong>, door peepholes.</p>\n\n<h3>Total Internal Reflection</h3>\n<ul>\n<li>Happens only when light travels from a <strong>slower to a faster</strong> medium (e.g. glass → air) <strong>and</strong> the angle of incidence is greater than the <strong>critical angle</strong>.</li>\n<li>Then <strong>no light refracts out</strong> — it is all reflected back inside.</li>\n<li><strong>Uses: fibre optics</strong> (light stays trapped in the fibre core, carrying phone/internet signals), prisms in binoculars, the sparkle of diamonds, reflective road signs.</li>\n</ul>\n\n<h3>Applications Roundup</h3>\n<ul>\n<li><strong>Camera:</strong> a converging lens forms a small, inverted, real image on the sensor or film.</li>\n<li><strong>Refracting telescope:</strong> a large converging objective lens gathers light and forms a real image; the eyepiece (another converging lens) magnifies it.</li>\n<li><strong>Eyeglasses:</strong> converging lenses correct farsightedness; diverging lenses correct nearsightedness.</li>\n<li><strong>Real vs virtual — the key test:</strong> a <strong>real</strong> image is formed by actual converging light rays and can be projected on a screen; a <strong>virtual</strong> image cannot be caught on a screen.</li>\n</ul>\n"},{"id":"snc-earth","name":"Earth and Space Science: Climate Change","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":3,"explain":"Sunlight (mostly visible light) passes through the atmosphere and warms Earth's surface. The surface then radiates heat as infrared radiation, which greenhouse gases absorb and re-radiate in all directions — including back down — trapping extra warmth.","options":["Greenhouse gases block all sunlight from reaching Earth","Greenhouse gases destroy the ozone layer, letting in extra heat","The greenhouse effect only happens inside actual greenhouses","The Sun's visible light passes through the atmosphere, Earth radiates heat (infrared), and greenhouse gases absorb and re-radiate some of that heat"],"q":"Which description of the greenhouse effect is correct?","topic":"Greenhouse effect"},{"answer":1,"explain":"Nitrogen (N₂) and oxygen (O₂) make up about 99% of the atmosphere but do not absorb infrared radiation, so they are not greenhouse gases. Carbon dioxide, methane, and water vapour do absorb infrared and trap heat.","options":["carbon dioxide","nitrogen","methane","water vapour"],"q":"Which of the following is NOT a greenhouse gas?","topic":"Greenhouse gases"},{"answer":0,"explain":"Burning coal, oil, and natural gas for electricity, heating, and transportation releases carbon dioxide that was locked underground for millions of years, and it is the single largest human source of the increase.","options":["burning fossil fuels for energy and transportation","planting trees","using solar panels","recycling paper"],"q":"Which human activity is the largest contributor to increased atmospheric carbon dioxide?","topic":"Causes"},{"answer":2,"explain":"Climate has always changed naturally — for example, slow shifts in Earth's orbit and tilt change how much sunlight different regions receive, triggering ice ages. Today's rapid warming is different because it is driven mainly by human greenhouse gas emissions.","options":["burning coal in power plants","driving gasoline cars","changes in Earth's orbit and tilt","clearing forests for farmland"],"q":"Which of the following is a NATURAL cause of climate change?","topic":"Causes"},{"answer":1,"explain":"During photosynthesis, plants take carbon dioxide from the air and lock its carbon into sugars and plant tissue. Respiration, decomposition, and burning fossil fuels all do the reverse — they release carbon dioxide.","options":["burning fossil fuels","photosynthesis","cellular respiration","decomposition"],"q":"Which process REMOVES carbon dioxide from the atmosphere?","topic":"Carbon cycle"},{"answer":1,"explain":"Fossil fuels are carbon that was removed from the atmosphere over millions of years. Burning them dumps that ancient carbon back into the air in decades — far faster than natural processes can reabsorb it.","options":["it removes carbon from the atmosphere permanently","it moves carbon from long-term underground storage into the atmosphere very quickly","it turns carbon dioxide directly into oxygen","it stops photosynthesis from happening"],"q":"Fossil fuels formed over millions of years from ancient organisms. Burning them affects the carbon cycle because it:","topic":"Carbon cycle"},{"answer":2,"explain":"Each year's snowfall traps tiny air bubbles, preserving samples of the ancient atmosphere. Analyzing them shows past carbon dioxide levels rising and falling in step with past temperatures — and that today's levels are higher than anything in at least 800,000 years.","options":["the exact temperature on any given day in the past","the future path of hurricanes","past atmospheric carbon dioxide levels and temperature patterns","how many species lived in the past"],"q":"Scientists study air bubbles trapped in ancient Antarctic ice cores. What do these bubbles reveal?","topic":"Evidence"},{"answer":0,"explain":"Tide gauges and satellites show seas rising as melting glaciers add water and warmer ocean water expands. Meanwhile, carbon dioxide keeps climbing — it is not decreasing — and winters are warming on average worldwide.","options":["global sea levels are rising as glaciers melt and ocean water expands","winters are getting colder everywhere on Earth","the amount of carbon dioxide in the air is decreasing","coral reefs are expanding into colder waters"],"q":"Which of these is observed evidence that Earth's climate is warming?","topic":"Evidence"},{"answer":2,"explain":"Extra dissolved carbon dioxide forms carbonic acid in seawater, lowering the pH. In more acidic water, shellfish, corals, and plankton struggle to build and maintain their calcium carbonate shells and skeletons.","options":["it makes the ocean too warm for fish to survive","it causes sea levels to fall","it makes it harder for shellfish and corals to build their shells and skeletons","it increases the ocean's salt content"],"q":"As the ocean absorbs extra carbon dioxide from the atmosphere, the water becomes more acidic. Why is ocean acidification a problem?","topic":"Impacts"},{"answer":0,"explain":"This is a positive feedback loop: warming melts reflective white ice, exposing dark ocean that absorbs more sunlight and warms further, which melts still more ice. The initial change amplifies itself.","options":["white ice reflects sunlight, but the darker ocean left behind absorbs more heat, causing more melting","it causes more clouds to form, cooling the planet","it releases fresh water that stops all ocean currents","melting ice directly removes carbon dioxide from the air"],"q":"Melting Arctic sea ice is an example of a positive feedback loop because:","topic":"Impacts"},{"answer":2,"explain":"Adaptation means adjusting to the effects of climate change that are already happening — sea walls and flood warnings don't cut emissions, they reduce the damage from higher water. Cutting emissions would be mitigation.","options":["mitigation, because it reduces greenhouse gas emissions","neither — sea walls have nothing to do with climate","adaptation, because it adjusts to the effects of climate change","both equally"],"q":"A city builds sea walls and updates its flood-warning system to deal with rising water levels. Is this mitigation or adaptation?","topic":"Mitigation and adaptation"},{"answer":3,"explain":"Mitigation attacks the causes of climate change by cutting greenhouse gas emissions at the source. Stilts, heat-resistant crops, and air conditioning all cope with warming's effects, so they are adaptation.","options":["building homes on stilts in flood zones","planting heat-resistant crops","installing air conditioning in schools","switching a town's electricity from coal to wind power"],"q":"Which action is an example of mitigation (reducing the causes of climate change)?","topic":"Mitigation and adaptation"}],"shortBank":[{"answer":"Visible sunlight passes through the atmosphere and warms Earth's surface. The warmed surface radiates heat energy back upward as infrared radiation. Greenhouse gases (such as carbon dioxide and methane) absorb some of this infrared radiation and re-radiate it in all directions, including back toward Earth. This traps extra heat and keeps the planet warmer than it would otherwise be.","marks":3,"q":"Explain the greenhouse effect step by step, starting with sunlight arriving at Earth.","topic":"Greenhouse effect"},{"answer":"Any two valid examples, e.g.: (1) Air bubbles in Antarctic ice cores show today's carbon dioxide levels are higher than at any time in at least 800,000 years. (2) Global sea levels are rising because melting glaciers add water and warmer ocean water expands. (3) Thermometer records show the average global temperature has risen about 1°C since the late 1800s.","marks":2,"q":"Give two pieces of evidence that Earth's climate is warming, and state what each one shows.","topic":"Evidence"},{"answer":"Photosynthesis moves carbon dioxide from the atmosphere into plants; cellular respiration and decomposition return carbon dioxide to the atmosphere; burning fossil fuels releases carbon that was stored underground over millions of years; and ocean absorption dissolves atmospheric carbon dioxide into seawater. (Also acceptable: the formation of fossil fuels and sedimentary rock locks carbon into long-term storage.)","marks":4,"q":"Describe the carbon cycle by naming at least four processes that move carbon between the atmosphere, living things, and long-term storage.","topic":"Carbon cycle"},{"answer":"Mitigation tackles the causes of climate change by reducing greenhouse gas emissions — e.g., switching a town's electricity from coal to solar or wind power, or expanding public transit to cut car use. Adaptation adjusts to the effects that are already happening — e.g., building sea walls against rising seas, or developing drought-resistant crops. Mitigation slows future warming; adaptation reduces harm from warming that is already locked in.","marks":3,"q":"Distinguish between climate mitigation and climate adaptation, giving two examples of each.","topic":"Mitigation and adaptation"}],"notes":"<h3>The Greenhouse Effect — How It Works</h3>\n<p>The greenhouse effect is <strong>natural</strong> — without it Earth would be about 33°C colder. The problem is that humans are <strong>strengthening</strong> it.</p>\n<ul>\n<li>The Sun sends <strong>short-wave radiation</strong> (visible light, UV) toward Earth; most passes through the atmosphere.</li>\n<li>Earth's surface absorbs it, warms up, and re-emits energy as <strong>long-wave infrared radiation</strong> (heat).</li>\n<li><strong>Greenhouse gases</strong> absorb this outgoing infrared and re-emit it in all directions — including back down.</li>\n<li>The trapped heat warms the lower atmosphere.</li>\n</ul>\n\n<h3>Greenhouse Gases and Their Sources</h3>\n<ul>\n<li><strong>Water vapour (H<sub>2</sub>O)</strong> — the most abundant greenhouse gas, from evaporation. Rises as the planet warms, amplifying warming (a <strong>positive feedback loop</strong>).</li>\n<li><strong>Carbon dioxide (CO<sub>2</sub>)</strong> — burning fossil fuels, deforestation, cement production. The main driver of human-caused warming because we release so much of it.</li>\n<li><strong>Methane (CH<sub>4</sub>)</strong> — livestock digestion, rice paddies, landfills, wetlands, natural gas leaks. Far more potent than CO<sub>2</sub> molecule-for-molecule but breaks down faster.</li>\n<li><strong>Nitrous oxide (N<sub>2</sub>O)</strong> — nitrogen fertilizers, manure, burning fossil fuels and biomass. Very long-lived in the atmosphere.</li>\n</ul>\n\n<h3>Natural vs Human Causes</h3>\n<h4>Natural</h4>\n<ul>\n<li><strong>Volcanic eruptions</strong> — release CO<sub>2</sub> but also aerosols that reflect sunlight and temporarily <strong>cool</strong> the planet.</li>\n<li><strong>Solar output changes</strong> — small variations in the Sun's energy.</li>\n<li><strong>Orbital cycles (Milankovitch cycles)</strong> — slow wobbles in Earth's orbit and tilt that caused past ice ages over tens of thousands of years.</li>\n<li><strong>El Niño / La Niña</strong> — ocean-atmosphere patterns shifting temperatures year to year.</li>\n</ul>\n<h4>Human (anthropogenic)</h4>\n<ul>\n<li>Burning <strong>fossil fuels</strong> for electricity, transport, and industry.</li>\n<li><strong>Deforestation</strong> — fewer trees to absorb CO<sub>2</sub>, and burning releases stored carbon.</li>\n<li><strong>Agriculture</strong> — methane from livestock and rice; nitrous oxide from fertilizers.</li>\n<li><strong>Waste</strong> — methane from garbage decomposing in landfills.</li>\n</ul>\n<p>Key exam point: natural factors act slowly or briefly; today's warming is too fast and tracks the rise in human emissions.</p>\n\n<h3>The Carbon Cycle</h3>\n<p>Carbon moves between <strong>reservoirs</strong>: atmosphere, biosphere (living things), hydrosphere (oceans), lithosphere (rocks, fossil fuels, soils).</p>\n<ul>\n<li><strong>Photosynthesis</strong> removes CO<sub>2</sub>; <strong>respiration and decomposition</strong> release it.</li>\n<li><strong>Combustion</strong> of fossil fuels or biomass releases stored carbon rapidly.</li>\n<li><strong>Ocean exchange</strong> — oceans absorb CO<sub>2</sub> (a major carbon sink); absorbed CO<sub>2</sub> also causes <strong>ocean acidification</strong>.</li>\n<li><strong>Sedimentation and weathering</strong> lock carbon into limestone and fossil fuels over millions of years.</li>\n</ul>\n<p>Humans move carbon from the slow lithosphere reservoir into the atmosphere far faster than natural processes can remove it.</p>\n\n<h3>Evidence for Climate Change</h3>\n<ul>\n<li><strong>Ice cores</strong> — ancient air bubbles trapped in polar ice reveal past CO<sub>2</sub> and temperature. CO<sub>2</sub> and temperature rise and fall together — and today's CO<sub>2</sub> is the highest in hundreds of thousands of years.</li>\n<li><strong>Temperature records</strong> — about 1°C of warming since the late 1800s, with the warmest years all recent.</li>\n<li><strong>Sea-level rise</strong> — from <strong>thermal expansion</strong> (water expands as it warms) plus melting glaciers and ice sheets.</li>\n<li><strong>Retreating glaciers</strong> — glaciers shrinking worldwide; Arctic sea ice declining in extent and thickness.</li>\n<li><strong>Phenology</strong> — earlier springs (flowering, migrations) and species shifting toward the poles and higher elevations.</li>\n</ul>\n\n<h3>Impacts</h3>\n<ul>\n<li><strong>Sea-level rise</strong> — coastal flooding, erosion, saltwater contaminating freshwater.</li>\n<li><strong>Extreme weather</strong> — more intense heatwaves, heavy rainfall, droughts, and storms. One event proves nothing; the <strong>pattern over decades</strong> is the evidence.</li>\n<li><strong>Ecosystems</strong> — habitat loss, coral bleaching, species unable to adapt or migrate fast enough.</li>\n<li><strong>Health and agriculture</strong> — heat illness, vector-borne diseases spreading (e.g. Lyme disease moving north in Ontario), shifting growing seasons, threats to crop yields.</li>\n</ul>\n\n<h3>Mitigation vs Adaptation</h3>\n<table>\n<tr><th></th><th>Mitigation</th><th>Adaptation</th></tr>\n<tr><td><strong>Goal</strong></td><td>Reduce the <strong>causes</strong> — cut emissions</td><td>Cope with the <strong>effects</strong> — adjust to changes underway</td></tr>\n<tr><td><strong>Examples</strong></td><td>Renewable energy, energy efficiency, public transit and EVs, reforestation, carbon pricing</td><td>Seawalls and flood defences, drought-resistant crops, cooling centres for heatwaves, stronger building codes</td></tr>\n</table>\n<p>Both are needed: mitigation limits future warming; adaptation protects against warming already locked in.</p>\n"}]},

{"id":"chv2o","name":"Civics and Citizenship (CHV2O1)","semester":1,"units":[{"id":"chv-govt","name":"Government and Democracy in Canada","instructions":"No notes.","quizFormat":{"mc":10,"short":2},"mcBank":[{"answer":0,"explain":"National defence and foreign affairs are federal responsibilities — only the national government can speak for Canada abroad or command the armed forces.","options":["Federal","Provincial","Municipal","Territorial"],"q":"Which level of government is responsible for national defence and foreign policy in Canada?","topic":"Levels of government"},{"answer":1,"explain":"Policing is delivered provincially and municipally — Halton Regional Police is a regional/municipal service, while provinces set policing standards and the RCMP contracts in some provinces.","options":["The RCMP only","Provincial and municipal governments","Federal government only","The courts"],"q":"Policing in Oakville is delivered by the Halton Regional Police. Which levels of government share responsibility for policing?","topic":"Levels of government"},{"answer":3,"explain":"Municipalities handle the local services closest to daily life: garbage, water, local roads, and public transit.","options":["Printing money","Immigration policy","Criminal law","Garbage collection and water"],"q":"Which of the following is a municipal responsibility?","topic":"Levels of government"},{"answer":2,"explain":"Health care delivery is provincial — Ontario runs OHIP and funds hospitals — though the federal government contributes funding through health transfers.","options":["Municipal","Federal","Provincial","Private charities"],"q":"Health care in Ontario — including hospitals and OHIP — is mainly the responsibility of which level of government?","topic":"Levels of government"},{"answer":2,"explain":"The judicial branch — the courts — interprets laws and can strike down any law that violates the Constitution.","options":["Executive","Legislative","Judicial","Administrative"],"q":"Which branch of government interprets laws and decides whether they follow the Constitution?","topic":"Branches of government"},{"answer":0,"explain":"The Prime Minister and Cabinet form the executive branch — they run the government day to day, enforce laws, and propose most new legislation.","options":["Executive","Judicial","Legislative","Senate"],"q":"The Prime Minister and Cabinet belong to which branch of government?","topic":"Branches of government"},{"answer":1,"explain":"Parliament is the elected House of Commons plus the appointed Senate — a bill must pass both chambers in identical form to become law.","options":["Prime Minister and Cabinet","House of Commons and Senate","Supreme Court and Parliament","Provincial legislatures and city councils"],"q":"Which two bodies make up Canada's Parliament?","topic":"Parliament"},{"answer":2,"explain":"You vote for one MP in your riding. The party that wins the most ridings usually forms the government, and its leader becomes Prime Minister.","options":["The Prime Minister directly","The Cabinet","One Member of Parliament","A senator"],"q":"In a Canadian federal election, what does each voter in a riding elect?","topic":"Elections"},{"answer":3,"explain":"First-past-the-post: the candidate with the most votes in each riding wins the seat — a majority of votes is not required.","options":["Proportional representation","Ranked ballot nationwide","Appointment by the Governor General","First-past-the-post"],"q":"Canada uses which electoral system for federal elections?","topic":"Elections"},{"answer":1,"explain":"You must be 18 or older on election day to vote federally. Elections Canada does let teens 14 and up pre-register as future electors.","options":["16","18","19","21"],"q":"What is the minimum voting age in Canadian federal elections?","topic":"Voting"},{"answer":2,"explain":"The NDP runs candidates in federal elections. The Ontario Liberal Party is a separate provincial party — federal and provincial parties are distinct
